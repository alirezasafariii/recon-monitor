name: Analysis 6.13 Materialize Raw v2

on:
  push:
    branches:
      - agent/analysis-engine-6.13-fresh-raw-holdout-v2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.13-fresh-raw-holdout-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen unscored protocol
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          from raw_recon_v2_benchmark import verify_v2_freeze
          r=verify_v2_freeze(); assert r['passed'], r
          m=r['manifest']
          assert m['evaluation_status']=='protocol_sealed_collection_open', m['evaluation_status']
          assert m['seal']['scored'] is False
          assert m['corpus']['sealed'] is False
          PY
      - name: Materialize safe raw fixtures and validate without scoring
        env:
          PYTHONPATH: app
        run: |
          python -m py_compile app/raw_recon_v2_materialize.py
          python app/raw_recon_v2_materialize.py
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v2_corpus import load_raw_cases, validate_v2_corpus
          cases=load_raw_cases('benchmarks/raw/analysis_raw_v2.jsonl')
          r=validate_v2_corpus(cases)
          assert r['passed'], r
          assert r['case_count']==96, r
          assert r['source_root_count']==24, r
          assert r['source_project_count']==24, r
          assert r['positive_family_count']>=18, r
          assert r['prior_source_root_overlap_count']==0, r
          assert r['prior_url_overlap_count']==0, r
          assert r['positive_control_raw_collision_count']==0, r
          assert r['positive_observable_delta_rate']==1.0, r
          material=json.loads(Path('benchmarks/raw/sources/v2_materialization_report.json').read_text())
          assert material['scoring_executed'] is False
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - name: Verify no scoring imports in materializer
        shell: bash
        run: |
          ! grep -Eq 'raw_recon_benchmark|rank_families|evaluate_raw_case|run_raw_benchmark|assess_admission|execute_detector_intelligence' app/raw_recon_v2_materialize.py
      - name: Cleanup and regenerate manifest
        shell: bash
        run: |
          rm -f .github/workflows/analysis-613-materialize.yml
          tmp="$(mktemp)"
          git ls-files | grep -v '^MANIFEST.sha256$' | while IFS= read -r f; do
            if [[ -f "$f" ]]; then sha256sum "$f"; fi
          done | sort -k2 > "$tmp"
          mv "$tmp" MANIFEST.sha256
          sha256sum -c MANIFEST.sha256 >/dev/null
      - name: Commit unscored materialized corpus
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Materialize unscored Analysis 6.13 raw v2 corpus'
          git push origin HEAD:agent/analysis-engine-6.13-fresh-raw-holdout-v2
