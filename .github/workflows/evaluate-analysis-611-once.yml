name: Evaluate Analysis 6.11 Fresh Raw Holdout Once

on:
  push:
    branches:
      - agent/analysis-engine-6.11-blind-raw-recon-benchmark

permissions:
  contents: write

env:
  PYTHONPATH: app

jobs:
  evaluate-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.11-blind-raw-recon-benchmark
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert sealed and never previously scored
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_benchmark import verify_freeze
          m=json.loads(Path('benchmarks/raw/splits/v1.json').read_text())
          assert m['evaluation_status']=='sealed_unscored', m['evaluation_status']
          assert m['corpus']['sealed'] is True
          assert m['seal']['scored'] is False
          freeze=verify_freeze('benchmarks/raw/splits/v1.json')
          assert freeze['passed'], freeze
          print('sealed fresh holdout verified')
          PY
      - name: First and only fresh raw benchmark evaluation
        run: |
          mkdir -p benchmarks/raw/reports
          python app/raw_recon_benchmark.py \
            --corpus benchmarks/raw/analysis_raw_v1.jsonl \
            --manifest benchmarks/raw/splits/v1.json \
            --json > benchmarks/raw/reports/analysis_raw_v1_postfreeze_report.json
          python - <<'PY'
          import json
          p='benchmarks/raw/reports/analysis_raw_v1_postfreeze_report.json'
          r=json.load(open(p))
          print(json.dumps({'metrics':r['metrics'],'quality_gate':r['quality_gate'],'case_count':r['case_count'],'positive_count':r['positive_count'],'negative_count':r['negative_count']},indent=2))
          PY
      - name: Irreversibly mark holdout consumed
        env:
          EVALUATION_RUN_ID: ${{ github.run_id }}
          EVALUATION_HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path=Path('benchmarks/raw/reports/analysis_raw_v1_postfreeze_report.json')
          manifest_path=Path('benchmarks/raw/splits/v1.json')
          report=json.loads(report_path.read_text())
          m=json.loads(manifest_path.read_text())
          assert m['evaluation_status']=='sealed_unscored'
          m['evaluation_status']='evaluated_once_consumed'
          m['seal']['scored']=True
          m['seal']['benchmark_report']=str(report_path)
          m['first_and_only_fresh_evaluation']={
              'run_id':os.environ['EVALUATION_RUN_ID'],
              'head_sha':os.environ['EVALUATION_HEAD_SHA'],
              'report':str(report_path),
              'quality_gate_passed':bool(report['quality_gate']['passed']),
              'metrics':report['metrics'],
              'case_count':report['case_count'],
          }
          m['reuse_policy']='This holdout is consumed. Any future run must be explicitly labeled regression-only with --allow-consumed and must never be described as fresh or blind.'
          manifest_path.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Remove one-shot evaluator and commit report plus consumed seal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/evaluate-analysis-611-once.yml
          git add benchmarks/raw/reports/analysis_raw_v1_postfreeze_report.json benchmarks/raw/splits/v1.json
          git commit -m 'Record the single Analysis 6.11 fresh raw evaluation'
          git push
