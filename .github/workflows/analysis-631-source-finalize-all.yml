name: Analysis 6.31 Source Finalize All

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_keyword_candidates.json

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble independent source shortlist
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from family_detectors.registry import DETECTOR_SPECS
          from raw_recon_v5_source_audit import AUDIT_RULE_VERSION, AUDIT_VERSION, audit_row
          from raw_recon_v6_source_firewall import check_candidate, validate_shortlist

          def load(path):
              data=json.loads(Path(path).read_text())
              assert data['scoring_executed'] is False
              return data.get('candidates_by_family') or {}
          pools=[load('benchmarks/raw/sources/v6_candidates.json'),load('benchmarks/raw/sources/v6_supplement_candidates.json'),load('benchmarks/raw/sources/v6_keyword_candidates.json')]
          eligible={}
          for family in sorted(DETECTOR_SPECS):
              rows=[]; seen=set()
              for pool in pools:
                  for raw in pool.get(family) or []:
                      root=str(raw.get('source_root') or '').strip(); project=str(raw.get('source_project') or '').strip()
                      if not root or not project or (root,project) in seen: continue
                      seen.add((root,project))
                      if not check_candidate(raw)['allowed']: continue
                      passed,hits,score=audit_row(family,raw)
                      if not passed: continue
                      row=dict(raw); row['freshness_validated']=True; row['v6_firewall_allowed']=True
                      row['source_family_audit_version']=AUDIT_VERSION; row['source_family_audit_rule_version']=AUDIT_RULE_VERSION
                      row['source_family_audit_score']=int(score); row['source_family_audit_group_hits']=hits
                      rows.append(row)
              rows.sort(key=lambda r:(int(r.get('source_family_audit_score') or 0),1 if r.get('repository_advisory_url') else 0,r.get('published_at') or ''),reverse=True)
              eligible[family]=rows
          missing=sorted(f for f,rows in eligible.items() if not rows)
          if missing: raise SystemExit('unresolved semantic source families: '+', '.join(missing))
          used_roots=set(); used_projects=set(); selected={}
          for family in sorted(eligible,key=lambda f:(len(eligible[f]),f)):
              for row in eligible[family]:
                  root=str(row['source_root']); project=str(row['source_project'])
                  if root in used_roots or project in used_projects: continue
                  selected[family]=row; used_roots.add(root); used_projects.add(project); break
              if family not in selected: raise SystemExit('source uniqueness gap: '+family)
          rows=[selected[f] for f in sorted(selected)]
          firewall=validate_shortlist(rows,required_count=36); assert firewall['passed'],firewall['errors']
          result={'version':'1.0.0','rule_version':'2026.08.13.6.31','evaluation_kind':'fresh_blind_v6_unscored_source_selection','selection_executes_scoring':False,'selection_uses_detector_output':False,'selection_uses_admission_results':False,'selection_uses_ranking_results':False,'family_count':36,'unique_root_count':len(used_roots),'unique_project_count':len(used_projects),'eligible_counts':{f:len(v) for f,v in eligible.items()},'firewall':firewall,'selected':rows}
          Path('benchmarks/raw/sources/v6_shortlist.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          Path('benchmarks/raw/sources/v6_selection_final_report.json').write_text(json.dumps({'rule_version':'2026.08.13.6.31','scoring_executed':False,'status':'selected','family_count':36,'unique_root_count':len(used_roots),'unique_project_count':len(used_projects),'eligible_counts':result['eligible_counts']},indent=2,sort_keys=True)+'\n')
          print({'family_count':36,'unique_root_count':len(used_roots),'unique_project_count':len(used_projects)})
          PY
      - name: Commit final source shortlist
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_shortlist.json benchmarks/raw/sources/v6_selection_final_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Select complete independent Analysis 6.31 v6 source set'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
