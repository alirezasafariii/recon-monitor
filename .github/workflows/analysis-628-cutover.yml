name: Analysis 6.28 Final Orchestrator Cleanup

on:
  push:
    branches:
      - agent/analysis-engine-6.28-final-orchestrator-cleanup

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.28-final-orchestrator-cleanup
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify sealed 6.27 base lineage
        run: |
          git merge-base --is-ancestor b3259277bd66a99a30f5b398e00b674e7c0b3190 HEAD

      - name: Apply Analysis 6.28 cleanup and compatibility patch
        run: |
          python scripts/analysis_628_cutover.py
          python scripts/analysis_628_compat.py

      - name: Exact Analysis 6.28 ownership contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_analysis_628_orchestrator_cleanup.py' -q

      - name: Preserve 6.27 seal and calibration contracts
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p 'test_analysis_627_seal.py' -q
          python -m unittest discover -s tests -p 'test_analysis_627_blind_failure_calibration.py' -q
          python -m unittest discover -s tests -p 'test_analysis_627_precision_routing.py' -q
          python -m unittest discover -s tests -p 'test_family_confusion_matrix_v670.py' -q
          python -m unittest discover -s tests -p 'test_family_reasoners_v670.py' -q
          python -m unittest discover -s tests -p 'test_family_evidence_extractors_v680.py' -q

      - name: Re-run consumed v4 as regression only
        env:
          PYTHONPATH: app
        run: |
          python app/raw_recon_v4_regression.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('benchmarks/raw/results/analysis_raw_v4_6_27_regression.json').read_text())
          assert report['evaluation_kind']=='post_first_blind_regression'
          assert report['quality_gate']['passed'], report['quality_gate']['failures']
          metrics=report['metrics']
          assert metrics['condition_extraction_precision']==1.0
          assert metrics['condition_extraction_recall']==1.0
          assert metrics['admission_precision']==1.0
          assert metrics['admission_recall']==1.0
          assert metrics['false_promotion_rate']==0.0
          assert metrics['wrong_family_promotion_rate']==0.0
          assert metrics['end_to_end_accuracy']==1.0
          PY

      - name: Full unit suite on Python 3.11
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden strict on Python 3.11
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration on Python 3.11
        run: python tests/integration_runner.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Exact Analysis 6.28 ownership contract on Python 3.13
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_analysis_628_orchestrator_cleanup.py' -q

      - name: Full unit suite on Python 3.13
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden strict on Python 3.13
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration on Python 3.13
        run: python tests/integration_runner.py

      - name: Verify immutable v4 boundary
        run: |
          python - <<'PY'
          from pathlib import import hashlib, json
          PY
        continue-on-error: true

      - name: Verify immutable v4 hashes exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          expected={
            'benchmarks/raw/analysis_raw_v4.jsonl':'fe6936881b7fe0e8c71c9bc76a0f87d02446a3d703ec1dddf84e0b6caa7fb9b6',
            'benchmarks/raw/sources/v4_shortlist.json':'d329752e8b6045b433e3d490c0ff438f067577840fb5429a80721a0f79a34f85',
            'benchmarks/raw/sources/v4_first_blind_report.json':'5c9d241b9da38fb374caa1851b8474aab2580dbafd1dbf25b6e68db267097960',
          }
          for name,wanted in expected.items():
            actual=hashlib.sha256(Path(name).read_bytes()).hexdigest(); assert actual==wanted,(name,wanted,actual)
          receipt=json.loads(Path('benchmarks/raw/sources/v4_first_blind_receipt.json').read_text())
          assert receipt['status']=='first_blind_consumed'
          assert receipt['evaluation_kind']=='first_blind_single_consumption'
          PY

      - name: Update manifest for Analysis 6.28
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.'); manifest=root/'MANIFEST.sha256'; entries={}; order=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
            if '  ' not in line: continue
            _,name=line.split('  ',1); p=root/name
            if p.is_file(): entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          permanent=(
            'app/analysis_engine.py','app/bug_candidates.py','app/security_reasoning.py',
            'app/family_orchestration.py','app/static_family_collectors.py',
            'tests/test_analysis_627_seal.py','tests/test_analysis_628_orchestrator_cleanup.py',
            'docs/ANALYSIS_ENGINE_6_28_ORCHESTRATOR_CLEANUP.md',
            'benchmarks/raw/results/analysis_raw_v4_6_27_regression.json',
          )
          for name in permanent:
            p=root/name
            if not p.is_file(): raise SystemExit(f'missing permanent 6.28 file: {name}')
            entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
            if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order),encoding='utf-8')
          PY

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Commit Analysis 6.28 cutover and remove one-shot helpers/workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-628-cutover.yml scripts/analysis_628_cutover.py scripts/analysis_628_compat.py
          git add -A
          git diff --cached --check
          git commit -m "Cut over Analysis Engine 6.28 orchestrator cleanup"
          git push origin HEAD:agent/analysis-engine-6.28-final-orchestrator-cleanup
