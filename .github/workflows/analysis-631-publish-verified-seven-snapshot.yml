name: Analysis 6.31 Publish Verified Seven Snapshot

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - '.github/workflows/analysis-631-publish-verified-seven-snapshot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: analysis-631-publish-verified-seven-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.31-fresh-blind-v6-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable capture artifact from successful strict-gate run
        uses: actions/download-artifact@v4
        with:
          name: analysis-631-seven-source-grounded-captures
          path: captured
          github-token: ${{ github.token }}
          repository: alirezasafariii/recon-monitor
          run-id: 31818999759
      - name: Normalize capture-only schema vocabulary
        env:
          PYTHONPATH: app
        run: |
          python app/v6_capture_method_normalize.py captured
          python app/v6_capture_adjudication_normalize.py captured
      - name: Re-run complete strict pre-score gates on immutable snapshot
        env:
          PYTHONPATH: app
        run: |
          set -euo pipefail
          python app/v6_literal_evidence_publish.py captured
          python app/v6_literal_capture_plan.py
          python app/v6_literal_capture_ingest.py --allow-incomplete
          python app/v6_literal_partial_verify.py
          python app/v6_literal_capture_verify.py --allow-missing
          python app/v6_literal_raw_precheck.py
          python app/v6_remaining_capture_manifest.py
          python app/v6_remaining_capture_index.py
          python app/v6_pre_score_checkpoint_refresh.py
          python - <<'PY'
          import json
          from pathlib import Path
          checkpoint = json.loads(Path('benchmarks/raw/sources/v6_pre_score_checkpoint.json').read_text())
          progress = checkpoint['literal_capture_progress']
          assert progress['evidence_present_count'] == 88, progress
          assert progress['complete_family_count'] == 22, progress
          assert checkpoint['scoring_executed'] is False
          assert checkpoint['first_blind_consumed'] is False
          PY
      - name: Commit verified evidence snapshot
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_capture_evidence/*.json \
                  benchmarks/raw/sources/v6_literal_capture_plan.json \
                  benchmarks/raw/sources/v6_literal_capture_ingest_report.json \
                  benchmarks/raw/sources/v6_remaining_capture_manifest.json \
                  benchmarks/raw/sources/v6_remaining_capture_index.tsv \
                  benchmarks/raw/sources/v6_pre_score_checkpoint.json
          if [[ -f benchmarks/raw/sources/v6_literal_capture_verification.json ]]; then
            git add benchmarks/raw/sources/v6_literal_capture_verification.json
          fi
          if git diff --cached --quiet; then
            echo 'Verified 88/144 snapshot already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified Analysis 6.31 seven-family evidence snapshot'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
