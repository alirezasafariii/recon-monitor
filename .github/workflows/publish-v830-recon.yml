name: Publish Recon Monitor v8.3.0 Recon Intelligence 2.0

on:
  push:
    paths:
      - '.github/workflows/publish-v830-recon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v8.3.0 patch and remove staging
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/v830/part* > /tmp/v830.b64
          test "$(wc -c < /tmp/v830.b64)" -eq 20432
          base64 -d /tmp/v830.b64 > /tmp/v830.patch.gz
          gzip -t /tmp/v830.patch.gz
          gzip -dc /tmp/v830.patch.gz > /tmp/v830.patch
          git apply --check /tmp/v830.patch
          git apply /tmp/v830.patch
          rm -rf .github/patches/v830
          rm -f .github/workflows/publish-v830-recon.yml
          find app tests -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f \( -name '*.pyc' -o -name '.DS_Store' \) -delete
          rm -f state/recon-v2.db config.env policies/targets.json

      - name: Rebuild manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x: x.as_posix()):
              if not p.is_file():
                  continue
              rel=p.as_posix().removeprefix('./')
              parts=p.parts
              if '.git' in parts or rel == 'MANIFEST.sha256':
                  continue
              if rel in {'config.env','policies/targets.json'}:
                  continue
              if '__pycache__' in parts or p.suffix == '.pyc' or p.name == '.DS_Store':
                  continue
              if parts and parts[0] in {'state','output','reports','logs'} and p.name != '.gitkeep':
                  continue
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append(f'{digest}  {rel}')
          Path('MANIFEST.sha256').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          print(f'Manifest files: {len(rows)}')
          PY

      - name: Verify source hygiene and manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          test ! -f config.env
          test ! -f policies/targets.json
          test ! -e .github/patches/v830
          test ! -e .github/workflows/publish-v830-recon.yml
          grep -q 'APP_VERSION = "8.3.0"' app/core.py
          grep -q 'RECON_CATEGORY_ORDER' app/dashboard.py
          grep -q "System" app/dashboard.py
          if find . -type f \( -name '*.pyc' -o -name '.DS_Store' \) | grep -q .; then exit 1; fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=app python -m unittest discover -s tests -v
          cp config.env.example config.env
          sed -i 's/I_HAVE_AUTHORIZATION="no"/I_HAVE_AUTHORIZATION="yes"/' config.env
          cp policies/targets.json.example policies/targets.json
          ./recon-monitor.sh test --integration
          rm -f config.env policies/targets.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=app python -m unittest discover -s tests -v
          cp config.env.example config.env
          sed -i 's/I_HAVE_AUTHORIZATION="no"/I_HAVE_AUTHORIZATION="yes"/' config.env
          cp policies/targets.json.example policies/targets.json
          ./recon-monitor.sh test --integration
          rm -f config.env policies/targets.json
          find app tests -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete

      - name: Rebuild final manifest after tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x: x.as_posix()):
              if not p.is_file(): continue
              rel=p.as_posix().removeprefix('./'); parts=p.parts
              if '.git' in parts or rel == 'MANIFEST.sha256': continue
              if rel in {'config.env','policies/targets.json'}: continue
              if '__pycache__' in parts or p.suffix == '.pyc' or p.name == '.DS_Store': continue
              if parts and parts[0] in {'state','output','reports','logs'} and p.name != '.gitkeep': continue
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}')
          Path('MANIFEST.sha256').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256

      - name: Commit clean v8.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Recon Monitor 8.3.0 Recon Intelligence 2.0'
          git push origin HEAD:main

      - name: Tag and release v8.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v8.3.0 -m 'Recon Monitor 8.3.0'
          git push origin v8.3.0
          git archive --format=zip --prefix=recon-monitor-v8.3.0/ -o /tmp/recon-monitor-v8.3.0.zip HEAD
          cd /tmp
          sha256sum recon-monitor-v8.3.0.zip > recon-monitor-v8.3.0.zip.sha256
          gh release create v8.3.0 recon-monitor-v8.3.0.zip recon-monitor-v8.3.0.zip.sha256 --repo alirezasafariii/recon-monitor --title 'Recon Monitor v8.3.0' --notes 'Recon Intelligence 2.0: complete Overview / Categories / Raw Data architecture; 9 multi-label security categories; 6 raw-data sources; interest scoring, change state, provenance and coverage/blind-spot context; duplicate research routes removed from the former More Tools menu and consolidated under their owning workspaces; More Tools is now System for operations, safety, governance and configuration only. 178 unit tests plus integration validation on Python 3.11 and 3.13. Schema remains 16.'
