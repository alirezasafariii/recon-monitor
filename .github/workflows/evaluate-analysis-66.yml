name: Evaluate Analysis 6.6 Fresh Holdout

on:
  push:
    branches:
      - agent/analysis-engine-6.6-postfreeze-blind
    paths:
      - .analysis-66-evaluate

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sealed branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.6-postfreeze-blind
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preflight frozen seal without scoring
        env:
          PYTHONPATH: app
        run: |
          python app/analysis_postfreeze_sources.py
          python app/analysis_postfreeze.py --json
          grep -q '"evaluation_status": "sealed_postfreeze"' benchmarks/golden/splits/v4.json
          grep -q '"sealed": true' benchmarks/golden/splits/v4.json
          grep -q '90aa5e60ee2d7ba9d686d831ad0aa88e6aee28fb4c2f09b87bc02ad3f64290ab' benchmarks/golden/splits/v4.json
          python -m unittest discover -s tests -p 'test_analysis_postfreeze*_v660.py' -q

      - name: Run first fresh post-freeze evaluation exactly once
        id: blind_eval
        shell: bash
        env:
          PYTHONPATH: app
        run: |
          set +e
          mkdir -p benchmarks/golden/reports
          python app/analysis_postfreeze.py --evaluate --json > benchmarks/golden/reports/analysis_v4_postfreeze_report.json
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          python -m json.tool benchmarks/golden/reports/analysis_v4_postfreeze_report.json >/dev/null
          test -s benchmarks/golden/reports/analysis_v4_postfreeze_report.json
          echo "$status" > /tmp/analysis_v66_eval_exit_code

      - name: Verify evaluation did not mutate sealed inputs
        shell: bash
        run: |
          git diff --exit-code -- benchmarks/golden/analysis_golden_v4.jsonl benchmarks/golden/splits/v4.json
          grep -q '90aa5e60ee2d7ba9d686d831ad0aa88e6aee28fb4c2f09b87bc02ad3f64290ab' benchmarks/golden/splits/v4.json

      - name: Commit immutable evaluation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/golden/reports/analysis_v4_postfreeze_report.json
          git diff --cached --name-only | grep -qx 'benchmarks/golden/reports/analysis_v4_postfreeze_report.json'
          git commit -m "Record Analysis 6.6 fresh post-freeze evaluation"
          git push origin HEAD:agent/analysis-engine-6.6-postfreeze-blind

      - name: Enforce preregistered gate result
        shell: bash
        run: |
          status='${{ steps.blind_eval.outputs.exit_code }}'
          if [ "$status" -ne 0 ]; then
            echo "Fresh post-freeze evaluation did not pass preregistered gates; report was preserved unchanged." >&2
            exit "$status"
          fi
