name: Publish Recon Monitor v8.7.0

on:
  push:
    branches: [agent/recon-analysis-live-progress-v1-clean]
    paths: ['.release-v8.7.0-trigger']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6a13e22ab3246d1c29117f3a9cabf0b7a55c976b"
          test "$(./recon-monitor.sh --version)" = "8.7.0"
          test -f docs/RELEASE_NOTES_v8.7.0.md
      - name: Publish v8.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v8.7.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v8.7.0 already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v8.7.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "6a13e22ab3246d1c29117f3a9cabf0b7a55c976b" \
            --title "Recon Monitor 8.7.0 — Evidence Completion & Live Progress" \
            --notes-file docs/RELEASE_NOTES_v8.7.0.md
