name: Analysis 6.25 One-Shot Cutover

on:
  push:
    branches:
      - agent/analysis-engine-6.25-owasp-top10-completion

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.25-owasp-top10-completion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic Analysis 6.25 cutover
        run: python scripts/analysis_625_cutover.py

      - name: Extend Analysis 6.25 evidence/reasoner registries
        run: python scripts/analysis_625_registry_extension.py

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: OWASP Top 10 2025 completion contract
        run: python -m unittest discover -s tests -p 'test_owasp_top10_2025_completion_v6250.py' -q

      - name: Family evidence extractor regression
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_family_evidence_extractors_v680.py' -q

      - name: Family reasoner regression
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_family_reasoners_v670.py' -q

      - name: Four-layer standards grounding contract
        run: python -m unittest discover -s tests -p 'test_analysis_619_standards_grounding.py' -q

      - name: Physical detector regression
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_physical_family_detectors_v690.py' -q

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit validated Analysis 6.25 cutover and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-625-one-shot.yml scripts/analysis_625_cutover.py scripts/analysis_625_registry_extension.py
          git add -A
          git diff --cached --check
          git commit -m "Complete OWASP Top 10 2025 coverage in Analysis 6.25"
          git push origin HEAD:agent/analysis-engine-6.25-owasp-top10-completion
