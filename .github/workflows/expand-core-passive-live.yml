name: Expand Core Passive Live

on:
  push:
    branches: ['feat/core-passive-live-adapters-20260914']
    paths: ['tools/_expand_core_passive_live_patch.py']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/core-passive-live-adapters-20260914
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/_expand_core_passive_live_patch.py
      - name: Verify focused regressions
        run: |
          set -euo pipefail
          python -m py_compile app/typed_evidence_adapter.py tests/test_typed_evidence_adapter.py
          python -m unittest tests.test_typed_evidence_adapter -q
          sha256sum --strict -c MANIFEST.sha256
      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          rm tools/_expand_core_passive_live_patch.py
          rm .github/workflows/expand-core-passive-live.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: cover remaining core passive-live families'
          git push origin HEAD:feat/core-passive-live-adapters-20260914
