name: Finalize Analysis 6.9 Physical Family Detectors

on:
  push:
    branches: [agent/analysis-engine-6.9-physical-family-detectors]
    paths: [.analysis-69-finalize]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.9-physical-family-detectors
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Analysis 6.9 integration
        run: python .analysis-69-apply.py
      - name: Advance inherited version contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          updates = {
            'tests/test_analysis_ranking_v650.py': [('self.assertEqual(REASONING_ENGINE_VERSION, "6.8.0")', 'self.assertEqual(REASONING_ENGINE_VERSION, "6.9.0")')],
            'tests/test_analysis_coverage_v610.py': [
              ('self.assertEqual(ENGINE_VERSION, "6.8.0")', 'self.assertEqual(ENGINE_VERSION, "6.9.0")'),
              ('self.assertEqual(CANDIDATE_ENGINE_VERSION, "6.8.0")', 'self.assertEqual(CANDIDATE_ENGINE_VERSION, "6.9.0")'),
              ('self.assertEqual(REASONING_ENGINE_VERSION, "6.8.0")', 'self.assertEqual(REASONING_ENGINE_VERSION, "6.9.0")'),
            ],
          }
          for path, replacements in updates.items():
              p = Path(path); text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text: raise SystemExit(f'missing version assertion: {path}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Syntax and registry check
        env:
          PYTHONPATH: app
        run: |
          python -m py_compile app/family_detectors/*.py app/analysis_standards.py app/bug_candidates.py app/analysis_engine.py app/security_reasoning.py
          python - <<'PY'
          from family_detectors import validate_detector_registry
          assert validate_detector_registry() == []
          PY
      - name: Focused detector stack
        env:
          PYTHONPATH: app
        run: |
          python tests/test_physical_family_detectors_v690.py
          python tests/test_family_evidence_extractors_v680.py
          python tests/test_family_reasoners_v670.py
          python tests/test_family_confusion_matrix_v670.py
          python tests/test_analysis_ranking_v650.py
          python tests/test_analysis_coverage_v610.py
      - name: Full unit suite
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Golden v3 strict regression
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict
      - name: Integration test
        run: python tests/integration_runner.py
      - name: Remove temporary Analysis 6.9 machinery
        shell: bash
        run: |
          rm -f .analysis-69-apply.py .analysis-69-trigger .analysis-69-diag .analysis-69-finalize analysis69-focused.txt
          rm -f .github/workflows/apply-analysis-69.yml .github/workflows/diagnose-analysis-69.yml .github/workflows/finalize-analysis-69.yml
      - name: Regenerate tracked-source manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          raw = subprocess.check_output(['git','ls-files','-z'])
          paths = [x.decode() for x in raw.split(b'\0') if x]
          removed = {'.analysis-69-apply.py','.analysis-69-trigger','.analysis-69-diag','.analysis-69-finalize','analysis69-focused.txt','.github/workflows/apply-analysis-69.yml','.github/workflows/diagnose-analysis-69.yml','.github/workflows/finalize-analysis-69.yml'}
          lines=[]
          for path in sorted(paths):
              if path == 'MANIFEST.sha256' or path in removed or not os.path.isfile(path): continue
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              lines.append(f'{h.hexdigest()}  {path}\n')
          with open('MANIFEST.sha256','w',encoding='utf-8') as f: f.writelines(lines)
          PY
          sha256sum -c MANIFEST.sha256
      - name: Commit finalized Analysis 6.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Analysis 6.9 physical family detectors"
          git push origin HEAD:agent/analysis-engine-6.9-physical-family-detectors
