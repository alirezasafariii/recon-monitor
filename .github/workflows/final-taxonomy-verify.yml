name: Final Taxonomy Verify

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'Run final taxonomy verification'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' \) -print -quit)"
      - name: Verify Python syntax
        run: python -m py_compile app/family_specs/base.py app/family_specs/taxonomy_attribution.py app/family_specs/registry.py app/hypothesis_admission.py
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Targeted taxonomy tests
        run: python -m unittest tests.test_final_taxonomy_attribution -q
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration test
        run: python tests/integration_runner.py
