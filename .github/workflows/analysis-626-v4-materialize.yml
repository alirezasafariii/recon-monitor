name: Analysis 6.26 Raw v4 Materialization

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialization contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_raw_recon_v4_materialization_v6260.py' -q

      - name: Source selection protocol regressions
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p 'test_raw_recon_v4_source_audit_v6260.py' -q
          python -m unittest discover -s tests -p 'test_raw_recon_v4_source_map_discovery_v6260.py' -q
          python -m unittest discover -s tests -p 'test_raw_recon_v4_inventory_discovery_v6260.py' -q

      - name: Materialize exactly 144 raw cases without scoring
        env:
          PYTHONPATH: app
        run: python app/raw_recon_v4_materialize.py

      - name: Verify frozen pre-score corpus invariants
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_corpus import load_raw_cases
          from raw_recon_v4_corpus import validate_v4_corpus

          shortlist = json.loads(Path('benchmarks/raw/sources/v4_shortlist.json').read_text(encoding='utf-8'))
          cases = load_raw_cases([Path('benchmarks/raw/analysis_raw_v4.jsonl')])
          report = json.loads(Path('benchmarks/raw/sources/v4_materialization_report.json').read_text(encoding='utf-8'))
          validation = validate_v4_corpus(cases, shortlist=shortlist)
          print(json.dumps({
              'case_count': len(cases),
              'source_root_count': validation['source_root_count'],
              'source_project_count': validation['source_project_count'],
              'positive_family_count': validation['positive_family_count'],
              'prior_root_overlap': validation['prior_source_root_overlap_count'],
              'prior_project_overlap': validation['prior_source_project_overlap_count'],
              'prior_url_overlap': validation['prior_url_overlap_count'],
              'grounding_overlap': validation['grounding_writeup_overlap_count'],
              'raw_collisions': validation['positive_control_raw_collision_count'],
              'observable_delta_rate': validation['positive_observable_delta_rate'],
              'base_label_leakage': validation.get('label_leakage_count', 0),
              'scoring_executed': report['scoring_executed'],
              'corpus_sha256': report['corpus_sha256'],
          }, indent=2, sort_keys=True))
          assert validation['passed'], validation['errors']
          assert len(cases) == 144
          assert validation['source_root_count'] == 36
          assert validation['source_project_count'] == 36
          assert validation['positive_family_count'] == 36
          assert validation['prior_source_root_overlap_count'] == 0
          assert validation['prior_source_project_overlap_count'] == 0
          assert validation['prior_url_overlap_count'] == 0
          assert validation['grounding_writeup_overlap_count'] == 0
          assert validation['positive_control_raw_collision_count'] == 0
          assert validation['positive_observable_delta_rate'] == 1.0
          assert report['scoring_executed'] is False
          PY

      - name: Register corpus and materialization artifacts in manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          entries = {}
          order = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line:
                  continue
              _, name = line.split('  ', 1)
              path = root / name
              if path.is_file():
                  entries[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  order.append(name)

          for name in (
              'app/raw_recon_v4_corpus.py',
              'app/raw_recon_v4_materialize.py',
              'tests/test_raw_recon_v4_materialization_v6260.py',
              'benchmarks/raw/analysis_raw_v4.jsonl',
              'benchmarks/raw/sources/v4_materialization_report.json',
          ):
              path = root / name
              entries[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              if name not in order:
                  order.append(name)

          manifest.write_text(
              ''.join(f'{entries[name]}  {name}\n' for name in order),
              encoding='utf-8',
          )
          PY

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Commit materialized pre-score corpus and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-v4-materialize.yml
          git add -A
          git diff --cached --check
          git commit -m "Materialize Analysis 6.26 fresh raw v4 holdout"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
