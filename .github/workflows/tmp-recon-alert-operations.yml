name: Temporary validate Recon Alert operations

on:
  push:
    branches:
      - agent/recon-alert-operations-v890

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/recon-alert-operations-v890
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run focused operations validation
        run: |
          python -m py_compile app/recon_alert_operations.py app/recon_alert_outbox.py tools/deliver_recon_alerts.py
          python -m unittest tests.test_recon_alert_operations tests.test_recon_alert_outbox tests.test_recon_alert_transport_consolidation

      - name: Remove temporary workflow and refresh manifest
        run: |
          git rm .github/workflows/tmp-recon-alert-operations.yml
          : > MANIFEST.sha256
          while IFS= read -r file; do
            if [ "$file" = "MANIFEST.sha256" ]; then
              continue
            fi
            sha256sum "$file" >> MANIFEST.sha256
          done < <(git ls-files)
          sha256sum --strict -c MANIFEST.sha256

      - name: Commit validated feature tree
        run: |
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add MANIFEST.sha256
          git commit -m 'chore: finalize Recon Alert operations manifest'
          git push origin HEAD:agent/recon-alert-operations-v890
