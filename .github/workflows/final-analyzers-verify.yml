name: Final Analyzers Verify

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: write

jobs:
  manifest:
    if: ${{ !contains(github.event.head_commit.message, '[manifest-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh manifest from current branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          entries = {}
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line:
                  continue
              digest, path = line.split(None, 1)
              entries[path.strip()] = digest

          new_paths = [
              'app/family_reasoning_final_analyzers.py',
              'app/family_specs/__init__.py',
              'app/family_specs/base.py',
              'app/family_specs/broken_function_authorization.py',
              'app/family_specs/broken_object_authorization.py',
              'app/family_specs/knowledge_projection.py',
              'app/family_specs/registry.py',
              'app/family_specs/ssrf.py',
              'tests/test_final_analyzers_bfla_ssrf_specs.py',
              'tests/test_final_analyzers_bola_spec.py',
          ]
          for path in new_paths:
              entries.setdefault(path, '')

          for path in sorted(entries):
              file_path = Path(path)
              if not file_path.is_file():
                  raise SystemExit(f'manifest path missing: {path}')
              entries[path] = hashlib.sha256(file_path.read_bytes()).hexdigest()

          manifest.write_text(
              ''.join(f'{entries[path]}  {path}\n' for path in sorted(entries)),
              encoding='utf-8',
          )
          PY
      - name: Verify refreshed manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Commit refreshed manifest
        shell: bash
        run: |
          if git diff --quiet -- MANIFEST.sha256; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          git commit -m 'Sync final analyzer manifest [manifest-sync]'
          git push origin HEAD:final-analyzers
