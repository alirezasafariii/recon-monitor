name: Analysis 6.17 One-Shot Cutover

on:
  push:
    branches:
      - agent/analysis-engine-6.17-authorization-raw-collectors

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.17-authorization-raw-collectors
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic 6.17 cutover
        run: python scripts/analysis_617_cutover.py

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Authorization collector tests
        run: python -m unittest discover -s tests -p 'test_physical_raw_collector_authorization_v6170.py' -q

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit validated cutover and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-617-one-shot.yml scripts/analysis_617_cutover.py
          git add MANIFEST.sha256 app/bug_candidates.py app/raw_family_collectors/__init__.py app/raw_family_collectors/authorization.py docs/ANALYSIS_ENGINE_6_17_AUTHORIZATION_RAW_COLLECTORS.md tests/test_physical_raw_collector_authorization_v6170.py
          git diff --cached --check
          git commit -m "Cut over Analysis 6.17 authorization raw collectors"
          git push origin HEAD:agent/analysis-engine-6.17-authorization-raw-collectors
