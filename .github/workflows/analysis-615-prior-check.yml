name: Analysis 6.15 Prior Provenance Check

on:
  push:
    branches:
      - agent/analysis-engine-6.15-fresh-raw-holdout-v3

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.15-fresh-raw-holdout-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check candidate roots and URLs
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_corpus import prior_source_index
          from raw_recon_v3_corpus import V3_PRIOR_CORPORA
          prior = prior_source_index(V3_PRIOR_CORPORA)
          v2 = json.loads(Path('benchmarks/raw/sources/v2_candidates.json').read_text())
          v2_roots, v2_urls = set(), set()
          for rows in (v2.get('candidates_by_family') or {}).values():
              for row in rows if isinstance(rows, list) else []:
                  if not isinstance(row, dict):
                      continue
                  if row.get('source_root'): v2_roots.add(str(row['source_root']))
                  if row.get('canonical_advisory_url'): v2_urls.add(str(row['canonical_advisory_url']))
          candidates = [
            ("GHSL-2023-234", "https://securitylab.github.com/advisories/GHSL-2023-232_GHSL-2023-234_Flowise/"),
            ("CVE-2020-8164", "https://groups.google.com/g/rubyonrails-security/c/f6ioe4sdpbY"),
            ("GHSL-2020-067", "https://securitylab.github.com/advisories/GHSL-2020-067-apache_ofbiz/"),
          ]
          report = []
          for root, url in candidates:
              report.append({
                  "root": root,
                  "url": url,
                  "prior_root_overlap": root in prior["roots"],
                  "prior_url_overlap": url in prior["urls"],
                  "v2_candidate_root_seen": root in v2_roots,
                  "v2_candidate_url_seen": url in v2_urls,
              })
          print(json.dumps(report, indent=2))
          PY
