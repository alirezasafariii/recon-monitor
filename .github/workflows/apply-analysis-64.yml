name: Apply Analysis 6.4

on:
  push:
    branches:
      - agent/analysis-engine-6.0-owasp-admission
    paths:
      - .analysis-64-apply.py
      - .analysis-64-fix.py
      - .github/workflows/apply-analysis-64.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.0-owasp-admission
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Analysis 6.4 patch
        run: |
          python3 .analysis-64-apply.py
          python3 .analysis-64-fix.py

      - name: Remove temporary patch machinery
        run: |
          rm -f .analysis-64-apply.py
          rm -f .analysis-64-fix.py
          rm -f .github/workflows/apply-analysis-64.yml

      - name: Syntax checks
        run: |
          python3 -m py_compile \
            app/analysis_corpus.py \
            app/analysis_benchmark.py \
            app/analysis_standards.py \
            app/hypothesis_admission.py \
            tests/test_analysis_large_corpus_v640.py

      - name: Corpus lint and held-out benchmark
        env:
          PYTHONPATH: app
        run: |
          python3 app/analysis_benchmark.py --strict
          python3 -m unittest \
            tests.test_analysis_large_corpus_v640 \
            tests.test_analysis_hard_benchmark_v630 \
            tests.test_analysis_standards_v630 \
            tests.test_analysis_golden_benchmark_v620

      - name: Full regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Integration test
        run: python3 tests/integration_runner.py

      - name: Clean generated caches
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Regenerate and verify manifest
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          rows = []
          for raw in files:
              if not raw:
                  continue
              name = raw.decode()
              if name == "MANIFEST.sha256":
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}")
          Path("MANIFEST.sha256").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add MANIFEST.sha256
          sha256sum -c MANIFEST.sha256

      - name: Commit final Analysis 6.4 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Analysis 6.4 real-world held-out calibration'
          git push origin HEAD:agent/analysis-engine-6.0-owasp-admission
