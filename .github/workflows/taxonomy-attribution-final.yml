name: Taxonomy Attribution Final

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run taxonomy attribution integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply taxonomy attribution integration
        run: python .github/scripts/apply_taxonomy_attribution.py
      - name: Refresh manifest for verification state
        shell: bash
        run: |
          git ls-files -z | grep -zv '^MANIFEST.sha256$' | sort -z | xargs -0 sha256sum > MANIFEST.sha256
      - name: Verify syntax
        run: python -m py_compile app/family_specs/taxonomy_attribution.py app/family_specs/knowledge_projection.py app/hypothesis_admission.py
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration suite
        run: python tests/integration_runner.py
      - name: Commit permanent integration and cleanup verifier
        shell: bash
        run: |
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          rm -f .github/TAXONOMY_ATTRIBUTION_TRIGGER
          rm -f .github/scripts/apply_taxonomy_attribution.py
          rm -f .github/workflows/taxonomy-attribution-final.yml
          git ls-files -z | grep -zv '^MANIFEST.sha256$' | grep -zv '^.github/TAXONOMY_ATTRIBUTION_TRIGGER$' | grep -zv '^.github/scripts/apply_taxonomy_attribution.py$' | grep -zv '^.github/workflows/taxonomy-attribution-final.yml$' | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          git add -A
          git commit -m 'Integrate structured taxonomy attribution'
          git push origin HEAD:final-analyzers

  verify:
    needs: integrate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout integrated branch head
        run: |
          git fetch origin final-analyzers
          git checkout -B final-analyzers origin/final-analyzers
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/TAXONOMY_ATTRIBUTION_TRIGGER
          test ! -e .github/scripts/apply_taxonomy_attribution.py
          test ! -e .github/workflows/taxonomy-attribution-final.yml
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' \) -print -quit)"
      - name: Verify syntax
        run: python -m py_compile app/family_specs/taxonomy_attribution.py app/family_specs/knowledge_projection.py app/hypothesis_admission.py
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration suite
        run: python tests/integration_runner.py
