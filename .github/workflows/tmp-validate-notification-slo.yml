name: Temporary validate notification delivery SLO

on:
  push:
    branches: [agent/notification-delivery-slo-v890]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/notification-delivery-slo-v890
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Integrate SLO evaluation and Operations Center visibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Fix placeholder counts in the newly added additive schema before validation.
          p = Path('app/notification_delivery_slo.py')
          text = p.read_text()
          text = text.replace(
              '") VALUES(1,1,?,?,?,?,?,?,?,?,?,?,?,?,?)",',
              '") VALUES(1,1,?,?,?,?,?,?,?,?,?,?,?,?)",',
          )
          text = text.replace(
              '") VALUES(?,?,?,\'open\',?,?,?,?,?,?,?,\'\',0,1,?,?,?,?,?)",',
              '") VALUES(?,?,?,\'open\',?,?,?,?,?,?,?,\'\',0,1,?,?,?,?)",',
          )
          p.write_text(text)

          # Supervisor evaluates SLOs after each coordinated runtime cycle.
          p = Path('app/notification_supervisor.py')
          text = p.read_text()
          old_imports = (
              'from finding_notification_operations import run_finding_notification_worker, worker_due\n'
              'from recon_alert_operations import recon_alert_worker_due, run_recon_alert_worker\n'
          )
          new_imports = (
              'from finding_notification_operations import finding_notification_diagnostics, run_finding_notification_worker, worker_due\n'
              'from notification_delivery_slo import evaluate_notification_delivery_slo\n'
              'from recon_alert_operations import recon_alert_diagnostics, recon_alert_worker_due, run_recon_alert_worker\n'
          )
          if old_imports not in text:
              raise SystemExit('supervisor import anchor not found')
          text = text.replace(old_imports, new_imports, 1)
          old_return = '''    heartbeat_notification_supervisor(db, owner_id=owner_id, now=finished)\n    return {\n        "version": NOTIFICATION_SUPERVISOR_VERSION,\n        "status": status,\n        "supervisor_run_id": run_id,\n        "owner_id": owner_id,\n        "workers": results,\n        "error": error,\n        "supervisor": notification_supervisor_status(db, now=finished),\n    }\n'''
          new_return = '''    heartbeat_notification_supervisor(db, owner_id=owner_id, now=finished)\n    supervisor_status = notification_supervisor_status(db, now=finished)\n    slo = evaluate_notification_delivery_slo(\n        db,\n        workers={\n            "finding": finding_notification_diagnostics(db, now=finished),\n            "recon_alert": recon_alert_diagnostics(db, now=finished),\n        },\n        supervisor=supervisor_status,\n        now=finished,\n    )\n    return {\n        "version": NOTIFICATION_SUPERVISOR_VERSION,\n        "status": status,\n        "supervisor_run_id": run_id,\n        "owner_id": owner_id,\n        "workers": results,\n        "error": error,\n        "supervisor": supervisor_status,\n        "slo": slo,\n    }\n'''
          if old_return not in text:
              raise SystemExit('supervisor return anchor not found')
          p.write_text(text.replace(old_return, new_return, 1))

          # Operations Center UI surfaces SLO state and durable open breaches.
          p = Path('app/dashboard_core.py')
          text = p.read_text()
          anchor = "        supervisor=dict(delivery.get('supervisor') or {})\n"
          if anchor not in text:
              raise SystemExit('dashboard supervisor anchor not found')
          text = text.replace(anchor, anchor + "        slo=dict(delivery.get('slo') or {})\n", 1)
          worker_anchor = "        worker_html=\"<section class='panel' style='margin-top:16px'><div class='panel-head'><div><h3>Delivery workers</h3>"
          if worker_anchor not in text:
              raise SystemExit('dashboard worker panel anchor not found')
          slo_block = '''        slo_rows=[]\n        for row in slo.get('open_breaches',[]):\n            thresholds=f"{row.get('warning_threshold',0)} / {row.get('critical_threshold',0)}"\n            slo_rows.append(f"<tr><td>{_esc(row.get('scope',''))}</td><td>{_esc(row.get('metric',''))}</td><td>{_pill(row.get('severity','warning'))}</td><td>{_esc(row.get('value',0))}</td><td>{_esc(thresholds)}</td><td>{_esc(row.get('opened_at',''))}</td><td>{_esc(row.get('summary',''))}</td></tr>")\n        slo_policy=dict(slo.get('policy') or {})\n        slo_state=str(slo.get('state') or 'healthy')\n        slo_html=f"<section class='panel' style='margin-top:16px'><div class='panel-head'><div><h3>Delivery SLOs</h3><span class='muted small'>Durable threshold breaches with dedup and cooldown.</span></div>{_pill(slo_state,'danger' if slo_state=='critical' else 'amber' if slo_state=='warning' else 'success')}</div><div class='panel-body'><div class='metrics-grid'>"+_metric_card('Open breaches',slo.get('open_breach_count',0),'Current delivery-health violations','danger' if slo_state=='critical' else 'amber' if slo_state=='warning' else 'success')+_metric_card('Critical',slo.get('critical_breach_count',0),'Critical SLO violations','danger')+_metric_card('Warning',slo.get('warning_breach_count',0),'Warning SLO violations','amber')+_metric_card('Cooldown',f"{slo_policy.get('cooldown_seconds',0)}s",'Transition alert dedup window','info')+f"</div><div class='table-wrap' style='margin-top:14px'><table><thead><tr><th>Scope</th><th>Metric</th><th>Severity</th><th>Value</th><th>Warn / Critical</th><th>Opened</th><th>Reason</th></tr></thead><tbody>{''.join(slo_rows) or '<tr><td colspan=7>No open delivery SLO breaches</td></tr>'}</tbody></table></div><p class='muted small' style='margin-top:12px'>SLO events are persisted internally and are not routed through the delivery transports they monitor.</p></div></section>"\n'''
          text = text.replace(worker_anchor, slo_block + worker_anchor, 1)
          body_anchor = "body=header+metrics+supervisor_html+worker_html+dead_table+"
          if body_anchor not in text:
              raise SystemExit('dashboard body anchor not found')
          text = text.replace(body_anchor, "body=header+metrics+supervisor_html+slo_html+worker_html+dead_table+", 1)
          p.write_text(text)

          # Extend existing integration expectations.
          p = Path('tests/test_notification_operations_center.py')
          text = p.read_text()
          anchor = '        self.assertEqual(set(status["workers"]), {"finding", "recon_alert"})\n'
          if anchor not in text:
              raise SystemExit('operations test snapshot anchor not found')
          text = text.replace(anchor, anchor + '        self.assertIn("slo", status)\n', 1)
          anchor = '        self.assertEqual(set(delivery["workers"]), {"finding", "recon_alert"})\n'
          if anchor not in text:
              raise SystemExit('product delivery test anchor not found')
          text = text.replace(anchor, anchor + '        self.assertIn("slo", delivery)\n', 1)
          anchor = '        self.assertIn("Notification supervisor", body)\n'
          if anchor not in text:
              raise SystemExit('dashboard SLO test anchor not found')
          text = text.replace(anchor, anchor + '        self.assertIn("Delivery SLOs", body)\n', 1)
          p.write_text(text)

          # Confirm automatic SLO evaluation is part of supervisor cycle results.
          p = Path('tests/test_notification_supervisor.py')
          text = p.read_text()
          anchor = '        self.assertEqual(result["workers"]["recon_alert"]["status"], "success")\n'
          if anchor not in text:
              raise SystemExit('supervisor result test anchor not found')
          text = text.replace(anchor, anchor + '        self.assertIn("slo", result)\n', 1)
          p.write_text(text)

          # Document the Operations Center extension and supervisor evaluation boundary.
          p = Path('docs/OPERATIONS_CENTER.md')
          text = p.read_text()
          section = '''\n\n## Delivery SLOs\n\nOperations Center evaluates configurable delivery SLOs for oldest pending age, queue backlog, dead letters, supervisor heartbeat freshness, and consecutive worker/supervisor failures. Breaches have durable open/resolved lifecycle state, severity, duration, occurrence counts, transition history, deduplication, and cooldown. SLO state is operational only and never rewrites Finding, Admission, Recon Alert, retry, or successful-delivery truth. See `docs/NOTIFICATION_DELIVERY_SLO.md`.\n'''
          if '## Delivery SLOs' not in text:
              text += section
          p.write_text(text)

          p = Path('docs/NOTIFICATION_SUPERVISOR.md')
          text = p.read_text()
          marker = 'A stale lease becomes claimable after expiry. This provides bounded restart recovery without requiring destructive cleanup.\n'
          addition = marker + '\nAfter each coordinated cycle, the supervisor evaluates Notification Delivery SLOs from the current worker diagnostics and supervisor health. This evaluation records operational breach state only; it does not alter either worker queue or domain truth.\n'
          if marker in text and 'After each coordinated cycle, the supervisor evaluates Notification Delivery SLOs' not in text:
              text = text.replace(marker, addition, 1)
          p.write_text(text)
          PY

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/notification_delivery_slo.py app/notification_operations_center.py app/notification_supervisor.py tools/notification_slo.py
          PYTHONPATH=app python tests/test_notification_delivery_slo.py
          PYTHONPATH=app python tests/test_notification_supervisor.py
          PYTHONPATH=app python tests/test_notification_operations_center.py
          PYTHONPATH=app python tests/test_finding_notification_operations.py
          PYTHONPATH=app python tests/test_recon_alert_operations.py
          PYTHONPATH=app python tests/test_product_platform_v50.py
          PYTHONPATH=app python tests/test_dashboard_performance_v501.py

      - name: Remove temporary workflow and update manifest minimally
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-validate-notification-slo.yml
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          changed = [
              'app/dashboard_core.py',
              'app/notification_delivery_slo.py',
              'app/notification_operations_center.py',
              'app/notification_supervisor.py',
              'docs/NOTIFICATION_DELIVERY_SLO.md',
              'docs/NOTIFICATION_SUPERVISOR.md',
              'docs/OPERATIONS_CENTER.md',
              'tests/test_notification_delivery_slo.py',
              'tests/test_notification_operations_center.py',
              'tests/test_notification_supervisor.py',
              'tools/notification_slo.py',
          ]
          manifest = Path('MANIFEST.sha256')
          lines = manifest.read_text().splitlines()
          by_path = {}
          order = []
          for line in lines:
              if not line.strip():
                  continue
              digest, path = line.split('  ', 1)
              by_path[path] = digest
              order.append(path)
          for path in changed:
              digest = sha256(Path(path).read_bytes()).hexdigest()
              by_path[path] = digest
              if path not in order:
                  order.append(path)
          manifest.write_text(''.join(f'{by_path[path]}  {path}\n' for path in order))
          PY
          sha256sum --strict -c MANIFEST.sha256

      - name: Commit validated feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Alireza Safari"
          git config user.email "88625680+alirezasafariii@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: integrate notification delivery SLO monitoring"
            git push origin HEAD:agent/notification-delivery-slo-v890
          fi
