name: Temporary GraphQL framework migration verification

on:
  push:
    branches:
      - refactor/graphql-admission-config-20260914

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh changed file hash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = 'app/graphql_data_exposure_admission_bridge.py'
          manifest = Path('MANIFEST.sha256')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          keep = [line for line in lines if not line.endswith('  ' + path)]
          digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
          keep.append(f'{digest}  {path}')
          manifest.write_text('\n'.join(keep) + '\n', encoding='utf-8')
          PY
      - name: Verify focused migration
        run: |
          python -m py_compile app/graphql_data_exposure_admission_bridge.py app/reviewed_evidence_admission.py
          PYTHONPATH=app python -m unittest discover -s tests -p 'test_graphql_data_exposure_differential_admission.py'
          PYTHONPATH=app python -m unittest discover -s tests -p 'test_reviewed_evidence_admission.py'
          sha256sum --strict -c MANIFEST.sha256
      - name: Finalize branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          git rm .github/workflows/tmp-graphql-framework-migration-verify.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh manifest for GraphQL admission migration'
            git push
          fi
