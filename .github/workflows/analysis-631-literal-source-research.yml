name: Analysis 6.31 Passive Literal Source Research

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - app/v6_literal_source_research.py
      - .github/workflows/analysis-631-literal-source-research.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse source research after corpus freeze
        run: |
          if [[ -f benchmarks/raw/sources/v6_corpus_freeze.json ]]; then
            echo 'Analysis 6.31 corpus is frozen; source research is immutable.' >&2
            exit 1
          fi

      - name: Collect passive public GitHub source metadata
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/v6_literal_source_research.py

      - name: Assert research did not consume benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('benchmarks/raw/sources/v6_literal_source_research.json').read_text(encoding='utf-8'))
          assert report['family_count'] == 36
          assert report['scoring_executed'] is False
          assert report['first_blind_consumed'] is False
          assert report['detector_output_used'] is False
          assert report['admission_output_used'] is False
          assert report['ranking_output_used'] is False
          assert report['active_target_validation_performed'] is False
          assert report['successful_snapshot_count'] + report['unresolved_snapshot_count'] == 36
          PY

      - name: Commit passive source research snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_literal_source_research.json
          if git diff --cached --quiet; then
            echo 'Passive source research snapshot unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Collect passive Analysis 6.31 literal source research'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
