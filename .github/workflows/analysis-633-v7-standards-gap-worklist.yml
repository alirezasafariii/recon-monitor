name: Analysis 6.33 V7 Standards Gap Worklist

on:
  push:
    branches: [agent/analysis-engine-6.33-v7-unseen-capture]
    paths:
      - '.github/workflows/analysis-633-v7-standards-gap-worklist.yml'
      - 'app/v7_standards_gap_worklist.py'
      - 'benchmarks/raw/sources/v7_standards_adjudication.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-633-v7-standards-gap-worklist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.33-v7-unseen-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standards-guided unresolved worklist
        env: {PYTHONPATH: app}
        run: python app/v7_standards_gap_worklist.py
      - name: Verify worklist scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_standards_gap_worklist.json').read_text())
          a=json.loads(Path('benchmarks/raw/sources/v7_standards_adjudication.json').read_text())
          expected=a['unresolved_variant_count']
          assert r['unresolved_variant_count'] == expected
          assert sum(r['by_case_kind'].values()) == expected
          assert r['adjudication_sha256'] == a['adjudication_sha256']
          assert r['quality_policy']['use_wstg_owasp_cwe_as_rubric'] is True
          assert r['quality_policy']['use_frozen_writeup_lessons_as_rubric'] is True
          assert r['quality_policy']['literal_upstream_source_required_for_acceptance'] is True
          assert r['quality_policy']['lower_threshold_to_force_acceptance'] is False
          assert r['human_review_required'] is False
          assert r['human_verified_record_count'] == 0
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False
          priority0=sorted({x['family'] for x in r['worklist'] if x['priority']==0})
          assert len(priority0) == a['family_adjudication_required_count'] - a['family_mapping_confirmed_count']
          print({
            'unresolved': r['unresolved_variant_count'],
            'by_kind': r['by_case_kind'],
            'by_priority': r['by_priority'],
            'priority0_families': priority0,
            'top_families': list(r['by_family'].items())[:12],
          })
          PY
      - name: Freeze worklist and manifest
        run: |
          git add benchmarks/raw/sources/v7_standards_gap_worklist.json
          git ls-files -z | python -c 'import sys; x=[v for v in sys.stdin.buffer.read().split(b"\0") if v and v!=b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(x))+b"\0")' | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
          git add MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(analysis-633): refresh V7 standards gap worklist'
          git push origin HEAD:agent/analysis-engine-6.33-v7-unseen-capture