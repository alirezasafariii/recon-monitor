name: Refresh v965 Manifest

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/vulnerability-intelligence-8.6.0' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Refresh manifest entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          changed = [
              "app/real_world_calibration.py",
              "app/recon_monitor.py",
              "tests/test_real_world_calibration_v965.py",
              "docs/REAL_WORLD_CALIBRATION_AND_FEEDBACK.md",
          ]
          manifest = Path("MANIFEST.sha256")
          hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in changed}
          output = []
          seen = set()
          for raw in manifest.read_text(encoding="utf-8").splitlines():
              if "  " not in raw:
                  output.append(raw)
                  continue
              _digest, path = raw.split("  ", 1)
              if path in hashes:
                  output.append(f"{hashes[path]}  {path}")
                  seen.add(path)
              else:
                  output.append(raw)
          for path in changed:
              if path not in seen:
                  output.append(f"{hashes[path]}  {path}")
          manifest.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
          sha256sum --strict -c MANIFEST.sha256

      - name: Commit manifest only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh manifest for real-world calibration v965"
          git push origin HEAD:${{ github.head_ref }}
