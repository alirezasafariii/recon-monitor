name: Temporary 8.8.0 Release Cleanup

on:
  push:
    branches:
      - release/8.8.0-20260914

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message != 'chore: remove temporary 8.8.0 release tooling' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary release tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp_prepare_release_8_8_0.py .github/workflows/tmp-release-8-8-0.yml
          git commit -m "chore: remove temporary 8.8.0 release tooling"
          git push
