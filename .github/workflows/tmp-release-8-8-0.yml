name: Temporary 8.8.0 Release Consolidator

on:
  push:
    branches:
      - release/8.8.0-20260914

permissions:
  contents: write

jobs:
  consolidate:
    if: "${{ github.event.head_commit.message != 'chore: consolidate 8.8.0 release metadata' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate release metadata and docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          VERSION = "8.8.0"
          SCHEMA = "18"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          core = read("app/core.py")
          old = 'APP_VERSION = "8.7.0"'
          if old not in core:
              raise SystemExit("expected 8.7.0 APP_VERSION in app/core.py")
          write("app/core.py", core.replace(old, 'APP_VERSION = "8.8.0"', 1))

          readme = read("README.md")
          old_block = '''# Recon Monitor 8.7.0

<!-- recon-monitor-current: app=8.7.0 schema=18 -->

## Current release: Evidence Completion & Live Progress

Recon Monitor 8.7.0 makes evidence gaps actionable without weakening canonical Admission and makes long-running Recon/Analysis work observable through explicit progress and health state.

Current `main` also hardens the reliability boundary around Recon: canonical comparison state is committed only from trustworthy collection, volatile changes use state-version confirmation, Potential Finding notifications are independent and idempotent, and target lifecycle records collection, Analysis, reporting, notification, and baseline validity separately.

The canonical application version is **8.7.0** and the core database schema is **18**. `app/core.py` is the source of truth for both values. See `CHANGELOG.md`, `MIGRATION-v8.7.0.md`, `docs/RELEASE_NOTES_v8.7.0.md`, and `docs/ARCHITECTURE.md` for the current contracts and migration details.
'''
          new_block = '''# Recon Monitor 8.8.0

<!-- recon-monitor-current: app=8.8.0 schema=18 -->

## Current release: Evidence-to-Finding Reliability & Durable Delivery

Recon Monitor 8.8.0 closes the operational path from trustworthy Recon observations to canonical Potential Findings and durable external delivery without weakening Admission or vulnerability-confirmation boundaries.

The release adds successful-snapshot and state-version reliability, offline Typed Evidence adapters for all nine `passive_live` families, controlled reviewed-evidence admission paths, a generic reviewed-evidence dispatcher, durable Finding notification outbox/retry/dead-letter operations, and one shared transport boundary for Finding notifications and Recon Change Alerts.

The canonical application version is **8.8.0** and the core database schema is **18**. Reliability and notification features use additive, independently versioned compatibility schemas where needed. `app/core.py` remains the source of truth for the release-facing application and core-schema values. See `CHANGELOG.md`, `MIGRATION-v8.8.0.md`, `docs/RELEASE_NOTES_v8.8.0.md`, and `docs/ARCHITECTURE.md` for the current contracts and migration details.
'''
          if old_block not in readme:
              raise SystemExit("README.md current-release block did not match expected 8.7.0 text")
          write("README.md", readme.replace(old_block, new_block, 1))

          readme_fa = read("README_FA.md")
          old_fa = '''# راهنمای Recon Monitor 8.7.0

<!-- recon-monitor-current: app=8.7.0 schema=18 -->

## نسخهٔ فعلی: Evidence Completion و Live Progress

Recon Monitor 8.7.0 شکاف‌های Evidence را بدون تضعیف Admission قابل اقدام می‌کند و برای Recon و Analysis طولانی، Progress و Health صریح ارائه می‌دهد.

وضعیت فعلی `main` مرز Reliability را نیز سخت‌تر کرده است: State مقایسهٔ Recon فقط از Collection قابل اعتماد commit می‌شود، تغییرات ناپایدار با State Version تأیید می‌شوند، Notification مربوط به Potential Finding از Recon Change Alert مستقل و Idempotent است و Lifecycle تارگت وضعیت Collection، Analysis، Report، Notification و اعتبار Baseline را جداگانه نگه می‌دارد.

نسخهٔ canonical برنامه **8.7.0** و Core Schema دیتابیس **18** است. منبع حقیقت هر دو مقدار `app/core.py` است. برای جزئیات به `CHANGELOG.md`، `MIGRATION-v8.7.0.md`، `docs/RELEASE_NOTES_v8.7.0.md` و `docs/ARCHITECTURE.md` مراجعه کن.
'''
          new_fa = '''# راهنمای Recon Monitor 8.8.0

<!-- recon-monitor-current: app=8.8.0 schema=18 -->

## نسخهٔ فعلی: Evidence-to-Finding Reliability و Durable Delivery

Recon Monitor 8.8.0 مسیر عملیاتی بین Recon قابل اعتماد، Evidence ساختاریافته، Admission canonical، Potential Finding و Delivery پایدار را کامل می‌کند، بدون اینکه مرز تأیید Vulnerability یا اختیار Admission تضعیف شود.

این نسخه Successful Snapshot و State-Version Confirmation، Typed Evidence آفلاین برای هر ۹ خانوادهٔ `passive_live`، مسیرهای Reviewed Evidence کنترل‌شده، Dispatcher عمومی Reviewed Evidence، Finding Notification Outbox پایدار با Retry/Dead-letter و Transport مشترک برای Finding Notification و Recon Change Alert را اضافه یا یکپارچه می‌کند.

نسخهٔ canonical برنامه **8.8.0** و Core Schema دیتابیس **18** است. قابلیت‌های Reliability و Notification در صورت نیاز از Compatibility Schemaهای مستقل و Additive استفاده می‌کنند. منبع حقیقت نسخه و Core Schema همچنان `app/core.py` است. برای جزئیات به `CHANGELOG.md`، `MIGRATION-v8.8.0.md`، `docs/RELEASE_NOTES_v8.8.0.md` و `docs/ARCHITECTURE.md` مراجعه کن.
'''
          if old_fa not in readme_fa:
              raise SystemExit("README_FA.md current-release block did not match expected 8.7.0 text")
          write("README_FA.md", readme_fa.replace(old_fa, new_fa, 1))

          architecture = read("docs/ARCHITECTURE.md")
          architecture = architecture.replace(
              "<!-- recon-monitor-current: app=8.7.0 schema=18 -->",
              "<!-- recon-monitor-current: app=8.8.0 schema=18 -->",
              1,
          )
          architecture = architecture.replace(
              "For the current build they are **8.7.0** and **18**.",
              "For the current build they are **8.8.0** and **18**.",
              1,
          )
          architecture = architecture.replace('`APP_VERSION = "8.7.0"`', '`APP_VERSION = "8.8.0"`', 1)
          old_analysis = '''Finding notifications are independent from Recon Change Alerts. After Analysis, new or materially changed Potential Findings are evaluated with a stable candidate identity and idempotent notification state. Re-observing an unchanged finding does not repeatedly notify; meaningful transitions can create a new notification event.
'''
          new_analysis = '''Typed and reviewed evidence are admitted only through explicit offline boundaries. Passive-live observations are adapted without new target traffic, and controlled differential review artifacts are redacted, integrity-checked, provenance-aware, and fail closed on contradictions or missing structural requirements. Reviewed evidence can reach canonical Admission through the generic dispatcher, but the strongest automatic outcome remains a Potential Finding rather than vulnerability confirmation.

Finding notifications are independent from Recon Change Alerts. New or materially changed Potential Findings are queued into a durable outbox, delivered by the scheduled/retry worker, and tracked through queued, retry-pending, delivering, delivered, failed, and dead-letter operational states. Delivery failures do not mutate Candidate or Admission truth. Recon Change Alerts retain their own lifecycle semantics but share the same public `notification_transports` boundary for Telegram and ProjectDiscovery `notify` delivery.
'''
          if old_analysis not in architecture:
              raise SystemExit("architecture notification paragraph not found")
          architecture = architecture.replace(old_analysis, new_analysis, 1)
          architecture = architecture.replace(
              "- `app/finding_notifications.py`: idempotent Potential Finding notification lifecycle.\n",
              "- `app/finding_notifications.py`: idempotent Potential Finding notification event lifecycle.\n- `app/finding_notification_outbox.py`: durable queue, retry, lease, delivery, and dead-letter operations for Finding notifications.\n- `app/notification_transports.py`: transport-neutral outbound delivery shared by Finding notifications and Recon Change Alerts.\n- reviewed-evidence adapters/dispatcher: offline controlled review and canonical Admission orchestration without target-side execution.\n",
              1,
          )
          write("docs/ARCHITECTURE.md", architecture)

          changelog = read("CHANGELOG.md")
          if not changelog.startswith("# Recon Monitor 8.7.0"):
              raise SystemExit("CHANGELOG.md does not begin with 8.7.0")
          release_section = '''# Recon Monitor 8.8.0 — Evidence-to-Finding Reliability & Durable Delivery

Recon Monitor 8.8.0 consolidates the post-8.7 reliability and evidence work into one release: trustworthy Recon snapshot semantics, offline typed/reviewed evidence, canonical Admission orchestration, durable Finding notification delivery, and a shared outbound transport boundary.

## Recon lifecycle and comparison reliability

- Successful Recon snapshots now isolate comparison-critical state so failed/interrupted collection cannot become the next baseline.
- Report-stage failure propagates into the target lifecycle instead of leaving a misleading successful target state.
- Volatile DNS/fingerprint changes use observed state-version confirmation (`A → B → B` confirms B; `A → B → C` resets confirmation).
- Target lifecycle and baseline eligibility are explicit; collection truth is kept separate from Analysis, reporting, and notification outcomes.
- Recon worker/database write paths, JavaScript availability tracking, stale progress reconciliation, Dashboard lifecycle checks, and bounded diagnostics were hardened.

## Typed and reviewed evidence

- Added an offline Typed Evidence Adapter for all nine `passive_live` families. It consumes fresh, redacted, matched observations without performing new target-side requests.
- CORS and source-map paths can emit their bounded typed promotion signals; the remaining passive-live families remain constrained by their family-specific evidence semantics.
- Added controlled offline differential/review boundaries for Open Redirect, Account Enumeration, Authentication Session, GraphQL Data Exposure, and Secret/Material Classification.
- Reviewed artifacts reject raw credentials, cookies/tokens, identities, response bodies, secret material, and other disallowed payloads according to each review contract.
- Potential Finding remains the strongest automatic outcome. Reviewed/typed evidence does not itself confirm a vulnerability.

## Canonical reviewed-evidence admission

- Added a generic reviewed-evidence Admission framework with integrity, hypothesis, provenance, structural-group, blocker, contradiction, and exactly-once checks.
- Migrated controlled identity, authentication lifecycle, GraphQL field-policy, and material-classification bridges onto the generic framework.
- Added a unified reviewed-evidence dispatcher so supported review artifacts enter canonical Admission through one orchestration boundary.
- Admission remains authoritative; transport or notification outcomes cannot rewrite Candidate/Admission state.

## Durable Finding notification delivery

- Potential Finding notification generation is independent from Recon Change Alerts and uses stable transition identities for new, promoted, reopened, confidence, and material evidence changes.
- Finding notifications are queued into a durable outbox instead of requiring synchronous delivery.
- The worker supports bounded retry/backoff, delivery leases, worker run history, scheduled/watch operation, status diagnostics, drain, explicit retry, and dead-letter registration/recovery.
- Queue observability includes due/retry/delivering/delivered/failed counts, oldest pending age, policy state, last worker run, and dead letters.
- External notification delivery is at-least-once; internal event/orchestration identity remains idempotent.

## Shared notification transports

- Finding notifications and Recon Change Alerts now share the public `app/notification_transports.py` boundary for Telegram and ProjectDiscovery `notify`.
- Recon Change Alert baseline suppression, score threshold, cooldown, `confirmed_only`, notification policy, ignored/false-positive filtering, and `last_notified` semantics are unchanged.
- Recon Change Alerts remain outside the Finding outbox; lifecycle semantics stay separate while transport implementation is consolidated.

## Release governance and compatibility

- Application version advances to **8.8.0**.
- Core database schema remains **18**; reliability and notification additions use additive, independently versioned feature schemas where required.
- No destructive database migration is required from 8.7.0.
- Branch hygiene and release-consistency checks keep merged branches and release-facing metadata bounded and verifiable.
- Final CI requires strict manifest validation, release/version consistency, the complete unit suite, and integration tests on Python 3.11 and Python 3.13.

'''
          write("CHANGELOG.md", release_section + changelog)

          migration = '''# Recon Monitor 8.8.0 Migration

Recon Monitor 8.8.0 is a backward-compatible application upgrade from 8.7.0. The core database schema remains **18**. New reliability, reviewed-evidence, and notification tables use additive, independently versioned feature schemas and are initialized idempotently by normal startup paths.

## What changes

- Recon comparison state is protected by successful-snapshot and explicit baseline/lifecycle boundaries.
- Volatile change confirmation is keyed by observed state version rather than raw event count.
- Passive-live observations can be adapted offline into family-specific typed evidence without new target traffic.
- Controlled reviewed-evidence flows can enter canonical Admission through the generic reviewed-evidence dispatcher.
- Potential Finding notifications use a durable outbox with retry, leases, worker scheduling/watch operation, diagnostics, and dead-letter recovery.
- Recon Change Alerts and Finding notifications share the public notification transport layer while keeping separate lifecycle semantics.

## Database compatibility

No destructive core migration is required. `SCHEMA_VERSION` remains **18**. Feature schemas are additive and self-versioned in compatibility metadata/tables; existing Recon history, baselines, Analysis state, Potential Findings, Alert workflow state, and evidence remain preserved.

Normal startup/setup compatibility checks may create missing additive feature tables or metadata. Failed or interrupted runs do not become canonical comparison baselines.

## Evidence and safety semantics

- Typed and reviewed adapters are offline boundaries; they do not authorize new target-side execution.
- Canonical Admission remains the decision authority for Potential Finding creation/promotion.
- Potential Findings are not automatic vulnerability confirmations.
- Controlled review artifacts remain redaction-first and reject disallowed raw credentials, session material, identities, response bodies, or secret values according to their contract.
- Finding notification delivery failures, retries, and dead-letter operations do not mutate Candidate or Admission truth.
- Recon Change Alerts remain outside the Finding notification outbox.

## Notification worker operations

After upgrade, operators can inspect or run the Finding notification worker with the existing delivery CLI, including `status`, `run`, `watch`, `failed`, `retry`, `drain`, and `configure` operations. Enabling a recurring worker policy remains an explicit operational choice.

## Upgrade

Use the normal Recon Monitor update workflow or update the checkout to the eventual `v8.8.0` release, then run:

```bash
./recon-monitor.sh doctor
./recon-monitor.sh test
```

No manual core database migration command is required beyond normal startup/setup compatibility checks.
'''
          write("MIGRATION-v8.8.0.md", migration)

          notes = '''# Recon Monitor 8.8.0 — Evidence-to-Finding Reliability & Durable Delivery

Recon Monitor 8.8.0 closes the reliability and operations gap between Recon observations and externally delivered Potential Finding notifications while preserving the platform's conservative evidence and authorization model.

## Release highlights

The release makes the end-to-end architecture explicit:

`Recon → Analysis → Hypothesis → Evidence Coverage/Planning → Validation Observation → Typed/Reviewed Evidence → Canonical Admission → Potential Finding → Durable Outbox → Worker → Notification Transport`

This is an operational composition, not a claim that every family executes every stage automatically. Canonical Admission remains authoritative and Potential Finding remains distinct from vulnerability confirmation.

## Trustworthy Recon state

Comparison-critical Recon state is committed only from successful/baseline-eligible collection. Failed or interrupted runs can no longer silently advance the comparison baseline. Target lifecycle now separates collection, Analysis, report, notification, overall status, and baseline eligibility.

Volatile changes use state-version confirmation. A stable repeated state can be confirmed, while a different subsequent state restarts confirmation rather than accumulating unrelated observations.

## Typed Evidence Adapter

The passive-live executor remains deliberately narrow and observation-oriented. 8.8.0 adds the missing offline adaptation layer for all nine `passive_live` families so eligible fresh/redacted observations can become family-specific typed evidence without issuing new target requests.

The adapter remains fail-closed and family-aware. Typed evidence does not bypass canonical Admission and does not directly confirm vulnerabilities.

## Controlled reviewed evidence

8.8.0 adds or completes offline controlled review/admission paths for:

- Open Redirect differential evidence;
- Account Enumeration controlled-identity differential evidence;
- Authentication Session lifecycle differential evidence;
- GraphQL field-policy differential evidence;
- Secret/Material Classification review.

The generic reviewed-evidence framework checks review integrity, linked hypotheses, direct provenance, required structural groups, blockers/contradictions, and exactly-once orchestration before calling canonical Candidate/Admission paths. Redaction and controlled-test boundaries are part of the contract.

## Durable notification outbox

Potential Finding transitions are queued into a durable outbox. The worker provides bounded retries/backoff, delivery leases, worker-run history, policy-controlled scheduling/watch mode, queue diagnostics, failed/dead-letter inspection, explicit retry, and bounded drain operations.

Transport failures affect delivery state only. They do not roll back or rewrite already-established Candidate/Admission truth. External transports are inherently at-least-once, so downstream receivers should tolerate duplicate delivery attempts.

## Recon Change Alert transport consolidation

Recon Change Alerts keep their existing lifecycle and policy semantics but no longer own duplicate Telegram/ProjectDiscovery delivery code. Both Alert and Finding notification paths now use `app/notification_transports.py` as the transport-neutral outbound boundary.

Recon Change Alerts intentionally do **not** enter the Finding outbox in this release.

## Compatibility

- Application version: **8.8.0**
- Core database schema: **18**
- Upgrade from 8.7.0: backward-compatible, additive feature initialization only
- No destructive core migration required
- Python CI matrix: 3.11 and 3.13

Release publication should use the same commit that passes strict manifest validation, release consistency, the complete unit suite, and integration tests.
'''
          write("docs/RELEASE_NOTES_v8.8.0.md", notes)

          manifest_path = Path("MANIFEST.sha256")
          lines = manifest_path.read_text(encoding="utf-8").splitlines()
          changed_paths = [
              "app/core.py",
              "README.md",
              "README_FA.md",
              "CHANGELOG.md",
              "docs/ARCHITECTURE.md",
              "MIGRATION-v8.8.0.md",
              "docs/RELEASE_NOTES_v8.8.0.md",
          ]
          digests = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in changed_paths}
          rewritten = []
          seen = set()
          for line in lines:
              if "  " not in line:
                  rewritten.append(line)
                  continue
              _digest, path = line.split("  ", 1)
              if path in digests:
                  rewritten.append(f"{digests[path]}  {path}")
                  seen.add(path)
              else:
                  rewritten.append(line)
          missing = [p for p in changed_paths if p not in seen]
          for path in missing:
              digest_line = f"{digests[path]}  {path}"
              if path.startswith("MIGRATION-"):
                  insert_at = next((i for i, line in enumerate(rewritten) if "  README.md" in line), len(rewritten))
              elif path.startswith("docs/"):
                  insert_at = next((i for i, line in enumerate(rewritten) if line.split("  ", 1)[-1].startswith("tests/") if "  " in line), len(rewritten))
              else:
                  insert_at = len(rewritten)
              rewritten.insert(insert_at, digest_line)
          manifest_path.write_text("\n".join(rewritten) + "\n", encoding="utf-8")
          PY
          sha256sum --strict -c MANIFEST.sha256
          python3 tools/check_release_consistency.py
      - name: Commit release consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/core.py README.md README_FA.md CHANGELOG.md docs/ARCHITECTURE.md MIGRATION-v8.8.0.md docs/RELEASE_NOTES_v8.8.0.md MANIFEST.sha256
          git commit -m "chore: consolidate 8.8.0 release metadata"
          git push
