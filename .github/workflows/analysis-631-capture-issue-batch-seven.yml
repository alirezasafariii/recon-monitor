name: Analysis 6.31 Capture Seven Source-Grounded Families

on:
  workflow_dispatch:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - 'app/v6_remaining_issue_batch_collector.py'
      - 'app/v6_capture_method_normalize.py'
      - 'app/v6_capture_adjudication_normalize.py'
      - '.github/workflows/analysis-631-capture-issue-batch-seven.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.31-fresh-blind-v6-validation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture seven independently grounded family variants
        env:
          PYTHONPATH: app
        run: python app/v6_remaining_issue_batch_collector.py captured
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-631-seven-source-grounded-captures
          path: captured/**/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.31-fresh-blind-v6-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: analysis-631-seven-source-grounded-captures
          path: captured
      - name: Normalize capture-only schema vocabulary
        env:
          PYTHONPATH: app
        run: |
          python app/v6_capture_method_normalize.py captured
          python app/v6_capture_adjudication_normalize.py captured
      - name: Publish through canonical strict gates
        env:
          PYTHONPATH: app
        run: |
          set -euo pipefail
          python app/v6_literal_evidence_publish.py captured
          python app/v6_literal_capture_plan.py
          python app/v6_literal_capture_ingest.py --allow-incomplete
          python app/v6_literal_partial_verify.py
          python app/v6_literal_capture_verify.py --allow-missing
          python app/v6_literal_raw_precheck.py
          python app/v6_remaining_capture_manifest.py
          python app/v6_remaining_capture_index.py
          python app/v6_pre_score_checkpoint_refresh.py
      - name: Commit only verified pre-score evidence
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_capture_evidence/*.json \
                  benchmarks/raw/sources/v6_literal_capture_plan.json \
                  benchmarks/raw/sources/v6_literal_capture_ingest_report.json \
                  benchmarks/raw/sources/v6_literal_capture_verification.json \
                  benchmarks/raw/sources/v6_remaining_capture_manifest.json \
                  benchmarks/raw/sources/v6_remaining_capture_index.tsv \
                  benchmarks/raw/sources/v6_pre_score_checkpoint.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture verified Analysis 6.31 seven-family evidence batch'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
