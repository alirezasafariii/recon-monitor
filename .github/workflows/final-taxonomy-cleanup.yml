name: Final Taxonomy Cleanup

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run final taxonomy cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove migration-only files and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/FINAL_TAXONOMY_ATTRIBUTION_TRIGGER \
            .github/scripts/final_taxonomy_attribution_migration.py \
            .github/scripts/fix_final_taxonomy_attribution_anchor.py \
            .github/workflows/final-taxonomy-attribution-migration.yml \
            .github/FINAL_TAXONOMY_CLEANUP_TRIGGER \
            .github/workflows/final-taxonomy-cleanup.yml
          git ls-files -z \
            | grep -zv '^MANIFEST.sha256$' \
            | grep -zv '^.github/FINAL_TAXONOMY_ATTRIBUTION_TRIGGER$' \
            | grep -zv '^.github/scripts/final_taxonomy_attribution_migration.py$' \
            | grep -zv '^.github/scripts/fix_final_taxonomy_attribution_anchor.py$' \
            | grep -zv '^.github/workflows/final-taxonomy-attribution-migration.yml$' \
            | grep -zv '^.github/FINAL_TAXONOMY_CLEANUP_TRIGGER$' \
            | grep -zv '^.github/workflows/final-taxonomy-cleanup.yml$' \
            | sort -z | xargs -0 sha256sum > MANIFEST.sha256
      - name: Verify final source state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/FINAL_TAXONOMY_ATTRIBUTION_TRIGGER
          test ! -e .github/scripts/final_taxonomy_attribution_migration.py
          test ! -e .github/scripts/fix_final_taxonomy_attribution_anchor.py
          test ! -e .github/workflows/final-taxonomy-attribution-migration.yml
          python -m py_compile app/family_specs/base.py app/family_specs/taxonomy_attribution.py app/family_specs/registry.py app/hypothesis_admission.py tests/test_final_taxonomy_attribution.py
          sha256sum --strict -c MANIFEST.sha256
      - name: Unit and integration smoke after cleanup
        run: |
          python -m unittest tests.test_final_taxonomy_attribution -q
          python tests/integration_runner.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add -A
          git commit -m 'Clean taxonomy migration artifacts'
          git push origin HEAD:final-analyzers

  verify:
    needs: cleanup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout cleaned branch head
        run: |
          git fetch origin final-analyzers
          git checkout -B final-analyzers origin/final-analyzers
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify cleanup and manifest
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/FINAL_TAXONOMY_ATTRIBUTION_TRIGGER
          test ! -e .github/scripts/final_taxonomy_attribution_migration.py
          test ! -e .github/scripts/fix_final_taxonomy_attribution_anchor.py
          test ! -e .github/workflows/final-taxonomy-attribution-migration.yml
          test ! -e .github/FINAL_TAXONOMY_CLEANUP_TRIGGER
          test ! -e .github/workflows/final-taxonomy-cleanup.yml
          test ! -e config.env
          test ! -e policies/targets.json
          sha256sum --strict -c MANIFEST.sha256
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration suite
        run: python tests/integration_runner.py
