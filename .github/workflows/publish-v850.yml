name: Publish Recon Monitor v8.5.0 BOLA Intelligence 2.0

on:
  push:
    branches:
      - agent/bola-intelligence-v850

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v8.5.0 integration patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v850_bola_intelligence_patch.py
          grep -q 'APP_VERSION = "8.5.0"' app/core.py
          grep -q 'ENGINE_VERSION = "5.2.0"' app/analysis_engine.py
          grep -q 'CANDIDATE_ENGINE_VERSION = "5.2.0"' app/bug_candidates.py
          grep -q 'ADMISSION_ENGINE_VERSION = "1.1.0"' app/hypothesis_admission.py
          grep -q 'BOLA_ENGINE_VERSION = "2.0.0"' app/bola_intelligence.py
          grep -q 'SCHEMA_VERSION = 18' app/core.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/*.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/*.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: BOLA precision and recall contract checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_bola_intelligence_v850 -v
          python - <<'PY'
          import sys, tempfile, json
          from pathlib import Path
          sys.path.insert(0, 'app')
          from core import APP_VERSION, SCHEMA_VERSION, Database
          from analysis_engine import ENGINE_VERSION, RULE_VERSION
          from bug_candidates import CANDIDATE_ENGINE_VERSION, CANDIDATE_RULE_VERSION
          from hypothesis_admission import ADMISSION_ENGINE_VERSION, ADMISSION_RULE_VERSION, knowledge_for_family
          from bola_intelligence import BOLA_ENGINE_VERSION, BOLA_RULE_VERSION
          assert APP_VERSION == '8.5.0'
          assert SCHEMA_VERSION == 18
          assert ENGINE_VERSION == '5.2.0' and RULE_VERSION == '2026.08.8.5'
          assert CANDIDATE_ENGINE_VERSION == '5.2.0' and CANDIDATE_RULE_VERSION == '2026.08.8.5'
          assert ADMISSION_ENGINE_VERSION == '1.1.0' and ADMISSION_RULE_VERSION == '2026.08.8.5'
          assert BOLA_ENGINE_VERSION == '2.0.0' and BOLA_RULE_VERSION == '2026.08.8.5'
          refs = knowledge_for_family('broken_object_authorization')
          assert len(refs) >= 7
          assert any(r['ref'].startswith('GHSL-') for r in refs)
          assert any('OWASP' in r['source'] for r in refs)
          with tempfile.TemporaryDirectory() as td:
              db = Database(Path(td) / 'db.sqlite')
              assert db.meta_get('schema_version') == '18'
              db.close()
          PY

      - name: Prepare clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git rm .github/workflows/publish-v850.yml scripts/v850_bola_intelligence_patch.py
          rmdir scripts 2>/dev/null || true
          git add -A
          git ls-files | grep -v '^MANIFEST.sha256$' | LC_ALL=C sort | while IFS= read -r f; do
            [ -f "$f" ] && sha256sum "$f"
          done > MANIFEST.sha256
          git add MANIFEST.sha256
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
          if find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pyc' -o -name '*.log' \) ! -path './.git/*' | grep -q .; then
            echo 'runtime artifact found in source tree'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft origin/main
          git add -A
          git commit -m 'Add BOLA IDOR Intelligence 2.0'
          git push origin HEAD:main

      - name: Package and release v8.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          test "$MAIN_SHA" = "$(git rev-parse origin/main)"
          git tag -a v8.5.0 -m 'Recon Monitor 8.5.0'
          git push origin v8.5.0
          git archive --format=zip --prefix=recon-monitor-v8.5.0/ HEAD -o recon-monitor-v8.5.0.zip
          SHA=$(sha256sum recon-monitor-v8.5.0.zip | awk '{print $1}')
          printf '%s  %s\n' "$SHA" recon-monitor-v8.5.0.zip > recon-monitor-v8.5.0.zip.sha256
          gh release create v8.5.0 \
            recon-monitor-v8.5.0.zip \
            recon-monitor-v8.5.0.zip.sha256 \
            --title 'Recon Monitor v8.5.0' \
            --notes 'BOLA / IDOR Intelligence 2.0. Object identifiers plus HTTP operations are retained as hidden hypotheses rather than promoted findings until stored target evidence supports an object-level authorization-boundary mismatch. Adds cross-owner, cross-tenant, parent-child scope, authorization-differential, and secondary-guard evidence models informed by OWASP API1/WSTG, CWE-639, and public GitHub Security Lab advisories for Spree, Zammad, Wekan, and Sentry. External knowledge remains strictly separate from target evidence. No automatic live object substitution is performed. Schema remains 18. Full unit/integration and dedicated BOLA precision/recall tests run on Python 3.11 and 3.13.'
          echo "RELEASE_SHA256=$SHA"
