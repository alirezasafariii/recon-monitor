name: Analysis 6.31 Corpus Freeze

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_validation_report.json

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze validated unscored corpus
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          validation=json.loads(Path('benchmarks/raw/sources/v6_validation_report.json').read_text())
          assert validation['passed'] is True
          assert validation['scoring_executed'] is False
          paths=[
            'benchmarks/raw/sources/v6_protocol.json',
            'benchmarks/raw/sources/v6_candidates.json',
            'benchmarks/raw/sources/v6_supplement_candidates.json',
            'benchmarks/raw/sources/v6_keyword_candidates.json',
            'benchmarks/raw/sources/v6_shortlist.json',
            'benchmarks/raw/analysis_raw_v6.jsonl',
            'benchmarks/raw/sources/v6_materialization_report.json',
            'benchmarks/raw/sources/v6_validation_report.json',
            'app/raw_recon_v6_source_firewall.py',
            'app/raw_recon_v6_source_discovery.py',
            'app/v6_benchmark_dataset.py',
            'app/v6_benchmark_validate.py',
          ]
          protected={}
          for value in paths:
            path=Path(value); assert path.exists(), value
            protected[value]=hashlib.sha256(path.read_bytes()).hexdigest()
          protocol=json.loads(Path('benchmarks/raw/sources/v6_protocol.json').read_text())
          shortlist=json.loads(Path('benchmarks/raw/sources/v6_shortlist.json').read_text())
          report={
            'version':'1.0.0','rule_version':'2026.08.13.6.31',
            'evaluation_status':'sealed_unscored_corpus',
            'scoring_executed':False,
            'first_blind_consumed':False,
            'first_blind_evaluator_frozen':False,
            'case_count':276,'family_count':36,
            'source_root_count':shortlist['unique_root_count'],
            'source_project_count':shortlist['unique_project_count'],
            'pre_registered_gates':{
              'single':protocol['single_quality_gates'],
              'pair':protocol['pair_quality_gates'],
              'triad':protocol['triad_quality_gates'],
            },
            'protected_sha256':protected,
            'mutation_policy':'protocol sources shortlist corpus and validation artifacts are immutable after this corpus freeze; evaluator freeze is a separate pre-score step',
          }
          Path('benchmarks/raw/sources/v6_corpus_freeze.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print({'evaluation_status':report['evaluation_status'],'case_count':276,'family_count':36})
          PY
      - name: Commit corpus freeze
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_corpus_freeze.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze validated unscored Analysis 6.31 v6 corpus'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
