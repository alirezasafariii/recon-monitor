name: Analysis 6.31 Corpus Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - 'benchmarks/raw/analysis_raw_v6.jsonl'
      - 'benchmarks/raw/sources/v6_materialization_report.json'
      - 'benchmarks/raw/sources/v6_validation_report.json'

permissions:
  contents: write

concurrency:
  group: analysis-631-corpus-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse second corpus freeze
        run: |
          if [[ -f benchmarks/raw/sources/v6_corpus_freeze.json ]]; then
            echo 'Analysis 6.31 corpus is already frozen. Create a new protocol/version instead of mutating it.' >&2
            exit 1
          fi

      - name: Reverify all 144 literal evidence artifacts
        env:
          PYTHONPATH: app
        run: python app/v6_literal_capture_verify.py --write-report

      - name: Revalidate complete literal-fresh unscored corpus
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v6_benchmark_validate import validate_v6_corpus

          shortlist = json.loads(Path('benchmarks/raw/sources/v6_shortlist.json').read_text(encoding='utf-8'))
          cases = [json.loads(line) for line in Path('benchmarks/raw/analysis_raw_v6.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          validation = validate_v6_corpus(cases, shortlist, require_literal_single_capture=True)
          Path('benchmarks/raw/sources/v6_validation_report.json').write_text(
              json.dumps(validation, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert validation['passed'], validation['errors']
          assert validation['scoring_executed'] is False
          assert validation['literal_single_capture_count'] == 144
          assert validation['label_leakage_count'] == 0
          assert validation['source_firewall']['passed'] is True
          PY

      - name: Build centralized immutable corpus freeze surface
        env:
          PYTHONPATH: app
        run: python app/v6_corpus_freeze.py

      - name: Verify generated freeze and manifest
        env:
          PYTHONPATH: app
        run: python app/v6_freeze_verify.py --require-freeze

      - name: Commit evidence-backed corpus freeze
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_literal_capture_verification.json \
                  benchmarks/raw/sources/v6_validation_report.json \
                  benchmarks/raw/sources/v6_corpus_freeze.json \
                  benchmarks/raw/sources/v6_freeze_manifest.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze evidence-backed literal-fresh unscored Analysis 6.31 corpus'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
