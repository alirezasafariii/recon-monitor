name: Analysis 6.31 Corpus Freeze

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse second corpus freeze
        run: |
          if [[ -f benchmarks/raw/sources/v6_corpus_freeze.json ]]; then
            echo 'Analysis 6.31 corpus is already frozen. Create a new protocol/version instead of mutating this freeze.' >&2
            exit 1
          fi

      - name: Revalidate literal capture evidence and unscored corpus
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v6_benchmark_validate import validate_v6_corpus
          from v6_literal_capture_verify import verify_capture_set

          capture_verification = verify_capture_set(require_complete=True, write_report=True)
          assert capture_verification['passed'], capture_verification['errors']
          assert capture_verification['capture_count'] == 144
          assert capture_verification['evidence_count'] == 144
          assert capture_verification['unique_evidence_hash_count'] == 144

          shortlist = json.loads(Path('benchmarks/raw/sources/v6_shortlist.json').read_text(encoding='utf-8'))
          cases = [json.loads(line) for line in Path('benchmarks/raw/analysis_raw_v6.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          validation = validate_v6_corpus(cases, shortlist, require_literal_single_capture=True)
          Path('benchmarks/raw/sources/v6_validation_report.json').write_text(
              json.dumps(validation, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert validation['passed'], validation['errors']
          assert validation['scoring_executed'] is False
          assert validation['label_leakage_count'] == 0
          assert validation['literal_single_capture_count'] == 144
          assert validation['source_firewall']['passed'] is True
          PY

      - name: Freeze validated corpus, evidence, and protected implementation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          capture_verification = json.loads(Path('benchmarks/raw/sources/v6_literal_capture_verification.json').read_text(encoding='utf-8'))
          ingest = json.loads(Path('benchmarks/raw/sources/v6_literal_capture_ingest_report.json').read_text(encoding='utf-8'))
          validation = json.loads(Path('benchmarks/raw/sources/v6_validation_report.json').read_text(encoding='utf-8'))
          shortlist = json.loads(Path('benchmarks/raw/sources/v6_shortlist.json').read_text(encoding='utf-8'))
          selection = json.loads(Path('benchmarks/raw/sources/v6_selection_final_report.json').read_text(encoding='utf-8'))
          materialization = json.loads(Path('benchmarks/raw/sources/v6_materialization_report.json').read_text(encoding='utf-8'))
          protocol = json.loads(Path('benchmarks/raw/sources/v6_protocol.json').read_text(encoding='utf-8'))
          capture_plan = json.loads(Path('benchmarks/raw/sources/v6_literal_capture_plan.json').read_text(encoding='utf-8'))
          source_research = json.loads(Path('benchmarks/raw/sources/v6_literal_source_research.json').read_text(encoding='utf-8'))

          assert capture_verification['passed'] is True
          assert capture_verification['scoring_executed'] is False
          assert capture_verification['capture_count'] == 144
          assert capture_verification['evidence_count'] == 144
          assert capture_verification['unique_evidence_hash_count'] == 144
          assert len(capture_verification['evidence_manifest']) == 144
          assert source_research['scoring_executed'] is False
          assert source_research['first_blind_consumed'] is False
          assert source_research['active_target_validation_performed'] is False
          assert source_research['family_count'] == 36
          assert source_research['successful_snapshot_count'] == 36
          assert source_research['unresolved_snapshot_count'] == 0
          assert capture_plan['scoring_executed'] is False
          assert capture_plan['first_blind_consumed'] is False
          assert capture_plan['required_capture_count'] == 144
          assert capture_plan['all_evidence_present'] is True
          assert ingest['passed'] is True
          assert ingest['scoring_executed'] is False
          assert ingest['first_blind_consumed'] is False
          assert ingest['valid_capture_count'] == 144
          assert ingest['missing_capture_count'] == 0
          assert ingest['error_count'] == 0
          assert ingest['plan_sha256'] == sha256('benchmarks/raw/sources/v6_literal_capture_plan.json')
          assert ingest['shortlist_sha256'] == sha256('benchmarks/raw/sources/v6_shortlist.json')
          assert validation['passed'] is True
          assert validation['scoring_executed'] is False
          assert validation['literal_single_capture_count'] == 144
          assert validation['label_leakage_count'] == 0
          assert validation['source_firewall']['passed'] is True
          assert shortlist['selection_executes_scoring'] is False
          assert shortlist['family_count'] == 36
          assert shortlist['unique_root_count'] == 36
          assert shortlist['unique_project_count'] == 36
          assert shortlist['owasp_grounded_family_count'] == 14
          assert shortlist['complement_family_count'] == 22
          assert shortlist['complement_override_family_count'] == 13
          assert shortlist['legacy_semantic_family_count'] == 9
          assert selection['scoring_executed'] is False
          assert selection['family_count'] == 36
          assert selection['complement_override_family_count'] == 13
          assert selection['legacy_semantic_family_count'] == 9
          assert materialization['fresh_raw_claim'] is True
          assert materialization['raw_capture_mode'] == 'literal_source_capture'
          assert materialization['literal_single_capture_count'] == 144
          assert materialization['input_capture_count'] == 144

          paths = [
            'benchmarks/raw/sources/v6_protocol.json',
            'benchmarks/raw/sources/v6_candidates.json',
            'benchmarks/raw/sources/v6_complement_overrides.json',
            'benchmarks/raw/sources/v6_owasp_writeup_grounding.json',
            'benchmarks/raw/sources/v6_owasp_writeup_candidates.json',
            'benchmarks/raw/sources/v6_owasp_exact_overrides.json',
            'benchmarks/raw/sources/v6_owasp_extension_grounding.json',
            'benchmarks/raw/sources/v6_owasp_extension_candidates.json',
            'benchmarks/raw/sources/v6_shortlist.json',
            'benchmarks/raw/sources/v6_selection_final_report.json',
            'benchmarks/raw/sources/v6_literal_capture_plan.json',
            'benchmarks/raw/sources/v6_literal_source_research.json',
            'benchmarks/raw/sources/v6_literal_captures.jsonl',
            'benchmarks/raw/sources/v6_literal_capture_ingest_report.json',
            'benchmarks/raw/sources/v6_literal_capture_verification.json',
            'benchmarks/raw/analysis_raw_v6.jsonl',
            'benchmarks/raw/sources/v6_materialization_report.json',
            'benchmarks/raw/sources/v6_validation_report.json',
            'app/raw_recon_v6_source_firewall.py',
            'app/raw_recon_v6_source_discovery.py',
            'app/v6_source_finalize.py',
            'app/v6_literal_capture_plan.py',
            'app/v6_literal_source_research.py',
            'app/v6_literal_capture_ingest.py',
            'app/v6_literal_capture_verify.py',
            'app/v6_benchmark_dataset.py',
            'app/v6_benchmark_validate.py',
            'app/v6_benchmark_evaluate.py',
            'app/v6_freeze_verify.py',
            'tests/test_v6_source_independence.py',
            'tests/test_v6_literal_capture_integrity.py',
            '.github/workflows/analysis-631-validation.yml',
            '.github/workflows/analysis-631-owasp-exact-finalize.yml',
            '.github/workflows/analysis-631-literal-capture-plan.yml',
            '.github/workflows/analysis-631-literal-source-research.yml',
            '.github/workflows/analysis-631-literal-capture-ingest.yml',
            '.github/workflows/analysis-631-materialize.yml',
            '.github/workflows/analysis-631-corpus-freeze.yml',
            '.github/workflows/analysis-631-evaluator-freeze.yml',
          ]
          paths.extend(sorted(capture_verification['evidence_manifest']))
          if len(paths) != len(set(paths)):
              raise RuntimeError('duplicate path in v6 freeze protection set')

          protected = {}
          for value in paths:
            path = Path(value)
            assert path.exists(), value
            digest = hashlib.sha256(path.read_bytes()).hexdigest()
            if value in capture_verification['evidence_manifest']:
                assert digest == capture_verification['evidence_manifest'][value], value
            protected[value] = digest

          report = {
            'version': '1.8.0',
            'rule_version': '2026.08.14.6.31.11',
            'evaluation_status': 'sealed_evidence_backed_literal_fresh_unscored_corpus',
            'scoring_executed': False,
            'first_blind_consumed': False,
            'first_blind_evaluator_frozen': False,
            'case_count': 276,
            'single_case_count': 144,
            'pair_case_count': 72,
            'triad_case_count': 60,
            'literal_single_capture_count': 144,
            'literal_evidence_artifact_count': 144,
            'family_count': 36,
            'source_root_count': shortlist['unique_root_count'],
            'source_project_count': shortlist['unique_project_count'],
            'source_model': {
              'owasp_grounded_family_count': 14,
              'complement_override_family_count': 13,
              'legacy_semantic_family_count': 9,
            },
            'pre_registered_gates': {
              'single': protocol['single_quality_gates'],
              'pair': protocol['pair_quality_gates'],
              'triad': protocol['triad_quality_gates'],
            },
            'protected_sha256': protected,
            'mutation_policy': 'source inputs, sealed passive source research, capture acquisition plan, evidence-only ingest, all 144 literal evidence artifacts, evidence-bound labels/adjudication, capture rows, shortlist, corpus, validator, evaluator, gates, tests and workflows are immutable after this freeze; evaluator authorization is frozen separately before the one-time score',
          }
          Path('benchmarks/raw/sources/v6_corpus_freeze.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('benchmarks/raw/sources/v6_freeze_manifest.sha256').write_text(
              ''.join(f'{digest}  {path}\n' for path, digest in sorted(protected.items())),
              encoding='utf-8'
          )
          PY

      - name: Verify newly generated freeze
        env:
          PYTHONPATH: app
        run: python app/v6_freeze_verify.py --require-freeze

      - name: Commit corpus freeze
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_literal_capture_verification.json benchmarks/raw/sources/v6_validation_report.json benchmarks/raw/sources/v6_corpus_freeze.json benchmarks/raw/sources/v6_freeze_manifest.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze evidence-backed literal-fresh unscored Analysis 6.31 corpus'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
