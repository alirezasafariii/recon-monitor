name: Finalize Analysis 6.6

on:
  push:
    branches:
      - agent/analysis-engine-6.6-postfreeze-blind
    paths:
      - .analysis-66-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.6-postfreeze-blind
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Remove temporary Analysis 6.6 machinery
        shell: bash
        run: |
          rm -f .github/workflows/materialize-analysis-66.yml
          rm -f .github/workflows/seal-analysis-66.yml
          rm -f .github/workflows/evaluate-analysis-66.yml
          rm -f .github/workflows/finalize-analysis-66.yml
          rm -f .analysis-66-finalize

      - name: Regenerate tracked-source manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          lines = []
          for path in sorted(paths):
              if path == "MANIFEST.sha256" or not os.path.isfile(path):
                  continue
              h = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              lines.append(f"{h.hexdigest()}  {path}\n")
          with open("MANIFEST.sha256", "w", encoding="utf-8") as handle:
              handle.writelines(lines)
          PY
          sha256sum -c MANIFEST.sha256

      - name: Verify sealed fresh-evaluation artifacts without rescoring
        env:
          PYTHONPATH: app
        shell: bash
        run: |
          python app/analysis_postfreeze_sources.py
          python app/analysis_postfreeze.py --json
          grep -q '"sealed": true' benchmarks/golden/splits/v4.json
          grep -q '90aa5e60ee2d7ba9d686d831ad0aa88e6aee28fb4c2f09b87bc02ad3f64290ab' benchmarks/golden/splits/v4.json
          test -s benchmarks/golden/reports/analysis_v4_postfreeze_report.json
          git diff --exit-code -- benchmarks/golden/analysis_golden_v4.jsonl benchmarks/golden/splits/v4.json benchmarks/golden/reports/analysis_v4_postfreeze_report.json

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Existing golden regression benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit final cleanup and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Analysis 6.6 fresh blind evaluation"
          git push origin HEAD:agent/analysis-engine-6.6-postfreeze-blind
