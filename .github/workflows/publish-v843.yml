name: Publish Recon Monitor v8.4.3 Recall Admission

on:
  push:
    branches:
      - agent/recall-preserving-admission-v843

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v8.4.3 patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v843_recall_admission_patch.py
          python scripts/v843_test_contract_fix.py
          grep -q 'APP_VERSION = "8.4.3"' app/core.py
          grep -q 'SCHEMA_VERSION = 18' app/core.py
          grep -q 'analysis_hypotheses' app/core.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/*.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/*.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: Recall and precision contract checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_recall_preserving_admission_v843 -v
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'app')
          from core import Database, APP_VERSION, SCHEMA_VERSION
          from hypothesis_admission import assess_admission
          assert APP_VERSION == '8.4.3'
          assert SCHEMA_VERSION == 18
          with tempfile.TemporaryDirectory() as td:
              db = Database(Path(td) / 'db.sqlite')
              assert db.meta_get('schema_version') == '18'
              names = {row[0] for row in db.all("SELECT name FROM sqlite_master WHERE type='table'")}
              assert 'analysis_hypotheses' in names
              db.close()
          assert not assess_admission('file_upload', [
              {'type':'file_surface','source':'semantic'},
              {'type':'content_type_field','source':'http_contract'},
          ])['admitted']
          assert assess_admission('file_upload', [
              {'type':'file_input','source':'schema'},
              {'type':'upload_operation','source':'endpoint'},
          ])['admitted']
          assert assess_admission('path_traversal', [
              {'type':'filename_field','source':'schema'},
              {'type':'upload_operation','source':'endpoint'},
          ])['admitted']
          PY

      - name: Prepare clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git rm .github/workflows/publish-v843.yml scripts/v843_recall_admission_patch.py scripts/v843_test_contract_fix.py
          rmdir scripts 2>/dev/null || true

          git add -A
          git ls-files | grep -v '^MANIFEST.sha256$' | LC_ALL=C sort | while IFS= read -r f; do
            [ -f "$f" ] && sha256sum "$f"
          done > MANIFEST.sha256
          git add MANIFEST.sha256

          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
          if find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pyc' -o -name '*.log' \) ! -path './.git/*' | grep -q .; then
            echo 'runtime artifact found in source tree'
            find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pyc' -o -name '*.log' \) ! -path './.git/*'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft origin/main
          git add -A
          git commit -m 'Add recall-preserving family admission'
          git push origin HEAD:main

      - name: Package and release v8.4.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          test "$MAIN_SHA" = "$(git rev-parse origin/main)"
          git tag -a v8.4.3 -m 'Recon Monitor 8.4.3'
          git push origin v8.4.3

          git archive --format=zip --prefix=recon-monitor-v8.4.3/ HEAD -o recon-monitor-v8.4.3.zip
          SHA=$(sha256sum recon-monitor-v8.4.3.zip | awk '{print $1}')
          printf '%s  %s\n' "$SHA" recon-monitor-v8.4.3.zip > recon-monitor-v8.4.3.zip.sha256

          gh release create v8.4.3 \
            recon-monitor-v8.4.3.zip \
            recon-monitor-v8.4.3.zip.sha256 \
            --title 'Recon Monitor v8.4.3' \
            --notes 'Recall-Preserving Family Admission. Weak security clues are retained in a hidden hypothesis ledger instead of being discarded, while analyst-facing File Upload and Path Traversal candidates now require family-specific decisive evidence. External OWASP/CWE/PortSwigger/GitHub Security Lab knowledge is stored as detection guidance only and never counted as target evidence. Schema 18 is additive. Includes full unit/integration and recall/precision regression validation on Python 3.11 and 3.13.'

          echo "RELEASE_SHA256=$SHA"
