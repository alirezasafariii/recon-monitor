name: Analysis 6.31 Corpus Materialization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse mutation after corpus freeze
        run: |
          if [[ -f benchmarks/raw/sources/v6_corpus_freeze.json ]]; then
            echo 'Analysis 6.31 corpus is already frozen; materialization mutation is forbidden.' >&2
            exit 1
          fi

      - name: Require literal capture input set
        run: |
          test -s benchmarks/raw/sources/v6_literal_captures.jsonl || {
            echo 'Missing v6_literal_captures.jsonl: 144 literal fresh captures are required.' >&2
            exit 1
          }

      - name: Verify sealed source-selection boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          shortlist = json.loads(Path('benchmarks/raw/sources/v6_shortlist.json').read_text())
          assert shortlist['evaluation_kind'] == 'fresh_blind_v6_unscored_source_selection'
          assert shortlist['selection_executes_scoring'] is False
          assert shortlist['selection_uses_detector_output'] is False
          assert shortlist['selection_uses_admission_results'] is False
          assert shortlist['selection_uses_ranking_results'] is False
          assert shortlist['grounding_counts_as_target_evidence'] is False
          assert shortlist['family_count'] == 36
          assert shortlist['unique_root_count'] == 36
          assert shortlist['unique_project_count'] == 36
          assert shortlist['owasp_grounded_family_count'] == 14
          assert shortlist['complement_family_count'] == 22
          assert shortlist['complement_override_family_count'] == 13
          assert shortlist['legacy_semantic_family_count'] == 9
          assert shortlist['supplement_pool_used'] is False
          assert shortlist['firewall']['passed'] is True
          assert shortlist['firewall']['scoring_executed'] is False
          assert shortlist['firewall']['candidate_count'] == 36
          assert shortlist['firewall']['unique_root_count'] == 36
          assert shortlist['firewall']['unique_project_count'] == 36
          assert shortlist['firewall']['rejected'] == []
          PY

      - name: Build unscored v6 literal corpus
        env:
          PYTHONPATH: app
        run: python app/v6_benchmark_dataset.py

      - name: Require literal-fresh corpus before commit
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v6_benchmark_validate import validate_v6_corpus

          report = json.loads(Path('benchmarks/raw/sources/v6_materialization_report.json').read_text())
          shortlist = json.loads(Path('benchmarks/raw/sources/v6_shortlist.json').read_text())
          cases = [json.loads(line) for line in Path('benchmarks/raw/analysis_raw_v6.jsonl').read_text().splitlines() if line.strip()]

          assert report['scoring_executed'] is False
          assert report['fresh_raw_claim'] is True
          assert report['raw_capture_mode'] == 'literal_source_capture'
          assert report['literal_single_capture_count'] == 144
          assert report['input_capture_count'] == 144
          assert report['single_case_count'] == 144
          assert report['pair_case_count'] == 72
          assert report['triad_case_count'] == 60
          assert report['case_count'] == 276
          assert report['family_count'] == 36
          assert len(cases) == 276

          validation = validate_v6_corpus(cases, shortlist, require_literal_single_capture=True)
          Path('benchmarks/raw/sources/v6_validation_report.json').write_text(
              json.dumps(validation, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          assert validation['passed'], validation['errors']
          assert validation['literal_single_capture_count'] == 144
          assert validation['label_leakage_count'] == 0
          assert validation['scoring_executed'] is False
          assert validation['source_firewall']['passed'] is True
          PY

      - name: Commit validated literal-fresh unscored corpus snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/analysis_raw_v6.jsonl benchmarks/raw/sources/v6_materialization_report.json benchmarks/raw/sources/v6_validation_report.json
          if git diff --cached --quiet; then
            echo 'No materialization snapshot change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize validated literal-fresh Analysis 6.31 v6 corpus'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
