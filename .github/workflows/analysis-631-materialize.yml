name: Analysis 6.31 Corpus Materialization

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_shortlist.json

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sealed-unscored v6 corpus
        env:
          PYTHONPATH: app
        run: python app/v6_benchmark_dataset.py

      - name: Verify materialization contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('benchmarks/raw/sources/v6_materialization_report.json').read_text())
          assert report['scoring_executed'] is False
          assert report['single_case_count'] == 144
          assert report['pair_case_count'] == 72
          assert report['triad_case_count'] == 60
          assert report['case_count'] == 276
          assert report['family_count'] == 36
          lines = [line for line in Path('benchmarks/raw/analysis_raw_v6.jsonl').read_text().splitlines() if line.strip()]
          assert len(lines) == 276
          print({key: report[key] for key in ('single_case_count','pair_case_count','triad_case_count','case_count','family_count')})
          PY

      - name: Commit sealed-unscored corpus snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/analysis_raw_v6.jsonl benchmarks/raw/sources/v6_materialization_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize sealed-unscored Analysis 6.31 v6 corpus'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
