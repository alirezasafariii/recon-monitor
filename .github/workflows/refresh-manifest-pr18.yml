name: Refresh PR18 Manifest

on:
  push:
    branches: [agent/collection-quality-v1]
    paths:
      - tests/test_collection_quality.py

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh existing manifest hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          refreshed = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              old_hash, path = raw.split('  ', 1)
              file_path = Path(path)
              digest = hashlib.sha256(file_path.read_bytes()).hexdigest()
              refreshed.append(f'{digest}  {path}')
          manifest.write_text('\n'.join(refreshed) + '\n', encoding='utf-8')
          PY
      - name: Commit refreshed manifest
        shell: bash
        run: |
          if git diff --quiet -- MANIFEST.sha256; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MANIFEST.sha256
          git commit -m "Refresh manifest for collection quality review fix"
          git push origin HEAD:agent/collection-quality-v1
