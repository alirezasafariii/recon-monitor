name: Account Enumeration Admission Bridge verification

on:
  push:
    branches:
      - feat/account-enumeration-admission-bridge-20260914
    paths:
      - '.github/workflows/account-enumeration-bridge-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-enumeration-admission-bridge-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh tracked hashes
        run: |
          for file in app/account_enumeration_admission_bridge.py tests/test_account_enumeration_admission_bridge.py docs/ACCOUNT_ENUMERATION_ADMISSION_BRIDGE.md; do
            grep -v "  $file$" MANIFEST.sha256 > MANIFEST.sha256.tmp || true
            mv MANIFEST.sha256.tmp MANIFEST.sha256
            sha256sum "$file" >> MANIFEST.sha256
          done
      - name: Focused compile and tests
        run: |
          python -m py_compile app/account_enumeration_admission_bridge.py tests/test_account_enumeration_admission_bridge.py
          python -m unittest tests.test_controlled_identity_differential tests.test_account_enumeration_admission_bridge
          sha256sum --strict -c MANIFEST.sha256
      - name: Commit final branch state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/account-enumeration-bridge-verify.yml
          git add MANIFEST.sha256
          git commit -m 'feat: finalize account enumeration admission bridge'
          git push origin HEAD:feat/account-enumeration-admission-bridge-20260914
