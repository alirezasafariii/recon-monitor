name: Refresh PR19 Manifest

on:
  push:
    branches: [agent/evidence-coverage-v1]
    paths:
      - .ci-refresh-pr19

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh existing manifest hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('MANIFEST.sha256')
          refreshed = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              _, path = raw.split('  ', 1)
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              refreshed.append(f'{digest}  {path}')
          manifest.write_text('\n'.join(refreshed) + '\n', encoding='utf-8')
          PY
      - name: Commit refreshed manifest
        shell: bash
        run: |
          if git diff --quiet -- MANIFEST.sha256; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MANIFEST.sha256
          git commit -m "Refresh PR19 manifest after main sync"
          git push origin HEAD:agent/evidence-coverage-v1
