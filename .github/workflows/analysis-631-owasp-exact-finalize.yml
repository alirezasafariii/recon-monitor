name: Analysis 6.31 OWASP Exact Finalize

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_owasp_exact_overrides.json
      - .github/workflows/analysis-631-owasp-exact-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate OWASP exact sources and assemble full shortlist
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from family_detectors.registry import DETECTOR_SPECS
          from raw_recon_v5_source_audit import AUDIT_RULE_VERSION, AUDIT_VERSION, audit_row
          from raw_recon_v6_source_firewall import canonical_url, exposure_index, validate_shortlist

          src = Path('benchmarks/raw/sources')
          grounding = json.loads((src/'v6_owasp_writeup_grounding.json').read_text())
          manual = json.loads((src/'v6_owasp_writeup_candidates.json').read_text())
          exact = json.loads((src/'v6_owasp_exact_overrides.json').read_text())
          assert exact['scoring_executed'] is False
          assert manual['scoring_executed'] is False
          assert grounding['grounding_counts_as_target_evidence'] is False

          hard = {
              'business_logic','cors_misconfiguration','dom_xss','graphql_data_exposure',
              'improper_inventory_management','nosql_injection','postmessage_trust',
              'sensitive_business_flow_abuse','sensitive_caching','software_supply_chain_failure',
          }
          exact_expected = hard - {'dom_xss','sensitive_business_flow_abuse'}
          if set(exact.get('candidates_by_family') or {}) != exact_expected:
              raise SystemExit('exact override family coverage mismatch')

          contracts = {
              'business_logic': (
                  ('business logic','registration workflow','workflow'),
                  ('invariant','duplicate email','uniqueness'),
                  ('password reset','ambiguity','privilege'),
              ),
              'cors_misconfiguration': (
                  ('cors','cross-origin'),
                  ('origin','untrusted'),
                  ('credential','sensitive'),
              ),
              'dom_xss': (
                  ('dom xss','client-side'),
                  ('svg','render','browser'),
                  ('sanit','bypass'),
              ),
              'graphql_data_exposure': (
                  ('graphql',),
                  ('concealed','restricted field','data exposure'),
                  ('aggregate','field','property'),
              ),
              'improper_inventory_management': (
                  ('old api','older arm api','legacy api'),
                  ('version','api'),
                  ('still exploitable','weaker authorization','version drift'),
              ),
              'nosql_injection': (
                  ('nosql','mongodb'),
                  ('query','operator','collection'),
                  ('inject','semantics','unintended'),
              ),
              'postmessage_trust': (
                  ('postmessage','message event'),
                  ('origin','iframe source','sender'),
                  ('validation','trust','correct iframe'),
              ),
              'sensitive_business_flow_abuse': (
                  ('invite','business'),
                  ('duplicate','flood','repeat'),
                  ('rate limit','anti-abuse','frequency'),
              ),
              'sensitive_caching': (
                  ('cache','cached'),
                  ('api key','sensitive','authenticated'),
                  ('shared cache','unauthenticated cache hit','edge'),
              ),
              'software_supply_chain_failure': (
                  ('supply chain','dependency'),
                  ('compromised','malicious'),
                  ('package','installation','published'),
              ),
          }

          prior = exposure_index()
          def firewall(row):
              root = str(row.get('source_root') or '').strip()
              project = str(row.get('source_project') or '').strip()
              urls = {
                  canonical_url(row.get('canonical_advisory_url')),
                  canonical_url(row.get('repository_advisory_url')),
                  canonical_url(row.get('source_code_location')),
                  canonical_url(row.get('source_url')),
              }
              urls.update(canonical_url(v) for v in row.get('references') or [])
              urls.discard('')
              return {
                  'allowed': bool(root and project) and root not in prior['roots'] and project not in prior['projects'] and not bool(urls & prior['urls']),
                  'root_overlap': root in prior['roots'],
                  'project_overlap': project in prior['projects'],
                  'url_overlap': sorted(urls & prior['urls']),
              }

          hard_rows = {}
          hard_report = {}
          for family in sorted(hard):
              pool = manual if family in {'dom_xss','sensitive_business_flow_abuse'} else exact
              rows = (pool.get('candidates_by_family') or {}).get(family) or []
              if len(rows) != 1:
                  raise SystemExit(f'{family}: expected one hard candidate')
              row = dict(rows[0])
              text = ' '.join([
                  str(row.get('summary') or ''), str(row.get('description') or ''),
                  *[str(v) for v in row.get('semantic_facts') or []],
              ]).lower()
              group_hits=[]
              for group in contracts[family]:
                  hits=sorted(term for term in group if term in text)
                  group_hits.append(hits)
                  if not hits:
                      raise SystemExit(f'{family}: OWASP semantic group missing: {group}')
              required=set((grounding.get('families') or {}).get(family,{}).get('wstg_ids') or [])
              supplied=set(row.get('wstg_ids') or [])
              if not supplied or not supplied.issubset(required):
                  raise SystemExit(f'{family}: WSTG mismatch supplied={sorted(supplied)} required={sorted(required)}')
              fw=firewall(row)
              if not fw['allowed']:
                  raise SystemExit(f'{family}: source firewall rejected candidate: {fw}')
              row['freshness_validated']=True
              row['v6_firewall_allowed']=True
              row['source_selection_track']='owasp_wstg_writeup_grounded_exact'
              row['owasp_grounding_audit']={
                  'passed':True,'group_hits':group_hits,'grounding_only':True,
                  'counts_as_target_evidence':False,
              }
              hard_rows[family]=row
              hard_report[family]={
                  'source_root':row['source_root'],'source_project':row['source_project'],
                  'wstg_ids':sorted(supplied),'semantic_group_hits':group_hits,'firewall':fw,
              }

          used_roots=set(); used_projects=set(); selected={}
          for family in sorted(hard_rows):
              row=hard_rows[family]
              root=str(row['source_root']); project=str(row['source_project'])
              if root in used_roots or project in used_projects:
                  raise SystemExit(f'{family}: hard source uniqueness collision')
              used_roots.add(root); used_projects.add(project); selected[family]=row

          def load_pool(path):
              if not path.exists(): return {}
              data=json.loads(path.read_text())
              assert data.get('scoring_executed') is False
              return data.get('candidates_by_family') or {}

          pools=[load_pool(src/'v6_candidates.json'),load_pool(src/'v6_supplement_candidates.json')]
          if (src/'v6_keyword_candidates.json').exists():
              pools.append(load_pool(src/'v6_keyword_candidates.json'))

          eligible={}
          for family in sorted(set(DETECTOR_SPECS)-hard):
              rows=[]; seen=set()
              for pool in pools:
                  for raw in pool.get(family) or []:
                      root=str(raw.get('source_root') or '').strip(); project=str(raw.get('source_project') or '').strip()
                      if not root or not project or (root,project) in seen: continue
                      seen.add((root,project))
                      if not firewall(raw)['allowed']: continue
                      passed,hits,score=audit_row(family,raw)
                      if not passed: continue
                      row=dict(raw)
                      row['freshness_validated']=True; row['v6_firewall_allowed']=True
                      row['source_family_audit_version']=AUDIT_VERSION
                      row['source_family_audit_rule_version']=AUDIT_RULE_VERSION
                      row['source_family_audit_score']=int(score)
                      row['source_family_audit_group_hits']=hits
                      row['source_selection_track']='legacy_semantic_fresh_pool'
                      rows.append(row)
              rows.sort(key=lambda r:(int(r.get('source_family_audit_score') or 0),1 if r.get('repository_advisory_url') else 0,r.get('published_at') or ''),reverse=True)
              eligible[family]=rows

          missing=sorted(f for f,rows in eligible.items() if not rows)
          if missing:
              raise SystemExit('non-hard semantic source gaps: '+', '.join(missing))
          for family in sorted(eligible,key=lambda f:(len(eligible[f]),f)):
              chosen=None
              for row in eligible[family]:
                  root=str(row['source_root']); project=str(row['source_project'])
                  if root in used_roots or project in used_projects: continue
                  chosen=row; break
              if chosen is None:
                  raise SystemExit('global uniqueness gap: '+family)
              selected[family]=chosen
              used_roots.add(str(chosen['source_root'])); used_projects.add(str(chosen['source_project']))

          if set(selected) != set(DETECTOR_SPECS):
              raise SystemExit(f'family coverage mismatch {len(selected)}/36')
          rows=[selected[f] for f in sorted(selected)]
          final_firewall=validate_shortlist(rows,required_count=36)
          if not final_firewall['passed']:
              raise SystemExit('final shortlist firewall failed: '+'; '.join(final_firewall['errors']))

          shortlist={
              'version':'3.0.0','rule_version':'2026.08.14.6.31',
              'evaluation_kind':'fresh_blind_v6_unscored_source_selection',
              'selection_executes_scoring':False,'selection_uses_detector_output':False,
              'selection_uses_admission_results':False,'selection_uses_ranking_results':False,
              'grounding_counts_as_target_evidence':False,
              'family_count':36,'unique_root_count':len(used_roots),'unique_project_count':len(used_projects),
              'owasp_grounded_family_count':10,'legacy_semantic_family_count':26,
              'firewall':final_firewall,'selected':rows,
          }
          report={
              'version':'1.0.0','rule_version':'2026.08.14.6.31','status':'selected',
              'scoring_executed':False,'family_count':36,
              'unique_root_count':len(used_roots),'unique_project_count':len(used_projects),
              'owasp_grounded_family_count':10,'legacy_semantic_family_count':26,
              'hard_family_validation':hard_report,
          }
          (src/'v6_shortlist.json').write_text(json.dumps(shortlist,indent=2,sort_keys=True)+'\n')
          (src/'v6_selection_final_report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:report[k] for k in ('status','family_count','unique_root_count','unique_project_count','owasp_grounded_family_count','legacy_semantic_family_count')},indent=2,sort_keys=True))
          PY
      - name: Commit sealed source shortlist
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_shortlist.json benchmarks/raw/sources/v6_selection_final_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Seal complete OWASP-grounded Analysis 6.31 v6 source set'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
