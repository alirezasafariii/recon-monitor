name: Analysis 6.31 OWASP Exact Finalize

on:
  workflow_dispatch:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_owasp_exact_overrides.json
      - benchmarks/raw/sources/v6_owasp_extension_candidates.json
      - benchmarks/raw/sources/v6_complement_overrides.json
      - app/v6_source_finalize.py
      - .github/workflows/analysis-631-owasp-exact-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse source mutation after corpus freeze
        run: |
          if [[ -f benchmarks/raw/sources/v6_corpus_freeze.json ]]; then
            echo 'Analysis 6.31 source selection is frozen and immutable.' >&2
            exit 1
          fi

      - name: Validate and assemble source shortlist
        env:
          PYTHONPATH: app
        run: python app/v6_source_finalize.py

      - name: Commit sealed source shortlist
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_shortlist.json benchmarks/raw/sources/v6_selection_final_report.json
          if git diff --cached --quiet; then
            echo 'No shortlist change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize hardened Analysis 6.31 v6 source shortlist'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation

      # Push trigger is temporary and will be removed after this hardened source rebuild succeeds.
