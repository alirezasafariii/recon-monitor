name: Fix PR19 Secret Coverage Mapping

on:
  push:
    branches: [agent/evidence-coverage-v1]
    paths:
      - .ci-fix-pr19-secret

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/evidence_coverage.py')
          text = path.read_text(encoding='utf-8')
          old = '    "source_map",\n    "navigation_context",'
          new = '    "source_map",\n    "secret_pattern",\n    "navigation_context",'
          if old not in text:
              raise SystemExit('javascript marker anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_evidence_coverage.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    def test_snapshot_is_diagnostic_only_and_persisted(self):\n'
          case = '''    def test_secret_pattern_tracks_javascript_collection_gap(self):\n        with tempfile.TemporaryDirectory() as td:\n            ctx = make_ctx(Path(td))\n            result = snapshot_evidence_coverage(\n                ctx,\n                analysis_id="ANALYSIS-1",\n                collection_quality=quality(javascript="partial"),\n                persist=False,\n            )\n            first_group = result["families"]["secret_exposure"]["promotion_required"][0]\n            signals = signal_map(first_group)\n            self.assertEqual(first_group["status"], "not_collected")\n            self.assertEqual(signals["secret_pattern"]["status"], "not_collected")\n            self.assertEqual(\n                signals["secret_pattern"]["collection_status"]["javascript"],\n                "partial",\n            )\n\n'''
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          test_path.write_text(tests.replace(anchor, case + anchor, 1), encoding='utf-8')
          PY
      - name: Run focused regression
        run: python -m unittest tests.test_evidence_coverage -q
      - name: Refresh manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('MANIFEST.sha256')
          refreshed = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              _, path = raw.split('  ', 1)
              refreshed.append(f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}')
          manifest.write_text('\n'.join(refreshed) + '\n', encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/evidence_coverage.py tests/test_evidence_coverage.py MANIFEST.sha256
          git commit -m "Map secret static evidence to JavaScript coverage"
          git push origin HEAD:agent/evidence-coverage-v1
