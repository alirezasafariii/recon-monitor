name: Temporary finding notification outbox re-verification

on:
  push:
    branches: [feat/finding-notification-outbox-20260914]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/finding-notification-outbox-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh changed file hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('MANIFEST.sha256')
          tracked = [
              'app/notification_transports.py',
              'app/finding_notification_outbox.py',
              'app/finding_notifications.py',
              'app/reviewed_evidence_dispatcher.py',
              'tools/deliver_finding_notifications.py',
              'tests/test_finding_notification_outbox.py',
              'tests/test_reviewed_evidence_dispatcher.py',
              'tests/test_reviewed_evidence_outbox_matrix.py',
              'docs/FINDING_NOTIFICATION_OUTBOX.md',
          ]
          replacements = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          original = manifest.read_text(encoding='utf-8').splitlines()
          output=[]; seen=set()
          for line in original:
              parts=line.split('  ',1)
              if len(parts)==2 and parts[1] in replacements:
                  p=parts[1]; output.append(f'{replacements[p]}  {p}'); seen.add(p)
              else:
                  output.append(line)
          for p in tracked:
              if p not in seen:
                  output.append(f'{replacements[p]}  {p}')
          manifest.write_text('\n'.join(output)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh manifest after outbox test fix'
            git push origin HEAD:feat/finding-notification-outbox-20260914
          fi
      - name: Verify focused outbox
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/notification_transports.py app/finding_notification_outbox.py app/finding_notifications.py app/reviewed_evidence_dispatcher.py tools/deliver_finding_notifications.py
          python -m unittest -q \
            tests.test_finding_notifications \
            tests.test_finding_notification_outbox \
            tests.test_reviewed_evidence_dispatcher \
            tests.test_reviewed_evidence_outbox_matrix
          sha256sum --strict -c MANIFEST.sha256
      - name: Finalize branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/finding-notification-outbox-20260914
          git checkout -B feat/finding-notification-outbox-20260914 origin/feat/finding-notification-outbox-20260914
          git rm -f .github/workflows/tmp-finding-outbox-reverify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary finding outbox re-verifier'
          git push origin HEAD:feat/finding-notification-outbox-20260914
