name: Analysis 6.29 Fresh Blind v5 First Evaluation

on:
  push:
    branches:
      - agent/analysis-engine-6.29-fresh-blind-v5-multifamily

permissions:
  contents: write

jobs:
  first-blind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen v5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.29-fresh-blind-v5-multifamily
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen v5 boundary before first scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.')
          freeze_path = root / 'benchmarks/raw/sources/v5_freeze_manifest.json'
          report_path = root / 'benchmarks/raw/results/analysis_raw_v5_first_blind.json'
          receipt_path = root / 'benchmarks/raw/sources/v5_first_blind_receipt.json'
          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))

          assert freeze['evaluation_status'] == 'sealed_unscored'
          assert freeze['scoring_executed'] is False
          assert freeze['evaluator_frozen_before_scoring'] is True
          assert freeze['first_blind_max_runs'] == 1
          assert freeze['case_count'] == 216
          assert freeze['single_case_count'] == 144
          assert freeze['multi_case_count'] == 72
          assert freeze['source_root_count'] == 36
          assert freeze['source_project_count'] == 36
          assert freeze['corpus_validation']['passed'] is True
          assert freeze['corpus_validation']['prior_cve_overlap_count'] == 0
          assert freeze['corpus_validation']['label_leakage_count'] == 0
          assert freeze['corpus_validation']['grounding_writeup_overlap_count'] == 0
          assert freeze['corpus_validation']['grounding_reference_overlap_count'] == 0
          assert not report_path.exists(), 'v5 first-blind report already exists'
          assert not receipt_path.exists(), 'v5 first-blind receipt already exists'

          for rel, wanted in freeze['protected_sha256'].items():
              actual = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              assert actual == wanted, (rel, wanted, actual)

          print(json.dumps({
              'status': freeze['evaluation_status'],
              'case_count': freeze['case_count'],
              'corpus_sha256': freeze['protected_sha256']['benchmarks/raw/analysis_raw_v5.jsonl'],
              'evaluator_sha256': freeze['protected_sha256']['app/raw_recon_v5_benchmark.py'],
          }, indent=2))
          PY

      - name: Execute frozen First Blind v5 exactly once
        env:
          PYTHONPATH: app
          WORKFLOW_START_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from raw_recon_v5_benchmark import run_v5_benchmark

          root = Path('.')
          result_dir = root / 'benchmarks/raw/results'
          result_dir.mkdir(parents=True, exist_ok=True)
          report_path = result_dir / 'analysis_raw_v5_first_blind.json'
          receipt_path = root / 'benchmarks/raw/sources/v5_first_blind_receipt.json'
          freeze_path = root / 'benchmarks/raw/sources/v5_freeze_manifest.json'
          shortlist_path = root / 'benchmarks/raw/sources/v5_shortlist.json'
          corpus_path = root / 'benchmarks/raw/analysis_raw_v5.jsonl'

          if report_path.exists() or receipt_path.exists():
              raise SystemExit('v5 first blind is already consumed')

          freeze = json.loads(freeze_path.read_text(encoding='utf-8'))
          report = run_v5_benchmark()
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          single_metrics = dict(report['single_family']['metrics'])
          multi_metrics = dict(report['multi_family']['metrics'])
          receipt = {
              'receipt_version': '1.0.0',
              'receipt_rule_version': '2026.08.13.6.29',
              'status': 'first_blind_consumed',
              'evaluation_kind': 'fresh_blind_v5_single_consumption',
              'workflow_start_commit': os.environ['WORKFLOW_START_COMMIT'],
              'case_count': report['case_count'],
              'single_case_count': report['single_case_count'],
              'multi_case_count': report['multi_case_count'],
              'family_count': 36,
              'corpus_sha256': sha(corpus_path),
              'shortlist_sha256': sha(shortlist_path),
              'freeze_sha256': sha(freeze_path),
              'evaluator_sha256': sha(root / 'app/raw_recon_v5_benchmark.py'),
              'report_sha256': sha(report_path),
              'single_metrics': single_metrics,
              'multi_metrics': multi_metrics,
              'quality_gate_passed': bool(report['quality_gate']['passed']),
              'single_quality_gate_passed': bool(report['quality_gate']['single_passed']),
              'multi_quality_gate_passed': bool(report['quality_gate']['multi_passed']),
              'single_quality_gate_failures': list(report['quality_gate']['single_failures']),
              'multi_quality_gate_failures': list(report['quality_gate']['multi_failures']),
              'mutation_policy': {
                  'frozen_v5_inputs_after_first_blind': 'forbidden',
                  'benchmark_repairs_after_first_blind': 'forbidden',
                  'subsequent_v5_runs': 'regression_only_not_first_blind',
                  'engine_repairs': 'allowed_only_with_separate_calibration_sources_without_modifying_frozen_v5_inputs',
              },
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'quality_gate_passed': receipt['quality_gate_passed'],
              'single_metrics': single_metrics,
              'multi_metrics': multi_metrics,
              'report_sha256': receipt['report_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - name: Verify immutable boundary after scoring
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          freeze=json.loads((root/'benchmarks/raw/sources/v5_freeze_manifest.json').read_text())
          receipt=json.loads((root/'benchmarks/raw/sources/v5_first_blind_receipt.json').read_text())
          for rel,wanted in freeze['protected_sha256'].items():
              actual=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert actual==wanted,(rel,wanted,actual)
          assert receipt['status']=='first_blind_consumed'
          assert receipt['evaluation_kind']=='fresh_blind_v5_single_consumption'
          assert receipt['corpus_sha256']==freeze['protected_sha256']['benchmarks/raw/analysis_raw_v5.jsonl']
          assert receipt['shortlist_sha256']==freeze['protected_sha256']['benchmarks/raw/sources/v5_shortlist.json']
          assert receipt['evaluator_sha256']==freeze['protected_sha256']['app/raw_recon_v5_benchmark.py']
          print('immutable v5 boundary preserved after first scoring')
          PY

      - name: Update manifest with immutable first-blind result
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.'); manifest=root/'MANIFEST.sha256'; entries={}; order=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line: continue
              _,name=line.split('  ',1); p=root/name
              if p.is_file(): entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          permanent=(
              'benchmarks/raw/results/analysis_raw_v5_first_blind.json',
              'benchmarks/raw/sources/v5_first_blind_receipt.json',
          )
          for name in permanent:
              p=root/name
              if not p.is_file(): raise SystemExit(f'missing v5 first-blind artifact: {name}')
              entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
              if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order),encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256

      - name: Commit consumed First Blind v5 before evaluating job conclusion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-629-v5-first-blind.yml
          if git ls-files --error-unmatch scripts/analysis_629_prepare_fix.py >/dev/null 2>&1; then
            git rm scripts/analysis_629_prepare_fix.py
          fi
          git add -A
          git diff --cached --check
          git commit -m "Record consumed Analysis 6.29 First Blind v5"
          git push origin HEAD:agent/analysis-engine-6.29-fresh-blind-v5-multifamily

      - name: Enforce pre-registered First Blind v5 gates
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('benchmarks/raw/results/analysis_raw_v5_first_blind.json').read_text())
          if not report['quality_gate']['passed']:
              print(json.dumps(report['quality_gate'], indent=2, sort_keys=True))
              raise SystemExit('Analysis 6.29 First Blind v5 failed pre-registered gates; result is consumed and frozen')
          print('Analysis 6.29 First Blind v5 passed all pre-registered gates')
          PY
