name: Analysis 6.29 Fresh Blind v5 Prepare

on:
  push:
    branches:
      - agent/analysis-engine-6.29-fresh-blind-v5-multifamily

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.29-fresh-blind-v5-multifamily
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify sealed 6.28 lineage and unchanged production scoring logic
        run: |
          set -euo pipefail
          BASE=8d7265479df58c8c67b168db81e6a8aeaf80c5e4
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" -- \
            app/analysis_engine.py \
            app/analysis_ranking.py \
            app/bug_candidates.py \
            app/security_reasoning.py \
            app/hypothesis_admission.py \
            app/family_detectors \
            app/family_reasoners.py \
            app/family_evidence_extractors.py \
            app/family_orchestration.py \
            app/static_family_collectors.py

      - name: Pre-score protocol tests
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p 'test_analysis_629_v5_protocol.py' -q
          python -m unittest discover -s tests -p 'test_analysis_628_orchestrator_cleanup.py' -q
          python -m unittest discover -s tests -p 'test_analysis_627_seal.py' -q

      - name: Discover fully fresh v5 source pool
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ github.token }}
        run: python app/raw_recon_v5_source_discovery.py

      - name: Verify exact fresh business-logic source supplement
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ github.token }}
        run: python app/raw_recon_v5_business_logic_supplement.py

      - name: Select semantic sources and materialize hard cases
        env:
          PYTHONPATH: app
        run: python app/raw_recon_v5_prepare.py

      - name: Validate integrity and freeze corpus plus evaluator
        env:
          PYTHONPATH: app
        run: python app/raw_recon_v5_freeze.py

      - name: Verify frozen v5 contract without scoring
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p 'test_analysis_629_v5_protocol.py' -q
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          freeze=json.loads((root/'benchmarks/raw/sources/v5_freeze_manifest.json').read_text())
          validation=freeze['corpus_validation']
          assert freeze['evaluation_status']=='sealed_unscored'
          assert freeze['scoring_executed'] is False
          assert freeze['evaluator_frozen_before_scoring'] is True
          assert freeze['case_count']==216
          assert freeze['single_case_count']==144
          assert freeze['multi_case_count']==72
          assert freeze['multi_observation_model']=='two_independent_stored_target_observations'
          assert freeze['source_root_count']==36
          assert freeze['source_project_count']==36
          assert freeze['prior_root_overlap_count']==0
          assert freeze['prior_project_overlap_count']==0
          assert freeze['prior_url_overlap_count']==0
          assert validation['passed'] is True
          assert validation['label_leakage_count']==0
          assert validation['grounding_writeup_overlap_count']==0
          assert validation['single_positive_control_collision_count']==0
          assert validation['multi_raw_collision_count']==0
          assert validation['single_positive_observable_delta_rate']==1.0
          for rel,wanted in freeze['protected_sha256'].items():
              actual=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert actual==wanted,(rel,wanted,actual)
          assert not (root/'benchmarks/raw/results/analysis_raw_v5_first_blind.json').exists()
          assert not (root/'benchmarks/raw/sources/v5_first_blind_receipt.json').exists()
          cases=[json.loads(line) for line in (root/'benchmarks/raw/analysis_raw_v5.jsonl').read_text().splitlines() if line.strip()]
          assert len(cases)==216
          singles=[c for c in cases if c['case_mode']=='single_family_fresh']
          multi=[c for c in cases if c['case_mode']=='multi_family_hard_case']
          assert len(singles)==144
          assert len(multi)==72
          assert all(len(c['raw_observations'])==2 for c in multi)
          dual=[c for c in multi if c['case_kind']=='dual_positive']
          assert len(dual)==18
          assert len({f for c in dual for f in c['expected_families']})==36
          shortlist=json.loads((root/'benchmarks/raw/sources/v5_shortlist.json').read_text())
          selected=shortlist['selected']
          assert len(selected)==36
          assert len({x['source_root'] for x in selected})==36
          assert len({x['source_project'] for x in selected})==36
          assert any(x['family']=='business_logic' and x['source_project']=='pretix/pretix' for x in selected)
          print(json.dumps({
              'corpus_sha256': freeze['protected_sha256']['benchmarks/raw/analysis_raw_v5.jsonl'],
              'evaluator_sha256': freeze['protected_sha256']['app/raw_recon_v5_benchmark.py'],
              'cases':216,
              'dual_positive_pairs':18,
              'source_kind_counts':freeze['source_kind_counts'],
          }, indent=2))
          PY

      - name: Update manifest for frozen v5 preparation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.'); manifest=root/'MANIFEST.sha256'; entries={}; order=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line: continue
              _,name=line.split('  ',1); p=root/name
              if p.is_file(): entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          permanent=(
              'app/raw_recon_v5_source_discovery.py',
              'app/raw_recon_v5_source_audit.py',
              'app/raw_recon_v5_business_logic_supplement.py',
              'app/raw_recon_v5_prepare.py',
              'app/raw_recon_v5_corpus.py',
              'app/raw_recon_v5_benchmark.py',
              'app/raw_recon_v5_freeze.py',
              'tests/test_analysis_629_v5_protocol.py',
              'docs/ANALYSIS_ENGINE_6_29_FRESH_BLIND_V5.md',
              'benchmarks/raw/sources/v5_candidates.json',
              'benchmarks/raw/sources/v5_business_logic_supplement.json',
              'benchmarks/raw/sources/v5_shortlist.json',
              'benchmarks/raw/analysis_raw_v5.jsonl',
              'benchmarks/raw/sources/v5_freeze_manifest.json',
              'benchmarks/raw/sources/v5_prepare_report.json',
          )
          for name in permanent:
              p=root/name
              if not p.is_file(): raise SystemExit(f'missing v5 permanent file: {name}')
              entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
              if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order),encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256

      - name: Commit frozen unscored v5 and remove preparation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-629-v5-prepare.yml
          git add -A
          git diff --cached --check
          git commit -m "Freeze Analysis 6.29 fresh blind v5 corpus and evaluator"
          git push origin HEAD:agent/analysis-engine-6.29-fresh-blind-v5-multifamily
