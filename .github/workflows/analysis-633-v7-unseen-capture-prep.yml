name: Analysis 6.33 V7 Unseen Capture Preparation

on:
  push:
    branches:
      - agent/analysis-engine-6.33-v7-unseen-capture
    paths:
      - '.github/workflows/analysis-633-v7-unseen-capture-prep.yml'
      - 'app/v7_capture_guard.py'
      - 'app/v7_literal_source_research.py'
      - 'app/v7_literal_capture_plan.py'
      - 'tests/test_v7_literal_source_research.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-633-v7-unseen-capture-prep
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.33-v7-unseen-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce frozen production engine and source assignment
        env: {PYTHONPATH: app}
        run: |
          set -euo pipefail
          BASELINE='b8b15261cc4049a1e5e425a83e57b6378a856113'
          git cat-file -e "${BASELINE}^{commit}"
          python - <<'PY'
          import json
          from v7_capture_guard import assert_capture_source_freeze
          r=assert_capture_source_freeze()
          assert r['source_assignment_commit']=='5656a8add583f61e712a837794ce7302857fce7a'
          assert r['engine_baseline_commit']=='b8b15261cc4049a1e5e425a83e57b6378a856113'
          assert r['family_count']==36 and r['unique_root_count']==36 and r['unique_project_count']==36
          assert r['recomputed_engine_seen_count']==0
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False and r['merge_authorized'] is False
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Assert no inherited literal evidence
        run: |
          set -euo pipefail
          if [ -d benchmarks/raw/sources/v7_capture_evidence ]; then count="$(find benchmarks/raw/sources/v7_capture_evidence -type f -name '*.json' | wc -l | tr -d ' ')"; else count=0; fi
          test "$count" = '0'
          echo "preexisting_v7_literal_evidence=$count"
      - name: Collect passive canonical snapshots for all frozen sources
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/v7_literal_source_research.py --require-all
      - name: Freeze canonical condition-control vocabulary
        env: {PYTHONPATH: app}
        run: python app/v7_literal_label_schema.py
      - name: Build 144-capture plan
        env: {PYTHONPATH: app}
        run: python app/v7_literal_capture_plan.py
      - name: Verify preparation is complete and unscored
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          research=json.loads(Path('benchmarks/raw/sources/v7_literal_source_research.json').read_text())
          plan=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_plan.json').read_text())
          assert research['successful_snapshot_count']==36 and research['unresolved_snapshot_count']==0
          assert research['source_assignment_commit']=='5656a8add583f61e712a837794ce7302857fce7a'
          assert research['ghsa_root_authoritative_count']==36
          assert research['exact_frozen_root_match_count']==36
          assert research['ghsa_alias_resolution_count']==0
          assert plan['family_count']==36 and plan['required_capture_count']==144
          assert plan['evidence_present_count']==0 and plan['evidence_missing_count']==144 and plan['all_evidence_present'] is False
          assert plan['source_assignment_commit']=='5656a8add583f61e712a837794ce7302857fce7a'
          for doc in (research,plan):
              assert doc['scoring_executed'] is False and doc['first_blind_consumed'] is False
          print({'snapshots':36,'exact_frozen_root_matches':36,'planned':144,'present':0,'literal_adjudication_required':plan['literal_adjudication_required_count'],'audit_fallbacks':plan['audit_fallback_count']})
          PY
      - name: Focused exact-identity regression
        env: {PYTHONPATH: app}
        run: python -m unittest tests/test_v7_literal_source_research.py -q
      - name: Full regression suite
        env: {PYTHONPATH: app}
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Source hygiene
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '^(state|runs|output|reports|backups)/.+|(^|/)config\.env$|\.db($|-)' || true)"
          forbidden="$(printf '%s\n' "$forbidden" | grep -Ev '/\.gitkeep$' || true)"
          test -z "$forbidden"
      - name: Freeze preparation artifacts and manifest
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v7_literal_source_research.json benchmarks/raw/sources/v7_literal_label_schema.json benchmarks/raw/sources/v7_literal_capture_plan.json
          git ls-files -z | python -c 'import sys; x=[v for v in sys.stdin.buffer.read().split(b"\0") if v and v!=b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(x))+b"\0")' | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
          git add MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo 'No capture-prep outputs changed.'; exit 0; fi
          git commit -m 'chore(analysis-633): freeze engine-unseen V7 capture preparation'
          git push origin HEAD:agent/analysis-engine-6.33-v7-unseen-capture
