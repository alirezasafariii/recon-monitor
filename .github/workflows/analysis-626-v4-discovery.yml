name: Analysis 6.26 Raw v4 Discovery

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discovery protocol contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_raw_recon_v4_discovery_protocol_v6260.py' -q

      - name: Discover knowledge-unseen reviewed advisory candidates
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ github.token }}
        run: python app/raw_recon_v4_source_discovery.py --max-pages 10 --target-per-family 160

      - name: Register stable v4 discovery files in manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          rows = []
          known = set()
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line:
                  continue
              _, name = line.split('  ', 1)
              path = root / name
              if path.is_file():
                  rows.append((name, hashlib.sha256(path.read_bytes()).hexdigest()))
                  known.add(name)
          additions = [
              'app/raw_recon_v4_source_discovery.py',
              'tests/test_raw_recon_v4_discovery_protocol_v6260.py',
              'docs/ANALYSIS_ENGINE_6_26_FRESH_RAW_HOLDOUT_V4.md',
              'benchmarks/raw/sources/v4_candidates.json',
          ]
          for name in additions:
              path = root / name
              if path.is_file() and name not in known:
                  rows.append((name, hashlib.sha256(path.read_bytes()).hexdigest()))
                  known.add(name)
          manifest.write_text(''.join(f'{digest}  {name}\n' for name, digest in rows), encoding='utf-8')
          PY

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Commit discovery snapshot and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-v4-discovery.yml
          git add MANIFEST.sha256 benchmarks/raw/sources/v4_candidates.json app/raw_recon_v4_source_discovery.py tests/test_raw_recon_v4_discovery_protocol_v6260.py docs/ANALYSIS_ENGINE_6_26_FRESH_RAW_HOLDOUT_V4.md
          git diff --cached --check
          git commit -m "Snapshot Analysis 6.26 fresh raw v4 source discovery"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
