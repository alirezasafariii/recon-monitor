name: Finalize Analysis Engine 6.0

on:
  push:
    branches:
      - agent/analysis-engine-6.0-owasp-admission

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.0-owasp-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Analysis Engine 6.0 patch
        run: |
          cat .analysis_v6_part_01 .analysis_v6_part_02 .analysis_v6_part_03 .analysis_v6_part_04 \
              .analysis_v6_part_05 .analysis_v6_part_06 .analysis_v6_part_07 .analysis_v6_part_08 \
              > .analysis_v6_patch.py
          sed -i 's/static_candidates = _static_candidates(db,analysis_id,run_id,target)/static_candidates = _static_candidates(db, analysis_id, run_id, target)/' .analysis_v6_patch.py
          python3 .analysis_v6_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_recall_preserving_admission_v843.py')
          s = p.read_text(encoding='utf-8')
          old = 'variant="file_validation", support=[{"type": "import_operation", "source": "endpoint", "text": "import operation"}],'
          new = 'variant="file_validation", support=[{"type": "import_operation", "source": "endpoint", "text": "import operation"}, {"type": "dangerous_type_accepted", "source": "stored_behavior", "text": "unsafe type accepted"}],'
          if old not in s:
              raise SystemExit('complementary evidence fixture not found')
          s = s.replace(old, new, 1)
          s = s.replace('{"file_input", "import_operation"}', '{"file_input", "import_operation", "dangerous_type_accepted"}', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax checks
        run: python3 -m py_compile app/hypothesis_admission.py app/bug_candidates.py app/analysis_engine.py app/candidate_intelligence.py app/behavioral_intelligence.py app/security_reasoning.py tests/test_analysis_admission_v600.py tests/test_recall_preserving_admission_v843.py
      - name: Focused Analysis regression tests
        run: python3 -m unittest tests.test_analysis_admission_v600 tests.test_recall_preserving_admission_v843 tests.test_bola_intelligence_v850 tests.test_security_reasoning_v46 tests.test_abstention_consistency_v844 tests.test_current_projection_v845
      - name: Full regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Clean staging files
        run: |
          rm -f .analysis_v6_patch.py .analysis_v6_part_01 .analysis_v6_part_02 .analysis_v6_part_03 .analysis_v6_part_04
          rm -f .analysis_v6_part_05 .analysis_v6_part_06 .analysis_v6_part_07 .analysis_v6_part_08
          rm -f .github/workflows/apply-analysis-v6.yml .github/workflows/apply-analysis-v6-retry.yml .github/workflows/apply-analysis-v6-finalize.yml
      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add OWASP-grounded Analysis Engine 6.0 admission'
          git push origin HEAD:agent/analysis-engine-6.0-owasp-admission
