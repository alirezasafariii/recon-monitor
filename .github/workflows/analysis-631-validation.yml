name: Analysis 6.31 Validation

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
  pull_request:
    branches:
      - agent/analysis-engine-6.30-open-redirect-calibration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify 6.31 production boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/analysis-engine-6.30-open-redirect-calibration --depth=1
          BASE=origin/agent/analysis-engine-6.30-open-redirect-calibration
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              app/raw_recon_v6_*.py|app/v6_benchmark_*.py|app/v6_source_*.py|app/v6_literal_*.py|app/v6_first_blind_*.py|app/v6_pre_score_*.py|app/v6_remaining_*.py|app/v6_freeze_verify.py|app/v6_corpus_freeze.py|tests/test_v6_*.py|benchmarks/raw/sources/v6_*.json|benchmarks/raw/sources/v6_*.jsonl|benchmarks/raw/sources/v6_*.sha256|benchmarks/raw/sources/v6_capture_evidence/*.json|benchmarks/raw/analysis_raw_v6.jsonl|docs/ANALYSIS_ENGINE_6_31_*.md|.github/workflows/analysis-631-*.yml)
                ;;
              *)
                echo "Analysis 6.31 pre-score production boundary violation: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$CHANGED"

      - name: Source independence tests
        run: python -m unittest tests.test_v6_source_independence -v

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Strict partial literal evidence inventory gate
        env:
          PYTHONPATH: app
        run: python app/v6_literal_partial_verify.py

      - name: Literal capture evidence gate
        env:
          PYTHONPATH: app
        run: python app/v6_literal_capture_verify.py --allow-missing

      - name: V6 corpus integrity gate
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v6_benchmark_validate import validate_v6_corpus
          from v6_literal_capture_verify import verify_capture_set

          corpus = Path('benchmarks/raw/analysis_raw_v6.jsonl')
          shortlist_path = Path('benchmarks/raw/sources/v6_shortlist.json')
          if not corpus.exists() or not shortlist_path.exists():
              print('V6 literal corpus/shortlist not materialized yet; integrity gate pending.')
              raise SystemExit(0)

          capture_verification = verify_capture_set(require_complete=True)
          print(json.dumps(capture_verification, indent=2, sort_keys=True))
          if not capture_verification['passed']:
              raise SystemExit(1)

          cases = [json.loads(line) for line in corpus.read_text(encoding='utf-8').splitlines() if line.strip()]
          shortlist = json.loads(shortlist_path.read_text(encoding='utf-8'))
          result = validate_v6_corpus(cases, shortlist, require_literal_single_capture=True)
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result['passed']:
              raise SystemExit(1)
          PY

      - name: Verify freeze hashes when present
        env:
          PYTHONPATH: app
        run: python app/v6_freeze_verify.py

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py
