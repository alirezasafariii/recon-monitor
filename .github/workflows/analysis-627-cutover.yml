name: Analysis 6.27 Formal Cutover

on:
  push:
    branches:
      - agent/analysis-engine-6.27-blind-failure-calibration

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.27-blind-failure-calibration
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable consumed-v4 boundary before cutover
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          expected={
            'benchmarks/raw/analysis_raw_v4.jsonl':'fe6936881b7fe0e8c71c9bc76a0f87d02446a3d703ec1dddf84e0b6caa7fb9b6',
            'benchmarks/raw/sources/v4_shortlist.json':'d329752e8b6045b433e3d490c0ff438f067577840fb5429a80721a0f79a34f85',
            'benchmarks/raw/sources/v4_first_blind_report.json':'5c9d241b9da38fb374caa1851b8474aab2580dbafd1dbf25b6e68db267097960',
          }
          for name,wanted in expected.items():
            actual=hashlib.sha256(Path(name).read_bytes()).hexdigest(); assert actual==wanted,(name,wanted,actual)
          receipt=json.loads(Path('benchmarks/raw/sources/v4_first_blind_receipt.json').read_text())
          assert receipt['status']=='first_blind_consumed'
          assert receipt['evaluation_kind']=='first_blind_single_consumption'
          PY

      - name: Apply Analysis 6.27 formal cutover
        run: python scripts/analysis_627_cutover.py

      - name: Analysis 6.27 exact cutover contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_analysis_627_seal.py' -q

      - name: Analysis 6.27 calibration contracts
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p 'test_analysis_627_blind_failure_calibration.py' -q
          python -m unittest discover -s tests -p 'test_analysis_627_precision_routing.py' -q
          python -m unittest discover -s tests -p 'test_family_confusion_matrix_v670.py' -q
          python -m unittest discover -s tests -p 'test_family_reasoners_v670.py' -q
          python -m unittest discover -s tests -p 'test_family_evidence_extractors_v680.py' -q
          python -m unittest discover -s tests -p 'test_owasp_top10_2025_completion_v6250.py' -q

      - name: Re-run consumed-v4 regression as regression only
        env:
          PYTHONPATH: app
        run: |
          python app/raw_recon_v4_regression.py
          python app/raw_recon_v4_regression_diagnostic.py
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('benchmarks/raw/results/analysis_raw_v4_6_27_regression.json').read_text())
          diag=json.loads(Path('benchmarks/raw/results/analysis_raw_v4_6_27_diagnostic.json').read_text())
          assert reg['evaluation_kind']=='post_first_blind_regression'
          assert reg['quality_gate']['passed'], reg['quality_gate']['failures']
          assert diag['condition_false_positive_family_counts']=={}
          assert diag['wrong_promotion_family_counts']=={}
          print(json.dumps({'metrics':reg['metrics'],'quality_gate':reg['quality_gate']},indent=2,sort_keys=True))
          PY

      - name: Full unit suite on Python 3.11
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden strict on Python 3.11
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration on Python 3.11
        run: python tests/integration_runner.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Full unit suite on Python 3.13
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden strict on Python 3.13
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration on Python 3.13
        run: python tests/integration_runner.py

      - name: Re-verify immutable v4 after all validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'benchmarks/raw/analysis_raw_v4.jsonl':'fe6936881b7fe0e8c71c9bc76a0f87d02446a3d703ec1dddf84e0b6caa7fb9b6',
            'benchmarks/raw/sources/v4_shortlist.json':'d329752e8b6045b433e3d490c0ff438f067577840fb5429a80721a0f79a34f85',
            'benchmarks/raw/sources/v4_first_blind_report.json':'5c9d241b9da38fb374caa1851b8474aab2580dbafd1dbf25b6e68db267097960',
          }
          for name,wanted in expected.items():
            actual=hashlib.sha256(Path(name).read_bytes()).hexdigest(); assert actual==wanted,(name,wanted,actual)
          print('immutable consumed-v4 boundary unchanged')
          PY

      - name: Update manifest for Analysis 6.27 cutover
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.'); manifest=root/'MANIFEST.sha256'; entries={}; order=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
            if '  ' not in line: continue
            _,name=line.split('  ',1); p=root/name
            if p.is_file(): entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          permanent=(
            'app/analysis_engine.py','app/bug_candidates.py','app/security_reasoning.py','app/analysis_standards.py',
            'app/hypothesis_admission.py','app/family_detectors/base.py','app/family_detectors/execution.py',
            'app/family_detectors/unsafe_api_consumption.py','app/raw_condition_reconstruction.py',
            'app/family_reasoners.py','app/family_evidence_extractors.py','app/raw_recon_v4_regression.py',
            'app/raw_recon_v4_regression_diagnostic.py','tests/test_analysis_627_blind_failure_calibration.py',
            'tests/test_analysis_627_precision_routing.py','tests/test_analysis_627_seal.py',
            'tests/test_analysis_625_seal.py','tests/test_family_confusion_matrix_v670.py','tests/test_family_reasoners_v670.py',
            'tests/test_family_evidence_extractors_v680.py','tests/test_detector_execution_intelligence_v6100.py',
            'tests/test_raw_condition_reconstruction_v6120.py','tests/test_raw_precision_calibration_v6140.py',
            'benchmarks/raw/results/analysis_raw_v4_6_27_regression.json',
            'benchmarks/raw/results/analysis_raw_v4_6_27_diagnostic.json',
            'docs/ANALYSIS_ENGINE_6_27_BLIND_FAILURE_CALIBRATION.md',
          )
          for name in permanent:
            p=root/name
            if not p.is_file(): raise SystemExit(f'missing permanent cutover file: {name}')
            entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
            if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order),encoding='utf-8')
          PY

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Commit Analysis 6.27 cutover and remove one-shot helper/workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-627-cutover.yml scripts/analysis_627_cutover.py
          git add -A
          git diff --cached --check
          git commit -m "Cut over Analysis Engine 6.27 blind failure calibration"
          git push origin HEAD:agent/analysis-engine-6.27-blind-failure-calibration
