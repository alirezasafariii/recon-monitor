name: Analysis 6.31 Capture Path Traversal

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-capture-path-traversal.yml
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout recon repository read-only
        uses: actions/checkout@v4
        with:
          path: recon
          persist-credentials: false

      - name: Verify controlled PHP runtime
        run: php -v

      - name: Checkout vulnerable Joomla extractor without credentials
        uses: actions/checkout@v4
        with:
          repository: joomla/joomla-cms
          ref: d89141ffe22b2a7d97193a825085a287053761b7
          path: joomla-vuln
          persist-credentials: false
          sparse-checkout: |
            administrator/components/com_joomlaupdate
          sparse-checkout-cone-mode: true

      - name: Checkout patched Joomla extractor without credentials
        uses: actions/checkout@v4
        with:
          repository: joomla/joomla-cms
          ref: 98ee218a642b8e795f13bc6eeb250bec5deee03e
          path: joomla-patched
          persist-credentials: false
          sparse-checkout: |
            administrator/components/com_joomlaupdate
          sparse-checkout-cone-mode: true

      - name: Build controlled ZIP extraction harness
        run: |
          cat > run_joomla_capture.py <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          checkout = Path(sys.argv[1]).resolve()
          revision = sys.argv[2]
          kind = sys.argv[3]
          work = Path(sys.argv[4]).resolve()
          entries = json.loads(sys.argv[5])
          work.mkdir(parents=True, exist_ok=True)
          dest = work / 'dest'
          dest.mkdir(parents=True, exist_ok=True)
          archive = work / 'payload.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_STORED) as zf:
              for name, content in entries.items():
                  zf.writestr(name, content)

          extractor_dir = checkout / 'administrator/components/com_joomlaupdate'
          password = 'v6-controlled-password-0123456789abcdef'
          update = extractor_dir / 'update.php'
          update.write_text(
              "<?php\n$extractionSetup = [\n"
              f"  'security.password' => '{password}',\n"
              f"  'setup.sourcepath' => {json.dumps(str(work))},\n"
              "  'setup.sourcefile' => 'payload.zip',\n"
              f"  'setup.destdir' => {json.dumps(str(dest))},\n"
              "];\n",
              encoding='utf-8',
          )
          wrapper = (
              "$_REQUEST = ['password' => " + json.dumps(password) + ", 'task' => 'startExtract']; "
              "include " + json.dumps(str(extractor_dir / 'extract.php')) + ";"
          )
          proc = subprocess.run(
              ['php', '-d', 'display_errors=0', '-r', wrapper],
              cwd=str(extractor_dir),
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              timeout=60,
              check=False,
          )
          update.unlink(missing_ok=True)
          stdout = proc.stdout.strip()
          try:
              response = json.loads(stdout)
          except Exception as exc:
              raise SystemExit(f'non-json extractor output: rc={proc.returncode} stdout={stdout!r} stderr={proc.stderr!r}: {exc}')
          if proc.returncode != 0:
              raise SystemExit(f'extractor failed: rc={proc.returncode} response={response!r} stderr={proc.stderr!r}')
          if response.get('status') is not True or response.get('done') is not True:
              raise SystemExit(f'extraction did not complete cleanly: {response!r}')

          observed = {}
          for name in entries:
              normalized = Path(name)
              candidate = (dest / normalized).resolve()
              observed[name] = {
                  'resolved_path': str(candidate),
                  'inside_destination': str(candidate).startswith(str(dest.resolve()) + os.sep) or candidate == dest.resolve(),
                  'exists_after_extraction': candidate.exists(),
                  'content': candidate.read_text(encoding='utf-8') if candidate.is_file() else None,
              }
          result = {
              'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'upstream_revision': revision,
              'case_kind': kind,
              'archive': {
                  'compression': 'stored',
                  'entries': list(entries),
                  'entry_contents': entries,
              },
              'request': {'task': 'startExtract', 'destination': str(dest), 'archive': str(archive)},
              'extractor_response': response,
              'stderr': proc.stderr.strip(),
              'filesystem_observations': observed,
          }
          Path(f'path-traversal-{kind.replace("_", "-")}.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Capture vulnerable escape on parent revision
        run: |
          python run_joomla_capture.py \
            joomla-vuln \
            d89141ffe22b2a7d97193a825085a287053761b7 \
            positive \
            /tmp/v6-joomla-positive \
            '{"../escape-positive.txt":"escaped-by-controlled-zip","safe/normal-positive.txt":"normal-positive"}'
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('path-traversal-positive.json').read_text())
          obs = value['filesystem_observations']['../escape-positive.txt']
          assert obs['inside_destination'] is False, obs
          assert obs['exists_after_extraction'] is True, obs
          assert obs['content'] == 'escaped-by-controlled-zip', obs
          assert value['filesystem_observations']['safe/normal-positive.txt']['exists_after_extraction'] is True
          PY

      - name: Capture patched rejection of escaping entry
        run: |
          python run_joomla_capture.py \
            joomla-patched \
            98ee218a642b8e795f13bc6eeb250bec5deee03e \
            secure_negative \
            /tmp/v6-joomla-secure \
            '{"../escape-secure.txt":"must-not-escape","safe/normal-secure.txt":"normal-secure"}'
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('path-traversal-secure-negative.json').read_text())
          escape = value['filesystem_observations']['../escape-secure.txt']
          safe = value['filesystem_observations']['safe/normal-secure.txt']
          assert escape['inside_destination'] is False
          assert escape['exists_after_extraction'] is False, escape
          assert safe['exists_after_extraction'] is True, safe
          PY

      - name: Capture patched near-miss path-like filename
        run: |
          python run_joomla_capture.py \
            joomla-patched \
            98ee218a642b8e795f13bc6eeb250bec5deee03e \
            near_miss \
            /tmp/v6-joomla-near \
            '{"safe/..hidden/file.txt":"near-miss-inside-root"}'
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('path-traversal-near-miss.json').read_text())
          obs = value['filesystem_observations']['safe/..hidden/file.txt']
          assert obs['inside_destination'] is True, obs
          assert obs['exists_after_extraction'] is True, obs
          assert obs['content'] == 'near-miss-inside-root'
          PY

      - name: Capture patched ordinary sparse control
        run: |
          python run_joomla_capture.py \
            joomla-patched \
            98ee218a642b8e795f13bc6eeb250bec5deee03e \
            sparse_noisy \
            /tmp/v6-joomla-sparse \
            '{"safe/ordinary.txt":"ordinary-inside-root"}'
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('path-traversal-sparse-noisy.json').read_text())
          obs = value['filesystem_observations']['safe/ordinary.txt']
          assert obs['inside_destination'] is True, obs
          assert obs['exists_after_extraction'] is True, obs
          assert obs['content'] == 'ordinary-inside-root'
          PY

      - name: Assert four distinct controlled outputs
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = sorted(Path('.').glob('path-traversal-*.json'))
          assert len(paths) == 4, paths
          hashes = {hashlib.sha256(path.read_bytes()).hexdigest() for path in paths}
          assert len(hashes) == 4, hashes
          for path in paths:
              value = json.loads(path.read_text())
              assert value['captured_at'].endswith('Z')
              assert value['extractor_response']['status'] is True
              assert value['extractor_response']['done'] is True
          PY

      - name: Upload controlled capture outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-631-path-traversal-captures
          path: path-traversal-*.json
          if-no-files-found: error
          retention-days: 7

  publish-evidence:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout recon repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download read-only capture job outputs
        uses: actions/download-artifact@v4
        with:
          name: analysis-631-path-traversal-captures
          path: captured
      - name: Build hash-bound evidence artifacts from actual filesystem observations
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v6_literal_capture_verify import _sha256_json

          family = 'path_traversal'
          source_root = 'GHSA-f3gp-9xr4-qmvc'
          source_project = 'joomla/joomla-cms'
          out = Path('benchmarks/raw/sources/v6_capture_evidence')
          out.mkdir(parents=True, exist_ok=True)
          configs = {
              'positive': {
                  'file': 'captured/path-traversal-positive.json',
                  'reference': 'https://github.com/joomla/joomla-cms/commit/d89141ffe22b2a7d97193a825085a287053761b7',
                  'basis': 'source_observation',
                  'signals': ['archive_entry_escape', 'base_directory_escape', 'path_escape_observed'],
                  'notes': 'Controlled local execution of the selected Joomla extractor parent revision extracted a ../ ZIP entry outside the configured destination root and preserved the controlled file contents.',
              },
              'secure_negative': {
                  'file': 'captured/path-traversal-secure-negative.json',
                  'reference': 'https://github.com/joomla/joomla-cms/commit/98ee218a642b8e795f13bc6eeb250bec5deee03e',
                  'basis': 'patched_control',
                  'signals': [],
                  'notes': 'Controlled local execution of the upstream Zip Slip fix skipped a ../ entry while still extracting an ordinary sibling entry inside the destination root.',
              },
              'near_miss': {
                  'file': 'captured/path-traversal-near-miss.json',
                  'reference': 'https://github.com/joomla/joomla-cms/commit/98ee218a642b8e795f13bc6eeb250bec5deee03e',
                  'basis': 'source_observation',
                  'signals': [],
                  'notes': 'Controlled local execution used a path-like ..hidden segment that is not a parent-directory segment; the patched extractor retained it inside the destination root.',
              },
              'sparse_noisy': {
                  'file': 'captured/path-traversal-sparse-noisy.json',
                  'reference': 'https://github.com/joomla/joomla-cms/commit/98ee218a642b8e795f13bc6eeb250bec5deee03e',
                  'basis': 'source_observation',
                  'signals': [],
                  'notes': 'Controlled local execution of an ordinary nested ZIP entry produced only in-root extraction evidence and no traversal condition.',
              },
          }
          for kind, cfg in configs.items():
              captured = json.loads(Path(cfg['file']).read_text(encoding='utf-8'))
              raw = {
                  'target': 'controlled-local-joomla-extractor',
                  'endpoint': 'administrator/components/com_joomlaupdate/extract.php',
                  'method': 'ZIP_EXTRACT',
                  'endpoint_schema': {'path_parameters': [], 'query_parameters': []},
                  'details': {
                      'literal_archive_extraction': {
                          'archive': captured['archive'],
                          'request': captured['request'],
                          'extractor_response': captured['extractor_response'],
                          'filesystem_observations': captured['filesystem_observations'],
                      },
                      'upstream_revision': captured['upstream_revision'],
                      'capture_environment': 'GitHub Actions isolated controlled upstream checkout',
                  },
              }
              evidence = {
                  'schema_version': '1.0',
                  'family': family,
                  'case_kind': kind,
                  'source_root': source_root,
                  'source_project': source_project,
                  'captured_at': captured['captured_at'],
                  'capture_reference': cfg['reference'],
                  'capture_method': 'repository_test_fixture',
                  'collector': {
                      'tool': 'Joomla upstream extract.php controlled ZIP reproduction',
                      'command': 'php -d display_errors=0 -r <controlled request wrapper>',
                      'source_file': 'administrator/components/com_joomlaupdate/extract.php',
                  },
                  'source_snapshot': {
                      'reference': cfg['reference'],
                      'retrieved_at': captured['captured_at'],
                      'payload': captured,
                      'content_sha256': _sha256_json(captured),
                  },
                  'adjudication': {
                      'basis': cfg['basis'],
                      'notes': cfg['notes'],
                      'expected_condition_signals': cfg['signals'],
                      'detector_output_used': False,
                      'admission_output_used': False,
                      'ranking_output_used': False,
                  },
                  'raw': raw,
                  'raw_sha256': _sha256_json(raw),
              }
              path = out / f'path-traversal--{kind.replace("_", "-")}.json'
              path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Refresh plan and strict-check all partial evidence
        env:
          PYTHONPATH: app
        run: |
          python app/v6_literal_capture_plan.py
          python app/v6_literal_partial_verify.py
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('benchmarks/raw/sources/v6_literal_capture_plan.json').read_text())
          assert plan['evidence_present_count'] == 8, plan['evidence_present_count']
          assert plan['evidence_missing_count'] == 136, plan['evidence_missing_count']
          PY
      - name: Commit second real Analysis 6.31 evidence family
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_capture_evidence/path-traversal--*.json \
                  benchmarks/raw/sources/v6_literal_capture_plan.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture real Analysis 6.31 path traversal evidence'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
