name: One-time Python compatibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Python 3.10/3.11 incompatible nested f-string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('app/dashboard.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = False
          for index, line in enumerate(lines):
              if "details=_json(r['details_json'],{}); cards.append(f" in line and "event_count" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index:index + 1] = [
                      indent + "details = _json(r['details_json'], {})",
                      indent + "summary = details.get(\"summary\", \"\")",
                      indent + "summary_html = f\"<p class='muted'>{_esc(summary)}</p>\" if summary else \"\"",
                      indent + "cards.append(f\"<article class='card'><div style='display:flex;justify-content:space-between;gap:10px'><div>{_pill(r['severity'])} {_pill(r['status'])}</div><strong class='tone-{_tone(r['severity'])}'>{r['risk_score']}</strong></div><h3 style='margin-top:14px'>{_esc(r['title'])}</h3><div class='queue-meta'><span>{_esc(r['target'])}</span><span>{r['event_count']} events</span><span>{_esc(r['last_seen'])}</span></div>{summary_html}</article>\")",
                  ]
                  changed = True
                  break
          if changed:
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = Path('MANIFEST.sha256')
          mlines = manifest.read_text(encoding='utf-8').splitlines()
          replaced = False
          for i, item in enumerate(mlines):
              if item.endswith('  app/dashboard.py'):
                  mlines[i] = f'{digest}  app/dashboard.py'
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('app/dashboard.py is missing from MANIFEST.sha256')
          manifest.write_text('\n'.join(mlines) + '\n', encoding='utf-8')
          PY

      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Compatibility fix already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard.py MANIFEST.sha256
          git commit -m 'Fix Python 3.10 and 3.11 dashboard compatibility'
          git push origin HEAD:main
