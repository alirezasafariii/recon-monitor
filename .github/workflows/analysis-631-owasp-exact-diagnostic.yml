name: Analysis 6.31 OWASP Exact Diagnostic

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_owasp_exact_overrides.json
      - benchmarks/raw/sources/v6_owasp_writeup_candidates.json
      - benchmarks/raw/sources/v6_owasp_writeup_grounding.json
      - .github/workflows/analysis-631-owasp-exact-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose all hard-family sources
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v6_source_firewall import canonical_url, exposure_index

          src=Path('benchmarks/raw/sources')
          grounding=json.loads((src/'v6_owasp_writeup_grounding.json').read_text())
          manual=json.loads((src/'v6_owasp_writeup_candidates.json').read_text())
          exact=json.loads((src/'v6_owasp_exact_overrides.json').read_text())
          hard=set(grounding['families'])
          pinned={'dom_xss','sensitive_business_flow_abuse'}
          # Family-level WSTG/OWASP semantic boundaries. These deliberately use
          # multiple equivalent phrases instead of wording from a single advisory.
          contracts={
            'business_logic':(
              ('business logic','business workflow','approval workflow','workflow'),
              ('invariant','gate','required approver','state transition','approval'),
              ('bypass','self-approve','skip','invalid state transition','incorrect transition','untrusted accepted'),
            ),
            'cors_misconfiguration':(
              ('cors','cross-origin'),
              ('origin','untrusted origin','origin restriction','trusted origin'),
              ('credential','sensitive','state-changing','data'),
            ),
            'dom_xss':(
              ('dom xss','client-side'),
              ('svg','render','browser','sink'),
              ('sanit','bypass'),
            ),
            'graphql_data_exposure':(
              ('graphql','shop api'),
              ('sensitive','non-public','private','restricted','data exposure'),
              ('field','entity','query','scope','filter','property'),
            ),
            'improper_inventory_management':(
              ('old api','older arm api','legacy api'),
              ('version','api'),
              ('still exploitable','weaker authorization','version drift'),
            ),
            'nosql_injection':(
              ('nosql','mongodb','mongo'),
              ('query','operator','filter','selector'),
              ('inject','injection','unvalidated','alter','semantics','unintended'),
            ),
            'postmessage_trust':(
              ('postmessage','message event'),
              ('origin','iframe source','sender'),
              ('validation','trust','correct iframe'),
            ),
            'sensitive_business_flow_abuse':(
              ('invite','business'),
              ('duplicate','flood','repeat'),
              ('rate limit','anti-abuse','frequency'),
            ),
            'sensitive_caching':(
              ('cache','cached'),
              ('api key','sensitive','authenticated'),
              ('shared cache','unauthenticated cache hit','edge'),
            ),
            'software_supply_chain_failure':(
              ('supply chain','dependency'),
              ('compromised','malicious'),
              ('package','installation','published'),
            ),
          }
          prior=exposure_index()
          results={}; passing=[]; failing=[]
          for family in sorted(hard):
              pool=manual if family in pinned else exact
              rows=(pool.get('candidates_by_family') or {}).get(family) or []
              errors=[]; row=dict(rows[0]) if len(rows)==1 else {}
              if len(rows)!=1:
                  errors.append(f'candidate_count={len(rows)}')
              text=' '.join([str(row.get('summary') or ''),str(row.get('description') or ''),*[str(v) for v in row.get('semantic_facts') or []]]).lower()
              hits=[]
              for group in contracts[family]:
                  gh=sorted(term for term in group if term in text); hits.append(gh)
                  if not gh: errors.append('semantic:'+repr(group))
              required=set(grounding['families'][family]['wstg_ids']); supplied=set(row.get('wstg_ids') or [])
              if not supplied or not supplied.issubset(required): errors.append('wstg_mismatch')
              root=str(row.get('source_root') or '').strip(); project=str(row.get('source_project') or '').strip()
              urls={canonical_url(row.get('canonical_advisory_url')),canonical_url(row.get('repository_advisory_url')),canonical_url(row.get('source_code_location')),canonical_url(row.get('source_url'))}
              urls.update(canonical_url(v) for v in row.get('references') or []); urls.discard('')
              fw={'root_overlap':root in prior['roots'],'project_overlap':project in prior['projects'],'url_overlap':sorted(urls & prior['urls'])}
              if not root or not project: errors.append('missing_identity')
              if fw['root_overlap']: errors.append('root_overlap')
              if fw['project_overlap']: errors.append('project_overlap')
              if fw['url_overlap']: errors.append('url_overlap')
              passed=not errors
              results[family]={'passed':passed,'source_root':root,'source_project':project,'wstg_ids':sorted(supplied),'semantic_group_hits':hits,'firewall':fw,'errors':errors}
              (passing if passed else failing).append(family)
          report={'version':'1.1.0','rule_version':'2026.08.14.6.31','evaluation_kind':'fresh_blind_v6_pre_score_hard_source_diagnostic','scoring_executed':False,'grounding_counts_as_target_evidence':False,'passed_family_count':len(passing),'failed_family_count':len(failing),'passing_families':passing,'failing_families':failing,'results':results}
          (src/'v6_owasp_exact_validation_diagnostic.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'passed_family_count':len(passing),'failed_family_count':len(failing),'passing_families':passing,'failing_families':failing,'results':results},indent=2,sort_keys=True))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_owasp_exact_validation_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record OWASP-grounded v6 hard-source diagnostic'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
