name: Analysis 6.31 Source Selection

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_candidates.json
      - app/v6_benchmark_source_selection.py
      - .github/workflows/analysis-631-source-selection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select 36 independent v6 sources
        env:
          PYTHONPATH: app
        run: python app/v6_benchmark_source_selection.py

      - name: Verify shortlist contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('benchmarks/raw/sources/v6_shortlist.json').read_text())
          assert data['selection_executes_scoring'] is False
          assert data['selection_uses_detector_output'] is False
          assert data['selection_uses_admission_results'] is False
          assert data['selection_uses_ranking_results'] is False
          assert data['family_count'] == 36
          assert data['unique_root_count'] == 36
          assert data['unique_project_count'] == 36
          assert data['firewall']['passed'] is True
          print({
              'family_count': data['family_count'],
              'unique_root_count': data['unique_root_count'],
              'unique_project_count': data['unique_project_count'],
          })
          PY

      - name: Commit v6 shortlist
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_shortlist.json
          if git diff --cached --quiet; then
            echo 'No shortlist change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Select 36 independent Analysis 6.31 v6 sources'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
