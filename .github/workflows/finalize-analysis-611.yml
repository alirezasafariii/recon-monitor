name: Finalize Analysis 6.11 Blind Raw Benchmark

on:
  push:
    branches:
      - agent/analysis-engine-6.11-blind-raw-recon-benchmark

permissions:
  contents: write

env:
  PYTHONPATH: app

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.11-blind-raw-recon-benchmark
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and focused Analysis 6.11 tests
        run: |
          python -m py_compile app/raw_recon_corpus.py app/raw_recon_benchmark.py
          python tests/test_raw_recon_benchmark_v6110.py
      - name: Detector stack regressions
        run: |
          python tests/test_detector_execution_intelligence_v6100.py
          python tests/test_physical_family_detectors_v690.py
          python tests/test_family_evidence_extractors_v680.py
          python tests/test_family_reasoners_v670.py
          python tests/test_family_confusion_matrix_v670.py
          python tests/test_analysis_ranking_v650.py
          python tests/test_analysis_coverage_v610.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Golden v3 regression
        run: python -m analysis_benchmark --corpus benchmarks/golden/analysis_golden_v3.jsonl --strict
      - name: Integration
        run: python tests/integration_runner.py
      - name: Verify freeze, consumed seal, report consistency, and corpus hash without rescoring raw v1
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from raw_recon_benchmark import verify_freeze
          from raw_recon_corpus import load_raw_cases, validate_raw_corpus

          manifest_path=Path('benchmarks/raw/splits/v1.json')
          corpus_path=Path('benchmarks/raw/analysis_raw_v1.jsonl')
          report_path=Path('benchmarks/raw/reports/analysis_raw_v1_postfreeze_report.json')
          m=json.loads(manifest_path.read_text())
          r=json.loads(report_path.read_text())
          freeze=verify_freeze(manifest_path)
          assert freeze['passed'], freeze
          assert m['evaluation_status']=='evaluated_once_consumed'
          assert m['seal']['scored'] is True
          assert m['first_and_only_fresh_evaluation']['run_id']=='31445225324'
          assert r['evaluation_status_at_start']=='sealed_unscored'
          assert r['quality_gate']['passed'] is False
          assert m['first_and_only_fresh_evaluation']['quality_gate_passed'] is False
          assert r['metrics']==m['first_and_only_fresh_evaluation']['metrics']
          assert hashlib.sha256(corpus_path.read_bytes()).hexdigest()==m['corpus']['sha256']
          cases=load_raw_cases(corpus_path)
          validation=validate_raw_corpus(cases)
          assert validation['passed'], validation
          assert len(cases)==96
          assert m['corpus']['source_root_count']==24
          assert m['corpus']['source_project_count']==24
          assert m['corpus']['positive_family_count']==20
          print(json.dumps({'freeze':freeze,'metrics':r['metrics'],'quality_gate':r['quality_gate'],'corpus_validation':validation},indent=2))
          PY
      - name: Verify workflow cleanup target and source hygiene
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)" || true
          test -z "$(find . -type f -name '*.jsonl' ! -path './benchmarks/golden/*' ! -path './benchmarks/raw/*' -print -quit)"
      - name: Remove finalizer and regenerate tracked-source manifest
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-analysis-611.yml
          git ls-files | grep -v '^MANIFEST.sha256$' | while IFS= read -r path; do sha256sum "$path"; done > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "ci.yml "
          git add MANIFEST.sha256
          git commit -m 'Finalize Analysis 6.11 blind raw benchmark'
          git push
