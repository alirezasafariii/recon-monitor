name: Analysis 6.17 Seal One-Shot

on:
  push:
    branches:
      - agent/analysis-engine-6.17-authorization-raw-collectors

permissions:
  contents: write

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.17-authorization-raw-collectors
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Relax stale historical version pins
        run: python scripts/analysis_617_fix_stale_version_tests.py

      - name: Apply deterministic Analysis 6.17 seal
        run: python scripts/analysis_617_seal.py

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Analysis 6.17 seal contract
        run: python -m unittest discover -s tests -p 'test_analysis_617_seal.py' -q

      - name: Authorization collector contract
        run: python -m unittest discover -s tests -p 'test_physical_raw_collector_authorization_v6170.py' -q

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit validated Analysis 6.17 seal and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-617-seal-one-shot.yml scripts/analysis_617_seal.py scripts/analysis_617_fix_stale_version_tests.py
          git add MANIFEST.sha256 app/analysis_engine.py app/bug_candidates.py app/security_reasoning.py tests/test_physical_raw_collector_injection_v6160.py tests/test_analysis_coverage_v610.py tests/test_analysis_ranking_v650.py tests/test_raw_precision_calibration_v6140.py tests/test_analysis_617_seal.py docs/ANALYSIS_ENGINE_6_17_SEAL.md
          git diff --cached --check
          git commit -m "Seal Analysis 6.17 authorization raw collectors"
          git push origin HEAD:agent/analysis-engine-6.17-authorization-raw-collectors
