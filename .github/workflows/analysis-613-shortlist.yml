name: Analysis 6.13 Source Shortlist

on:
  push:
    branches:
      - agent/analysis-engine-6.13-fresh-raw-holdout-v2

permissions:
  contents: write

jobs:
  shortlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.13-fresh-raw-holdout-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sealed unscored protocol
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          from raw_recon_v2_benchmark import verify_v2_freeze
          r=verify_v2_freeze(); assert r['passed'], r
          assert r['manifest']['evaluation_status']=='protocol_sealed_collection_open'
          assert r['manifest']['seal']['scored'] is False
          PY
      - name: Build deterministic source shortlist without scoring
        env:
          PYTHONPATH: app
        run: |
          python app/raw_recon_v2_shortlist.py --target-roots 24
      - name: Cleanup and regenerate manifest
        shell: bash
        run: |
          rm -f .github/workflows/analysis-613-shortlist.yml
          tmp="$(mktemp)"
          git ls-files | grep -v '^MANIFEST.sha256$' | while IFS= read -r f; do
            if [[ -f "$f" ]]; then sha256sum "$f"; fi
          done | sort -k2 > "$tmp"
          mv "$tmp" MANIFEST.sha256
          sha256sum -c MANIFEST.sha256 >/dev/null
      - name: Commit shortlist
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Select Analysis 6.13 raw v2 primary-source shortlist'
          git push origin HEAD:agent/analysis-engine-6.13-fresh-raw-holdout-v2
