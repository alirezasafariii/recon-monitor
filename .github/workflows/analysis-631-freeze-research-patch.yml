name: Analysis 6.31 Freeze Research Surface Patch

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-freeze-research-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add passive research artifacts to corpus freeze protection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/analysis-631-corpus-freeze.yml')
          text = path.read_text(encoding='utf-8')
          anchors = {
              "            'benchmarks/raw/sources/v6_literal_capture_plan.json',\n": "            'benchmarks/raw/sources/v6_literal_capture_plan.json',\n            'benchmarks/raw/sources/v6_literal_source_research.json',\n",
              "            'app/v6_literal_capture_plan.py',\n": "            'app/v6_literal_capture_plan.py',\n            'app/v6_literal_source_research.py',\n",
              "            '.github/workflows/analysis-631-literal-capture-plan.yml',\n": "            '.github/workflows/analysis-631-literal-capture-plan.yml',\n            '.github/workflows/analysis-631-literal-source-research.yml',\n",
          }
          for needle, replacement in anchors.items():
              if replacement.splitlines()[1].strip() in text:
                  continue
              if needle not in text:
                  raise SystemExit(f'freeze anchor missing: {needle!r}')
              text = text.replace(needle, replacement, 1)
          text = text.replace("'version': '1.7.0'", "'version': '1.8.0'")
          text = text.replace("'rule_version': '2026.08.14.6.31.9'", "'rule_version': '2026.08.14.6.31.11'")
          text = text.replace('source inputs, capture acquisition plan, evidence-only ingest,', 'source inputs, sealed passive source research, capture acquisition plan, evidence-only ingest,')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Assert research surface is freeze-protected
        run: |
          grep -F "'benchmarks/raw/sources/v6_literal_source_research.json'" .github/workflows/analysis-631-corpus-freeze.yml
          grep -F "'app/v6_literal_source_research.py'" .github/workflows/analysis-631-corpus-freeze.yml
          grep -F "'.github/workflows/analysis-631-literal-source-research.yml'" .github/workflows/analysis-631-corpus-freeze.yml

      - name: Commit freeze-surface hardening
        run: |
          set -euo pipefail
          git add .github/workflows/analysis-631-corpus-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Protect Analysis 6.31 passive source research in corpus freeze'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
