name: Temporary Evidence Adapter Verify

on:
  push:
    branches: [feat/evidence-adapter-20260914]
    paths: ['.github/workflows/tmp-evidence-adapter-verify.yml']

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-adapter-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle typed signals by evidence root
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          adapter = Path('app/typed_evidence_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          start = text.index('def _persist_evidence(')
          end = text.index('\n\ndef adapt_validation_runner_execution(', start)
          replacement = '''def _persist_evidence(
              db: Database,
              *,
              execution: Mapping[str, Any],
              hypothesis: Mapping[str, Any],
              items: list[dict[str, Any]],
          ) -> dict[str, str]:
              """Persist at most one Evidence Record per execution root and polarity.

              ``evidence_records`` intentionally has a unique (analysis_id, root_fingerprint,
              polarity) contract. Typed signal granularity belongs in hypothesis evidence;
              the evidence record is the provenance root that prevents one execution from
              masquerading as several independent sources.
              """

              now = utc_now()
              execution_id = str(execution.get("execution_id") or "")
              root = sha256_text(
                  "|".join(
                      [
                          "typed-validation-root",
                          execution_id,
                          str(execution.get("family") or ""),
                          str(execution.get("target") or ""),
                      ]
                  )
              )
              grouped: dict[str, list[dict[str, Any]]] = {}
              for item in items:
                  polarity = str(item.get("polarity") or "support")
                  grouped.setdefault(polarity, []).append(item)

              evidence_by_polarity: dict[str, str] = {}
              for polarity, group in sorted(grouped.items()):
                  signal_types = sorted({str(item.get("type") or "") for item in group if str(item.get("type") or "")})
                  observations = sorted(
                      [
                          {
                              "sequence": int(item.get("observation_sequence") or 0),
                              "type": str(item.get("type") or ""),
                              "observed_at": str(item.get("observed_at") or ""),
                              "url": str(item.get("url") or ""),
                              "method": str(item.get("method") or ""),
                          }
                          for item in group
                      ],
                      key=lambda item: (item["sequence"], item["type"], item["url"]),
                  )
                  canonical = {
                      "execution_id": execution_id,
                      "family": str(execution.get("family") or ""),
                      "polarity": polarity,
                      "signal_types": signal_types,
                      "observations": observations,
                      "rule_version": TYPED_EVIDENCE_ADAPTER_RULE_VERSION,
                  }
                  integrity = sha256_text(json_dumps(canonical))
                  evidence_id = "EVD-" + integrity[:16].upper()
                  observed_values = [str(item.get("observed_at") or "") for item in group if str(item.get("observed_at") or "")]
                  first_seen = min(observed_values) if observed_values else now
                  last_seen = max(observed_values) if observed_values else now
                  direct = any(str(item.get("type") or "") in _DIRECT_TYPES for item in group)
                  evidence_type = signal_types[0] if len(signal_types) == 1 else "typed_validation_bundle"
                  summary = (
                      f"Typed passive-live {polarity} evidence from one approved execution root: "
                      + ", ".join(signal_types)
                  )[:2000]
                  db.execute(
                      """INSERT OR IGNORE INTO evidence_records(
                      evidence_id,analysis_id,source_run_id,target,evidence_type,polarity,source_kind,source_tool,source_artifact,
                      parser_name,parser_version,source_group,root_fingerprint,trust_score,observation_quality,directness,summary,
                      raw_reference,integrity_hash,first_seen,last_seen,created_at
                      ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                      (
                          evidence_id,
                          str(hypothesis.get("analysis_id") or ""),
                          str(hypothesis.get("source_run_id") or ""),
                          str(hypothesis.get("target") or ""),
                          evidence_type,
                          polarity,
                          "passive_live_validation",
                          "validation_runner",
                          "validation-runner-executions.jsonl",
                          "typed_evidence_adapter",
                          TYPED_EVIDENCE_ADAPTER_VERSION,
                          f"validation_execution:{execution_id}",
                          root,
                          ADAPTER_TRUST_SCORE_CEILING,
                          ADAPTER_OBSERVATION_QUALITY_CEILING,
                          "direct" if direct else "contextual",
                          summary,
                          f"validation_execution:{execution_id}",
                          integrity,
                          first_seen,
                          last_seen,
                          now,
                      ),
                  )
                  stored = db.one(
                      "SELECT evidence_id,integrity_hash FROM evidence_records WHERE analysis_id=? AND root_fingerprint=? AND polarity=?",
                      (str(hypothesis.get("analysis_id") or ""), root, polarity),
                  )
                  if not stored or str(stored["integrity_hash"] or "") != integrity:
                      raise ReconError("Typed evidence root collision or mutable evidence detected")
                  evidence_by_polarity[polarity] = str(stored["evidence_id"] or evidence_id)
                  db.execute("UPDATE evidence_records SET last_seen=? WHERE evidence_id=?", (now, evidence_by_polarity[polarity]))
              return evidence_by_polarity
          '''
          # De-indent the embedded function from YAML/Python source indentation.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          text = text[:start] + replacement + text[end:]

          old_call = '''        evidence_ids = _persist_evidence(
              db,
              execution=execution,
              hypothesis=hypothesis,
              items=all_items,
          )
          '''
          old_call = '\n'.join(line[4:] if line.startswith('    ') else line for line in old_call.splitlines()) + '\n'
          new_call = '''        evidence_by_polarity = _persist_evidence(
              db,
              execution=execution,
              hypothesis=hypothesis,
              items=all_items,
          )
              evidence_ids = list(evidence_by_polarity.values())
          '''
          new_call = '\n'.join(line[4:] if line.startswith('    ') else line for line in new_call.splitlines()) + '\n'
          if old_call not in text:
              raise SystemExit('evidence persistence call not found')
          text = text.replace(old_call, new_call, 1)

          link_marker = '        if candidate_id:\n            by_id = {evidence_id: item for evidence_id, item in zip(evidence_ids, all_items)}'
          link_start = text.index(link_marker)
          link_end = text.index('\n\n        status = "applied" if all_items else "no_typed_signal"', link_start)
          link = '''        if candidate_id:
              for polarity, evidence_id in sorted(evidence_by_polarity.items()):
                  rooted_items = [
                      item for item in all_items
                      if str(item.get("polarity") or "support") == polarity
                  ]
                  max_weight = max(
                      [abs(int(item.get("weight") or 1)) for item in rooted_items],
                      default=1,
                  )
                  db.execute(
                      "INSERT OR REPLACE INTO candidate_evidence_links(candidate_id,evidence_id,polarity,weight,relation,created_at) VALUES(?,?,?,?,?,?)",
                      (
                          candidate_id,
                          evidence_id,
                          polarity,
                          max(1, min(100, max_weight)),
                          "typed_validation_adapter",
                          utc_now(),
                      ),
                  )
          '''
          link = '\n'.join(line[4:] if line.startswith('    ') else line for line in link.splitlines())
          text = text[:link_start] + link + text[link_end:]
          adapter.write_text(text, encoding='utf-8')

          test = Path('tests/test_typed_evidence_adapter.py')
          test_text = test.read_text(encoding='utf-8')
          old = '''        evidence = self.fx.db.one(
              "SELECT evidence_type,root_fingerprint FROM evidence_records "
              "WHERE source_kind='passive_live_validation' AND evidence_type='untrusted_origin_allowed'"
          )
              self.assertIsNotNone(evidence)
          '''
          old = '\n'.join(line[4:] if line.startswith('    ') else line for line in old.splitlines()) + '\n'
          new = '''        evidence = self.fx.db.one(
              "SELECT evidence_type,root_fingerprint,summary FROM evidence_records "
              "WHERE source_kind='passive_live_validation' AND polarity='support'"
          )
              self.assertIsNotNone(evidence)
              self.assertIn("untrusted_origin_allowed", str(evidence["summary"]))
          '''
          new = '\n'.join(line[4:] if line.startswith('    ') else line for line in new.splitlines()) + '\n'
          if old not in test_text:
              raise SystemExit('test evidence assertion block not found')
          test.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile adapter and CLI
        run: python -m py_compile app/typed_evidence_adapter.py app/recon_monitor.py tests/test_typed_evidence_adapter.py
      - name: Run typed evidence adapter regressions
        run: python tests/test_typed_evidence_adapter.py -v
      - name: Verify release metadata remains consistent
        run: python tools/check_release_consistency.py
      - name: Finalize branch hygiene and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          paths = [
              'app/recon_monitor.py',
              'app/typed_evidence_adapter.py',
              'docs/TYPED_EVIDENCE_ADAPTER.md',
              'tests/test_typed_evidence_adapter.py',
          ]
          existing = manifest.read_text(encoding='utf-8').splitlines()
          replacements = {}
          for rel in paths:
              digest = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              replacements[rel] = f'{digest}  {rel}'
          out = []
          seen = set()
          for line in existing:
              parts = line.split('  ', 1)
              rel = parts[1] if len(parts) == 2 else ''
              if rel in replacements:
                  out.append(replacements[rel])
                  seen.add(rel)
              else:
                  out.append(line)
          for rel in paths:
              if rel not in seen:
                  out.append(replacements[rel])
          manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          git rm -f .github/workflows/tmp-evidence-adapter-patch.yml .github/workflows/tmp-evidence-adapter-verify.yml
          sha256sum --strict -c MANIFEST.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/typed_evidence_adapter.py tests/test_typed_evidence_adapter.py MANIFEST.sha256
          git commit -m 'fix: preserve one evidence root per validation execution'
          git push
