name: Temporary Evidence Adapter Verify

on:
  push:
    branches: [feat/evidence-adapter-20260914]
    paths: ['.github/workflows/tmp-evidence-adapter-verify.yml']

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-adapter-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle typed signals by evidence root
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          adapter = Path('app/typed_evidence_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          start = text.index('def _persist_evidence(')
          end = text.index('\n\ndef adapt_validation_runner_execution(', start)
          replacement = '''def _persist_evidence(\n    db: Database,\n    *,\n    execution: Mapping[str, Any],\n    hypothesis: Mapping[str, Any],\n    items: list[dict[str, Any]],\n) -> dict[str, str]:\n    """Persist at most one Evidence Record per execution root and polarity.\n\n    ``evidence_records`` intentionally has a unique (analysis_id, root_fingerprint,\n    polarity) contract. Typed signal granularity belongs in hypothesis evidence;\n    the evidence record is the provenance root that prevents one execution from\n    masquerading as several independent sources.\n    """\n\n    now = utc_now()\n    execution_id = str(execution.get("execution_id") or "")\n    root = sha256_text(\n        "|".join(\n            [\n                "typed-validation-root",\n                execution_id,\n                str(execution.get("family") or ""),\n                str(execution.get("target") or ""),\n            ]\n        )\n    )\n    grouped: dict[str, list[dict[str, Any]]] = {}\n    for item in items:\n        polarity = str(item.get("polarity") or "support")\n        grouped.setdefault(polarity, []).append(item)\n\n    evidence_by_polarity: dict[str, str] = {}\n    for polarity, group in sorted(grouped.items()):\n        signal_types = sorted({str(item.get("type") or "") for item in group if str(item.get("type") or "")})\n        observations = sorted(\n            [\n                {\n                    "sequence": int(item.get("observation_sequence") or 0),\n                    "type": str(item.get("type") or ""),\n                    "observed_at": str(item.get("observed_at") or ""),\n                    "url": str(item.get("url") or ""),\n                    "method": str(item.get("method") or ""),\n                }\n                for item in group\n            ],\n            key=lambda item: (item["sequence"], item["type"], item["url"]),\n        )\n        canonical = {\n            "execution_id": execution_id,\n            "family": str(execution.get("family") or ""),\n            "polarity": polarity,\n            "signal_types": signal_types,\n            "observations": observations,\n            "rule_version": TYPED_EVIDENCE_ADAPTER_RULE_VERSION,\n        }\n        integrity = sha256_text(json_dumps(canonical))\n        evidence_id = "EVD-" + integrity[:16].upper()\n        evidence_by_polarity[polarity] = evidence_id\n        observed_values = [str(item.get("observed_at") or "") for item in group if str(item.get("observed_at") or "")]\n        first_seen = min(observed_values) if observed_values else now\n        last_seen = max(observed_values) if observed_values else now\n        direct = any(str(item.get("type") or "") in _DIRECT_TYPES for item in group)\n        evidence_type = signal_types[0] if len(signal_types) == 1 else "typed_validation_bundle"\n        summary = (\n            f"Typed passive-live {polarity} evidence from one approved execution root: "\n            + ", ".join(signal_types)\n        )[:2000]\n        db.execute(\n            """INSERT OR IGNORE INTO evidence_records(\n            evidence_id,analysis_id,source_run_id,target,evidence_type,polarity,source_kind,source_tool,source_artifact,\n            parser_name,parser_version,source_group,root_fingerprint,trust_score,observation_quality,directness,summary,\n            raw_reference,integrity_hash,first_seen,last_seen,created_at\n            ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",\n            (\n                evidence_id,\n                str(hypothesis.get("analysis_id") or ""),\n                str(hypothesis.get("source_run_id") or ""),\n                str(hypothesis.get("target") or ""),\n                evidence_type,\n                polarity,\n                "passive_live_validation",\n                "validation_runner",\n                "validation-runner-executions.jsonl",\n                "typed_evidence_adapter",\n                TYPED_EVIDENCE_ADAPTER_VERSION,\n                f"validation_execution:{execution_id}",\n                root,\n                ADAPTER_TRUST_SCORE_CEILING,\n                ADAPTER_OBSERVATION_QUALITY_CEILING,\n                "direct" if direct else "contextual",\n                summary,\n                f"validation_execution:{execution_id}",\n                integrity,\n                first_seen,\n                last_seen,\n                now,\n            ),\n        )\n        stored = db.one(\n            "SELECT evidence_id,integrity_hash FROM evidence_records WHERE analysis_id=? AND root_fingerprint=? AND polarity=?",\n            (str(hypothesis.get("analysis_id") or ""), root, polarity),\n        )\n        if not stored or str(stored["integrity_hash"] or "") != integrity:\n            raise ReconError("Typed evidence root collision or mutable evidence detected")\n        evidence_by_polarity[polarity] = str(stored["evidence_id"] or evidence_id)\n        db.execute("UPDATE evidence_records SET last_seen=? WHERE evidence_id=?", (now, evidence_by_polarity[polarity]))\n    return evidence_by_polarity\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(\n              '''        evidence_ids = _persist_evidence(\n            db,\n            execution=execution,\n            hypothesis=hypothesis,\n            items=all_items,\n        )\n''',\n              '''        evidence_by_polarity = _persist_evidence(\n            db,\n            execution=execution,\n            hypothesis=hypothesis,\n            items=all_items,\n        )\n        evidence_ids = list(evidence_by_polarity.values())\n''',\n              1,\n          )
          link_start = text.index('        if candidate_id:\n            by_id = {evidence_id: item for evidence_id, item in zip(evidence_ids, all_items)}')
          link_end = text.index('\n\n        status = "applied" if all_items else "no_typed_signal"', link_start)
          link = '''        if candidate_id:\n            for polarity, evidence_id in sorted(evidence_by_polarity.items()):\n                rooted_items = [\n                    item for item in all_items\n                    if str(item.get("polarity") or "support") == polarity\n                ]\n                max_weight = max(\n                    [abs(int(item.get("weight") or 1)) for item in rooted_items],\n                    default=1,\n                )\n                db.execute(\n                    "INSERT OR REPLACE INTO candidate_evidence_links(candidate_id,evidence_id,polarity,weight,relation,created_at) VALUES(?,?,?,?,?,?)",\n                    (\n                        candidate_id,\n                        evidence_id,\n                        polarity,\n                        max(1, min(100, max_weight)),\n                        "typed_validation_adapter",\n                        utc_now(),\n                    ),\n                )\n'''
          text = text[:link_start] + link + text[link_end:]
          adapter.write_text(text, encoding='utf-8')

          test = Path('tests/test_typed_evidence_adapter.py')
          test_text = test.read_text(encoding='utf-8')
          old = '''        evidence = self.fx.db.one(\n            "SELECT evidence_type,root_fingerprint FROM evidence_records "\n            "WHERE source_kind='passive_live_validation' AND evidence_type='untrusted_origin_allowed'"\n        )\n        self.assertIsNotNone(evidence)\n'''
          new = '''        evidence = self.fx.db.one(\n            "SELECT evidence_type,root_fingerprint,summary FROM evidence_records "\n            "WHERE source_kind='passive_live_validation' AND polarity='support'"\n        )\n        self.assertIsNotNone(evidence)\n        self.assertIn("untrusted_origin_allowed", str(evidence["summary"]))\n'''
          if old not in test_text:\n              raise SystemExit('test evidence assertion block not found')\n          test.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile adapter and CLI
        run: python -m py_compile app/typed_evidence_adapter.py app/recon_monitor.py tests/test_typed_evidence_adapter.py
      - name: Run typed evidence adapter regressions
        run: python tests/test_typed_evidence_adapter.py -v
      - name: Verify release metadata remains consistent
        run: python tools/check_release_consistency.py
      - name: Finalize branch hygiene and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          paths = [
              'app/recon_monitor.py',
              'app/typed_evidence_adapter.py',
              'docs/TYPED_EVIDENCE_ADAPTER.md',
              'tests/test_typed_evidence_adapter.py',
          ]
          existing = manifest.read_text(encoding='utf-8').splitlines()
          replacements = {}
          for rel in paths:
              digest = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              replacements[rel] = f'{digest}  {rel}'
          out = []
          seen = set()
          for line in existing:
              parts = line.split('  ', 1)
              rel = parts[1] if len(parts) == 2 else ''
              if rel in replacements:
                  out.append(replacements[rel])
                  seen.add(rel)
              else:
                  out.append(line)
          for rel in paths:
              if rel not in seen:
                  out.append(replacements[rel])
          manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          git rm -f .github/workflows/tmp-evidence-adapter-patch.yml .github/workflows/tmp-evidence-adapter-verify.yml
          sha256sum --strict -c MANIFEST.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/typed_evidence_adapter.py tests/test_typed_evidence_adapter.py MANIFEST.sha256
          git commit -m 'fix: preserve one evidence root per validation execution'
          git push
