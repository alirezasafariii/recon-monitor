name: Approved Analysis 6.31 First Blind Run Once

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - '.github/workflows/approved-first-blind-run-once.yml'

permissions:
  contents: write

concurrency:
  group: approved-analysis-631-first-blind-once
  cancel-in-progress: false

jobs:
  first-blind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved branch state
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.31-fresh-blind-v6-validation
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require frozen canonical corpus and evaluator
        env:
          PYTHONPATH: app
        run: python app/v6_freeze_verify.py --require-freeze --require-evaluator-frozen

      - name: Prove no prior First Blind consumption
        shell: bash
        run: |
          set -euo pipefail
          test ! -e benchmarks/raw/sources/v6_first_blind_consumption.json
          test ! -e benchmarks/raw/results/analysis_raw_v6_first_blind.json

      - name: Authorize single First Blind consumption
        env:
          PYTHONPATH: app
        run: |
          python app/v6_first_blind_consume.py authorize \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Persist authorization before scoring
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_first_blind_consumption.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Authorize single Analysis 6.31 First Blind consumption'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation

      - name: Execute canonical First Blind once
        id: first_blind
        env:
          PYTHONPATH: app
        run: |
          python app/v6_first_blind_consume.py execute \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Persist immutable First Blind result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f benchmarks/raw/sources/v6_first_blind_consumption.json
          test -f benchmarks/raw/results/analysis_raw_v6_first_blind.json
          git add \
            benchmarks/raw/sources/v6_first_blind_consumption.json \
            benchmarks/raw/results/analysis_raw_v6_first_blind.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No First Blind result changes to commit.' >&2
            exit 1
          fi
          git commit -m 'Record immutable Analysis 6.31 First Blind result'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation

      - name: Report immutable quality gate outcome
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt_path=Path('benchmarks/raw/sources/v6_first_blind_consumption.json')
          result_path=Path('benchmarks/raw/results/analysis_raw_v6_first_blind.json')
          if not receipt_path.exists() or not result_path.exists():
              raise SystemExit('First Blind did not produce the immutable receipt/result pair')
          receipt=json.loads(receipt_path.read_text())
          result=json.loads(result_path.read_text())
          print(json.dumps({
              'receipt_state': receipt.get('state'),
              'first_blind_consumed': receipt.get('first_blind_consumed'),
              'scoring_executed': result.get('scoring_executed'),
              'quality_gate_passed': (result.get('quality_gate') or {}).get('passed'),
          }, indent=2, sort_keys=True))
          if receipt.get('state') != 'completed':
              raise SystemExit(f"First Blind did not complete cleanly: {receipt.get('state')}")
          if result.get('scoring_executed') is not True or result.get('first_blind_consumed') is not True:
              raise SystemExit('First Blind result does not prove single scoring consumption')
          # Do not rerun on gate failure. The result is intentionally immutable either way.
          PY
