name: Analysis 6.31 Source Keyword Supplement

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_supplement_candidates.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect source-text fallback candidates
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          import raw_recon_v4_source_discovery as v4
          from raw_recon_v5_nvd_discovery import CVE_RE, _candidate, _cwes, prior_cve_exposure
          from raw_recon_v5_source_audit import HARD_ANCHORS, audit_row
          import raw_recon_v6_source_firewall as fw

          supplement = json.loads(Path('benchmarks/raw/sources/v6_supplement_candidates.json').read_text())
          targets = list(supplement.get('families_without_semantic_candidates') or [])
          prior = fw.exposure_index()
          prior_cves = set(prior_cve_exposure()) | {
              str(root).upper() for root in prior['roots'] if CVE_RE.fullmatch(str(root).upper())
          }
          grounding = v4._grounding_writeup_urls()
          family_cwes = v4._family_cwes()
          endpoint = 'https://services.nvd.nist.gov/rest/json/cves/2.0'
          request_count = 0
          pools = {}

          def fetch_keyword(term):
              nonlocal_marker = None
              params = urllib.parse.urlencode({'keywordSearch': term, 'resultsPerPage': 500})
              req = urllib.request.Request(endpoint + '?' + params, headers={'User-Agent':'Recon-Monitor-Analysis-6.31-v6/1.0','Accept':'application/json'})
              response = None
              for attempt in range(3):
                  try:
                      response = urllib.request.urlopen(req, timeout=90)
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {403,429} or attempt == 2:
                          raise
                      time.sleep(6.5 * (attempt + 1))
              if response is None:
                  return []
              with response:
                  payload = json.load(response)
              return [dict(w['cve']) for w in payload.get('vulnerabilities') or [] if isinstance(w, dict) and isinstance(w.get('cve'), dict)]

          for family in sorted(targets):
              by_root = {}
              terms = list(HARD_ANCHORS[family][0])[:4]
              for term in terms:
                  if request_count:
                      time.sleep(6.2)
                  records = fetch_keyword(term)
                  request_count += 1
                  for cve in records:
                      matched = _cwes(cve) & set(family_cwes.get(family, ()))
                      if not matched:
                          continue
                      row = _candidate(cve, family=family, matched_cwes=matched, prior=prior, prior_cves=prior_cves, grounding_urls=grounding)
                      if row is None or not fw.check_candidate(row)['allowed']:
                          continue
                      root = str(row.get('source_root') or '')
                      if root and root not in by_root:
                          row['v6_firewall_allowed'] = True
                          by_root[root] = row
                  if sum(1 for row in by_root.values() if audit_row(family, row)[0]) >= 2:
                      break
              rows = list(by_root.values())
              rows.sort(key=lambda row: (1 if audit_row(family,row)[0] else 0, audit_row(family,row)[2], row.get('published_at') or ''), reverse=True)
              pools[family] = rows

          semantic = {family: sum(1 for row in rows if audit_row(family,row)[0]) for family,rows in pools.items()}
          unresolved = sorted(family for family in targets if semantic.get(family,0) == 0)
          out = {
              'version':'1.0.0',
              'rule_version':'2026.08.13.6.31',
              'evaluation_kind':'fresh_blind_v6_unscored_keyword_source_supplement',
              'target_families':sorted(targets),
              'api_request_count':request_count,
              'family_semantic_candidate_counts':semantic,
              'families_without_semantic_candidates':unresolved,
              'scoring_executed':False,
              'candidate_selection_uses_detector_scores':False,
              'candidate_selection_uses_admission_results':False,
              'candidates_by_family':pools,
          }
          Path('benchmarks/raw/sources/v6_keyword_candidates.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print({'target_family_count':len(targets),'unresolved':unresolved,'api_request_count':request_count})
          PY

      - name: Commit keyword supplement snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_keyword_candidates.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record fallback Analysis 6.31 v6 source candidates'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
