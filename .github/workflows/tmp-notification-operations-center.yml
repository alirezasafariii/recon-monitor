name: Temporary validate notification operations center

on:
  push:
    branches: [agent/notification-operations-center-v890]
    paths: [.github/workflows/tmp-notification-operations-center.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/notification-operations-center-v890
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Integrate unified delivery operations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          product = Path('app/product_platform.py')
          text = product.read_text(encoding='utf-8')
          core_import = 'from core import APP_VERSION, AppPaths, Database, ReconError, json_dumps, parse_int, safe_json_loads, utc_now\n'
          extra_import = 'from notification_operations_center import notification_delivery_operations\n'
          if extra_import not in text:
              if core_import not in text:
                  raise SystemExit('product_platform core import anchor missing')
              text = text.replace(core_import, core_import + extra_import, 1)
          anchor = '    notifications = [dict(row) for row in db.all("SELECT * FROM notification_policies ORDER BY target,event_type")]\n'
          if '    delivery_workers = notification_delivery_operations(db)\n' not in text:
              if anchor not in text:
                  raise SystemExit('operations notifications anchor missing')
              text = text.replace(anchor, anchor + '    delivery_workers = notification_delivery_operations(db)\n', 1)
          score_anchor = '    degraded_plugins = sum(1 for item in plugins if not item.get("ok"))\n    score -= min(10, degraded_plugins * 2)\n'
          score_replacement = score_anchor + '    delivery_dead_letters = int(delivery_workers.get("dead_letter_open", 0) or 0)\n    paused_delivery_workers = sum(1 for item in delivery_workers.get("workers", {}).values() if item.get("state") == "paused_with_backlog")\n    score -= min(15, delivery_dead_letters * 3)\n    score -= min(10, paused_delivery_workers * 5)\n'
          if '    delivery_dead_letters = int(delivery_workers.get("dead_letter_open", 0) or 0)\n' not in text:
              if score_anchor not in text:
                  raise SystemExit('operations score anchor missing')
              text = text.replace(score_anchor, score_replacement, 1)
          warn_anchor = '    if degraded_plugins: warnings.append(f"{degraded_plugins} plugin(s) are degraded or invalid.")\n'
          if '    warnings.extend(delivery_workers.get("warnings", []))\n' not in text:
              if warn_anchor not in text:
                  raise SystemExit('operations warning anchor missing')
              text = text.replace(warn_anchor, warn_anchor + '    warnings.extend(delivery_workers.get("warnings", []))\n', 1)
          old_payload = '    payload = {"program_health_score": score, "database": integrity, "failed_stages": failed_stages, "latest_run": latest_run, "run_completeness": completeness, "engine_quality": quality, "scope": scope, "storage": storage, "backups": backups, "schedules": schedules, "notifications": notifications, "plugins": plugins, "warnings": warnings, "generated_at": utc_now(), "deep_check": deep_check}\n'
          new_payload = '    payload = {"program_health_score": score, "database": integrity, "failed_stages": failed_stages, "latest_run": latest_run, "run_completeness": completeness, "engine_quality": quality, "scope": scope, "storage": storage, "backups": backups, "schedules": schedules, "notifications": notifications, "delivery_workers": delivery_workers, "plugins": plugins, "warnings": warnings, "generated_at": utc_now(), "deep_check": deep_check}\n'
          if new_payload not in text:
              if old_payload not in text:
                  raise SystemExit('operations payload anchor missing')
              text = text.replace(old_payload, new_payload, 1)
          product.write_text(text, encoding='utf-8')

          dashboard = Path('app/dashboard_core.py')
          text = dashboard.read_text(encoding='utf-8')
          product_import_old = '''from product_platform import (\n    CASE_STATES, RULE_STATES, NOTIFICATION_MODES, build_report_draft, build_validation_package,\n    case_detail, engine_quality, engine_quality_snapshot, list_cases, list_stories, operations_center, platform_sync, rule_governance,\n    run_completeness, run_completeness_snapshot, scope_center, set_case_state, set_notification_policy, set_rule_state, set_schedule_policy,\n    storage_health, storage_health_snapshot, sync_security_cases, sync_security_stories,\n)\n'''
          product_import_new = '''from product_platform import (\n    CASE_STATES, RULE_STATES, NOTIFICATION_MODES, build_report_draft, build_validation_package,\n    case_detail, engine_quality, engine_quality_snapshot, invalidate_platform_cache, list_cases, list_stories, operations_center, platform_sync, rule_governance,\n    run_completeness, run_completeness_snapshot, scope_center, set_case_state, set_notification_policy, set_rule_state, set_schedule_policy,\n    storage_health, storage_health_snapshot, sync_security_cases, sync_security_stories,\n)\n'''
          if 'invalidate_platform_cache' not in text.split('from platform_v6 import', 1)[0]:
              if product_import_old not in text:
                  raise SystemExit('dashboard product import anchor missing')
              text = text.replace(product_import_old, product_import_new, 1)
          notification_import = 'from notification_operations_center import combined_dead_letters, notification_delivery_action\n'
          plugins_import = 'from plugins import PluginManager\n'
          if notification_import not in text:
              if plugins_import not in text:
                  raise SystemExit('dashboard plugin import anchor missing')
              text = text.replace(plugins_import, plugins_import + notification_import, 1)

          post_anchor = '''            if path == "/schedules/set":\n                set_schedule_policy(db,str((data.get("target") or [""])[0]),str((data.get("cadence") or [""])[0]),enabled=str((data.get("enabled") or ["true"])[0]).lower()=="true",max_runtime_minutes=parse_int((data.get("max_runtime") or [120])[0],120),request_budget=parse_int((data.get("request_budget") or [10000])[0],10000),quiet_hours=str((data.get("quiet_hours") or [""])[0]),actor=actor)\n                self.redirect('/operations-center'); return\n'''
          post_block = '''            if path == "/notification-workers/action":\n                action=str((data.get("action") or [""])[0]).strip().lower()\n                enabled_raw=str((data.get("enabled") or [""])[0]).strip().lower()\n                interval_raw=str((data.get("interval_seconds") or [""])[0]).strip()\n                batch_raw=str((data.get("batch_limit") or [""])[0]).strip()\n                notification_delivery_action(\n                    worker=str((data.get("worker") or [""])[0]),\n                    action=action,\n                    config=self.config,\n                    logger=self.logger,\n                    db=db,\n                    enabled=(enabled_raw in {"1","true","yes","on"}) if action == "configure" and enabled_raw else None,\n                    interval_seconds=parse_int(interval_raw,60,60,3600) if interval_raw else None,\n                    batch_limit=parse_int(batch_raw,100,1,500) if batch_raw else None,\n                    event_id=str((data.get("event_id") or [""])[0]),\n                    target=str((data.get("target") or [""])[0]),\n                    max_batches=parse_int((data.get("max_batches") or [20])[0],20,1,100),\n                )\n                invalidate_platform_cache()\n                self.redirect('/operations-center'); return\n'''
          if post_block not in text:
              if post_anchor not in text:
                  raise SystemExit('dashboard POST anchor missing')
              text = text.replace(post_anchor, post_block + post_anchor, 1)

          start = text.index('    def operations_center_page(self) -> None:\n')
          end = text.index('    def storage_health_page(self) -> None:\n', start)
          new_method = '''    def operations_center_page(self) -> None:\n        db=self.db()\n        try:\n            refresh=str((self.query().get('refresh')or['0'])[0]).lower() in {'1','true','yes'}\n            data=operations_center(self.paths,db,refresh=refresh,deep_check=refresh)\n            dead_letters=combined_dead_letters(db,limit=50)\n        finally: db.close()\n        completeness=data.get('run_completeness',{}); storage=data.get('storage',{}); quality=data.get('engine_quality',{})\n        delivery=data.get('delivery_workers',{}); workers=delivery.get('workers',{})\n        warnings=''.join(f"<div class='callout'><strong>Attention</strong><span>{_esc(item)}</span></div>" for item in data.get('warnings',[])) or _empty('No operational warning')\n        dims=completeness.get('dimensions',{})\n        stage_rows=''.join(f"<tr><td>{_esc(stage)}</td><td>{_pill(info.get('status'))}</td><td>{info.get('score',0)}%</td><td>{info.get('records',0)}</td></tr>" for stage,info in dims.items())\n        backups=''.join(f"<tr><td><code>{_esc(row['backup_id'])}</code></td><td>{_esc(row['created_at'])}</td><td>{_esc(row['verified_at'] or 'not verified')}</td><td>{row['size']}</td></tr>" for row in data.get('backups',[]))\n        schedules=''.join(f"<tr><td>{_esc(row['target'])}</td><td>{_esc(row['cadence'])}</td><td>{_pill('active' if row['enabled'] else 'disabled')}</td><td>{row['request_budget']}</td><td>{row['max_runtime_minutes']} min</td></tr>" for row in data.get('schedules',[]))\n        header=_page_header('Operations center','Program health plus a unified control plane for Finding and Recon Alert delivery. Queue and lifecycle state remain independent.',"<a class='button secondary' href='/operations-center?refresh=1'>Run deep refresh</a><a class='button secondary' href='/storage-health'>Storage health</a><a class='button' href='/scope-center'>Scope center</a>",f'Recon Monitor {APP_VERSION} · Cached daily operations')\n        metrics="<div class='metrics-grid'>"+_metric_card('Program health',data.get('program_health_score',0),'Database, runs, backups, delivery and engine quality','success' if data.get('program_health_score',0)>=75 else 'amber')+_metric_card('Delivery backlog',delivery.get('queue_depth',0),f"{delivery.get('due_now',0)} due now",'amber' if delivery.get('due_now',0) else 'success')+_metric_card('Dead letters',delivery.get('dead_letter_open',0),'Finding + Recon Alert delivery','danger' if delivery.get('dead_letter_open',0) else 'success')+_metric_card('Run completeness',f"{completeness.get('score',0)}%",data.get('latest_run') or 'No run','info')+_metric_card('Engine health',quality.get('health_score',0),'Quality and backlog health','purple')+_metric_card('Failed stages',data.get('failed_stages',0),'Historical failed stage records','danger' if data.get('failed_stages',0) else 'success')+_metric_card('Storage',f"{round(storage.get('estimated_total_bytes',0)/1024/1024,1)} MB",'Estimated managed data','blue')+_metric_card('Backups',len(data.get('backups',[])),'Catalogued recent backups','orange')+"</div>"\n\n        def worker_panel(key,label):\n            worker=dict(workers.get(key) or {}); policy=dict(worker.get('policy') or {}); last=dict(worker.get('last_worker_run') or {})\n            enabled=bool(policy.get('enabled',True)); state=str(worker.get('state') or 'unknown')\n            enabled_options=("<option value='true' selected>Enabled</option><option value='false'>Disabled</option>" if enabled else "<option value='true'>Enabled</option><option value='false' selected>Disabled</option>")\n            summary="<div class='metrics-grid'>"+_metric_card('Queue',worker.get('queue_depth',0),f"{worker.get('due_now',0)} due now",'amber' if worker.get('due_now',0) else 'success')+_metric_card('Retry pending',worker.get('retry_pending',0),'Awaiting next attempt','amber' if worker.get('retry_pending',0) else 'neutral')+_metric_card('Dead letters',worker.get('dead_letter_open',0),'Needs operator review','danger' if worker.get('dead_letter_open',0) else 'success')+_metric_card('Delivered',worker.get('delivered',0),'Durably finalized deliveries','blue')+"</div>"\n            configure=f"<form method='post' action='/notification-workers/action' class='stack'><input type='hidden' name='worker' value='{_esc(key)}'><input type='hidden' name='action' value='configure'><label>Worker state<br><select name='enabled'>{enabled_options}</select></label><label>Interval seconds<br><input type='number' name='interval_seconds' min='60' max='3600' value='{_esc(policy.get('interval_seconds',60))}'></label><label>Batch limit<br><input type='number' name='batch_limit' min='1' max='500' value='{_esc(policy.get('batch_limit',100))}'></label><button class='secondary'>Save worker policy</button></form>"\n            actions=f"<div class='stack'><form method='post' action='/notification-workers/action'><input type='hidden' name='worker' value='{_esc(key)}'><input type='hidden' name='action' value='run'><button>Run one pass now</button></form><form method='post' action='/notification-workers/action'><input type='hidden' name='worker' value='{_esc(key)}'><input type='hidden' name='action' value='drain'><input type='hidden' name='max_batches' value='20'><input type='hidden' name='batch_limit' value='{_esc(policy.get('batch_limit',100))}'><button class='secondary'>Bounded drain</button></form><form method='post' action='/notification-workers/action'><input type='hidden' name='worker' value='{_esc(key)}'><input type='hidden' name='action' value='retry'><button class='secondary'>Retry all dead letters</button></form></div>"\n            last_text=(f"{last.get('status','unknown')} · {last.get('finished_at') or last.get('started_at') or 'time unavailable'}" if last else 'No recorded worker run yet')\n            return f"<article class='panel'><div class='panel-head'><div><h3>{_esc(label)}</h3><span class='muted small'>Independent durable queue · {_esc(last_text)}</span></div>{_pill(state,'danger' if state=='degraded' else 'amber' if state in {'work_due','paused_with_backlog'} else 'success')}</div><div class='panel-body'>{summary}<div class='two-col' style='margin-top:14px'>{configure}<section><h4>Operator actions</h4>{actions}<p class='muted small'>External delivery is at-least-once. Actions do not change Candidate, Admission or Recon Alert eligibility truth.</p></section></div></div></article>"\n\n        worker_html="<section class='panel' style='margin-top:16px'><div class='panel-head'><div><h3>Delivery workers</h3><span class='muted small'>One control plane; separate Finding and Recon Alert queues.</span></div>{_pill('independent state','info')}</div><div class='panel-body stack'>"+worker_panel('finding','Finding delivery')+worker_panel('recon_alert','Recon Alert delivery')+"</div></section>"\n        dead_rows=[]\n        for row in dead_letters:\n            worker=str(row.get('worker') or ''); label='Finding' if worker=='finding' else 'Recon Alert'; context=row.get('mode') or row.get('run_id') or ''\n            retry=f"<form method='post' action='/notification-workers/action'><input type='hidden' name='worker' value='{_esc(worker)}'><input type='hidden' name='action' value='retry'><input type='hidden' name='event_id' value='{_esc(row.get('event_id',''))}'><button class='secondary'>Retry</button></form>"\n            dead_rows.append(f"<tr><td>{_esc(label)}</td><td><code>{_esc(row.get('event_id',''))}</code></td><td>{_esc(row.get('target',''))}</td><td>{_esc(context)}</td><td>{_esc(row.get('attempt_count',0))}</td><td>{_esc(row.get('last_error',''))}</td><td>{_esc(row.get('dead_lettered_at',''))}</td><td>{retry}</td></tr>")\n        dead_table=f"<section class='panel' style='margin-top:16px'><div class='panel-head'><h3>Dead-letter registry</h3><span class='muted small'>{len(dead_letters)} open event(s)</span></div><div class='table-wrap'><table><thead><tr><th>Worker</th><th>Event</th><th>Target</th><th>Context</th><th>Attempts</th><th>Last error</th><th>Dead-lettered</th><th></th></tr></thead><tbody>{''.join(dead_rows) or '<tr><td colspan=8>No open delivery dead letters</td></tr>'}</tbody></table></div></section>"\n        forms="<div class='two-col' style='margin-top:16px'><section class='panel'><div class='panel-head'><h3>Schedule policy</h3></div><div class='panel-body'><form method='post' action='/schedules/set' class='stack'><label>Target<br><input name='target' required></label><label>Cadence<br><input name='cadence' placeholder='weekly or Mon,Thu 03:00' required></label><label>Request budget<br><input type='number' name='request_budget' value='10000'></label><label>Maximum runtime (minutes)<br><input type='number' name='max_runtime' value='120'></label><label>Quiet hours<br><input name='quiet_hours' placeholder='22:00-07:00'></label><input type='hidden' name='enabled' value='true'><button>Save policy</button></form></div></section><section class='panel'><div class='panel-head'><h3>Notification policy</h3></div><div class='panel-body'><form method='post' action='/notifications/set' class='stack'><label>Target<br><input name='target' value='*' required></label><label>Event type<br><input name='event_type' placeholder='strong_candidate' required></label><label>Mode<br>{_select('mode',NOTIFICATION_MODES,'digest','Select mode')}</label><label>Minimum score<br><input type='number' name='minimum_score' value='70'></label><button>Save policy</button></form></div></section></div>"\n        body=header+metrics+worker_html+dead_table+f"<div class='two-col' style='margin-top:16px'><section class='panel'><div class='panel-head'><h3>Operational attention</h3></div><div class='panel-body stack'>{warnings}</div></section><section class='panel'><div class='panel-head'><h3>Latest run completeness</h3></div><div class='table-wrap'><table><thead><tr><th>Stage</th><th>Status</th><th>Coverage</th><th>Records</th></tr></thead><tbody>{stage_rows or '<tr><td colspan=4>No stage data</td></tr>'}</tbody></table></div></section></div><section class='panel' style='margin-top:16px'><div class='panel-head'><h3>Backup readiness</h3></div><div class='table-wrap'><table><thead><tr><th>Backup</th><th>Created</th><th>Verified</th><th>Bytes</th></tr></thead><tbody>{backups or '<tr><td colspan=4>No catalogued backups</td></tr>'}</tbody></table></div></section><section class='panel' style='margin-top:16px'><div class='panel-head'><h3>Configured schedules</h3></div><div class='table-wrap'><table><thead><tr><th>Target</th><th>Cadence</th><th>Status</th><th>Budget</th><th>Runtime</th></tr></thead><tbody>{schedules or '<tr><td colspan=5>No schedule policies</td></tr>'}</tbody></table></div></section>"+forms\n        self.send_html('Operations center',body)\n\n'''
          text = text[:start] + new_method + text[end:]
          dashboard.write_text(text, encoding='utf-8')

          docs = Path('docs/OPERATIONS_CENTER.md')
          dtext = docs.read_text(encoding='utf-8')
          section = '''\n## Delivery workers\n\nOperations Center now includes one control-plane view for durable Finding and Recon Alert delivery. It shows queue depth, due-now work, retry backlog, dead letters, worker policy, and the latest worker run for both queues. Operators can configure, run, bounded-drain, and retry each worker independently. The two outboxes and their domain lifecycle semantics remain separate. See `docs/NOTIFICATION_OPERATIONS_CENTER.md`.\n'''
          if '## Delivery workers' not in dtext:
              docs.write_text(dtext.rstrip() + '\n' + section, encoding='utf-8')
          PY

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/notification_operations_center.py app/product_platform.py app/dashboard_core.py
          python -m unittest discover -s tests -p 'test_notification_operations_center.py' -q
          python -m unittest discover -s tests -p 'test_finding_notification_operations.py' -q
          python -m unittest discover -s tests -p 'test_recon_alert_operations.py' -q
          python -m unittest discover -s tests -p 'test_product_platform_v50.py' -q
          python -m unittest discover -s tests -p 'test_dashboard_performance_v501.py' -q

      - name: Remove temporary workflow and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-notification-operations-center.yml
          git show origin/main:MANIFEST.sha256 > MANIFEST.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('MANIFEST.sha256')
          entries = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, path = line.split('  ', 1)
              entries[path] = digest
          changed = [
              'app/dashboard_core.py',
              'app/notification_operations_center.py',
              'app/product_platform.py',
              'docs/NOTIFICATION_OPERATIONS_CENTER.md',
              'docs/OPERATIONS_CENTER.md',
              'tests/test_notification_operations_center.py',
          ]
          for name in changed:
              data = Path(name).read_bytes()
              entries[name] = hashlib.sha256(data).hexdigest()
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in sorted(entries)), encoding='utf-8')
          PY
          sha256sum --strict -c MANIFEST.sha256 >/dev/null

      - name: Commit validated feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate notification workers into Operations Center'
          git push origin HEAD:agent/notification-operations-center-v890
