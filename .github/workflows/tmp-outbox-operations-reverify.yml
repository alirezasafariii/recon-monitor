name: Temporary finding notification worker operations re-verification

on:
  push:
    branches: [feat/outbox-worker-operations-20260914]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/outbox-worker-operations-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh changed file hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('MANIFEST.sha256')
          tracked = [
              'app/finding_notification_operations.py',
              'tools/deliver_finding_notifications.py',
              'tests/test_finding_notification_operations.py',
              'docs/FINDING_NOTIFICATION_WORKER_OPERATIONS.md',
          ]
          original = manifest.read_text(encoding='utf-8').splitlines()
          replacements = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          seen = set(); output = []
          for line in original:
              parts = line.split('  ', 1)
              if len(parts) == 2 and parts[1] in replacements:
                  output.append(f'{replacements[parts[1]]}  {parts[1]}'); seen.add(parts[1])
              else:
                  output.append(line)
          for path in tracked:
              if path not in seen:
                  output.append(f'{replacements[path]}  {path}')
          manifest.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh manifest for outbox worker operations'
            git push origin HEAD:feat/outbox-worker-operations-20260914
          fi
      - name: Verify focused operations
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/finding_notification_operations.py tools/deliver_finding_notifications.py
          python -m unittest -q \
            tests.test_finding_notification_operations \
            tests.test_finding_notification_outbox \
            tests.test_finding_notifications \
            tests.test_reviewed_evidence_dispatcher
          sha256sum --strict -c MANIFEST.sha256
      - name: Finalize branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/outbox-worker-operations-20260914
          git checkout -B feat/outbox-worker-operations-20260914 origin/feat/outbox-worker-operations-20260914
          git rm -f .github/workflows/tmp-outbox-operations-reverify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary outbox operations re-verifier'
          git push origin HEAD:feat/outbox-worker-operations-20260914
