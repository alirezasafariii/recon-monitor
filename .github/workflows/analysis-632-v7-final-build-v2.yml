name: Analysis 6.32 v7 Final Holdout Build v2

on:
  push:
    branches:
      - agent/analysis-engine-6.32-post-blind-calibration
    paths:
      - '.github/workflows/analysis-632-v7-final-build-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-632-v7-final-build-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.32-post-blind-calibration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse any sealed or consumed v7 state
        run: |
          set -euo pipefail
          test ! -e benchmarks/raw/sources/v7_corpus_freeze.json
          test ! -e benchmarks/raw/sources/v7_first_blind_consumption.json
          test ! -e benchmarks/raw/results/analysis_raw_v7_first_blind.json

      - name: Prove v6 First Blind is consumed and immutable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('benchmarks/raw/sources/v6_first_blind_consumption.json').read_text())
          result=json.loads(Path('benchmarks/raw/results/analysis_raw_v6_first_blind.json').read_text())
          assert receipt['state']=='completed'
          assert receipt['first_blind_consumed'] is True
          assert receipt['rerun_allowed'] is False
          assert result['scoring_executed'] is True
          assert result['first_blind_consumed'] is True
          PY

      - name: Normalize passive raw method to HTTP GET before capture
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/v7_literal_patch_capture.py')
          text=p.read_text()
          if '"method": "GET",' not in text:
              assert '"method": "UNKNOWN",' in text
              p.write_text(text.replace('"method": "UNKNOWN",','"method": "GET",',1))
          PY

      - name: Discover real patchable replacements for the final five families
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python app/raw_recon_v7_missing5_supplement_v2.py
          python app/raw_recon_v7_merge_patchable.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_candidates_patchable.json').read_text())
          print({'patchable_family_count':r.get('patchable_family_count'),'missing':r.get('families_without_candidates')})
          assert r['patchable_family_count']==36, r['families_without_candidates']
          assert r['families_without_candidates']==[]
          assert all(v>0 for v in r['family_candidate_counts'].values())
          assert r['candidate_selection_uses_v6_first_blind_score'] is False
          assert r['candidate_selection_uses_v6_first_blind_case_errors'] is False
          assert r['scoring_executed'] is False
          PY

      - name: Select 36 globally unique fresh sources
        env:
          PYTHONPATH: app
        run: |
          python app/raw_recon_v7_source_selection.py
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v7_source_firewall import validate_shortlist
          r=json.loads(Path('benchmarks/raw/sources/v7_shortlist.json').read_text())
          assert len(r['selected'])==36
          assert r['global_assignment_complete'] is True
          assert r['families_without_semantic_candidates']==[]
          assert r['firewall']['passed'] is True
          assert r['firewall']['unique_root_count']==36
          assert r['firewall']['unique_project_count']==36
          assert all(row.get('patch_probe_passed') is True for row in r['selected'])
          assert all(int(row.get('patch_added_line_count') or 0)>0 for row in r['selected'])
          assert all(row.get('pre_score_expected_condition_signals') for row in r['selected'])
          assert validate_shortlist(r['selected'])['passed'] is True
          assert r['selection_uses_v6_first_blind_score'] is False
          assert r['selection_uses_v6_first_blind_case_errors'] is False
          assert r['scoring_executed'] is False
          PY

      - name: Collect 36 canonical and 36 linked passive snapshots
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python app/v7_literal_source_research.py --require-all
          python app/v7_literal_linked_research.py --require-all

      - name: Reset only unsealed v7 outputs and preregister clean 144-capture plan
        env:
          PYTHONPATH: app
        run: |
          rm -rf benchmarks/raw/sources/v7_capture_evidence
          rm -f benchmarks/raw/sources/v7_literal_captures.jsonl \
                benchmarks/raw/sources/v7_literal_capture_ingest_report.json \
                benchmarks/raw/sources/v7_literal_capture_verification.json \
                benchmarks/raw/analysis_raw_v7.jsonl \
                benchmarks/raw/sources/v7_materialization_report.json \
                benchmarks/raw/sources/v7_validation_report.json
          python app/v7_literal_label_schema.py
          python app/v7_literal_capture_plan.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_plan.json').read_text())
          assert p['required_capture_count']==144
          assert p['evidence_present_count']==0 and p['evidence_missing_count']==144
          assert p['scoring_executed'] is False
          assert p['v6_first_blind_score_used'] is False
          assert p['v6_first_blind_case_errors_used'] is False
          PY

      - name: Capture and publish 144 independent source-grounded observations
        env:
          PYTHONPATH: app
        run: |
          rm -rf /tmp/v7-final-v2-captures
          mkdir -p /tmp/v7-final-v2-captures
          python app/v7_literal_patch_capture.py /tmp/v7-final-v2-captures
          test "$(find /tmp/v7-final-v2-captures -type f -name '*.json' | wc -l | tr -d ' ')" = "144"
          python app/v7_literal_evidence_publish.py /tmp/v7-final-v2-captures

      - name: Evidence-only ingest and strict 144-of-144 verification
        env:
          PYTHONPATH: app
        run: |
          python app/v7_literal_capture_plan.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_plan.json').read_text())
          assert p['evidence_present_count']==144 and p['evidence_missing_count']==0 and p['all_evidence_present'] is True
          PY
          python app/v7_literal_capture_ingest.py
          python app/v7_literal_capture_verify.py --write-report
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_verification.json').read_text())
          assert r['passed'] is True, r['errors']
          assert r['capture_count']==144
          assert r['evidence_count']==144
          assert r['unique_evidence_hash_count']==144
          assert r['family_count']==36
          assert r['scoring_executed'] is False
          PY

      - name: Materialize and strictly validate 276 fresh cases
        env:
          PYTHONPATH: app
        run: |
          python app/v7_benchmark_dataset.py
          python - <<'PY'
          import json
          from pathlib import Path
          from v7_benchmark_validate import validate_v7_corpus
          cases=[json.loads(line) for line in Path('benchmarks/raw/analysis_raw_v7.jsonl').read_text().splitlines() if line.strip()]
          shortlist=json.loads(Path('benchmarks/raw/sources/v7_shortlist.json').read_text())
          r=validate_v7_corpus(cases,shortlist,require_literal_single_capture=True)
          Path('benchmarks/raw/sources/v7_validation_report.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          assert r['passed'] is True, r['errors']
          assert r['case_count']==276
          assert r['single_case_count']==144
          assert r['pair_case_count']==72
          assert r['triad_case_count']==60
          assert r['literal_single_capture_count']==144
          assert r['label_leakage_count']==0
          assert r['source_firewall']['passed'] is True
          assert r['scoring_executed'] is False
          PY

      - name: Prove v6 immutable artifacts unchanged
        run: |
          git diff --exit-code HEAD -- \
            benchmarks/raw/sources/v6_first_blind_consumption.json \
            benchmarks/raw/results/analysis_raw_v6_first_blind.json \
            benchmarks/raw/analysis_raw_v6.jsonl \
            benchmarks/raw/sources/v6_corpus_freeze.json \
            benchmarks/raw/sources/v6_evaluator_freeze.json

      - name: Commit complete unscored v7 holdout
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/v7_literal_patch_capture.py \
            benchmarks/raw/sources/v7_missing5_supplement.json \
            benchmarks/raw/sources/v7_candidates_patchable.json \
            benchmarks/raw/sources/v7_shortlist.json \
            benchmarks/raw/sources/v7_literal_source_research.json \
            benchmarks/raw/sources/v7_literal_linked_research.json \
            benchmarks/raw/sources/v7_literal_label_schema.json \
            benchmarks/raw/sources/v7_literal_capture_plan.json \
            benchmarks/raw/sources/v7_capture_evidence \
            benchmarks/raw/sources/v7_literal_captures.jsonl \
            benchmarks/raw/sources/v7_literal_capture_ingest_report.json \
            benchmarks/raw/sources/v7_literal_capture_verification.json \
            benchmarks/raw/analysis_raw_v7.jsonl \
            benchmarks/raw/sources/v7_materialization_report.json \
            benchmarks/raw/sources/v7_validation_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Analysis 6.32 fresh v7 holdout v2'
          git pull --rebase origin agent/analysis-engine-6.32-post-blind-calibration
          git push origin HEAD:agent/analysis-engine-6.32-post-blind-calibration
