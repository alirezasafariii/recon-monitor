name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"

      - name: Build temporary manifest for v965 validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          changed = [
              ".github/workflows/ci.yml",
              "app/real_world_calibration.py",
              "app/recon_monitor.py",
              "tests/test_real_world_calibration_v965.py",
              "docs/REAL_WORLD_CALIBRATION_AND_FEEDBACK.md",
          ]
          manifest = Path("MANIFEST.sha256")
          hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in changed}
          output = []
          seen = set()
          for raw in manifest.read_text(encoding="utf-8").splitlines():
              if "  " not in raw:
                  output.append(raw)
                  continue
              _digest, path = raw.split("  ", 1)
              if path in hashes:
                  output.append(f"{hashes[path]}  {path}")
                  seen.add(path)
              else:
                  output.append(raw)
          for path in changed:
              if path not in seen:
                  output.append(f"{hashes[path]}  {path}")
          manifest.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Verify manifest
        shell: bash
        run: sha256sum --strict -c MANIFEST.sha256

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION="$(./recon-monitor.sh --version)"
          CORE_VERSION="$(python -c 'import sys; sys.path.insert(0, "app"); from core import APP_VERSION; print(APP_VERSION)')"
          test "$CLI_VERSION" = "$CORE_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$CLI_VERSION"
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Integration test
        run: python tests/integration_runner.py
