name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"

      - name: Verify manifest
        shell: bash
        run: sha256sum --strict -c MANIFEST.sha256

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION="$(./recon-monitor.sh --version)"
          CORE_VERSION="$(python -c 'import sys; sys.path.insert(0, "app"); from core import APP_VERSION; print(APP_VERSION)')"
          test "$CLI_VERSION" = "$CORE_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$CLI_VERSION"
          fi

      - name: Verify release metadata
        run: python tools/check_release_consistency.py

      - name: Dependency range coverage
        run: python tools/dependency_range_coverage.py --require-full-ratio 0.9997

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Integration test
        run: python tests/integration_runner.py
      - name: Real dashboard HTTP acceptance
        if: matrix.python-version == '3.13'
        run: python tests/dashboard_browser_acceptance.py --http-only --output "$RUNNER_TEMP/dashboard-http"

  test-macos:
    name: macOS ${{ matrix.runner }} Python 3.14
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['macos-latest', 'macos-15-intel']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify release metadata
        run: python tools/check_release_consistency.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration test
        run: python tests/integration_runner.py
      - name: Command cleanup without resource leaks
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_command_runner_stdin.py' -v

  api-macos:
    name: API shutdown (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Portable API shutdown regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -W error::ResourceWarning -m unittest discover -s tests -p 'test_api_process_identity.py' -v
          python -W error::ResourceWarning -m unittest discover -s tests -p 'test_api_portable_shutdown.py' -v

  dashboard-safari:
    name: Dashboard acceptance (native Safari)
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Enable Safari automation on the disposable runner
        run: sudo /usr/bin/safaridriver --enable
      - name: Real HTTP and Safari dashboard acceptance
        run: python tests/dashboard_browser_acceptance.py --browser safari --output "$RUNNER_TEMP/dashboard-browser"
      - name: Preserve browser results and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-native-safari
          path: ${{ runner.temp }}/dashboard-browser
          retention-days: 7
          if-no-files-found: warn
