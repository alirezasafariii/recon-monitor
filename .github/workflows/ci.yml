name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"

      - name: Inspect calibration challenge misses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'app')
          from analysis_benchmark import load_golden_cases
          from analysis_benchmark_v2 import build_challenge_records, quality_report
          cases = load_golden_cases([
              'tests/fixtures/vulnerability_intelligence_golden_v1.json',
              'tests/fixtures/vulnerability_intelligence_phase2_golden_v2.json',
          ])
          report = quality_report('.')
          threshold = report['challenge_threshold']
          challenges = build_challenge_records(cases)
          fp = [
              {'family': r['family'], 'kind': r['case_kind'], 'score': r['score'], 'evidence': r['target_evidence_confidence'], 'signals': r['signals'], 'contradictions': r['contradictions'], 'top_family': r['top_family']}
              for r in challenges if r['score'] >= threshold
          ]
          print('CHALLENGE_FALSE_POSITIVES=' + json.dumps(fp, sort_keys=True))
          print('ORDERING_FAILURES=' + json.dumps(report['challenge_ordering_failures'], sort_keys=True))
          PY

      - name: Verify manifest
        shell: bash
        run: sha256sum --strict -c MANIFEST.sha256

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION="$(./recon-monitor.sh --version)"
          CORE_VERSION="$(python -c 'import sys; sys.path.insert(0, "app"); from core import APP_VERSION; print(APP_VERSION)')"
          test "$CLI_VERSION" = "$CORE_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$CLI_VERSION"
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Integration test
        run: python tests/integration_runner.py
