name: Recon Monitor Secret Migration

on:
  push:
    branches: [agent/vulnerability-intelligence-8.6.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vulnerability-intelligence-8.6.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Secret Exposure production migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Fix the initial analyzer syntax and keep detail marker parsing explicit.
          replace_once(
              'app/family_analyzers/secret_exposure.py',
              '    for value in details.get("marker_classes", []) if isinstance(details.get("marker_classes"), list) else []:\n',
              '    detail_markers = details.get("marker_classes", [])\n    for value in (detail_markers if isinstance(detail_markers, list) else []):\n',
          )

          # Avoid placeholder-like synthetic material in the regression fixtures.
          p = Path('tests/test_family_analyzer_secret_exposure_v881.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('access = "AKIA" + "A" * 16\n        secret = "B" * 40', 'access = "AKIA1234567890ABCDEF"\n        secret = "Ab3dEf5hIj7lMn9pQr2tUv4xYz6Bcd8Fgh0Jkl2N"')
          text = text.replace('token = "eyJ" + "A" * 20 + "." + "B" * 20 + "." + "C" * 20', 'token = "eyJAbCdEfGhIjKlMnOpQr.StUvWxYz0123456789.A1b2C3d4E5f6G7h8"')
          p.write_text(text, encoding='utf-8')

          # Production scan: classify stored JS blobs offline and persist only
          # fingerprinted/redacted observations. No provider request is introduced.
          replace_once(
              'app/analysis_engine.py',
              'from behavioral_intelligence import generate_behavioral_candidates, generate_behavioral_intelligence\n',
              'from behavioral_intelligence import generate_behavioral_candidates, generate_behavioral_intelligence\nfrom family_analyzers.secret_exposure import detect_redacted_secret_material\n',
          )
          replace_once(
              'app/analysis_engine.py',
              '        compact = text[:5_000_000]\n        sources = [(name, match.start()) for name, pattern in source_patterns.items() for match in pattern.finditer(compact)]\n',
              '''        compact = text[:5_000_000]\n        for observation in detect_redacted_secret_material(compact):\n            db.execute(\n                "INSERT OR REPLACE INTO secret_intelligence(analysis_id,target,run_id,js_url,secret_kind,value_fingerprint,confidence,assessment,reasons_json,created_at) VALUES(?,?,?,?,?,?,?,?,?,?)",\n                (\n                    analysis_id, target, run_id, row["url"],\n                    str(observation.get("secret_kind") or "credential_material"),\n                    str(observation.get("value_fingerprint") or ""),\n                    parse_int(observation.get("confidence"), 0),\n                    str(observation.get("assessment") or "candidate"),\n                    json_dumps(observation.get("reasons") if isinstance(observation.get("reasons"), list) else []),\n                    utc_now(),\n                ),\n            )\n            secret_count += 1\n        sources = [(name, match.start()) for name, pattern in source_patterns.items() for match in pattern.finditer(compact)]\n''',
          )

          # Candidate Engine integration.
          path = 'app/bug_candidates.py'
          replace_once(
              path,
              'from family_analyzers.postmessage_trust import analyze_postmessage_trust_signal, is_postmessage_source\n',
              'from family_analyzers.postmessage_trust import analyze_postmessage_trust_signal, is_postmessage_source\nfrom family_analyzers.secret_exposure import analyze_secret_exposure_signal\n',
          )
          replace_once(
              path,
              'CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "1.11.0"',
              'CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "1.12.0"',
          )
          replace_once(
              path,
              '    "source_map_exposure": {\n        "source_map_publicly_reachable",\n        "sensitive_source_content_observed",\n    },\n}',
              '    "source_map_exposure": {\n        "source_map_publicly_reachable",\n        "sensitive_source_content_observed",\n    },\n    "secret_exposure": {\n        "credential_material_confirmed",\n        "live_secret_context",\n    },\n}',
          )
          replace_once(
              path,
              '_base.FAMILY_EVIDENCE_SCHEMAS["source_map_exposure"] = {\n    "required_any": (\n        ("source_map", "source_map_publicly_reachable"),\n        ("internal_sources", "sensitive_source_content_observed"),\n    ),\n    "label": "source-map surface/public reachability plus internal source structure or sensitive source-content evidence",\n}\nFAMILY_EVIDENCE_SCHEMAS = _base.FAMILY_EVIDENCE_SCHEMAS',
              '_base.FAMILY_EVIDENCE_SCHEMAS["source_map_exposure"] = {\n    "required_any": (\n        ("source_map", "source_map_publicly_reachable"),\n        ("internal_sources", "sensitive_source_content_observed"),\n    ),\n    "label": "source-map surface/public reachability plus internal source structure or sensitive source-content evidence",\n}\n_base.FAMILY_EVIDENCE_SCHEMAS["secret_exposure"] = {\n    "required_any": (\n        ("secret_pattern",),\n        ("context", "credential_material_confirmed", "live_secret_context"),\n    ),\n    "label": "redacted secret-pattern evidence plus concrete exposure context or confirmed credential material",\n}\nFAMILY_EVIDENCE_SCHEMAS = _base.FAMILY_EVIDENCE_SCHEMAS',
          )

          helper = textwrap.dedent(r'''
          def _secret_marker_classes(db: Any, *, target: str, js_url: str) -> list[str]:
              rows = db.all(
                  "SELECT value FROM js_indicators WHERE target=? AND js_url=? AND kind='sensitive_marker'",
                  (target, js_url),
              )
              classes: set[str] = set()
              for row in rows:
                  label = str(row["value"] or "").split(":count=", 1)[0].strip().lower()
                  if label:
                      classes.add(label)
              return sorted(classes)


          def _record_secret_static_hypothesis(
              db: Any,
              *,
              analysis_id: str,
              run_id: str,
              rows: list[Mapping[str, Any]],
          ) -> bool:
              if not rows:
                  return False
              target = str(rows[0]["target"] or "")
              js_url = str(rows[0]["js_url"] or "")
              observations: list[dict[str, Any]] = []
              max_confidence = 0
              for row in rows:
                  confidence = _base.parse_int(row["confidence"], 0)
                  max_confidence = max(max_confidence, confidence)
                  reasons = _base._loads(row["reasons_json"], [])
                  observations.append({
                      "secret_kind": str(row["secret_kind"] or ""),
                      "value_fingerprint": str(row["value_fingerprint"] or ""),
                      "confidence": confidence,
                      "assessment": str(row["assessment"] or "candidate"),
                      "reasons": reasons if isinstance(reasons, list) else [],
                  })
              dedicated = analyze_secret_exposure_signal(
                  db,
                  analysis_id=analysis_id,
                  target=target,
                  js_url=js_url,
                  observations=observations,
                  marker_classes=_secret_marker_classes(db, target=target, js_url=js_url),
                  details={},
                  business_context="general",
              )
              if not dedicated:
                  return False
              family_meta = dict(dedicated.get("family_analyzer") or {})
              support = [dict(item) for item in dedicated.get("support", []) if isinstance(item, Mapping)]
              contradict = [dict(item) for item in dedicated.get("contradict", []) if isinstance(item, Mapping)]
              source_ref = f"secret:{js_url}"
              hypothesis = _ORIGINAL_RECORD_HYPOTHESIS(
                  db,
                  analysis_id=analysis_id,
                  source_run_id=run_id,
                  target=target,
                  alert_id=None,
                  asset="",
                  endpoint=js_url,
                  source_ref=source_ref,
                  family="secret_exposure",
                  variant=str(dedicated.get("variant") or "secret_pattern_surface"),
                  support=support,
                  contradict=contradict,
                  missing=[str(item) for item in dedicated.get("missing", []) if str(item)],
                  rule_ids=[str(item) for item in dedicated.get("rule_ids", []) if str(item)],
                  summary=str(dedicated.get("summary") or "Credential/token exposure hypothesis."),
              )
              if family_meta:
                  hypothesis = _persist_family_meta(db, hypothesis, family_meta)
              if not bool(hypothesis.get("assessment", {}).get("admitted")):
                  return False

              support = hypothesis["support"]
              contradict = hypothesis["contradict"]
              direct = bool(dedicated.get("direct"))
              likelihood = _base._clamp(
                  34 + max_confidence * 0.45 + (18 if direct else 0)
                  + sum(_base.parse_int(item.get("weight"), 0) for item in contradict)
              )
              candidate_id = _base._insert_candidate(
                  db,
                  analysis_id=analysis_id,
                  source_run_id=run_id,
                  target=target,
                  alert_id=None,
                  asset="",
                  endpoint=js_url,
                  source_ref=source_ref,
                  family="secret_exposure",
                  variant=str(dedicated.get("variant") or "credential_material_candidate"),
                  likelihood=likelihood,
                  evidence_strength=_evidence_strength_with_family_directness(
                      max_confidence, support, contradict, direct=direct
                  ),
                  impact_potential=_base._impact(_base.BUG_FAMILIES["secret_exposure"]["impact"], "general"),
                  support=support,
                  contradict=contradict,
                  missing=hypothesis["missing"],
                  rule_ids=hypothesis["rule_ids"],
                  summary=str(dedicated.get("summary") or "Redacted credential/token material is exposed in client-delivered JavaScript."),
              )
              _base.mark_promoted(db, analysis_id, hypothesis["hypothesis_fingerprint"], candidate_id)
              return True
          ''').strip() + '\n\n'
          replace_once(path, '\nclass _MigratedStaticFilteredDatabase:\n', '\n' + helper + 'class _MigratedStaticFilteredDatabase:\n')
          replace_once(
              path,
              '        if "from source_map_intelligence" in lowered:\n            return []\n        if "from js_dataflows" not in lowered:\n',
              '        if "from source_map_intelligence" in lowered:\n            return []\n        if "from secret_intelligence" in lowered:\n            return []\n        if "from js_dataflows" not in lowered:\n',
          )
          replace_once(
              path,
              '    source_map_rows = db.all(f"SELECT * FROM source_map_intelligence WHERE analysis_id=?{target_clause}", tuple(params))\n    migrated_count = 0\n',
              '''    secret_rows = db.all(f"SELECT * FROM secret_intelligence WHERE analysis_id=?{target_clause}", tuple(params))\n    grouped_secrets: dict[tuple[str, str], list[Mapping[str, Any]]] = {}\n    for row in secret_rows:\n        grouped_secrets.setdefault((str(row["target"] or ""), str(row["js_url"] or "")), []).append(row)\n    migrated_count = 0\n    for grouped_rows in grouped_secrets.values():\n        if _record_secret_static_hypothesis(db, analysis_id=analysis_id, run_id=run_id, rows=grouped_rows):\n            migrated_count += 1\n\n    source_map_rows = db.all(f"SELECT * FROM source_map_intelligence WHERE analysis_id=?{target_clause}", tuple(params))\n''',
          )
          PY

      - name: Sync router regression contracts and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          for p in sorted(Path('tests').glob('test_family_analyzer_*_v*.py')):
              if p.name == 'test_family_analyzer_secret_exposure_v881.py':
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('test_router_registers_thirteen_dedicated_families_without_fallback', 'test_router_registers_fourteen_dedicated_families_without_fallback')
              text = text.replace('self.assertEqual(status["registered_count"], 13)', 'self.assertEqual(status["registered_count"], 14)')
              text = text.replace('self.assertEqual(status["pending_count"], 8)', 'self.assertEqual(status["pending_count"], 7)')
              text = text.replace('            "source_map_exposure",\n        ])', '            "source_map_exposure", "secret_exposure",\n        ])')
              text = text.replace('                "source_map_exposure",\n            ],', '                "source_map_exposure", "secret_exposure",\n            ],')
              text = text.replace('self.assertIsNone(analyzer_for_family("secret_exposure"))', 'self.assertIsNotNone(analyzer_for_family("secret_exposure"))\n        self.assertIsNone(analyzer_for_family("graphql_authorization"))')
              p.write_text(text, encoding='utf-8')

          docs = Path('docs/FAMILY_ANALYZERS.md')
          text = docs.read_text(encoding='utf-8')
          section = textwrap.dedent('''
          ## 14. Secret Exposure

          `family_analyzers.secret_exposure.SecretExposureFamilyAnalyzer`

          Primary reasoning references:

          - CWE-798 — Use of Hard-coded Credentials
          - related CWE-321 — Use of Hard-coded Cryptographic Key
          - related CWE-540 / CWE-200 — sensitive information in source / exposure boundary concepts
          - WSTG-INFO-05 — Review Web Page Content for Information Leakage
          - OWASP Secrets Management Cheat Sheet

          The analyzer separates a secret-looking name from credential material, exposure context, placeholder/public-client-identifier controls, and lifecycle evidence. `apiKey`, `clientSecret`, `accessToken`, `authToken` and `password` names are discovery surface only.

          Stored JavaScript blobs are classified **offline**. The detector fingerprints and immediately discards matched material; it persists only the normalized kind, opaque fingerprint, confidence, assessment and safe reason text. Complete private-key blocks, paired cloud credential material and strong provider-specific secret formats may emit `credential_material_confirmed`. JWT syntax remains a candidate rather than proof of a live or privileged token.

          Examples, templates, provider test credentials and explicitly publishable/public client identifiers are filtered before promotion. `live_secret_context` is accepted only from already-authorized stored lifecycle evidence. The analyzer performs no provider/API request, credential-use request or online validity check.

          ```text
          secret-looking marker / redacted pattern
                  ↓
          hidden hypothesis
                  ↓
          concrete credential-shaped material + client exposure context
                  ↓
          Potential Finding
                  ↓
          structurally confirmed credential material OR authorized stored live-status evidence
                  ↓
          family confirmation-ready state
          ```

          The historical `secret_intelligence → _insert_candidate()` static bypass is migrated to `dedicated analyzer → record_hypothesis → Family Reasoning admission → promotion`. Potential Finding and confirmation remain separate states. Raw credentials, tokens, passwords and private-key bodies are never copied into analyzer output.

          ''')
          if '## 14. Secret Exposure\n' not in text:
              text = text.replace('## Write-up pattern library\n', section + '## Write-up pattern library\n', 1)
          text = text.replace('13. Source-map Exposure\n\nPending dedicated analyzers: **8**.', '13. Source-map Exposure\n14. Secret Exposure\n\nPending dedicated analyzers: **7**.')
          text = text.replace('1. Secret Exposure\n2. GraphQL Authorization\n3. GraphQL Data Exposure\n4. Business Logic\n5. Race Condition\n6. WebSocket Authorization\n7. CORS\n8. Sensitive Caching', '1. GraphQL Authorization\n2. GraphQL Data Exposure\n3. Business Logic\n4. Race Condition\n5. WebSocket Authorization\n6. CORS\n7. Sensitive Caching')
          text = text.replace('DOM-XSS, postMessage Trust and Open Redirect additionally migrate their static JavaScript paths to hypothesis-first handling.', 'DOM-XSS, postMessage Trust, Open Redirect, Source-map Exposure and Secret Exposure additionally migrate their static JavaScript/intelligence paths to hypothesis-first handling.')
          docs.write_text(text, encoding='utf-8')
          PY

      - name: Compile and run Secret regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/family_analyzers/secret_exposure.py app/analysis_engine.py app/bug_candidates.py tests/test_family_analyzer_secret_exposure_v881.py
          python -m unittest tests.test_family_analyzer_secret_exposure_v881 -q

      - name: Run full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Run integration
        run: python tests/integration_runner.py

      - name: Normalize manifest and commit migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          standard_ci = '540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d'
          names = subprocess.check_output(['git', 'ls-files', '-co', '--exclude-standard', '-z']).decode().split('\0')
          lines = []
          for name in sorted(set(x for x in names if x and x != 'MANIFEST.sha256')):
              digest = standard_ci if name == '.github/workflows/ci.yml' else hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}')
          pathlib.Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/analysis_engine.py app/bug_candidates.py app/family_analyzers/secret_exposure.py tests docs/FAMILY_ANALYZERS.md MANIFEST.sha256
          git commit -m 'Wire Secret Exposure family analyzer'
          git push origin HEAD:agent/vulnerability-intelligence-8.6.0
