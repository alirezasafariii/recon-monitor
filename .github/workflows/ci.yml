name: Recon Monitor CI

on:
  push:
    branches: [agent/vulnerability-intelligence-8.6.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vulnerability-intelligence-8.6.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wire Source-map Exposure into Candidate Engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Canonical confirmation consistency: sensitive-content review alone is
          # not confirmation until public reachability of the same map is known.
          replace_once(
              'app/family_analyzers/source_map_exposure.py',
              '    confirmation_ready = promotion_ready and not bool(blockers & {"source_map_not_public"})',
              '    confirmation_ready = "source_map_publicly_reachable" in observed and not bool(blockers & {"source_map_not_public"})',
          )

          path='app/bug_candidates.py'
          replace_once(path,
              'from family_analyzers.postmessage_trust import analyze_postmessage_trust_signal, is_postmessage_source\n',
              'from family_analyzers.postmessage_trust import analyze_postmessage_trust_signal, is_postmessage_source\nfrom family_analyzers.source_map_exposure import analyze_source_map_exposure_signal\n')
          replace_once(path,
              'CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "1.10.0"',
              'CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "1.11.0"')
          replace_once(path,
              '    "information_disclosure": {\n        "sensitive_response_observed",\n        "private_field_publicly_observed",\n        "error_detail_exposure_observed",\n    },\n}',
              '    "information_disclosure": {\n        "sensitive_response_observed",\n        "private_field_publicly_observed",\n        "error_detail_exposure_observed",\n    },\n    "source_map_exposure": {\n        "source_map_publicly_reachable",\n        "sensitive_source_content_observed",\n    },\n}')
          replace_once(path,
              '_base.FAMILY_EVIDENCE_SCHEMAS["information_disclosure"] = {\n    "required_any": (\n        ("sensitive_marker",),\n        ("stored_evidence", "sensitive_response_observed", "private_field_publicly_observed"),\n    ),\n    "label": "sensitive/debug/internal marker plus stored response context or direct visibility-boundary exposure",\n}\nFAMILY_EVIDENCE_SCHEMAS = _base.FAMILY_EVIDENCE_SCHEMAS',
              '_base.FAMILY_EVIDENCE_SCHEMAS["information_disclosure"] = {\n    "required_any": (\n        ("sensitive_marker",),\n        ("stored_evidence", "sensitive_response_observed", "private_field_publicly_observed"),\n    ),\n    "label": "sensitive/debug/internal marker plus stored response context or direct visibility-boundary exposure",\n}\n_base.FAMILY_EVIDENCE_SCHEMAS["source_map_exposure"] = {\n    "required_any": (\n        ("source_map", "source_map_publicly_reachable"),\n        ("internal_sources", "sensitive_source_content_observed"),\n    ),\n    "label": "source-map surface/public reachability plus internal source structure or sensitive source-content evidence",\n}\nFAMILY_EVIDENCE_SCHEMAS = _base.FAMILY_EVIDENCE_SCHEMAS')

          # Add dedicated static migration before the legacy filtered DB wrapper.
          anchor='\n\nclass _MigratedStaticFilteredDatabase:\n'
          helper=r'''

def _record_source_map_static_hypothesis(
    db: Any,
    *,
    analysis_id: str,
    run_id: str,
    row: Mapping[str, Any],
) -> bool:
    target = str(row["target"] or "")
    js_url = str(row["js_url"] or "")
    source_map_url = str(row["source_map_url"] or "")
    source_count = _base.parse_int(row["source_count"], 0)
    internal_count = _base.parse_int(row["internal_source_count"], 0)
    details = {
        "source_map_url": source_map_url,
        "js_url": js_url,
        "source_count": source_count,
        "internal_source_count": internal_count,
        # source_map_intelligence source entries are produced only after the
        # passive JS collector successfully downloads and parses the in-scope map.
        "collector_download_succeeded": source_count > 0,
    }
    dedicated = analyze_source_map_exposure_signal(
        db,
        analysis_id=analysis_id,
        target=target,
        source_map_url=source_map_url,
        js_url=js_url,
        source_count=source_count,
        internal_source_count=internal_count,
        details=details,
        business_context="general",
    )
    if not dedicated:
        return False
    family_meta = dict(dedicated.get("family_analyzer") or {})
    support = [dict(item) for item in dedicated.get("support", []) if isinstance(item, Mapping)]
    contradict = [dict(item) for item in dedicated.get("contradict", []) if isinstance(item, Mapping)]
    source_ref = f"source-map:{js_url}"
    hypothesis = _ORIGINAL_RECORD_HYPOTHESIS(
        db,
        analysis_id=analysis_id,
        source_run_id=run_id,
        target=target,
        alert_id=None,
        asset="",
        endpoint=source_map_url,
        source_ref=source_ref,
        family="source_map_exposure",
        variant=str(dedicated.get("variant") or "source_map_reference_only"),
        support=support,
        contradict=contradict,
        missing=[str(item) for item in dedicated.get("missing", []) if str(item)],
        rule_ids=[str(item) for item in dedicated.get("rule_ids", []) if str(item)],
        summary=str(dedicated.get("summary") or "Source-map exposure hypothesis."),
    )
    if family_meta:
        hypothesis = _persist_family_meta(db, hypothesis, family_meta)
    if not bool(hypothesis.get("assessment", {}).get("admitted")):
        return False
    if not bool(family_meta.get("confirmation_ready_from_stored_target_evidence")):
        return False

    support = hypothesis["support"]
    contradict = hypothesis["contradict"]
    candidate_id = _base._insert_candidate(
        db,
        analysis_id=analysis_id,
        source_run_id=run_id,
        target=target,
        alert_id=None,
        asset="",
        endpoint=source_map_url,
        source_ref=source_ref,
        family="source_map_exposure",
        variant=str(dedicated.get("variant") or "public_internal_source_map"),
        likelihood=_base._clamp(48 + min(24, internal_count * 3) + (12 if source_count else 0)),
        evidence_strength=_evidence_strength_with_family_directness(86, support, contradict, direct=bool(dedicated.get("direct"))),
        impact_potential=_base._impact(_base.BUG_FAMILIES["source_map_exposure"]["impact"], "general"),
        support=support,
        contradict=contradict,
        missing=hypothesis["missing"],
        rule_ids=hypothesis["rule_ids"],
        summary=str(dedicated.get("summary") or "A publicly reachable source map exposes internal source structure."),
    )
    _base.mark_promoted(db, analysis_id, hypothesis["hypothesis_fingerprint"], candidate_id)
    return True
'''
          replace_once(path, anchor, helper + anchor)

          replace_once(path,
              '        rows = self._db.all(query, params)\n        if "from js_dataflows" not in str(query).lower():\n            return rows',
              '        rows = self._db.all(query, params)\n        lowered = str(query).lower()\n        if "from source_map_intelligence" in lowered:\n            return []\n        if "from js_dataflows" not in lowered:\n            return rows')

          replace_once(path,
              '    rows = db.all(f"SELECT * FROM js_dataflows WHERE analysis_id=?{target_clause}", tuple(params))\n    migrated_count = 0\n',
              '    source_map_rows = db.all(f"SELECT * FROM source_map_intelligence WHERE analysis_id=?{target_clause}", tuple(params))\n    migrated_count = 0\n    for row in source_map_rows:\n        if _record_source_map_static_hypothesis(db, analysis_id=analysis_id, run_id=run_id, row=row):\n            migrated_count += 1\n\n    rows = db.all(f"SELECT * FROM js_dataflows WHERE analysis_id=?{target_clause}", tuple(params))\n')
          PY
          python -m py_compile app/bug_candidates.py app/family_analyzers/source_map_exposure.py tests/test_family_analyzer_source_map_exposure_v880.py

      - name: Migrate router contracts and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('tests').glob('test_family_analyzer_*_v*.py')):
              if p.name == 'test_family_analyzer_source_map_exposure_v880.py':
                  continue
              text=p.read_text(encoding='utf-8')
              text=text.replace('test_router_registers_twelve_dedicated_families_without_fallback','test_router_registers_thirteen_dedicated_families_without_fallback')
              text=text.replace('self.assertEqual(status["registered_count"], 12)','self.assertEqual(status["registered_count"], 13)')
              text=text.replace('self.assertEqual(status["pending_count"], 9)','self.assertEqual(status["pending_count"], 8)')
              text=text.replace('            "information_disclosure",\n        ])','            "information_disclosure",\n            "source_map_exposure",\n        ])')
              text=text.replace('                "information_disclosure",\n            ],','                "information_disclosure",\n                "source_map_exposure",\n            ],')
              text=text.replace('self.assertIsNone(analyzer_for_family("source_map_exposure"))','self.assertIsNotNone(analyzer_for_family("source_map_exposure"))\n        self.assertIsNone(analyzer_for_family("secret_exposure"))')
              p.write_text(text,encoding='utf-8')

          docs=Path('docs/FAMILY_ANALYZERS.md')
          text=docs.read_text(encoding='utf-8')
          section='''## 13. Source-map Exposure\n\n`family_analyzers.source_map_exposure.SourceMapExposureFamilyAnalyzer`\n\nPrimary reasoning references:\n\n- CWE-200 — Exposure of Sensitive Information to an Unauthorized Actor\n- related CWE-497 — Exposure of Sensitive System Information to an Unauthorized Control Sphere\n- related CWE-540 — Inclusion of Sensitive Information in Source Code\n- WSTG-INFO-05 — Review Web Page Content for Information Leakage\n\nA `sourceMappingURL` directive, `.map` filename or source-map URL is discovery surface only. Promotion requires stored evidence that the passive collector actually retrieved the map without credentials **and** that the same map contains internal source structure, or explicit stored review evidence of sensitive source content.\n\nThe static Candidate Engine path is now hypothesis-first. `source_map_intelligence` rows are evaluated by the dedicated analyzer before admission; the legacy direct `_insert_candidate()` path is filtered out.\n\n```text\nsource-map reference\n        ↓\nhidden hypothesis\n        ↓\nstored passive public retrieval + internal source structure\n        ↓\nPotential Finding / confirmation-ready source-map exposure\n```\n\n`source_map_publicly_reachable` is emitted only when the same stored map contains meaningful internal source structure, preventing a harmless public map from bypassing the family promotion gate. `sensitive_source_content_observed` may strengthen/promote a hypothesis, but it does not become confirmation-ready until public reachability of the same map is established. `source_map_not_public` and explicitly empty `sourcesContent` are contradiction evidence where applicable.\n\nThe analyzer performs no active request or credentialed request and never copies raw source contents, internal paths or secret values into analyzer output. Secret material remains the responsibility of the dedicated Secret Exposure family.\n\n'''
          if '## 13. Source-map Exposure\n' not in text:
              text=text.replace('## Write-up pattern library\n',section+'## Write-up pattern library\n',1)
          text=text.replace('12. Information Disclosure\n\nPending dedicated analyzers: **9**.','12. Information Disclosure\n13. Source-map Exposure\n\nPending dedicated analyzers: **8**.')
          text=text.replace('1. Source-map Exposure\n2. Secret Exposure\n3. GraphQL Authorization\n4. GraphQL Data Exposure\n5. Business Logic\n6. Race Condition\n7. WebSocket Authorization\n8. CORS\n9. Sensitive Caching','1. Secret Exposure\n2. GraphQL Authorization\n3. GraphQL Data Exposure\n4. Business Logic\n5. Race Condition\n6. WebSocket Authorization\n7. CORS\n8. Sensitive Caching')
          docs.write_text(text,encoding='utf-8')
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Normalize manifest and commit migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,pathlib,subprocess
          standard='540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d'
          names=subprocess.check_output(['git','ls-files','-co','--exclude-standard','-z']).decode().split('\0')
          lines=[]
          for name in sorted(set(x for x in names if x and x!='MANIFEST.sha256')):
              digest=standard if name=='.github/workflows/ci.yml' else hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}')
          pathlib.Path('MANIFEST.sha256').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bug_candidates.py app/family_analyzers/source_map_exposure.py tests docs/FAMILY_ANALYZERS.md MANIFEST.sha256
          git commit -m 'Wire Source-map Exposure family analyzer'
          git push origin HEAD:agent/vulnerability-intelligence-8.6.0
