name: Recon Monitor CI

on:
  push:
    branches: [agent/vulnerability-intelligence-8.6.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vulnerability-intelligence-8.6.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract and apply migration patch
        shell: bash
        run: |
          set -euo pipefail
          git show a37904e9c3dcb6e600f57e372909dabb047729d7:.github/workflows/ci.yml > /tmp/embedded.yml
          python - <<'EXTRACT'
          from pathlib import Path
          import textwrap
          text = Path('/tmp/embedded.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run unit tests"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          code = textwrap.dedent(text[start:end])
          Path('/tmp/path_patch.py').write_text(code, encoding='utf-8')
          EXTRACT
          python /tmp/path_patch.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          standard_ci_sha256 = '540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d'
          names = subprocess.check_output(['git','ls-files','-co','--exclude-standard','-z']).decode().split('\0')
          lines = []
          for name in sorted(set(x for x in names if x and x != 'MANIFEST.sha256')):
              digest = standard_ci_sha256 if name == '.github/workflows/ci.yml' else hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}')
          pathlib.Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/family_reasoning.py app/bug_candidates.py app/family_analyzers docs/FAMILY_ANALYZERS.md tests MANIFEST.sha256
          git commit -m 'Add dedicated Path Traversal family analyzer'
          git push origin HEAD:agent/vulnerability-intelligence-8.6.0
