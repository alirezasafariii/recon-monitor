name: Recon Monitor CI

on:
  push:
    branches: [agent/vulnerability-intelligence-8.6.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vulnerability-intelligence-8.6.0
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply consolidation
        run: python .ci-consolidate.py apply
      - name: Syntax check
        run: python -m py_compile app/bug_candidates.py app/workspace_v7.py app/safe_validation.py tests/test_architecture_single_source_v883.py
      - name: Focused regression
        run: python -m unittest tests.test_architecture_single_source_v883 -v
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration
        run: python tests/integration_runner.py
      - name: Finalize tree and manifest
        run: python .ci-consolidate.py finalize
      - name: Commit consolidated architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate family policy single sources'
          git push origin HEAD:agent/vulnerability-intelligence-8.6.0
