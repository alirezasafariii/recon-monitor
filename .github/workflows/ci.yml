## 11. Path Traversal

`family_analyzers.path_traversal.PathTraversalFamilyAnalyzer`

Primary reasoning references:

- CWE-22 — Improper Limitation of a Pathname to a Restricted Directory (Path Traversal)
- related CWE-23 — Relative Path Traversal
- related CWE-36 — Absolute Path Traversal
- WSTG-ATHZ-01 — Testing Directory Traversal File Include

The algorithm separates five questions:

1. **Path surface** — identify a concrete user-influenced path/filename/archive-member/storage-path field plus a file-system-relevant operation.
2. **Expected root policy** — document the intended base/root directory, canonicalization and containment policy before deciding whether a path is unsafe.
3. **Controlled boundary observation** — promotion requires stored behavior from an explicitly controlled, non-sensitive test resource showing that the path resolved outside the intended root and reached the file operation.
4. **Enforcement review** — canonicalization, real-path resolution, base-directory containment, absolute-path rejection and archive-member normalization are contradiction evidence when actually enforced.
5. **Confirmation boundary** — confirmation is stricter than promotion and requires the same controlled observation to establish out-of-root access/write behavior or a canonicalization/root-containment bypass tied to the operation.

Structural `path_parameter` / `filename_field` / `storage_path` plus file-operation signals intentionally share **one evidence root** (`path_traversal_structural_surface`). They therefore remain a hidden hypothesis by themselves.

Family-specific evidence is split by certainty:

- `path_escape_observed` — a controlled non-sensitive path expected to remain contained or be rejected resolved outside the intended root and reached a file operation; enough for a **Potential Finding**, not confirmation by itself.
- `path_boundary_differential` — expected containment/rejection differs from stored observed behavior for that same controlled resource.
- `canonicalization_bypass_observed` — the same direct observation records an actual canonicalization/root-containment bypass; confirmation-ready.
- `out_of_root_file_access_observed` — the same controlled observation records access to a test-owned non-sensitive resource outside the intended root; confirmation-ready.
- `out_of_root_file_write_observed` — stored evidence records a test-owned non-sensitive resource written outside the intended root; confirmation-ready, while the analyzer itself performs no write.

Contradicting controls are `canonicalization_enforced` and `base_directory_enforced`.

The Candidate Engine path is hypothesis-first:

```text
path/filename + file operation
        ↓
hidden hypothesis
        ↓
dedicated Path Traversal analyzer
        ↓
controlled non-sensitive root escape
        ↓
Potential Finding
        ↓
out-of-root access/write or canonicalization-boundary bypass
        ↓
family confirmation-ready state
```

The analyzer is read-only over stored observations. It performs **no active request**, no filesystem read/write, no archive extraction, no sensitive-path request and no traversal-payload generation. File Upload and Information Disclosure remain neighboring families and are not inferred from traversal surface alone.

'''
          text = text.replace("\n## Write-up pattern library\n", "\n" + section + "## Write-up pattern library\n", 1)
          text = text.replace("SSRF and File Upload / Import migrate their alert/endpoint surfaces through dedicated analyzers before admission, so structural remote-fetch or upload/import semantics remain hidden until independent stored target behavior exists.", "SSRF, File Upload / Import and Path Traversal migrate their alert/endpoint surfaces through dedicated analyzers before admission, so structural remote-fetch, upload/import or path/file-operation semantics remain hidden until independent stored target behavior exists.")
          text = text.replace("10. File Upload / Import\n\nPending dedicated analyzers: **11**.", "10. File Upload / Import\n11. Path Traversal\n\nPending dedicated analyzers: **10**.")
          text = text.replace("1. Path Traversal\n2. Information Disclosure\n3. Source-map Exposure\n4. Secret Exposure\n5. GraphQL Authorization\n6. GraphQL Data Exposure\n7. Business Logic\n8. Race Condition\n9. WebSocket Authorization\n10. CORS\n11. Sensitive Caching", "1. Information Disclosure\n2. Source-map Exposure\n3. Secret Exposure\n4. GraphQL Authorization\n5. GraphQL Data Exposure\n6. Business Logic\n7. Race Condition\n8. WebSocket Authorization\n9. CORS\n10. Sensitive Caching")
