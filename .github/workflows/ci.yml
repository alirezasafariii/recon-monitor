name: Recon Monitor CI

on:
  push:
    branches: [agent/vulnerability-intelligence-8.6.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vulnerability-intelligence-8.6.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wire Information Disclosure into Candidate Engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'app/bug_candidates.py'
          replace_once(path,
              'from family_analyzers.file_upload import analyze_file_upload_signal\n',
              'from family_analyzers.file_upload import analyze_file_upload_signal\nfrom family_analyzers.information_disclosure import analyze_information_disclosure_signal\n')
          replace_once(path,
              'CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "1.9.0"',
              'CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "1.10.0"')
          replace_once(path,
              '    "path_traversal": {\n        "path_escape_observed",\n        "path_boundary_differential",\n        "canonicalization_bypass_observed",\n        "out_of_root_file_access_observed",\n        "out_of_root_file_write_observed",\n    },\n}',
              '    "path_traversal": {\n        "path_escape_observed",\n        "path_boundary_differential",\n        "canonicalization_bypass_observed",\n        "out_of_root_file_access_observed",\n        "out_of_root_file_write_observed",\n    },\n    "information_disclosure": {\n        "sensitive_response_observed",\n        "private_field_publicly_observed",\n        "error_detail_exposure_observed",\n    },\n}')
          replace_once(path,
              '_base.FAMILY_EVIDENCE_SCHEMAS["path_traversal"] = {\n    "required_any": (\n        ("path_parameter", "filename_field", "storage_path"),\n        ("file_operation", "download_operation", "import_operation", "archive_operation", "upload_operation", "path_escape_observed", "path_boundary_differential", "canonicalization_bypass_observed", "out_of_root_file_access_observed", "out_of_root_file_write_observed"),\n    ),\n    "label": "user-influenced path/filename plus file operation or stored filesystem-boundary differential",\n}\nFAMILY_EVIDENCE_SCHEMAS = _base.FAMILY_EVIDENCE_SCHEMAS',
              '_base.FAMILY_EVIDENCE_SCHEMAS["path_traversal"] = {\n    "required_any": (\n        ("path_parameter", "filename_field", "storage_path"),\n        ("file_operation", "download_operation", "import_operation", "archive_operation", "upload_operation", "path_escape_observed", "path_boundary_differential", "canonicalization_bypass_observed", "out_of_root_file_access_observed", "out_of_root_file_write_observed"),\n    ),\n    "label": "user-influenced path/filename plus file operation or stored filesystem-boundary differential",\n}\n_base.FAMILY_EVIDENCE_SCHEMAS["information_disclosure"] = {\n    "required_any": (\n        ("sensitive_marker",),\n        ("stored_evidence", "sensitive_response_observed", "private_field_publicly_observed"),\n    ),\n    "label": "sensitive/debug/internal marker plus stored response context or direct visibility-boundary exposure",\n}\nFAMILY_EVIDENCE_SCHEMAS = _base.FAMILY_EVIDENCE_SCHEMAS')
          replace_once(path,
              '    "file_upload",\n    "path_traversal",\n}',
              '    "file_upload",\n    "path_traversal",\n    "information_disclosure",\n}')
          replace_once(path,
              '    if family == "path_traversal":\n        return analyze_path_traversal_signal(\n            db, analysis_id=analysis_id, target=target, endpoint=stored["endpoint"], method=stored["method"],\n            body_fields=stored["body_fields"], query_fields=stored["query_fields"], path_fields=stored["path_fields"],\n            details=details, business_context=stored["business_context"], semantic_text=stored["semantic_text"],\n        )\n\n    return None',
              '    if family == "path_traversal":\n        return analyze_path_traversal_signal(\n            db, analysis_id=analysis_id, target=target, endpoint=stored["endpoint"], method=stored["method"],\n            body_fields=stored["body_fields"], query_fields=stored["query_fields"], path_fields=stored["path_fields"],\n            details=details, business_context=stored["business_context"], semantic_text=stored["semantic_text"],\n        )\n\n    if family == "information_disclosure":\n        return analyze_information_disclosure_signal(\n            db, analysis_id=analysis_id, target=target, endpoint=stored["endpoint"], method=stored["method"],\n            body_fields=stored["body_fields"], query_fields=stored["query_fields"], path_fields=stored["path_fields"],\n            details=details, business_context=stored["business_context"], semantic_text=stored["semantic_text"],\n        )\n\n    return None')
          PY
          python -m py_compile app/bug_candidates.py app/family_analyzers/information_disclosure.py

      - name: Migrate router regression contracts and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for p in sorted(Path('tests').glob('test_family_analyzer_*_v*.py')):
              if p.name == 'test_family_analyzer_information_disclosure_v879.py':
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('test_router_registers_eleven_dedicated_families_without_fallback', 'test_router_registers_twelve_dedicated_families_without_fallback')
              text = text.replace('self.assertEqual(status["registered_count"], 11)', 'self.assertEqual(status["registered_count"], 12)')
              text = text.replace('self.assertEqual(status["pending_count"], 10)', 'self.assertEqual(status["pending_count"], 9)')
              text = text.replace('            "path_traversal",\n        ])', '            "path_traversal",\n            "information_disclosure",\n        ])')
              text = text.replace('                "path_traversal",\n            ],', '                "path_traversal",\n                "information_disclosure",\n            ],')
              text = text.replace(
                  'self.assertIsNone(analyzer_for_family("information_disclosure"))',
                  'self.assertIsNotNone(analyzer_for_family("information_disclosure"))\n        self.assertIsNone(analyzer_for_family("source_map_exposure"))'
              )
              p.write_text(text, encoding='utf-8')

          docs = Path('docs/FAMILY_ANALYZERS.md')
          text = docs.read_text(encoding='utf-8')
          section = '''## 12. Information Disclosure\n\n`family_analyzers.information_disclosure.InformationDisclosureFamilyAnalyzer`\n\nPrimary reasoning references:\n\n- CWE-200 — Exposure of Sensitive Information to an Unauthorized Actor\n- related CWE-209 — Generation of Error Message Containing Sensitive Information\n- related CWE-497 — Exposure of Sensitive System Information to an Unauthorized Control Sphere\n- related CWE-1295 — Debug Messages Revealing Unnecessary Information\n- WSTG-ERRH-01 — Testing for Improper Error Handling\n- WSTG-ERRH-02 — Testing for Stack Traces\n- WSTG-INFO-05 — Review Web Page Content for Information Leakage\n\nThe analyzer separates marker discovery from actual visibility-boundary evidence. Debug strings, stack-trace markers, framework/server versions, internal-looking paths, `token`/`secret` names and source-map references remain structural surface only. `sensitive_marker` and `stored_evidence` deliberately share one evidence root, so marker persistence alone cannot promote a Potential Finding.\n\nDirect target evidence requires stored response behavior showing explicitly sensitive/private information outside its intended audience. The canonical direct types are `sensitive_response_observed` and `private_field_publicly_observed`; error/debug disclosure may additionally emit `error_detail_exposure_observed` when the stored category is actually sensitive internal detail rather than a generic error status.\n\n`intended_public_metadata` and `redaction_enforced` are contradictions. Authorized-owner visibility does not become disclosure. Secret/token-only observations prefer `secret_exposure`, source-map-only observations prefer `source_map_exposure`, and GraphQL-specific excessive-field exposure remains a neighboring GraphQL family.\n\n```text\ndebug/internal/sensitive-looking marker\n        ↓\nhidden hypothesis\n        ↓\nstored response + explicit non-public policy + public/unauthorized visibility\n        ↓\nSensitive Information Disclosure Potential Finding\n        ↓\nanalyst confirmation using minimal redacted evidence\n```\n\nThe analyzer stores field names, categories and booleans only. It performs no active request, credential validation, private-data retrieval or payload generation, and it never copies raw sensitive values into analyzer output.\n\n'''
          if '## 12. Information Disclosure\n' not in text:
              text = text.replace('## Write-up pattern library\n', section + '## Write-up pattern library\n', 1)
          text = text.replace(
              'SSRF, File Upload / Import and Path Traversal migrate their alert/endpoint surfaces through dedicated analyzers before admission, so structural remote-fetch, upload/import or path/file-operation semantics remain hidden until independent stored target behavior exists.',
              'SSRF, File Upload / Import, Path Traversal and Information Disclosure migrate their alert/endpoint surfaces through dedicated analyzers before admission, so structural remote-fetch, upload/import, path/file-operation or sensitive-marker semantics remain hidden until independent stored target behavior exists.'
          )
          text = text.replace('11. Path Traversal\n\nPending dedicated analyzers: **10**.', '11. Path Traversal\n12. Information Disclosure\n\nPending dedicated analyzers: **9**.')
          text = text.replace('1. Information Disclosure\n2. Source-map Exposure\n3. Secret Exposure\n4. GraphQL Authorization\n5. GraphQL Data Exposure\n6. Business Logic\n7. Race Condition\n8. WebSocket Authorization\n9. CORS\n10. Sensitive Caching', '1. Source-map Exposure\n2. Secret Exposure\n3. GraphQL Authorization\n4. GraphQL Data Exposure\n5. Business Logic\n6. Race Condition\n7. WebSocket Authorization\n8. CORS\n9. Sensitive Caching')
          docs.write_text(text, encoding='utf-8')
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Normalize manifest and commit migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          standard_ci_sha256 = '540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d'
          names = subprocess.check_output(['git','ls-files','-co','--exclude-standard','-z']).decode().split('\0')
          lines = []
          for name in sorted(set(x for x in names if x and x != 'MANIFEST.sha256')):
              digest = standard_ci_sha256 if name == '.github/workflows/ci.yml' else hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}')
          pathlib.Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bug_candidates.py tests docs/FAMILY_ANALYZERS.md MANIFEST.sha256
          git commit -m 'Wire Information Disclosure family analyzer'
          git push origin HEAD:agent/vulnerability-intelligence-8.6.0
