name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"

      - name: Print calibration baseline
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'app')
          from analysis_benchmark import run_default_benchmark
          report = run_default_benchmark('.')
          profile = report['calibration_profile']
          summary = {
              'coverage': report['coverage'],
              'threshold_70_metrics': report['global_metrics'],
              'selected_global_threshold': profile['global']['threshold'],
              'selected_global_metrics': profile['global']['metrics'],
              'global_ready': profile['global']['ready'],
              'score_brier_diagnostic': profile['global']['diagnostics']['score_brier_diagnostic'],
              'expected_calibration_error': profile['global']['diagnostics']['expected_calibration_error'],
              'family_profiles_ready': sum(1 for value in profile['families'].values() if value['ready']),
              'activation': profile['activation'],
          }
          print('CALIBRATION_BASELINE=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Verify manifest
        shell: bash
        run: sha256sum --strict -c MANIFEST.sha256

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION="$(./recon-monitor.sh --version)"
          CORE_VERSION="$(python -c 'import sys; sys.path.insert(0, "app"); from core import APP_VERSION; print(APP_VERSION)')"
          test "$CLI_VERSION" = "$CORE_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$CLI_VERSION"
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Integration test
        run: python tests/integration_runner.py
