name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"

      - name: Inspect calibration misses
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'app')
          from analysis_benchmark import load_golden_cases, replay_golden_cases, benchmark_report
          cases = load_golden_cases([
              'tests/fixtures/vulnerability_intelligence_golden_v1.json',
              'tests/fixtures/vulnerability_intelligence_phase2_golden_v2.json',
          ])
          records = replay_golden_cases(cases)
          report = benchmark_report(records)
          threshold = report['calibration_profile']['global']['threshold']
          positives = sorted(
              [r for r in records if r['label']],
              key=lambda r: (r['score'], r['family'])
          )
          negatives = sorted(
              [r for r in records if not r['label']],
              key=lambda r: (-r['score'], r['family'])
          )
          print('SELECTED_THRESHOLD=' + str(threshold))
          print('POSITIVE_MISSES=' + json.dumps([
              {'family': r['family'], 'score': r['score'], 'evidence': r['target_evidence_confidence'], 'signals': r['signals'], 'top_family': r['top_family']}
              for r in positives if r['score'] < threshold
          ], sort_keys=True))
          print('LOWEST_POSITIVES=' + json.dumps([
              {'family': r['family'], 'score': r['score'], 'evidence': r['target_evidence_confidence'], 'top_family': r['top_family']}
              for r in positives[:15]
          ], sort_keys=True))
          print('HIGHEST_NEGATIVES=' + json.dumps([
              {'family': r['family'], 'score': r['score'], 'evidence': r['target_evidence_confidence'], 'top_family': r['top_family']}
              for r in negatives[:15]
          ], sort_keys=True))
          PY

      - name: Verify manifest
        shell: bash
        run: sha256sum --strict -c MANIFEST.sha256

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION="$(./recon-monitor.sh --version)"
          CORE_VERSION="$(python -c 'import sys; sys.path.insert(0, "app"); from core import APP_VERSION; print(APP_VERSION)')"
          test "$CLI_VERSION" = "$CORE_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$CLI_VERSION"
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Integration test
        run: python tests/integration_runner.py
