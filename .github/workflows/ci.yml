name: Recon Monitor Family Completion

on:
  push:
    branches: [agent/vulnerability-intelligence-8.6.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vulnerability-intelligence-8.6.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract completion regression and docs blocks
        shell: bash
        run: |
          set -euo pipefail
          git show 9bb4e8a55bc44bad9e91e4dd74f69a5e8f9c6122:.github/workflows/ci.yml > /tmp/previous-completion.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/previous-completion.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          blocks = []
          pos = 0
          while True:
              try:
                  start = text.index(marker, pos) + len(marker)
              except ValueError:
                  break
              end = text.index(end_marker, start)
              raw = text[start:end]
              code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
              blocks.append(code)
              pos = end + len(end_marker)
          if len(blocks) < 5:
              raise SystemExit(f'expected >=5 python blocks, found {len(blocks)}')
          Path('/tmp/protocol.py').write_text(blocks[1], encoding='utf-8')
          Path('/tmp/tests.py').write_text(blocks[2], encoding='utf-8')
          Path('/tmp/docs.py').write_text(blocks[3], encoding='utf-8')
          PY

      - name: Wire all remaining analyzers structurally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('app/bug_candidates.py')
          text = p.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'missing anchor: {old[:180]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from family_analyzers.bfla import analyze_bfla_signal\n',
              'from family_analyzers.bfla import analyze_bfla_signal\nfrom family_analyzers.business_logic import analyze_business_logic_signal\nfrom family_analyzers.cors_misconfiguration import analyze_cors_misconfiguration_signal\n',
          )
          replace_once(
              'from family_analyzers.file_upload import analyze_file_upload_signal\n',
              'from family_analyzers.file_upload import analyze_file_upload_signal\nfrom family_analyzers.graphql_authorization import analyze_graphql_authorization_signal\nfrom family_analyzers.graphql_data_exposure import analyze_graphql_data_exposure_signal\n',
          )
          replace_once(
              'from family_analyzers.postmessage_trust import analyze_postmessage_trust_signal, is_postmessage_source\n',
              'from family_analyzers.postmessage_trust import analyze_postmessage_trust_signal, is_postmessage_source\nfrom family_analyzers.race_condition import analyze_race_condition_signal\n',
          )
          replace_once(
              'from family_analyzers.secret_exposure import analyze_secret_exposure_signal\n',
              'from family_analyzers.secret_exposure import analyze_secret_exposure_signal\nfrom family_analyzers.sensitive_caching import analyze_sensitive_caching_signal\n',
          )
          replace_once(
              'from family_analyzers.ssrf import analyze_ssrf_signal\n',
              'from family_analyzers.ssrf import analyze_ssrf_signal\nfrom family_analyzers.websocket_authorization import analyze_websocket_authorization_signal\n',
          )
          replace_once('CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "1.12.0"', 'CANDIDATE_FAMILY_ANALYZER_INTEGRATION_VERSION = "2.0.0"')

          old = '''    "secret_exposure": {
              "credential_material_confirmed",
              "live_secret_context",
          },
          }'''.replace('          ', '')
          new = '''    "secret_exposure": {
              "credential_material_confirmed",
              "live_secret_context",
          },
          "graphql_authorization": {"graphql_unauthorized_object_response", "graphql_authorization_differential"},
          "graphql_data_exposure": {"sensitive_graphql_response_observed", "field_authorization_differential"},
          "business_logic": {"workflow_invariant_violation", "invalid_transition_accepted", "server_value_override_observed"},
          "race_condition": {"duplicate_operation_observed", "non_atomic_transition_observed"},
          "websocket_authorization": {"unauthorized_subscription_observed", "channel_authorization_differential"},
          "cors_misconfiguration": {"untrusted_origin_allowed", "credentialed_cross_origin_read"},
          "sensitive_caching": {"shared_cache_sensitive_response", "cross_user_cache_observed"},
          }'''.replace('          ', '')
          replace_once(old, new)

          replace_once(
              '    "information_disclosure",\n}\n\n_INCOMPLETE_STATIC_GROUPS',
              '    "information_disclosure",\n    "business_logic",\n    "race_condition",\n    "cors_misconfiguration",\n    "sensitive_caching",\n}\n\n_INCOMPLETE_STATIC_GROUPS',
          )

          start = text.index('def _dedicated_family_result(')
          return_pos = text.index('\n    return None\n', start)
          alert_branches = '''

              if family == "business_logic":
                  return analyze_business_logic_signal(
                      db, analysis_id=analysis_id, target=target, endpoint=stored["endpoint"], method=stored["method"],
                      body_fields=stored["body_fields"], query_fields=stored["query_fields"], path_fields=stored["path_fields"],
                      details=details, business_context=stored["business_context"], semantic_text=stored["semantic_text"],
                  )
              if family == "race_condition":
                  return analyze_race_condition_signal(
                      db, analysis_id=analysis_id, target=target, endpoint=stored["endpoint"], method=stored["method"],
                      body_fields=stored["body_fields"], query_fields=stored["query_fields"], path_fields=stored["path_fields"],
                      details=details, business_context=stored["business_context"], semantic_text=stored["semantic_text"],
                  )
              if family == "cors_misconfiguration":
                  return analyze_cors_misconfiguration_signal(
                      db, analysis_id=analysis_id, target=target, endpoint=stored["endpoint"], details=details,
                      business_context=stored["business_context"], semantic_text=stored["semantic_text"],
                  )
              if family == "sensitive_caching":
                  return analyze_sensitive_caching_signal(
                      db, analysis_id=analysis_id, target=target, endpoint=stored["endpoint"], details=details,
                      business_context=stored["business_context"], semantic_text=stored["semantic_text"],
                  )
          '''.replace('          ', '')
          text = text[:return_pos] + alert_branches + text[return_pos:]

          helper = r'''
          def _graphql_runtime_details(db: Any, *, analysis_id: str, target: str, js_url: str) -> dict[str, Any]:
              return _semantic_runtime_details(
                  db, analysis_id=analysis_id, target=target, js_url=js_url,
                  unit_types=("graphql_authorization_observation", "graphql_data_exposure_observation", "graphql_field_observation", "graphql_runtime_observation"),
                  result_key="graphql_runtime_observations",
              )


          def _websocket_runtime_details(db: Any, *, analysis_id: str, target: str, js_url: str) -> dict[str, Any]:
              return _semantic_runtime_details(
                  db, analysis_id=analysis_id, target=target, js_url=js_url,
                  unit_types=("websocket_authorization_observation", "websocket_runtime_observation", "subscription_observation", "channel_authorization_observation"),
                  result_key="websocket_runtime_observations",
              )


          def _promote_static_family_result(db: Any, *, analysis_id: str, run_id: str, target: str, endpoint: str, source_ref: str, family: str, dedicated: Mapping[str, Any], confidence: int) -> bool:
              family_meta = dict(dedicated.get("family_analyzer") or {})
              support = [dict(item) for item in dedicated.get("support", []) if isinstance(item, Mapping)]
              contradict = [dict(item) for item in dedicated.get("contradict", []) if isinstance(item, Mapping)]
              hypothesis = _ORIGINAL_RECORD_HYPOTHESIS(
                  db, analysis_id=analysis_id, source_run_id=run_id, target=target, alert_id=None, asset="",
                  endpoint=endpoint, source_ref=source_ref, family=family,
                  variant=str(dedicated.get("variant") or "stored_surface"), support=support, contradict=contradict,
                  missing=[str(item) for item in dedicated.get("missing", []) if str(item)],
                  rule_ids=[str(item) for item in dedicated.get("rule_ids", []) if str(item)],
                  summary=str(dedicated.get("summary") or f"{family} hypothesis."),
              )
              if family_meta:
                  hypothesis = _persist_family_meta(db, hypothesis, family_meta)
              if not bool(hypothesis.get("assessment", {}).get("admitted")):
                  return False
              support = hypothesis["support"]
              contradict = hypothesis["contradict"]
              direct = bool(dedicated.get("direct"))
              candidate_id = _base._insert_candidate(
                  db, analysis_id=analysis_id, source_run_id=run_id, target=target, alert_id=None, asset="",
                  endpoint=endpoint, source_ref=source_ref, family=family,
                  variant=str(dedicated.get("variant") or "stored_surface"),
                  likelihood=_base._clamp(30 + confidence * 0.32 + (12 if direct else 0) + sum(_base.parse_int(x.get("weight"), 0) for x in contradict)),
                  evidence_strength=_evidence_strength_with_family_directness(confidence, support, contradict, direct=direct),
                  impact_potential=_base._impact(_base.BUG_FAMILIES[family]["impact"], "general"),
                  support=support, contradict=contradict, missing=hypothesis["missing"], rule_ids=hypothesis["rule_ids"],
                  summary=str(dedicated.get("summary") or f"{family} hypothesis."),
              )
              _base.mark_promoted(db, analysis_id, hypothesis["hypothesis_fingerprint"], candidate_id)
              return True


          def _record_graphql_static_hypotheses(db: Any, *, analysis_id: str, run_id: str, row: Mapping[str, Any]) -> int:
              target = str(row["target"] or "")
              js_url = str(row["js_url"] or "")
              operation_name = str(row["operation_name"] or "")
              operation_type = str(row["operation_type"] or "query")
              confidence = _base.parse_int(row["confidence"], 0)
              identifiers = [str(v) for v in _base._list(_base._loads(row["identifiers_json"], []))]
              sensitive = [str(v) for v in _base._list(_base._loads(row["sensitive_fields_json"], []))]
              runtime = _graphql_runtime_details(db, analysis_id=analysis_id, target=target, js_url=js_url)
              promoted = 0
              if identifiers:
                  dedicated = analyze_graphql_authorization_signal(
                      db, analysis_id=analysis_id, target=target, endpoint="/graphql", js_url=js_url,
                      operation_name=operation_name, operation_type=operation_type, identifiers=identifiers,
                      details=runtime, business_context="general",
                  )
                  if dedicated and _promote_static_family_result(
                      db, analysis_id=analysis_id, run_id=run_id, target=target, endpoint="/graphql",
                      source_ref=f"graphql:{js_url}:{operation_name}", family="graphql_authorization", dedicated=dedicated, confidence=confidence,
                  ):
                      promoted += 1
              if sensitive:
                  dedicated = analyze_graphql_data_exposure_signal(
                      db, analysis_id=analysis_id, target=target, endpoint="/graphql", js_url=js_url,
                      operation_name=operation_name, operation_type=operation_type, sensitive_fields=sensitive,
                      details=runtime, business_context="general",
                  )
                  if dedicated and _promote_static_family_result(
                      db, analysis_id=analysis_id, run_id=run_id, target=target, endpoint="/graphql",
                      source_ref=f"graphql-data:{js_url}:{operation_name}", family="graphql_data_exposure", dedicated=dedicated, confidence=confidence,
                  ):
                      promoted += 1
              return promoted


          def _record_websocket_static_hypothesis(db: Any, *, analysis_id: str, run_id: str, row: Mapping[str, Any]) -> bool:
              target = str(row["target"] or "")
              js_url = str(row["js_url"] or "")
              source = str(row["source_kind"] or "")
              sink = str(row["sink_kind"] or "")
              confidence = _base.parse_int(row["confidence"], 0)
              dedicated = analyze_websocket_authorization_signal(
                  db, analysis_id=analysis_id, target=target, endpoint=js_url, js_url=js_url,
                  source_kind=source, sink_kind=sink, operation="websocket construction or messaging",
                  details=_websocket_runtime_details(db, analysis_id=analysis_id, target=target, js_url=js_url),
                  semantic_text=str(row["snippet"] or ""), business_context="general",
              )
              return bool(dedicated and _promote_static_family_result(
                  db, analysis_id=analysis_id, run_id=run_id, target=target, endpoint=js_url,
                  source_ref=f"js-dataflow:{js_url}:{source}:{sink}", family="websocket_authorization", dedicated=dedicated, confidence=confidence,
              ))


          '''.replace('          ', '')
          replace_once('\nclass _MigratedStaticFilteredDatabase:\n', '\n' + helper + 'class _MigratedStaticFilteredDatabase:\n')

          replace_once(
              '        if "from secret_intelligence" in lowered:\n            return []\n        if "from js_dataflows" not in lowered:\n',
              '        if "from secret_intelligence" in lowered:\n            return []\n        if "from graphql_intelligence" in lowered:\n            return []\n        if "from js_dataflows" not in lowered:\n',
          )
          replace_once(
              '            if is_navigation_sink(sink):\n                continue\n            filtered.append(row)\n',
              '            if is_navigation_sink(sink):\n                continue\n            if sink.strip().lower() == "websocket":\n                continue\n            filtered.append(row)\n',
          )
          replace_once(
              '    source_map_rows = db.all(f"SELECT * FROM source_map_intelligence WHERE analysis_id=?{target_clause}", tuple(params))\n',
              '    graphql_rows = db.all(f"SELECT * FROM graphql_intelligence WHERE analysis_id=?{target_clause}", tuple(params))\n    for row in graphql_rows:\n        migrated_count += _record_graphql_static_hypotheses(db, analysis_id=analysis_id, run_id=run_id, row=row)\n\n    source_map_rows = db.all(f"SELECT * FROM source_map_intelligence WHERE analysis_id=?{target_clause}", tuple(params))\n',
          )
          replace_once(
              '        if is_navigation_sink(sink):\n            if _record_open_redirect_static_hypothesis(db, analysis_id=analysis_id, run_id=run_id, row=row):\n                migrated_count += 1\n            continue\n\n    legacy_count',
              '        if is_navigation_sink(sink):\n            if _record_open_redirect_static_hypothesis(db, analysis_id=analysis_id, run_id=run_id, row=row):\n                migrated_count += 1\n            continue\n        if sink.strip().lower() == "websocket":\n            if _record_websocket_static_hypothesis(db, analysis_id=analysis_id, run_id=run_id, row=row):\n                migrated_count += 1\n            continue\n\n    legacy_count',
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply protocol bypass, tests and docs completion
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/protocol.py
          python /tmp/tests.py
          python /tmp/docs.py

      - name: Compile and run completion regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/family_analyzers/*.py app/bug_candidates.py app/behavioral_intelligence.py tests/test_family_analyzers_completion_v888.py
          python -m unittest tests.test_family_analyzers_completion_v888 -q

      - name: Run full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Run integration
        run: python tests/integration_runner.py

      - name: Commit completed 21-family migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          standard_ci = '540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d'
          names = subprocess.check_output(['git', 'ls-files', '-co', '--exclude-standard', '-z']).decode().split('\0')
          lines = []
          for name in sorted(set(x for x in names if x and x != 'MANIFEST.sha256')):
              digest = standard_ci if name == '.github/workflows/ci.yml' else hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}')
          pathlib.Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bug_candidates.py app/behavioral_intelligence.py app/family_analyzers tests docs/FAMILY_ANALYZERS.md MANIFEST.sha256
          git commit -m 'Complete all 21 dedicated family analyzers'
          git push origin HEAD:agent/vulnerability-intelligence-8.6.0
