name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: Verify normalized manifest source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and diff normalized manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          standard_ci_sha256 = "540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          lines = []
          for name in sorted(path for path in paths if path and path != "MANIFEST.sha256"):
              if name == ".github/workflows/ci.yml":
                  digest = standard_ci_sha256
              else:
                  digest = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}")
          pathlib.Path("normalized-manifest.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          diff -u normalized-manifest.txt MANIFEST.sha256
