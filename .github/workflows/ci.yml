name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"

      - name: Emit normalized manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          standard_ci_sha256 = "540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          print("---BEGIN-MANIFEST---")
          for name in sorted(path for path in paths if path and path != "MANIFEST.sha256"):
              if name == ".github/workflows/ci.yml":
                  digest = standard_ci_sha256
              else:
                  digest = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              print(f"{digest}  {name}")
          print("---END-MANIFEST---")
          PY

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION="$(./recon-monitor.sh --version)"
          CORE_VERSION="$(python -c 'import sys; sys.path.insert(0, "app"); from core import APP_VERSION; print(APP_VERSION)')"
          test "$CLI_VERSION" = "$CORE_VERSION"
