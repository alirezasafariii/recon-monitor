name: Recon Monitor CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    name: Normalize release manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vulnerability-intelligence-8.6.0

      - name: Generate normalized manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          standard_ci_sha256 = "540637cb95ca3a2d6577a0d222a6cdb5d5d892244b305d66f6c1b962bc10484d"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          lines = []
          for name in sorted(path for path in paths if path and path != "MANIFEST.sha256"):
              if name == ".github/workflows/ci.yml":
                  digest = standard_ci_sha256
              else:
                  digest = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}")
          pathlib.Path("MANIFEST.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit normalized manifest when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- MANIFEST.sha256; then
            echo "Manifest already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git commit -m "Normalize release manifest checksums"
          git push origin HEAD:agent/vulnerability-intelligence-8.6.0
