name: Analysis 6.12 Full Suite Diagnostic

on:
  push:
    branches:
      - agent/analysis-engine-6.12-raw-condition-reconstruction

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.12-raw-condition-reconstruction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture unit output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -q > analysis612-unit-failure.txt 2>&1
          status=$?
          echo "exit_status=$status" >> analysis612-unit-failure.txt
          cat analysis612-unit-failure.txt
          exit 0
      - name: Commit diagnostic and self-remove
        shell: bash
        run: |
          rm -f .github/workflows/analysis-612-unit-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Record Analysis 6.12 full-suite diagnostic'
          git push origin HEAD:agent/analysis-engine-6.12-raw-condition-reconstruction
