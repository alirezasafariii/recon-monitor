name: Analysis 6.26 Source Map Candidate Inspect

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print source-map family candidates without engine scoring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmarks/raw/sources/v4_candidates.json').read_text(encoding='utf-8'))
          rows=d['candidates_by_family']['source_map_exposure']
          print('COUNT',len(rows))
          for row in rows:
              print(json.dumps({
                  'root':row.get('source_root'),
                  'project':row.get('source_project'),
                  'summary':row.get('summary'),
                  'cwes':row.get('matched_cwes'),
                  'url':row.get('canonical_advisory_url'),
              },ensure_ascii=False,sort_keys=True))
          PY
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-source-map-candidate-inspect.yml
          git commit -m "Remove Analysis 6.26 source-map candidate inspector"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
