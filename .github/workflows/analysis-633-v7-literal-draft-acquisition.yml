name: Analysis 6.33 V7 Literal Draft Acquisition

on:
  push:
    branches:
      - agent/analysis-engine-6.33-v7-literal-capture
    paths:
      - '.github/workflows/analysis-633-v7-literal-draft-acquisition.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analysis-633-v7-literal-draft-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.33-v7-literal-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source assignment and pre-scoring state
        env: {PYTHONPATH: app}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v7_capture_guard import assert_capture_source_freeze
          g=assert_capture_source_freeze()
          assert g['recomputed_engine_seen_count']==0
          assert g['source_assignment_commit']=='5c2c81075b870fe43db817c59a65f27423012f08'
          p=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_plan.json').read_text())
          assert p['required_capture_count']==144 and p['scoring_executed'] is False and p['first_blind_consumed'] is False
          b=json.loads(Path('benchmarks/raw/sources/v7_boundary_evidence_report.json').read_text())
          assert b['source_count']==36 and b['exact_revision_pair_count']==22
          print({'engine_seen':0,'source_count':36,'planned':144,'scoring':False})
          PY
      - name: Capture exact source neighborhoods
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/v7_source_snippet_capture.py
      - name: Checkpoint source snippet inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_source_snippet_candidates_report.json').read_text())
          assert r['source_count']==36 and r['exact_pair_source_count']==22
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False
          print(r)
          PY
          git config user.name 'github-actions[bot]'; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/raw/sources/v7_source_snippet_candidates.json benchmarks/raw/sources/v7_source_snippet_candidates_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(analysis-633): checkpoint V7 source snippets'
            git push origin HEAD:agent/analysis-engine-6.33-v7-literal-capture
          fi
      - name: Build literal capture drafts without publishing
        env: {PYTHONPATH: app}
        run: python app/v7_capture_draft_build.py
      - name: Verify drafts remain unscored and fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_capture_drafts_report.json').read_text())
          assert r['planned_count']==144
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False
          assert r['third_party_code_executed'] is False and r['target_contact_performed'] is False
          assert r['draft_count'] + r['missing_literal_source_count'] == 144
          print({k:r[k] for k in ('draft_count','missing_literal_source_count','targeted_family_blocked_count','status_counts','scoring_executed')})
          PY
      - name: Full regression suite
        env: {PYTHONPATH: app}
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit draft inventory and strict manifest
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v7_capture_drafts benchmarks/raw/sources/v7_capture_drafts_report.json benchmarks/raw/sources/v7_source_snippet_candidates.json benchmarks/raw/sources/v7_source_snippet_candidates_report.json
          git ls-files -z | python -c 'import sys; x=[v for v in sys.stdin.buffer.read().split(b"\0") if v and v!=b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(x))+b"\0")' | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
          git add MANIFEST.sha256
          git config user.name 'github-actions[bot]'; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then echo 'No V7 draft changes.'; exit 0; fi
          git commit -m 'chore(analysis-633): build V7 literal capture drafts'
          git push origin HEAD:agent/analysis-engine-6.33-v7-literal-capture
