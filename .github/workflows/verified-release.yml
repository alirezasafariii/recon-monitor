{
  "name": "Verified release publisher",
  "on": {
    "workflow_call": {
      "inputs": {
        "version": {
          "required": true,
          "type": "string"
        },
        "release_sha": {
          "required": true,
          "type": "string"
        },
        "release_tree": {
          "required": true,
          "type": "string"
        }
      }
    },
    "workflow_dispatch": {
      "inputs": {
        "version": {
          "required": true,
          "type": "string"
        },
        "release_sha": {
          "required": true,
          "type": "string"
        },
        "release_tree": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "recon-monitor-verified-release",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "RELEASE_VERSION": "${{ inputs.version }}",
        "RELEASE_TAG": "v${{ inputs.version }}",
        "RELEASE_SHA": "${{ inputs.release_sha }}",
        "RELEASE_TREE": "${{ inputs.release_tree }}"
      },
      "steps": [
        {
          "name": "Checkout tested release source",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.RELEASE_SHA }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Require successful CI for exact main commit",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\npython tools/verify_release_ci.py --repo \"$GITHUB_REPOSITORY\" --sha \"$RELEASE_SHA\" --timeout 1200 > \"$RUNNER_TEMP/release-ci-verification.json\"\ncat \"$RUNNER_TEMP/release-ci-verification.json\""
        },
        {
          "name": "Verify source and release metadata",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$RELEASE_SHA\"\ntest \"$(git rev-parse HEAD^{tree})\" = \"$RELEASE_TREE\"\ntest \"$(./recon-monitor.sh --version)\" = \"$RELEASE_VERSION\"\ntest ! -e config.env\ntest ! -e policies/targets.json\nsha256sum --strict -c MANIFEST.sha256\npython tools/check_release_consistency.py\npython tools/dependency_range_coverage.py --require-full-ratio 0.9997"
        },
        {
          "name": "Build ZIP and verify packaged source and integration",
          "shell": "bash",
          "run": "set -euo pipefail\noutput=\"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION\"\nmkdir -p \"$output\"\ngit archive --format=zip --prefix=recon-monitor-v$RELEASE_VERSION/ --output=\"$output/recon-monitor-v$RELEASE_VERSION.zip\" \"$RELEASE_SHA\"\ncat > \"$RUNNER_TEMP/verify-release-archive.py\" <<'PY'\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nimport os\nimport subprocess\nimport sys\nimport zipfile\nfrom pathlib import Path\n\nrepo, package, destination = map(Path, sys.argv[1:4])\nversion = sys.argv[4]\ncommit = sys.argv[5]\nactual = subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], cwd=repo, text=True).strip()\nassert actual == commit, (actual, commit)\nassert not subprocess.check_output([\"git\", \"status\", \"--porcelain\"], cwd=repo)\nraw = subprocess.check_output([\"git\", \"ls-tree\", \"-rz\", \"--full-tree\", commit], cwd=repo)\nfiles = {}\nfor record in raw.split(b\"\\0\"):\n    if not record:\n        continue\n    metadata, name = record.split(b\"\\t\", 1)\n    mode, kind, _ = metadata.decode().split()\n    assert kind == \"blob\" and mode in {\"100644\", \"100755\"}, record[:150]\n    files[name.decode(\"utf-8\")] = int(mode, 8) & 0o777\nsys.path.insert(0, str(repo / \"app\"))\nfrom operations import UpdateManager\n\nprefix = f\"recon-monitor-v{version}/\"\ndestination.mkdir(parents=True, exist_ok=True)\nwith zipfile.ZipFile(package) as archive:\n    UpdateManager._validate_zip_members(archive, destination)\n    assert archive.testzip() is None\n    members = {entry.filename: entry for entry in archive.infolist() if not entry.is_dir()}\n    assert len(members) == sum(not entry.is_dir() for entry in archive.infolist())\n    assert set(members) == {prefix + name for name in files}\n    for name, mode in files.items():\n        entry = members[prefix + name]\n        assert archive.read(entry) == (repo / name).read_bytes(), name\n        archive_mode = (entry.external_attr >> 16) & 0o777\n        # Git ZIP uses DOS/default metadata for ordinary non-executable files.\n        if entry.create_system == 0 and archive_mode == 0:\n            archive_mode = 0o644\n        assert archive_mode == mode, name\n    archive.extractall(destination)\n    for name, mode in files.items():\n        (destination / prefix / name).chmod(mode)\nroot = destination / prefix\nassert UpdateManager._package_version(root) == version\nassert UpdateManager._expected_release_assets(version) == (package.name, package.name + \".sha256\")\nmanifest = (root / \"MANIFEST.sha256\").read_text().splitlines()\nfor line in manifest:\n    digest, name = line.split(\"  \", 1)\n    assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name\ntree = subprocess.check_output([\"git\", \"rev-parse\", \"HEAD^{tree}\"], cwd=repo, text=True).strip()\nresult = {\n    \"version\": version, \"commit\": commit, \"tree\": tree,\n    \"archive\": package.name, \"bytes\": package.stat().st_size,\n    \"sha256\": hashlib.sha256(package.read_bytes()).hexdigest(),\n    \"files\": len(files), \"manifest_entries\": len(manifest),\n    \"source_bytes_and_modes_match\": True,\n    \"update_package_contract_valid\": True,\n}\nsidecar = package.with_name(package.name + \".sha256\")\nsidecar.write_text(result[\"sha256\"] + \"  \" + package.name + \"\\n\")\nprint(json.dumps(result, sort_keys=True))\n\nPY\npython \"$RUNNER_TEMP/verify-release-archive.py\" \"$PWD\" \"$output/recon-monitor-v$RELEASE_VERSION.zip\" \"$output/extracted\" \"$RELEASE_VERSION\" \"$RELEASE_SHA\" > \"$output/archive-verification.json\"\ncat \"$output/archive-verification.json\"\ncd \"$output/extracted/recon-monitor-v$RELEASE_VERSION\"\npython tools/check_release_consistency.py\nsha256sum --strict -c MANIFEST.sha256 > \"$output/manifest-verification.txt\"\npython tests/integration_runner.py | tee \"$output/fixture-integration.json\"\npython - <<'PY'\nimport json, os\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP']) / ('recon-release-v' + os.environ['RELEASE_VERSION'])\nmeta = json.loads((root / 'archive-verification.json').read_text())\nassert meta['tree'] == os.environ['RELEASE_TREE']\nassert meta['files'] > 0 and meta['manifest_entries'] > 0\nassert json.loads((root / 'fixture-integration.json').read_text())['ok'] is True\nPY"
        },
        {
          "name": "Checkout legacy updater source",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "8ac6411c62213c536082c330a76fd1a73c8856bd",
            "path": "legacy-updater-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Validate actual 8.8.3 to release update install before publication",
          "shell": "bash",
          "run": "set -euo pipefail\nlegacy_install=\"$RUNNER_TEMP/legacy-installed\"\nmkdir -p \"$legacy_install\"\ngit -C \"$GITHUB_WORKSPACE/legacy-updater-source\" archive --format=tar HEAD | tar -x -C \"$legacy_install\"\ncd \"$legacy_install\"\nrm -rf tools\ntest ! -e tools\nprintf 'I_HAVE_AUTHORIZATION=\"no\"\\nTELEGRAM_ENABLED=\"no\"\\n' > config.env\ntest \"$(./recon-monitor.sh --version)\" = \"8.8.3\"\n./recon-monitor.sh init --no-wizard\n./recon-monitor.sh update install --package \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/recon-monitor-v$RELEASE_VERSION.zip\" --sha256 \"$(sha256sum \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/recon-monitor-v$RELEASE_VERSION.zip\" | cut -d ' ' -f 1)\" > \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/legacy-install-validation.json\"\ncat \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/legacy-install-validation.json\"\ntest \"$(./recon-monitor.sh --version)\" = \"$RELEASE_VERSION\"\ntest ! -e tools\npython app/dashboard_review_support.py --help > /dev/null\ncd \"$GITHUB_WORKSPACE\"\n"
        },
        {
          "name": "Checkout installed 8.8.5 updater source",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "539744139e34169aaebf791b3f3720e44493669a",
            "path": "current-updater-source",
            "persist-credentials": false
          }
        },
        {
          "name": "Validate actual 8.8.5 to release update install before publication",
          "shell": "bash",
          "run": "set -euo pipefail\ncurrent_install=\"$RUNNER_TEMP/current-installed\"\nmkdir -p \"$current_install\"\ngit -C \"$GITHUB_WORKSPACE/current-updater-source\" archive --format=tar HEAD | tar -x -C \"$current_install\"\ncd \"$current_install\"\nprintf 'I_HAVE_AUTHORIZATION=\"no\"\\nTELEGRAM_ENABLED=\"no\"\\n' > config.env\ntest \"$(./recon-monitor.sh --version)\" = \"8.8.5\"\n./recon-monitor.sh init --no-wizard\n./recon-monitor.sh update install --package \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/recon-monitor-v$RELEASE_VERSION.zip\" --sha256 \"$(sha256sum \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/recon-monitor-v$RELEASE_VERSION.zip\" | cut -d ' ' -f 1)\" > \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/current-install-validation.json\"\ncat \"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION/current-install-validation.json\"\ntest \"$(./recon-monitor.sh --version)\" = \"$RELEASE_VERSION\"\ntest -f tools/dashboard_real_data_review.py\npython app/dashboard_review_support.py --help > /dev/null\ncd \"$GITHUB_WORKSPACE\"\n"
        },
        {
          "name": "Create draft, verify downloads, and publish Latest",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\npython tools/verify_release_ci.py --repo \"$GITHUB_REPOSITORY\" --sha \"$RELEASE_SHA\" --timeout 1200 > \"$RUNNER_TEMP/release-ci-verification.json\"\ntest \"$GITHUB_REPOSITORY\" = \"alirezasafariii/recon-monitor\"\n[[ \"$GITHUB_REF\" == \"refs/heads/main\" || \"$GITHUB_REF\" == \"refs/heads/publish/v${RELEASE_VERSION}-\"* ]]\ntest \"$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/heads/main\" --jq '.object.sha')\" = \"$RELEASE_SHA\"\ntest \"$(gh api \"repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG\" --jq '[.[] | select(.ref == (\"refs/tags/\" + env.RELEASE_TAG))] | length')\" = \"0\"\noutput=\"$RUNNER_TEMP/recon-release-v$RELEASE_VERSION\"\ngh release create \"$RELEASE_TAG\" \"$output/recon-monitor-v$RELEASE_VERSION.zip\" \"$output/recon-monitor-v$RELEASE_VERSION.zip.sha256\" --repo \"$GITHUB_REPOSITORY\" --target \"$RELEASE_SHA\" --title \"Recon Monitor $RELEASE_VERSION \u2014 Explicit DNS Wildcard Evidence\" --notes-file \"docs/RELEASE_NOTES_v$RELEASE_VERSION.md\" --draft --latest=false\nmkdir -p \"$output/downloaded\"\ngh release download \"$RELEASE_TAG\" --repo \"$GITHUB_REPOSITORY\" --dir \"$output/downloaded\" --pattern \"recon-monitor-v$RELEASE_VERSION.zip\" --pattern \"recon-monitor-v$RELEASE_VERSION.zip.sha256\"\ncd \"$output/downloaded\"\nsha256sum --strict -c \"recon-monitor-v$RELEASE_VERSION.zip.sha256\"\npython - <<'PY'\nimport hashlib, json, os\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP']) / ('recon-release-v' + os.environ['RELEASE_VERSION'])\nmeta = json.loads((root / 'archive-verification.json').read_text())\nfor name in [('recon-monitor-v' + os.environ['RELEASE_VERSION'] + '.zip'), ('recon-monitor-v' + os.environ['RELEASE_VERSION'] + '.zip.sha256')]:\n    assert (root / name).read_bytes() == (root / 'downloaded' / name).read_bytes(), name\nassert hashlib.sha256((root / 'downloaded' / meta['archive']).read_bytes()).hexdigest() == meta['sha256']\nPY\ncd \"$GITHUB_WORKSPACE\"\ntag_sha=\"$(gh api \"repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG\" --jq '[.[] | select(.ref == (\"refs/tags/\" + env.RELEASE_TAG))][0].object.sha // \"\"')\"\nif [[ -n \"$tag_sha\" ]]; then test \"$tag_sha\" = \"$RELEASE_SHA\"; fi\ntest \"$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/heads/main\" --jq '.object.sha')\" = \"$RELEASE_SHA\"\npython tools/verify_release_ci.py --repo \"$GITHUB_REPOSITORY\" --sha \"$RELEASE_SHA\" --timeout 1200 > \"$RUNNER_TEMP/release-ci-verification.json\"\ngh release edit \"$RELEASE_TAG\" --repo \"$GITHUB_REPOSITORY\" --target \"$RELEASE_SHA\" --draft=false --latest\ntest \"$(gh api \"repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG\" --jq '.object.sha')\" = \"$RELEASE_SHA\"\ngh api \"repos/$GITHUB_REPOSITORY/releases/latest\" > \"$output/release-verification.json\"\npython - <<'PY'\nimport hashlib, json, os\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP']) / ('recon-release-v' + os.environ['RELEASE_VERSION'])\nrelease = json.loads((root / 'release-verification.json').read_text())\nassert release['tag_name'] == os.environ['RELEASE_TAG']\nassert release['target_commitish'] == os.environ['RELEASE_SHA']\nassert not release['draft'] and not release['prerelease']\nassets = {a['name']: a for a in release['assets']}\nassert set(assets) == {('recon-monitor-v' + os.environ['RELEASE_VERSION'] + '.zip'), ('recon-monitor-v' + os.environ['RELEASE_VERSION'] + '.zip.sha256')}\nfor name, asset in assets.items():\n    data = (root / 'downloaded' / name).read_bytes()\n    assert asset['state'] == 'uploaded' and asset['size'] == len(data)\n    assert asset['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest()\nprint(json.dumps({'url': release['html_url'], 'tag': release['tag_name'], 'commit': release['target_commitish'], 'assets_verified': True, 'download_verified': True}))\nPY"
        },
        {
          "name": "Keep downloaded asset verification",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "recon-monitor-v${{ env.RELEASE_VERSION }}-verified-download",
            "if-no-files-found": "error",
            "retention-days": 7,
            "path": "${{ runner.temp }}/recon-release-v${{ env.RELEASE_VERSION }}/downloaded/*\n${{ runner.temp }}/recon-release-v${{ env.RELEASE_VERSION }}/archive-verification.json\n${{ runner.temp }}/recon-release-v${{ env.RELEASE_VERSION }}/release-verification.json\n${{ runner.temp }}/recon-release-v${{ env.RELEASE_VERSION }}/fixture-integration.json\n${{ runner.temp }}/recon-release-v${{ env.RELEASE_VERSION }}/legacy-install-validation.json\n${{ runner.temp }}/recon-release-v${{ env.RELEASE_VERSION }}/current-install-validation.json\n${{ runner.temp }}/release-ci-verification.json"
          }
        }
      ]
    }
  }
}
