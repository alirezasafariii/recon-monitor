name: Finalize Analysis 6.13 Fresh Raw v2

on:
  push:
    branches:
      - agent/analysis-engine-6.13-fresh-raw-holdout-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.13-fresh-raw-holdout-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused 6.13 protocol and corpus validation without scoring
        env:
          PYTHONPATH: app
        run: |
          python -m py_compile app/raw_recon_v2_corpus.py app/raw_recon_v2_benchmark.py app/raw_recon_v2_materialize.py app/raw_recon_v2_result_diagnostic.py
          python -m unittest tests.test_raw_recon_v2_protocol_v6130 tests.test_raw_condition_reconstruction_v6120 tests.test_raw_routing_boundaries_v6120 tests.test_raw_recon_benchmark_v6110 -v
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from raw_recon_v2_benchmark import verify_v2_freeze
          from raw_recon_v2_corpus import load_raw_cases, validate_v2_corpus
          f=verify_v2_freeze(); assert f['passed'], f
          m=f['manifest']; assert m['evaluation_status']=='evaluated_once_consumed'
          assert m['first_and_only_fresh_evaluation']['run_id']=='31471744115'
          cases=load_raw_cases('benchmarks/raw/analysis_raw_v2.jsonl')
          v=validate_v2_corpus(cases); assert v['passed'], v
          assert v['positive_control_raw_collision_count']==0 and v['positive_observable_delta_rate']==1.0
          corpus_sha=hashlib.sha256(Path('benchmarks/raw/analysis_raw_v2.jsonl').read_bytes()).hexdigest()
          assert corpus_sha==m['corpus']['sha256']=='1ad289915f89bf281fd6a80e0b8d55ebb045ecd8f9658b1ae9d88f07afddb1f3'
          report=Path(m['first_and_only_fresh_evaluation']['report_path'])
          assert hashlib.sha256(report.read_bytes()).hexdigest()==m['first_and_only_fresh_evaluation']['report_sha256']
          saved=json.loads(report.read_text())
          assert saved['metrics']==m['first_and_only_fresh_evaluation']['metrics']
          assert saved['quality_gate']['passed'] is False
          assert {x['metric'] for x in saved['quality_gate']['failures']}=={'condition_extraction_precision','admission_precision'}
          diagnostic=json.loads(Path('benchmarks/raw/results/analysis_raw_v2_diagnostic_summary.json').read_text())
          assert diagnostic['rescoring_executed'] is False
          assert diagnostic['condition_false_positive_count']==4
          assert diagnostic['condition_false_negative_count']==3
          assert diagnostic['admission_false_positive_count']==2
          assert diagnostic['admission_false_negative_count']==3
          print(json.dumps({'metrics':saved['metrics'],'quality_gate':saved['quality_gate'],'diagnostic_counts':{k:diagnostic[k] for k in ('condition_false_positive_count','condition_false_negative_count','admission_false_positive_count','admission_false_negative_count','routing_top1_error_count','routing_top3_error_count')}}, indent=2, sort_keys=True))
          PY
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Golden v3 regression
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict
      - name: Integration
        run: python tests/integration_runner.py
      - name: Enforce no v2 rescoring in finalizer
        shell: bash
        run: |
          ! grep -Eq 'benchmark_v2_file\(|raw_recon_v2_benchmark.py .*--allow-consumed|run_raw_benchmark\(' .github/workflows/finalize-analysis-613.yml
      - name: Cleanup finalizer and regenerate manifest
        shell: bash
        run: |
          rm -f .github/workflows/finalize-analysis-613.yml
          tmp="$(mktemp)"
          git ls-files | grep -v '^MANIFEST.sha256$' | while IFS= read -r f; do
            if [[ -f "$f" ]]; then sha256sum "$f"; fi
          done | sort -k2 > "$tmp"
          mv "$tmp" MANIFEST.sha256
          sha256sum -c MANIFEST.sha256 >/dev/null
          test ! -e .github/workflows/finalize-analysis-613.yml
          test ! -e .github/workflows/analysis-613-first-fresh-evaluation.yml
          test ! -e .github/workflows/analysis-613-corpus-seal.yml
          test ! -e .github/workflows/analysis-613-materialize.yml
          test ! -e .github/workflows/analysis-613-saved-result-diagnostic.yml
      - name: Commit final clean Analysis 6.13 tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize Analysis 6.13 fresh raw v2 benchmark'
          git push origin HEAD:agent/analysis-engine-6.13-fresh-raw-holdout-v2
