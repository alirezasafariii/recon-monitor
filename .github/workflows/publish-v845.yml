name: Publish Recon Monitor v8.4.5 Current Projection Isolation

on:
  push:
    branches:
      - agent/current-analysis-isolation-v845

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v8.4.5 patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v845_current_projection_patch.py
          grep -q 'APP_VERSION = "8.4.5"' app/core.py
          grep -q 'SCHEMA_VERSION = 18' app/core.py
          grep -q 'WHERE analysis_id=? AND target=? AND source_run_id=?' app/workspace_v7.py
          grep -q 'WHERE analysis_id=? AND target=? ORDER BY priority_score DESC LIMIT 300' app/workspace_v7.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/*.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/*.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: Current projection contract checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_current_projection_v845 -v
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'app')
          from core import Database, APP_VERSION, SCHEMA_VERSION
          assert APP_VERSION == '8.4.5'
          assert SCHEMA_VERSION == 18
          with tempfile.TemporaryDirectory() as td:
              db = Database(Path(td) / 'db.sqlite')
              assert db.meta_get('schema_version') == '18'
              db.close()
          PY

      - name: Prepare clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git rm .github/workflows/publish-v845.yml scripts/v845_current_projection_patch.py
          rmdir scripts 2>/dev/null || true
          git add -A
          git ls-files | grep -v '^MANIFEST.sha256$' | LC_ALL=C sort | while IFS= read -r f; do
            [ -f "$f" ] && sha256sum "$f"
          done > MANIFEST.sha256
          git add MANIFEST.sha256
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
          if find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pyc' -o -name '*.log' \) ! -path './.git/*' | grep -q .; then
            echo 'runtime artifact found in source tree'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft origin/main
          git add -A
          git commit -m 'Isolate current analysis projections from history'
          git push origin HEAD:main

      - name: Package and release v8.4.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          test "$MAIN_SHA" = "$(git rev-parse origin/main)"
          git tag -a v8.4.5 -m 'Recon Monitor 8.4.5'
          git push origin v8.4.5
          git archive --format=zip --prefix=recon-monitor-v8.4.5/ HEAD -o recon-monitor-v8.4.5.zip
          SHA=$(sha256sum recon-monitor-v8.4.5.zip | awk '{print $1}')
          printf '%s  %s\n' "$SHA" recon-monitor-v8.4.5.zip > recon-monitor-v8.4.5.zip.sha256
          gh release create v8.4.5 \
            recon-monitor-v8.4.5.zip \
            recon-monitor-v8.4.5.zip.sha256 \
            --title 'Recon Monitor v8.4.5' \
            --notes 'Current Analysis Projection Isolation hotfix. Change Intelligence and the Attack Surface Graph now surface candidates only from the latest analysis for the target, preventing historical candidates from reappearing as current findings after a newer analysis correctly abstains. Historical target memory and learning remain preserved. Schema remains 18. Full unit/integration and dedicated current-projection tests run on Python 3.11 and 3.13.'
          echo "RELEASE_SHA256=$SHA"
