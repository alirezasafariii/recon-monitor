name: Analysis 6.31 Literal Capture Feasibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build unscored capture feasibility report
        env:
          PYTHONPATH: app
        run: python app/v6_literal_capture_feasibility.py
      - name: Assert feasibility report does not consume benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('benchmarks/raw/sources/v6_literal_capture_feasibility.json').read_text(encoding='utf-8'))
          assert report['family_count'] == 36
          assert report['required_capture_count'] == 144
          assert report['scoring_executed'] is False
          assert report['first_blind_consumed'] is False
          assert report['detector_output_used'] is False
          assert report['admission_output_used'] is False
          assert report['ranking_output_used'] is False
          assert report['active_target_validation_performed'] is False
          assert report['evidence_present_count'] + report['evidence_missing_count'] == 144
          PY
      - name: Commit capture feasibility report
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_literal_capture_feasibility.json
          if git diff --cached --quiet; then
            echo 'Capture feasibility report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Analysis 6.31 literal capture feasibility'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
