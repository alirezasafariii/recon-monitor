name: Analysis 6.20 One-Shot Cutover

on:
  push:
    branches:
      - agent/analysis-engine-6.20-api-configuration-raw-collectors

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.20-api-configuration-raw-collectors
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic Analysis 6.20 cutover
        run: python scripts/analysis_620_cutover.py

      - name: Preserve Analysis 6.20 precision boundaries
        run: python scripts/analysis_620_precision_fix.py

      - name: Align Analysis 6.20 near-miss fixture
        run: python scripts/analysis_620_fixture_fix.py

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: API configuration collector contract
        run: python -m unittest discover -s tests -p 'test_physical_raw_collector_api_configuration_v6200.py' -q

      - name: Four-layer standards grounding contract
        run: python -m unittest discover -s tests -p 'test_analysis_619_standards_grounding.py' -q

      - name: Physical detector regression
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_physical_family_detectors_v690.py' -q

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit validated Analysis 6.20 cutover and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-620-one-shot.yml scripts/analysis_620_cutover.py scripts/analysis_620_precision_fix.py scripts/analysis_620_fixture_fix.py
          git add -A
          git diff --cached --check
          git commit -m "Cut over Analysis 6.20 API configuration raw collectors"
          git push origin HEAD:agent/analysis-engine-6.20-api-configuration-raw-collectors
