name: Capture Analysis 6.8 Focused Test Exits

on:
  push:
    branches:
      - agent/analysis-engine-6.8-family-evidence-extractors
    paths:
      - .analysis-68-capture

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.8-family-evidence-extractors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply pending patches
        run: python .analysis-68-apply.py
      - name: Capture exact focused sequence
        shell: bash
        env:
          PYTHONPATH: app
        run: |
          set +e
          out=analysis68-focused-combined.txt
          : > "$out"
          overall=0
          for test in \
            tests/test_family_evidence_extractors_v680.py \
            tests/test_family_reasoners_v670.py \
            tests/test_family_confusion_matrix_v670.py \
            tests/test_analysis_ranking_v650.py \
            tests/test_analysis_coverage_v610.py
          do
            echo "### $test" >> "$out"
            python "$test" >> "$out" 2>&1
            code=$?
            echo "EXIT=$code" >> "$out"
            echo >> "$out"
            if [ "$code" -ne 0 ]; then overall=$code; fi
          done
          echo "OVERALL=$overall" >> "$out"
          cat "$out"
      - name: Commit captured output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis68-focused-combined.txt
          git commit -m "Capture Analysis 6.8 focused test output" || exit 0
          git push origin HEAD:agent/analysis-engine-6.8-family-evidence-extractors
