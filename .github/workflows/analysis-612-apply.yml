name: Apply Analysis 6.12 Reconstruction

on:
  push:
    branches:
      - agent/analysis-engine-6.12-raw-condition-reconstruction

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.12-raw-condition-reconstruction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate reconstruction and bump lineage versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new), encoding='utf-8')

          path='app/family_detectors/execution.py'
          replace(path, 'from family_detectors.registry import DETECTOR_SPECS\n', 'from family_detectors.registry import DETECTOR_SPECS\nfrom family_detectors.reconstruction import reconstruct_raw_evidence\n')
          replace(path, 'EXECUTION_ENGINE_VERSION = "1.0.0"', 'EXECUTION_ENGINE_VERSION = "1.1.0"')
          replace(path, 'EXECUTION_RULE_VERSION = "2026.08.11.6.10"', 'EXECUTION_RULE_VERSION = "2026.08.11.6.12"')
          replace(path, ', "/v1/", "/v2/", "/dev/", "/test/"', ', "/dev/", "/test/"')
          replace(path, 'if any(token in surface_text for token in VERSION_MARKERS) or re.search(r"/v\\d+(?:\\.\\d+)?(?:/|$)", endpoint.lower()):', 'if any(token in surface_text for token in VERSION_MARKERS):')
          old = '''    _typed_evidence(result, evidence_for or (), evidence_against or ()); _explicit_contract_flags(result, _flatten(details))\n    _passive_raw_heuristics(result, target=str(target or ""), endpoint=str(endpoint or ""), method=str(method or "UNKNOWN"), endpoint_schema=endpoint_schema, details=details, category=str(category or ""), business_context=str(business_context or "general"))\n    return {family: packet for family, packet in result.items() if packet["support"] or packet["contradict"]}'''
          new = '''    _typed_evidence(result, evidence_for or (), evidence_against or ()); _explicit_contract_flags(result, _flatten(details))\n    _passive_raw_heuristics(result, target=str(target or ""), endpoint=str(endpoint or ""), method=str(method or "UNKNOWN"), endpoint_schema=endpoint_schema, details=details, category=str(category or ""), business_context=str(business_context or "general"))\n    reconstructed = reconstruct_raw_evidence(\n        target=str(target or ""), endpoint=str(endpoint or ""), method=str(method or "UNKNOWN"),\n        endpoint_schema=endpoint_schema, details=details, category=str(category or ""),\n        business_context=str(business_context or "general"),\n    )\n    for family, packet in reconstructed.items():\n        target_packet = _packet_for(result, family)\n        for side in ("support", "contradict"):\n            for item in packet.get(side) or []:\n                _add(target_packet, side, dict(item))\n    return {family: packet for family, packet in result.items() if packet["support"] or packet["contradict"]}'''
          replace(path, old, new)

          replace('app/analysis_engine.py', 'ENGINE_VERSION = "6.10.0"', 'ENGINE_VERSION = "6.12.0"')
          replace('app/analysis_engine.py', 'RULE_VERSION = "2026.08.11.6.10"', 'RULE_VERSION = "2026.08.11.6.12"')
          replace('app/bug_candidates.py', 'CANDIDATE_ENGINE_VERSION = "6.10.0"', 'CANDIDATE_ENGINE_VERSION = "6.12.0"')
          replace('app/bug_candidates.py', 'CANDIDATE_RULE_VERSION = "2026.08.11.6.10"', 'CANDIDATE_RULE_VERSION = "2026.08.11.6.12"')
          replace('app/security_reasoning.py', 'REASONING_ENGINE_VERSION = "6.10.0"', 'REASONING_ENGINE_VERSION = "6.12.0"')
          replace('app/security_reasoning.py', 'REASONING_RULE_VERSION = "2026.08.11.6.10"', 'REASONING_RULE_VERSION = "2026.08.11.6.12"')

          replace('tests/test_detector_execution_intelligence_v6100.py', 'self.assertEqual(EXECUTION_ENGINE_VERSION, "1.0.0")', 'self.assertEqual(EXECUTION_ENGINE_VERSION, "1.1.0")')
          replace('tests/test_detector_execution_intelligence_v6100.py', 'self.assertEqual(EXECUTION_RULE_VERSION, "2026.08.11.6.10")', 'self.assertEqual(EXECUTION_RULE_VERSION, "2026.08.11.6.12")')
          replace('tests/test_analysis_coverage_v610.py', 'self.assertEqual(ENGINE_VERSION, "6.10.0")', 'self.assertEqual(ENGINE_VERSION, "6.12.0")')
          replace('tests/test_analysis_coverage_v610.py', 'self.assertEqual(CANDIDATE_ENGINE_VERSION, "6.10.0")', 'self.assertEqual(CANDIDATE_ENGINE_VERSION, "6.12.0")')
          replace('tests/test_analysis_coverage_v610.py', 'self.assertEqual(REASONING_ENGINE_VERSION, "6.10.0")', 'self.assertEqual(REASONING_ENGINE_VERSION, "6.12.0")')
          PY
      - name: Focused reconstruction tests
        env:
          PYTHONPATH: app
        run: |
          python -m py_compile app/family_detectors/execution.py app/family_detectors/reconstruction.py app/raw_recon_observability.py app/raw_recon_regression.py
          python -m unittest tests.test_raw_condition_reconstruction_v6120 tests.test_detector_execution_intelligence_v6100 tests.test_raw_recon_benchmark_v6110 -v
      - name: Record consumed v1 regression snapshot
        env:
          PYTHONPATH: app
        run: python app/raw_recon_regression.py --json --strict-safety > analysis612-consumed-v1-regression.json
      - name: Cleanup temporary diagnostic files and commit
        shell: bash
        run: |
          rm -f .github/workflows/analysis-612-apply.yml analysis612-v1-observability.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Integrate Analysis 6.12 raw condition reconstruction'
          git push origin HEAD:agent/analysis-engine-6.12-raw-condition-reconstruction
