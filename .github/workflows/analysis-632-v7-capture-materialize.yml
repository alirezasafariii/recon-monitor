name: Analysis 6.32 v7 Capture and Materialize

on:
  push:
    branches:
      - agent/analysis-engine-6.32-post-blind-calibration
    paths:
      - 'benchmarks/raw/sources/v7_literal_capture_plan.json'
      - '.github/workflows/analysis-632-v7-capture-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-632-v7-capture-materialize
  cancel-in-progress: false

jobs:
  capture-materialize-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.32-post-blind-calibration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require clean 144-capture pre-score plan
        env:
          PYTHONPATH: app
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_plan.json').read_text())
          assert plan['family_count'] == 36
          assert plan['required_capture_count'] == 144
          assert plan['evidence_present_count'] == 0
          assert plan['evidence_missing_count'] == 144
          assert plan['scoring_executed'] is False
          assert plan['first_blind_consumed'] is False
          assert plan['v6_first_blind_score_used'] is False
          assert plan['v6_first_blind_case_errors_used'] is False
          PY
          python -m py_compile \
            app/v7_literal_patch_capture.py \
            app/v7_literal_evidence_publish.py \
            app/v7_literal_capture_ingest.py \
            app/v7_literal_capture_verify.py \
            app/v7_benchmark_dataset.py \
            app/v7_benchmark_validate.py

      - name: Collect 144 independent source-grounded observations
        env:
          PYTHONPATH: app
        run: |
          rm -rf /tmp/v7-literal-captures
          mkdir -p /tmp/v7-literal-captures
          python app/v7_literal_patch_capture.py /tmp/v7-literal-captures
          test "$(find /tmp/v7-literal-captures -type f -name '*.json' | wc -l | tr -d ' ')" = "144"

      - name: Publish evidence with strict source/hash binding
        env:
          PYTHONPATH: app
        run: python app/v7_literal_evidence_publish.py /tmp/v7-literal-captures

      - name: Refresh plan and ingest evidence only
        env:
          PYTHONPATH: app
        run: |
          python app/v7_literal_capture_plan.py
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_plan.json').read_text())
          assert plan['evidence_present_count'] == 144, plan
          assert plan['evidence_missing_count'] == 0, plan
          assert plan['all_evidence_present'] is True, plan
          PY
          python app/v7_literal_capture_ingest.py

      - name: Verify complete 144-of-144 literal evidence
        env:
          PYTHONPATH: app
        run: |
          python app/v7_literal_capture_verify.py --write-report
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_literal_capture_verification.json').read_text())
          assert r['passed'] is True, r['errors']
          assert r['capture_count'] == 144
          assert r['evidence_count'] == 144
          assert r['unique_evidence_hash_count'] == 144
          assert r['family_count'] == 36
          assert r['scoring_executed'] is False
          PY

      - name: Materialize 276 fresh v7 cases
        env:
          PYTHONPATH: app
        run: python app/v7_benchmark_dataset.py

      - name: Strictly validate v7 corpus without scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v7_benchmark_validate import validate_v7_corpus
          cases=[json.loads(line) for line in Path('benchmarks/raw/analysis_raw_v7.jsonl').read_text().splitlines() if line.strip()]
          shortlist=json.loads(Path('benchmarks/raw/sources/v7_shortlist.json').read_text())
          report=validate_v7_corpus(cases, shortlist, require_literal_single_capture=True)
          Path('benchmarks/raw/sources/v7_validation_report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          assert report['passed'] is True, report['errors']
          assert report['case_count'] == 276
          assert report['single_case_count'] == 144
          assert report['pair_case_count'] == 72
          assert report['triad_case_count'] == 60
          assert report['literal_single_capture_count'] == 144
          assert report['label_leakage_count'] == 0
          assert report['source_firewall']['passed'] is True
          assert report['scoring_executed'] is False
          PY

      - name: Prove consumed v6 result remains untouched
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            benchmarks/raw/sources/v6_first_blind_consumption.json \
            benchmarks/raw/results/analysis_raw_v6_first_blind.json \
            benchmarks/raw/analysis_raw_v6.jsonl \
            benchmarks/raw/sources/v6_corpus_freeze.json \
            benchmarks/raw/sources/v6_evaluator_freeze.json

      - name: Commit complete unscored v7 corpus
        shell: bash
        run: |
          set -euo pipefail
          git add \
            benchmarks/raw/sources/v7_capture_evidence \
            benchmarks/raw/sources/v7_literal_capture_plan.json \
            benchmarks/raw/sources/v7_literal_captures.jsonl \
            benchmarks/raw/sources/v7_literal_capture_ingest_report.json \
            benchmarks/raw/sources/v7_literal_capture_verification.json \
            benchmarks/raw/analysis_raw_v7.jsonl \
            benchmarks/raw/sources/v7_materialization_report.json \
            benchmarks/raw/sources/v7_validation_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize Analysis 6.32 fresh v7 holdout corpus'
          git pull --rebase origin agent/analysis-engine-6.32-post-blind-calibration
          git push origin HEAD:agent/analysis-engine-6.32-post-blind-calibration
