name: Final Exposure Family Migration

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: write

# Controlled migration/verifier. Projection bound preserves CWE-1295.
jobs:
  migrate:
    if: github.event.head_commit.message == 'Run exposure family migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exposure family migration
        run: |
          python .github/scripts/final_exposure_family_migration.py
          python .github/scripts/fix_exposure_projection.py
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration test
        run: python tests/integration_runner.py
      - name: Commit successful migration
        shell: bash
        run: |
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add \
            app/family_reasoning_final_analyzers.py \
            app/family_specs/registry.py app/family_specs/__init__.py \
            app/family_specs/account_enumeration.py \
            app/family_specs/information_disclosure.py \
            app/family_specs/source_map_exposure.py \
            app/family_specs/secret_exposure.py \
            app/family_analyzers/account_enumeration.py \
            app/family_analyzers/information_disclosure.py \
            app/family_analyzers/source_map_exposure.py \
            app/family_analyzers/secret_exposure.py \
            tests/test_final_analyzers_bfla_ssrf_specs.py \
            tests/test_final_analyzers_property_file_path_cors_specs.py \
            tests/test_final_analyzers_auth_redirect_postmessage_graphql_specs.py \
            tests/test_final_analyzers_exposure_specs.py \
            tests/_test_family_analyzer_information_disclosure_v879_legacy.py \
            tests/_test_family_analyzer_secret_exposure_v881_legacy.py \
            MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize account and exposure family migration'
            git push origin HEAD:final-analyzers
          fi

  verify:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout migrated branch head
        run: |
          git fetch origin final-analyzers
          git checkout -B final-analyzers origin/final-analyzers
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' \) -print -quit)"
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration test
        run: python tests/integration_runner.py
