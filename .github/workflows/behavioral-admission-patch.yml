name: Behavioral admission patch

on:
  push:
    branches:
      - agent/behavioral-admission-hardening

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/behavioral-admission-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply admission bridge patch
        run: python .github/behavioral_patch.py

      - name: Verify focused behavioral tests
        run: python -m unittest discover -s tests -p 'test_behavioral_v45.py' -q

      - name: Verify source hygiene and manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e config.env
          test ! -e policies/targets.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"
          sha256sum --strict -c MANIFEST.sha256

      - name: Run full unit and integration suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: Commit hardened behavioral admission path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate behavioral candidates through family admission'
          git push origin HEAD:agent/behavioral-admission-hardening
