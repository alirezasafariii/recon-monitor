name: Analysis 6.26 Inventory Inspect

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print selected and candidate improper inventory sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          shortlist=json.loads(Path('benchmarks/raw/sources/v4_shortlist.json').read_text(encoding='utf-8'))
          candidates=json.loads(Path('benchmarks/raw/sources/v4_candidates.json').read_text(encoding='utf-8'))
          selected=[r for r in shortlist['selected'] if r['family']=='improper_inventory_management']
          print('=== SELECTED ===')
          for r in selected:
              print(json.dumps({k:r.get(k) for k in ('source_root','source_project','summary','description','canonical_advisory_url','matched_cwes','shortlist_semantic_hits')},ensure_ascii=False,sort_keys=True))
          print('=== CANDIDATES ===')
          for r in candidates['candidates_by_family']['improper_inventory_management']:
              print(json.dumps({k:r.get(k) for k in ('source_root','source_project','summary','description','canonical_advisory_url','matched_cwes')},ensure_ascii=False,sort_keys=True))
          PY
      - name: Remove inspector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-inventory-inspect.yml
          git commit -m "Remove Analysis 6.26 inventory inspector"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
