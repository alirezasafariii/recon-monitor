name: Analysis 6.15 First and Only Fresh Raw v3 Evaluation

on:
  push:
    branches:
      - agent/analysis-engine-6.15-fresh-raw-holdout-v3

permissions:
  contents: write

jobs:
  evaluate-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.15-fresh-raw-holdout-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-score immutable-state verification
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from raw_recon_corpus import load_raw_cases
          from raw_recon_v3_benchmark import verify_v3_freeze
          from raw_recon_v3_corpus import validate_v3_corpus

          manifest_path = Path('benchmarks/raw/splits/v3.json')
          corpus_path = Path('benchmarks/raw/analysis_raw_v3.jsonl')
          manifest = json.loads(manifest_path.read_text())
          assert manifest['evaluation_status'] == 'sealed_unscored', manifest['evaluation_status']
          assert manifest['corpus']['sealed'] is True
          assert manifest['corpus']['scored'] is False
          assert manifest['seal']['scored'] is False
          expected_sha = 'ee17e481dd543a8cd0a9c35c07e2eab32f6cbac8e15d62016c9b953799e6d10f'
          actual_sha = hashlib.sha256(corpus_path.read_bytes()).hexdigest()
          assert actual_sha == expected_sha, (actual_sha, expected_sha)
          assert manifest['corpus']['sha256'] == expected_sha
          assert manifest['seal']['corpus_sha256'] == expected_sha
          freeze = verify_v3_freeze(manifest_path)
          assert freeze['passed'], freeze['errors']
          cases = load_raw_cases(corpus_path)
          validation = validate_v3_corpus(cases)
          assert validation['passed'], validation['errors']
          assert validation['source_root_count'] == 24
          assert validation['source_project_count'] == 24
          assert validation['positive_family_count'] == 18
          assert validation['prior_source_root_overlap_count'] == 0
          assert validation['prior_url_overlap_count'] == 0
          assert validation['positive_control_raw_collision_count'] == 0
          assert validation['positive_observable_delta_rate'] == 1.0
          print(json.dumps({'status': 'sealed_unscored_verified', 'corpus_sha256': actual_sha, 'case_count': len(cases), 'source_roots': validation['source_root_count'], 'projects': validation['source_project_count'], 'families': validation['positive_family_count']}, indent=2))
          PY

      - name: First and only fresh benchmark score
        env:
          PYTHONPATH: app
          EVALUATION_RUN_ID: ${{ github.run_id }}
          EVALUATION_TRIGGER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from raw_recon_v3_benchmark import benchmark_v3_file

          # SCIENTIFIC INVARIANT: exactly one call to benchmark_v3_file in this workflow.
          report = benchmark_v3_file()
          report['evaluation_semantics'] = 'first_and_only_fresh_raw_v3'
          report['evaluation_run_id'] = str(os.environ['EVALUATION_RUN_ID'])
          report['evaluation_trigger_sha'] = os.environ['EVALUATION_TRIGGER_SHA']
          report['evaluation_date'] = '2026-08-12'
          report['fresh_or_blind_claim_allowed_for_this_run'] = True
          output = Path('benchmarks/raw/results/analysis_raw_v3_first_blind.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'metrics': report['metrics'], 'quality_gate': report['quality_gate'], 'case_count': report['case_count']}, indent=2, sort_keys=True))
          PY

      - name: Consume v3 immediately after first score
        env:
          EVALUATION_RUN_ID: ${{ github.run_id }}
          EVALUATION_TRIGGER_SHA: ${{ github.sha }}
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from raw_recon_v3_benchmark import verify_v3_freeze

          manifest_path = Path('benchmarks/raw/splits/v3.json')
          result_path = Path('benchmarks/raw/results/analysis_raw_v3_first_blind.json')
          manifest = json.loads(manifest_path.read_text())
          report = json.loads(result_path.read_text())
          assert manifest['evaluation_status'] == 'sealed_unscored'
          assert report['evaluation_status_at_start'] == 'sealed_unscored'
          assert report['evaluation_semantics'] == 'first_and_only_fresh_raw_v3'
          assert str(report['evaluation_run_id']) == str(os.environ['EVALUATION_RUN_ID'])

          manifest['evaluation_status'] = 'evaluated_once_consumed'
          manifest['corpus']['scored'] = True
          manifest['seal']['scored'] = True
          manifest['seal']['consumed_at'] = '2026-08-12'
          manifest['seal']['first_and_only_fresh_run_id'] = str(os.environ['EVALUATION_RUN_ID'])
          manifest['seal']['evaluation_trigger_sha'] = os.environ['EVALUATION_TRIGGER_SHA']
          manifest['seal']['result_path'] = 'benchmarks/raw/results/analysis_raw_v3_first_blind.json'
          manifest['seal']['quality_gate_passed'] = bool(report['quality_gate']['passed'])
          manifest['seal']['metrics'] = report['metrics']
          manifest['seal']['note'] = 'Raw v3 was scored exactly once as a fresh holdout and is now permanently consumed. Any future execution is regression-only and must never be described as fresh or blind.'
          manifest['evaluation'] = {
              'first_and_only_fresh_run_id': str(os.environ['EVALUATION_RUN_ID']),
              'evaluation_trigger_sha': os.environ['EVALUATION_TRIGGER_SHA'],
              'evaluated_at': '2026-08-12',
              'result_path': 'benchmarks/raw/results/analysis_raw_v3_first_blind.json',
              'quality_gate': report['quality_gate'],
              'metrics': report['metrics'],
              'fresh_run_consumed': True,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          freeze = verify_v3_freeze(manifest_path)
          assert freeze['passed'], freeze['errors']
          print(json.dumps({'evaluation_status': manifest['evaluation_status'], 'run_id': manifest['evaluation']['first_and_only_fresh_run_id'], 'quality_gate': manifest['evaluation']['quality_gate'], 'metrics': manifest['evaluation']['metrics']}, indent=2, sort_keys=True))
          PY

      - name: Remove one-shot workflow, regenerate manifest, and commit consumed result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/analysis-615-first-blind.yml
          git ls-files | grep -v '^MANIFEST.sha256$' | while IFS= read -r f; do
            if [[ -f "$f" ]]; then sha256sum "$f"; fi
          done | LC_ALL=C sort -k2 > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Analysis 6.15 first blind raw v3 result and consume holdout'
          git push origin HEAD:agent/analysis-engine-6.15-fresh-raw-holdout-v3
