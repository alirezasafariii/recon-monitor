name: Analysis 6.26 Raw v4 First Blind

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  first-blind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pre-registered blind protocol
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_raw_recon_v4_first_blind_v6260.py' -q

      - name: Revalidate frozen corpus before scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_corpus import load_raw_cases
          from raw_recon_v4_blind import verify_v4_freeze
          from raw_recon_v4_corpus import validate_v4_corpus

          freeze = verify_v4_freeze()
          assert freeze['passed'], freeze
          shortlist = json.loads(Path('benchmarks/raw/sources/v4_shortlist.json').read_text(encoding='utf-8'))
          cases = load_raw_cases(Path('benchmarks/raw/analysis_raw_v4.jsonl'))
          validation = validate_v4_corpus(cases, shortlist=shortlist)
          assert validation['passed'], validation['errors']
          assert len(cases) == 144
          assert validation['source_root_count'] == 36
          assert validation['source_project_count'] == 36
          assert validation['positive_family_count'] == 36
          assert validation['label_leakage_count'] == 0
          assert validation['prior_source_root_overlap_count'] == 0
          assert validation['prior_source_project_overlap_count'] == 0
          assert validation['prior_url_overlap_count'] == 0
          assert validation['grounding_writeup_overlap_count'] == 0
          assert validation['positive_control_raw_collision_count'] == 0
          assert validation['positive_observable_delta_rate'] == 1.0
          print(json.dumps({'freeze': freeze, 'validation': {
              'case_count': len(cases),
              'root_count': validation['source_root_count'],
              'project_count': validation['source_project_count'],
              'family_count': validation['positive_family_count'],
              'label_leakage': validation['label_leakage_count'],
          }}, indent=2, sort_keys=True))
          PY

      - name: Execute FIRST blind scoring exactly once
        env:
          PYTHONPATH: app
        run: python app/raw_recon_v4_blind.py

      - name: Verify frozen inputs did not change during scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v4_blind import verify_v4_freeze

          result = verify_v4_freeze()
          assert result['passed'], result
          report = json.loads(Path('benchmarks/raw/sources/v4_first_blind_report.json').read_text(encoding='utf-8'))
          frozen = report['frozen_inputs']
          assert frozen['corpus_sha256'] == result['corpus_sha256']
          assert frozen['shortlist_sha256'] == result['shortlist_sha256']
          assert report['evaluation_kind'] == 'first_blind_single_consumption'
          assert report['case_count'] == 144
          assert report['family_count'] == 36
          print(json.dumps({
              'metrics': report['metrics'],
              'quality_gate': report['quality_gate'],
              'by_kind': report['by_kind'],
              'failed_positive_families': sorted(
                  family for family, row in report['family_results'].items()
                  if not row['positive_admitted']
              ),
              'wrong_promotion_families': sorted(
                  family for family, row in report['family_results'].items()
                  if row['wrong_promotions']
              ),
              'near_miss_promotion_families': sorted(
                  family for family, row in report['family_results'].items()
                  if not row['near_miss_abstained']
              ),
              'secure_negative_promotion_families': sorted(
                  family for family, row in report['family_results'].items()
                  if not row['secure_negative_abstained']
              ),
              'sparse_promotion_families': sorted(
                  family for family, row in report['family_results'].items()
                  if not row['sparse_noisy_abstained']
              ),
          }, indent=2, sort_keys=True))
          PY

      - name: Create immutable first-blind consumption receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path('benchmarks/raw/sources/v4_first_blind_report.json')
          freeze_path = Path('benchmarks/raw/sources/v4_freeze.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          receipt = {
              'receipt_version': '1.0.0',
              'receipt_rule_version': '2026.08.13.6.26',
              'status': 'first_blind_consumed',
              'evaluation_kind': 'first_blind_single_consumption',
              'workflow_start_commit': os.environ['GITHUB_SHA'],
              'report_sha256': hashlib.sha256(report_path.read_bytes()).hexdigest(),
              'freeze_sha256': hashlib.sha256(freeze_path.read_bytes()).hexdigest(),
              'corpus_sha256': report['frozen_inputs']['corpus_sha256'],
              'shortlist_sha256': report['frozen_inputs']['shortlist_sha256'],
              'case_count': report['case_count'],
              'family_count': report['family_count'],
              'quality_gate_passed': report['quality_gate']['passed'],
              'quality_gate_failures': report['quality_gate']['failures'],
              'metrics': report['metrics'],
              'mutation_policy': {
                  'frozen_v4_inputs_after_first_blind': 'forbidden',
                  'benchmark_repairs_after_first_blind': 'forbidden',
                  'engine_repairs': 'allowed_only_without_modifying_frozen_v4_inputs',
                  'subsequent_v4_runs': 'regression_only_not_first_blind',
              },
          }
          Path('benchmarks/raw/sources/v4_first_blind_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Register first-blind protocol and immutable result in manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          entries = {}
          order = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line:
                  continue
              _, name = line.split('  ', 1)
              path = root / name
              if path.is_file():
                  entries[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  order.append(name)

          for name in (
              'app/raw_recon_v4_blind.py',
              'tests/test_raw_recon_v4_first_blind_v6260.py',
              'benchmarks/raw/sources/v4_first_blind_report.json',
              'benchmarks/raw/sources/v4_first_blind_receipt.json',
          ):
              path = root / name
              entries[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              if name not in order:
                  order.append(name)

          manifest.write_text(
              ''.join(f'{entries[name]}  {name}\n' for name in order),
              encoding='utf-8',
          )
          PY

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Persist first-blind result and consume holdout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-v4-first-blind.yml
          git add -A
          git diff --cached --check
          git commit -m "Record Analysis 6.26 raw v4 first blind result"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4

      - name: Enforce pre-registered blind quality gate after persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('benchmarks/raw/sources/v4_first_blind_report.json').read_text(encoding='utf-8'))
          if not report['quality_gate']['passed']:
              print(json.dumps(report['quality_gate'], indent=2, sort_keys=True))
              raise SystemExit('Analysis 6.26 FIRST BLIND quality gate failed; immutable report has already been persisted')
          print('Analysis 6.26 FIRST BLIND quality gate: PASS')
          PY
