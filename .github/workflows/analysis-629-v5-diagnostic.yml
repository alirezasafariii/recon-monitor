name: Analysis 6.29 Consumed v5 Diagnostic

on:
  push:
    branches:
      - agent/analysis-engine-6.29-fresh-blind-v5-multifamily

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumed v5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.29-fresh-blind-v5-multifamily
          fetch-depth: 0

      - name: Build diagnostic strictly from stored first-blind report
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root=Path('.')
          report_path=root/'benchmarks/raw/results/analysis_raw_v5_first_blind.json'
          receipt_path=root/'benchmarks/raw/sources/v5_first_blind_receipt.json'
          out_path=root/'benchmarks/raw/results/analysis_raw_v5_first_blind_diagnostic.json'
          report=json.loads(report_path.read_text())
          receipt=json.loads(receipt_path.read_text())
          assert receipt['status']=='first_blind_consumed'
          assert report['evaluation_kind']=='fresh_blind_v5_single_consumption'

          cases=list(report['multi_family']['cases'])
          unexpected=[c for c in cases if c.get('unexpected_promotions')]
          non_exact=[c for c in cases if not c.get('exact_admission_set')]
          dual_secure_fail=[c for c in cases if c.get('case_kind')=='dual_secure' and not c.get('dual_secure_rejected')]
          condition_miss=[c for c in cases if c.get('condition_misses')]
          top3_miss=[c for c in cases if int(c.get('expected_top3_hits',0)) < int(c.get('expected_top3_slots',0))]

          promoted=Counter(f for c in unexpected for f in c.get('unexpected_promotions') or [])
          condition_families=Counter(f for c in condition_miss for f in (c.get('condition_misses') or {}))
          diag={
              'diagnostic_version':'1.0.0',
              'rule_version':'2026.08.13.6.29',
              'source':'stored_consumed_first_blind_report_only',
              'scoring_rerun':False,
              'first_blind_consumed':True,
              'quality_gate_passed':bool(report['quality_gate']['passed']),
              'single_metrics':report['single_family']['metrics'],
              'multi_metrics':report['multi_family']['metrics'],
              'counts':{
                  'unexpected_promotion_cases':len(unexpected),
                  'non_exact_admission_cases':len(non_exact),
                  'dual_secure_failures':len(dual_secure_fail),
                  'condition_miss_cases':len(condition_miss),
                  'top3_miss_cases':len(top3_miss),
              },
              'unexpected_promotions_by_family':dict(promoted),
              'condition_misses_by_family':dict(condition_families),
              'unexpected_promotion_cases':unexpected,
              'dual_secure_failures':dual_secure_fail,
              'condition_miss_cases':condition_miss,
              'top3_miss_cases':top3_miss,
          }
          out_path.write_text(json.dumps(diag,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'counts':diag['counts'],
              'unexpected_promotions_by_family':diag['unexpected_promotions_by_family'],
              'condition_misses_by_family':diag['condition_misses_by_family'],
              'unexpected_case_ids':[x['id'] for x in unexpected],
              'dual_secure_failure_ids':[x['id'] for x in dual_secure_fail],
              'condition_miss_ids':[x['id'] for x in condition_miss],
          },indent=2,sort_keys=True))
          PY

      - name: Update manifest and commit diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.'); manifest=root/'MANIFEST.sha256'; entries={}; order=[]
          for line in manifest.read_text().splitlines():
              if '  ' not in line: continue
              _,name=line.split('  ',1); p=root/name
              if p.is_file(): entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          name='benchmarks/raw/results/analysis_raw_v5_first_blind_diagnostic.json'
          p=root/name; entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[n]}  {n}\n' for n in order))
          PY
          sha256sum -c MANIFEST.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-629-v5-diagnostic.yml
          git add -A
          git diff --cached --check
          git commit -m "Record Analysis 6.29 consumed v5 diagnostic"
          git push origin HEAD:agent/analysis-engine-6.29-fresh-blind-v5-multifamily
