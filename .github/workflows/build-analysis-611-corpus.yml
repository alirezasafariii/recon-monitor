name: Build Analysis 6.11 Raw Replay Corpus

on:
  push:
    branches:
      - agent/analysis-engine-6.11-blind-raw-recon-benchmark

permissions:
  contents: write

env:
  PYTHONPATH: app

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.11-blind-raw-recon-benchmark
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Translate selected advisories into raw replay fixtures
        run: |
          python - <<'PY'
          import copy, json, re
          from pathlib import Path

          root = Path('.')
          selected_doc = json.loads((root/'benchmarks/raw/sources/v1_candidates.json').read_text())
          selected = selected_doc['selected']

          expected_condition = {
              'broken_object_authorization':['unauthorized_object_response'],
              'broken_function_authorization':['unauthorized_function_response'],
              'mass_assignment':['privileged_property_accepted'],
              'authentication_session':['authentication_boundary_regression'],
              'account_enumeration':['response_difference'],
              'open_redirect':['external_destination'],
              'ssrf':['server_request_function'],
              'file_upload':['dangerous_type_accepted'],
              'path_traversal':['path_escape_observed'],
              'information_disclosure':['public_observation'],
              'cors_misconfiguration':['credentials_allowed'],
              'race_condition':['duplicate_effect_observed'],
              'sql_injection':['database_error_observed'],
              'nosql_injection':['nosql_error_observed'],
              'command_injection':['process_execution_reached'],
              'server_side_template_injection':['template_engine_error_observed'],
              'ldap_injection':['ldap_error_observed'],
              'unrestricted_resource_consumption':['rate_limit_absent_observed'],
              'security_misconfiguration':['stack_trace_exposed'],
              'secret_exposure':['high_entropy_value'],
          }

          defaults = {
              'broken_object_authorization':('GET','/api/items/123'),
              'broken_function_authorization':('POST','/admin/action'),
              'mass_assignment':('POST','/api/profile'),
              'authentication_session':('POST','/auth/login'),
              'account_enumeration':('POST','/auth/forgot-password'),
              'open_redirect':('GET','/login'),
              'ssrf':('POST','/api/preview'),
              'file_upload':('POST','/api/upload'),
              'path_traversal':('GET','/api/download'),
              'information_disclosure':('GET','/api/status'),
              'cors_misconfiguration':('GET','/api/me'),
              'race_condition':('POST','/api/redeem'),
              'sql_injection':('GET','/api/search'),
              'nosql_injection':('POST','/api/search'),
              'command_injection':('POST','/api/convert'),
              'server_side_template_injection':('POST','/api/render'),
              'ldap_injection':('GET','/api/directory/search'),
              'unrestricted_resource_consumption':('GET','/api/export'),
              'security_misconfiguration':('GET','/debug'),
              'secret_exposure':('GET','/assets/app.js'),
          }

          def code_blocks(text):
              return re.findall(r'```(?:[a-zA-Z0-9_+.-]+)?\s*\n(.*?)```', text or '', re.S)

          def route_from(text, fallback):
              # Prefer method-qualified paths in advisory text, then explicit /api or /actions paths.
              for pat in [r'\b(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+`?(/[^\s`"\']+)', r'`(/(?:api|actions|admin|auth|graphql)[^`\s]*)`']:
                  m = re.search(pat, text or '', re.I)
                  if m:
                      if len(m.groups()) == 2:
                          return m.group(1).upper(), m.group(2).rstrip('.,);')
                      return None, m.group(1).rstrip('.,);')
              return None, fallback

          def first_code(text, markers=()):
              blocks = code_blocks(text)
              if markers:
                  for block in blocks:
                      low = block.lower()
                      if any(marker in low for marker in markers):
                          return block[:8000]
              return blocks[0][:8000] if blocks else ''

          def base_raw(src):
              fam = src['family']; default_method, fallback = defaults[fam]
              method_hint, endpoint = route_from(src.get('description',''), fallback)
              raw = {
                  'target': src['source_project'].replace('/','-') + '.fixture.invalid',
                  'endpoint': endpoint,
                  'method': method_hint or default_method,
                  'endpoint_schema': {'query_parameters':[], 'body_fields':[], 'path_parameters':[], 'object_identifiers':[], 'authentication_hints':[]},
                  'details': {},
                  'category': '',
                  'business_context': 'general',
              }
              desc=(src.get('description') or '').lower(); summary=(src.get('summary') or '').lower()
              schema=raw['endpoint_schema']; details=raw['details']

              if fam == 'broken_object_authorization':
                  schema['path_parameters']=['id']; schema['object_identifiers']=['id']; raw['business_context']='customer_data'
                  details['context_observations']=[{'context':'lower_scope_user','expected_access':'denied','status_code':200}]
              elif fam == 'broken_function_authorization':
                  if '/admin' not in raw['endpoint'] and 'permission' not in raw['endpoint'].lower(): raw['endpoint']='/admin'+raw['endpoint']
                  raw['method']='POST'; raw['business_context']='administration'
                  details['context_observations']=[{'context':'low_privilege_user','role':'viewer','expected_access':'denied','status_code':200}]
              elif fam == 'mass_assignment':
                  raw['method']='POST'
                  fields=[]
                  for token in ('overrideConfig','role','is_admin','admin','permissions','privilege','owner_id','user_id'):
                      if token.lower() in desc: fields.append(token)
                  schema['body_fields']=fields[:4] or ['role']
              elif fam == 'authentication_session':
                  schema['authentication_hints']=['session']; schema['body_fields']=['username','password']; raw['business_context']='identity'
              elif fam == 'account_enumeration':
                  schema['body_fields']=['email']; raw['business_context']='identity'
              elif fam == 'open_redirect':
                  schema['query_parameters']=['redirect']; details['status_code']=302; details['response_headers']={'Location':'https://untrusted.fixture.invalid/landing'}
              elif fam == 'ssrf':
                  schema['body_fields']=['url']; raw['category']='remote preview webhook import'
                  code=first_code(src.get('description',''), ('requests.get','http.get','urlopen','fetch(','axios.get','http.request','curl','wget'))
                  if code: details['source_code']=code
              elif fam == 'file_upload':
                  raw['method']='POST'; schema['body_fields']=['file']; raw['category']='file upload multipart/form-data'
              elif fam == 'path_traversal':
                  schema['query_parameters']=['path']; raw['category']='file download archive';
              elif fam == 'information_disclosure':
                  raw['business_context']='customer_data'; details['status_code']=200
                  if any(x in desc for x in ('stack trace','stacktrace','traceback')): details['response_text']='Traceback: application stack frame disclosed in stored response'
                  else: details['response_text']='Stored public response contains sensitive diagnostic material described by the advisory'
              elif fam == 'cors_misconfiguration':
                  origin='https://untrusted.fixture.invalid'; details['request_headers']={'Origin':origin}; details['response_headers']={'Access-Control-Allow-Origin':origin}
                  if 'credential' in desc: details['response_headers']['Access-Control-Allow-Credentials']='true'
                  schema['authentication_hints']=['session']; raw['business_context']='identity'
              elif fam == 'race_condition':
                  raw['method']='POST'; raw['endpoint'] = raw['endpoint'] if any(x in raw['endpoint'].lower() for x in ('redeem','claim','transfer','withdraw','reserve','confirm','refund')) else '/api/redeem'; raw['category']='single use redeem operation'
              elif fam == 'sql_injection':
                  schema['query_parameters']=['filter']; raw['category']='database search query sql'
                  if any(x in desc for x in ('sql syntax error','syntax error at','database error')): details['response_text']='SQL syntax error at or near query expression'
              elif fam == 'nosql_injection':
                  schema['body_fields']=['filter']; raw['category']='mongodb nosql document query'
                  if any(x in desc for x in ('mongoerror','mongodb error','nosql error')): details['response_text']='MongoError: invalid query operator'
              elif fam == 'command_injection':
                  schema['body_fields']=['input']; code=first_code(src.get('description',''), ('exec(','spawn(','system(','popen(','subprocess','child_process'))
                  if code: details['source_code']=code
              elif fam == 'server_side_template_injection':
                  schema['body_fields']=['template']; raw['category']='server template render'
                  code=first_code(src.get('description',''), ('jinja','render_template','twig','freemarker','handlebars','template'))
                  if code: details['source_code']=code
                  if any(x in desc for x in ('template error','template syntax','jinja2.exceptions','twig\\error')): details['response_text']='TemplateSyntaxError: stored render failed'
              elif fam == 'ldap_injection':
                  schema['query_parameters']=['filter']; raw['category']='ldap directory search filter'
                  if any(x in desc for x in ('ldap error','invalid dn','filter error')): details['response_text']='LDAP filter error: invalid search expression'
              elif fam == 'unrestricted_resource_consumption':
                  schema['query_parameters']=['limit']; raw['category']='bulk export report'; details['status_code']=200
              elif fam == 'security_misconfiguration':
                  details['status_code']=500
                  if any(x in desc for x in ('stack trace','stacktrace','traceback','exception')): details['response_text']='Traceback: framework exception with application path /srv/app/module.py:42'
                  elif 'directory listing' in desc: details['response_text']='<title>Index of /</title>'
                  else: details['response_text']='debug exception details exposed in stored error response'
                  raw['category']='debug error deployment configuration'
              elif fam == 'secret_exposure':
                  raw['category']='production javascript client asset'
                  block=first_code(src.get('description',''), ('api_key','apikey','token','password','secret'))
                  if block:
                      # Preserve code shape but redact advisory credential material; do not inject a synthetic secret.
                      details['source_code']=re.sub(r'(["\'])([^"\']{12,})(["\'])', r'\1<redacted>\3', block[:8000])
              return raw

          def near_miss(raw, fam):
              out=copy.deepcopy(raw); d=out['details']
              if fam in ('broken_object_authorization','broken_function_authorization'): d.pop('context_observations',None)
              elif fam=='open_redirect': d['response_headers']={'Location':'/home'}
              elif fam=='ssrf': d.pop('source_code',None)
              elif fam=='cors_misconfiguration': d['response_headers'].pop('Access-Control-Allow-Credentials',None); out['endpoint_schema']['authentication_hints']=[]; out['business_context']='public'
              elif fam in ('sql_injection','nosql_injection','server_side_template_injection','ldap_injection','security_misconfiguration','information_disclosure'): d.pop('response_text',None)
              elif fam=='secret_exposure': d.pop('source_code',None)
              return out

          def secure_negative(raw, fam):
              out=near_miss(raw,fam); d=out['details']
              if fam in ('broken_object_authorization','broken_function_authorization'): d['context_observations']=[{'context':'unauthorized_user','expected_access':'denied','status_code':403}]
              elif fam=='open_redirect': d['status_code']=302; d['response_headers']={'Location':'/dashboard'}
              elif fam=='cors_misconfiguration': d['request_headers']={'Origin':'https://untrusted.fixture.invalid'}; d['response_headers']={'Access-Control-Allow-Origin':'https://trusted.fixture.invalid'}
              elif fam=='unrestricted_resource_consumption': d['status_code']=429
              elif fam=='file_upload': d['status_code']=415
              elif fam=='path_traversal': d['status_code']=400
              else: d.setdefault('status_code', 400)
              return out

          def sparse(raw):
              return {'target':raw['target'],'endpoint':raw['endpoint'],'method':raw['method'],'endpoint_schema':raw['endpoint_schema'],'details':{},'category':'','business_context':'general'}

          rows=[]; compact=[]
          for src in selected:
              fam=src['family']; pos=base_raw(src)
              variants=[('positive',pos,True),('near_miss',near_miss(pos,fam),False),('secure_negative',secure_negative(pos,fam),False),('sparse_noisy',sparse(pos),False)]
              compact.append({k:src.get(k) for k in ('source_root','family','bucket_cwe','source_project','source_date','provenance_url','source_code_location','summary','cve_id')})
              for kind,raw,admitted in variants:
                  rows.append({
                      'id':f"{src['source_root']}-{kind}",
                      'family':fam,
                      'case_kind':kind,
                      'rank_required':kind!='sparse_noisy',
                      'split':'postfreeze_holdout',
                      'source_root':src['source_root'],
                      'source_project':src['source_project'],
                      'source_date':src['source_date'],
                      'provenance':{
                          'source_kind':'github_reviewed_advisory',
                          'url':src['provenance_url'],
                          'primary_source':True,
                          'source_code_location':src['source_code_location'],
                          'translation':'sanitized_raw_replay_from_advisory_facts',
                      },
                      'raw':raw,
                      'expected':{'family':fam,'admitted':admitted,'condition_signals':expected_condition.get(fam,[]) if kind=='positive' else []},
                  })
          dest=root/'benchmarks/raw/analysis_raw_v1.jsonl'; dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text('\n'.join(json.dumps(r,sort_keys=True,separators=(',',':')) for r in rows)+'\n')
          (root/'benchmarks/raw/sources/v1.json').write_text(json.dumps({'protocol':'analysis-6.11-blind-raw-recon','sources':compact},indent=2,sort_keys=True))
          print(json.dumps({'sources':len(selected),'cases':len(rows),'families':len({r['family'] for r in rows})},indent=2))
          PY
      - name: Validate corpus schema and independence without scoring
        run: |
          python - <<'PY'
          from raw_recon_corpus import load_raw_cases, validate_raw_corpus
          cases=load_raw_cases('benchmarks/raw/analysis_raw_v1.jsonl')
          report=validate_raw_corpus(cases)
          print(report)
          if not report['passed']:
              raise SystemExit('; '.join(report['errors']))
          PY
      - name: Commit unscored corpus
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/raw/analysis_raw_v1.jsonl benchmarks/raw/sources/v1.json
          git commit -m 'Build Analysis 6.11 unscored raw replay corpus'
          git push
