name: Analysis 6.19 One-Shot Cutover

on:
  push:
    branches:
      - agent/analysis-engine-6.19-client-side-standards-grounding

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.19-client-side-standards-grounding
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic Analysis 6.19 cutover
        run: python scripts/analysis_619_cutover.py

      - name: Correct multi-hypothesis client test contract
        run: python scripts/analysis_619_test_contract_fix.py

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Four-layer standards grounding contract
        run: python -m unittest discover -s tests -p 'test_analysis_619_standards_grounding.py' -q

      - name: Client-side collector contract
        run: python -m unittest discover -s tests -p 'test_physical_raw_collector_client_side_v6190.py' -q

      - name: Standards regression
        run: python -m unittest discover -s tests -p 'test_analysis_standards_v630.py' -q

      - name: Physical detector regression
        run: python -m unittest discover -s tests -p 'test_physical_family_detectors_v690.py' -q

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit validated Analysis 6.19 cutover and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-619-one-shot.yml scripts/analysis_619_cutover.py scripts/analysis_619_diagnostic_patch.py scripts/analysis_619_test_contract_fix.py
          git add MANIFEST.sha256 app/analysis_standards.py app/hypothesis_admission.py app/family_detectors/base.py app/family_detectors/registry.py app/family_detectors/postmessage_trust.py app/raw_family_collectors/__init__.py app/raw_family_collectors/client_side.py app/bug_candidates.py docs/ANALYSIS_ENGINE_6_19_CLIENT_SIDE_STANDARDS_GROUNDING.md tests/test_analysis_standards_v630.py tests/test_physical_family_detectors_v690.py tests/test_analysis_619_standards_grounding.py tests/test_physical_raw_collector_client_side_v6190.py
          git diff --cached --check
          git commit -m "Cut over Analysis 6.19 client-side standards-grounded collectors"
          git push origin HEAD:agent/analysis-engine-6.19-client-side-standards-grounding
