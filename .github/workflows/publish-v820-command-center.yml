name: Publish Recon Monitor v8.2.0 Command Center 2.0

on:
  push:
    paths:
      - '.github/workflows/publish-v820-command-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Command Center 2.0 code patch
        shell: bash
        run: |
          cat > /tmp/cc820.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/cc820.patch.gz.b64 | gzip -d > /tmp/cc820.patch
          git apply /tmp/cc820.patch

      - name: Apply v8.2.0 version and documentation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          p=root/'app/core.py'; s=p.read_text(); s=s.replace('APP_VERSION = "8.1.1"','APP_VERSION = "8.2.0"',1); p.write_text(s)
          for rel in ['tests/test_stability_v451.py','tests/test_platform_v60.py','tests/test_workspace_v70.py','tests/test_safe_validation_v51.py','tests/test_product_platform_v50.py']:
              p=root/rel; s=p.read_text(); s=s.replace('"8.1.1"','"8.2.0"').replace("'8.1.1'","'8.2.0'"); p.write_text(s)
          p=root/'config.env.example'; s=p.read_text(); s=s.replace('# Recon Monitor 8.1.1 configuration','# Recon Monitor 8.2.0 configuration',1).replace('ReconMonitor/8.1.1','ReconMonitor/8.2.0'); p.write_text(s)
          p=root/'README.md'; s=p.read_text(); s=s.replace('# Recon Monitor 8.1.1','# Recon Monitor 8.2.0',1)
          section='''\n## Command Center 2.0 in 8.2.0\n\nThe landing workspace is now decision-first. It ranks run failures, high-value potential findings, open cases, evidence gaps, and material re-check changes into one **Decision Inbox**, then surfaces a single **Next Best Action**. Workspace Pulse and Recent Research Activity provide context without turning the landing page back into an inventory dashboard.\n\n'''
          if '## Command Center 2.0 in 8.2.0' not in s:
              first=s.find('\n'); s=s[:first+1]+section+s[first+1:]
          p.write_text(s)
          p=root/'README_FA.md'; s=p.read_text(); s=s.replace('# راهنمای Recon Monitor 8.1.0','# راهنمای Recon Monitor 8.2.0',1).replace('# راهنمای Recon Monitor 8.1.1','# راهنمای Recon Monitor 8.2.0',1); p.write_text(s)
          p=root/'CHANGELOG.md'; s=p.read_text()
          block='''# 8.2.0 — Command Center 2.0\n\n- Rebuilt the landing workspace around a ranked Decision Inbox instead of passive dashboard cards.\n- Added a single Next Best Action derived from run health, potential findings, evidence gaps and material surface changes.\n- Added high-interest change, high-value finding and evidence-gap KPIs with target focus.\n- Added compact Workspace Pulse and Recent Research Activity panels.\n- Kept Recon, Analysis, Potential Findings and Alerts as the four primary workspaces.\n- Preserved the permanent Command Center navigation entry introduced in 8.1.1.\n- Database schema remains 16; no destructive migration is required.\n\n'''
          if not s.startswith('# 8.2.0 — Command Center 2.0'):
              s=block+s
          p.write_text(s)
          (root/'MIGRATION-v8.2.md').write_text('''# Migration to Recon Monitor 8.2.0\n\nRecon Monitor 8.2.0 is a Dashboard/decision-workflow upgrade. The database schema remains **16**.\n\n## What changes\n\n- Command Center becomes a ranked Decision Inbox.\n- The highest-value next action is surfaced explicitly.\n- Material re-check changes and recent run activity are visible without opening specialist tools.\n- Four primary workspaces remain Recon, Analysis, Potential Findings and Alerts.\n\n## Upgrade\n\n```bash\n./recon-monitor.sh update check\n./recon-monitor.sh update install\n```\n\nThe updater creates backups before replacement and retains rollback behavior.\n''')
          p=root/'tests/test_update_v810.py'; s=p.read_text(); s=s.replace('"tagName": "v8.2.0"','"tagName": "v8.3.0"',1).replace('"name": "Recon Monitor v8.2.0"','"name": "Recon Monitor v8.3.0"',1).replace('/tag/v8.2.0','/tag/v8.3.0',1).replace('"recon-monitor-v8.2.0.zip"','"recon-monitor-v8.3.0.zip"',1).replace('"recon-monitor-v8.2.0.zip.sha256"','"recon-monitor-v8.3.0.zip.sha256"',1).replace('self.assertEqual(result["available"], "8.2.0")','self.assertEqual(result["available"], "8.3.0")',1).replace('self.assertIn("recon-monitor-v8.2.0.zip", result["assets"])','self.assertIn("recon-monitor-v8.3.0.zip", result["assets"])',1); p.write_text(s)
          # Remove this one-time workflow before building the final manifest/commit.
          (root/'.github/workflows/publish-v820-command-center.yml').unlink(missing_ok=True)
          PY

      - name: Rebuild and verify source manifest
        shell: bash
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.py[co]' -delete
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          entries=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel=='MANIFEST.sha256' or rel.startswith('.git/') or rel=='.DS_Store': continue
              entries.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          (root/'MANIFEST.sha256').write_text('\n'.join(entries)+'\n')
          print(f'manifest entries={len(entries)}')
          PY
          sha256sum -c MANIFEST.sha256
          ! find . -type f \( -name '*.pyc' -o -name '.DS_Store' \) | grep .
          test ! -f config.env
          test ! -f policies/targets.json
          grep -q 'APP_VERSION = "8.2.0"' app/core.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate on Python 3.11
        shell: bash
        run: |
          PYTHONPATH=app python -m unittest discover -s tests -v
          cp config.env.example config.env
          sed -i 's/I_HAVE_AUTHORIZATION="no"/I_HAVE_AUTHORIZATION="yes"/' config.env
          cp policies/targets.json.example policies/targets.json
          ./recon-monitor.sh test --integration
          rm -f config.env policies/targets.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate on Python 3.13
        shell: bash
        run: |
          PYTHONPATH=app python -m unittest discover -s tests -v
          cp config.env.example config.env
          sed -i 's/I_HAVE_AUTHORIZATION="no"/I_HAVE_AUTHORIZATION="yes"/' config.env
          cp policies/targets.json.example policies/targets.json
          ./recon-monitor.sh test --integration
          rm -f config.env policies/targets.json

      - name: Commit clean v8.2.0 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Recon Monitor 8.2.0 Command Center 2.0'
          git push origin HEAD:main

      - name: Tag and publish v8.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -a v8.2.0 -m 'Recon Monitor 8.2.0'
          git push origin v8.2.0
          git archive --format=zip --prefix=recon-monitor-v8.2.0/ -o /tmp/recon-monitor-v8.2.0.zip HEAD
          cd /tmp
          sha256sum recon-monitor-v8.2.0.zip > recon-monitor-v8.2.0.zip.sha256
          gh release create v8.2.0 recon-monitor-v8.2.0.zip recon-monitor-v8.2.0.zip.sha256 \
            --repo alirezasafariii/recon-monitor \
            --title 'Recon Monitor v8.2.0' \
            --notes 'Command Center 2.0: ranked Decision Inbox, single Next Best Action, material change stream, workspace pulse, recent research activity, permanent Command Center navigation, 174 unit tests plus integration validation on Python 3.11 and 3.13. Schema remains 16.'
