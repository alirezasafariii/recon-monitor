name: Publish Recon Monitor v8.2.0

'on':
  push:
    paths:
      - '.github/workflows/publish-v820-command-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean v8.2.0 source
        run: python3 .github/scripts/publish_v820.py

      - name: Verify source hygiene and manifest
        shell: bash
        run: |
          sha256sum -c MANIFEST.sha256
          test ! -f config.env
          test ! -f policies/targets.json
          test ! -e .github/scripts/publish_v820.py
          test ! -e .github/workflows/publish-v820-command-center.yml
          grep -q 'APP_VERSION = "8.2.0"' app/core.py
          if find . -type f \( -name '*.pyc' -o -name '.DS_Store' \) | grep -q .; then exit 1; fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python 3.11
        shell: bash
        run: |
          PYTHONPATH=app python -m unittest discover -s tests -v
          cp config.env.example config.env
          sed -i 's/I_HAVE_AUTHORIZATION="no"/I_HAVE_AUTHORIZATION="yes"/' config.env
          cp policies/targets.json.example policies/targets.json
          ./recon-monitor.sh test --integration
          rm -f config.env policies/targets.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Python 3.13
        shell: bash
        run: |
          PYTHONPATH=app python -m unittest discover -s tests -v
          cp config.env.example config.env
          sed -i 's/I_HAVE_AUTHORIZATION="no"/I_HAVE_AUTHORIZATION="yes"/' config.env
          cp policies/targets.json.example policies/targets.json
          ./recon-monitor.sh test --integration
          rm -f config.env policies/targets.json

      - name: Commit clean v8.2.0 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Recon Monitor 8.2.0 Command Center 2.0'
          git push origin HEAD:main

      - name: Tag and release v8.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -a v8.2.0 -m 'Recon Monitor 8.2.0'
          git push origin v8.2.0
          git archive --format=zip --prefix=recon-monitor-v8.2.0/ -o /tmp/recon-monitor-v8.2.0.zip HEAD
          cd /tmp
          sha256sum recon-monitor-v8.2.0.zip > recon-monitor-v8.2.0.zip.sha256
          gh release create v8.2.0 recon-monitor-v8.2.0.zip recon-monitor-v8.2.0.zip.sha256 --repo alirezasafariii/recon-monitor --title 'Recon Monitor v8.2.0' --notes 'Command Center 2.0: ranked Decision Inbox, single Next Best Action, material change stream, Workspace Pulse, recent research activity, permanent Command Center navigation, 174 unit tests plus integration validation on Python 3.11 and 3.13. Schema remains 16.'
