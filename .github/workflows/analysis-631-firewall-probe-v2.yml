name: Analysis 6.31 Replacement Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe replacements
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import check_candidate

          rows = [
            {
              'family': 'cors_misconfiguration',
              'source_root': 'HARMONIA-ISSUE-710',
              'source_project': 'forkwright/harmonia',
              'canonical_advisory_url': 'https://github.com/forkwright/harmonia/issues/710',
            },
            {
              'family': 'graphql_data_exposure',
              'source_root': 'EYESPIE-ISSUE-122',
              'source_project': 'ryjen/eyespie',
              'canonical_advisory_url': 'https://github.com/ryjen/eyespie/issues/122',
            },
            {
              'family': 'nosql_injection',
              'source_root': 'ACTOR-TS-ISSUE-738',
              'source_project': 'pathosDev/actor-ts',
              'canonical_advisory_url': 'https://github.com/pathosDev/actor-ts/issues/738',
            },
            {
              'family': 'source_map_exposure',
              'source_root': 'GOV-BB-ISSUE-2092',
              'source_project': 'govtech-bb/gov-bb',
              'canonical_advisory_url': 'https://github.com/govtech-bb/gov-bb/issues/2092',
            },
            {
              'family': 'unsafe_api_consumption',
              'source_root': 'RICKBOT-ISSUE-38',
              'source_project': 'zachlagden/rickbot',
              'canonical_advisory_url': 'https://github.com/zachlagden/rickbot/issues/38',
            },
            {
              'family': 'websocket_authorization',
              'source_root': 'LAYOUT-ORCHESTRATION-ISSUE-20',
              'source_project': 'bazauto/layout-orchestration',
              'canonical_advisory_url': 'https://github.com/bazauto/layout-orchestration/issues/20',
            },
          ]
          results = []
          for row in rows:
              result = check_candidate(row)
              results.append({'family': row['family'], 'source_root': row['source_root'], 'source_project': row['source_project'], **result})
          print(json.dumps({
              'scoring_executed': False,
              'detector_output_used': False,
              'candidate_count': len(rows),
              'fresh_count': sum(1 for row in results if row['allowed']),
              'rejected_count': sum(1 for row in results if not row['allowed']),
              'results': results,
          }, indent=2, sort_keys=True))
          if any(not row['allowed'] for row in results):
              raise SystemExit(2)
          PY
