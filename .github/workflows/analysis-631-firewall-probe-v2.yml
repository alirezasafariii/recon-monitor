name: Analysis 6.31 Complement Firewall Diagnostic

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose complement gaps without scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v5_source_audit import audit_row
          from raw_recon_v6_source_firewall import check_candidate, exposure_index

          families = {
            'account_enumeration', 'authentication_session', 'broken_function_authorization',
            'command_injection', 'cryptographic_failure', 'exceptional_condition_mishandling',
            'file_upload', 'mass_assignment', 'race_condition',
            'server_side_template_injection', 'unrestricted_resource_consumption',
          }
          doc = json.loads(Path('benchmarks/raw/sources/v6_candidates.json').read_text(encoding='utf-8'))
          pool = doc.get('candidates_by_family') or {}
          prior = exposure_index()
          report = {}
          for family in sorted(families):
              rows = []
              for raw in pool.get(family) or []:
                  fw = check_candidate(raw, index=prior)
                  passed, hits, score = audit_row(family, raw)
                  rows.append({
                      'source_root': raw.get('source_root'),
                      'source_project': raw.get('source_project'),
                      'canonical_advisory_url': raw.get('canonical_advisory_url'),
                      'audit_passed': bool(passed),
                      'audit_score': int(score),
                      'audit_hits': hits,
                      'firewall': fw,
                      'eligible': bool(passed and fw['allowed']),
                  })
              report[family] = rows
          print(json.dumps({
              'scoring_executed': False,
              'detector_output_used': False,
              'families': report,
          }, indent=2, sort_keys=True))
          PY
