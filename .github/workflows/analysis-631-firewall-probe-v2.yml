name: Analysis 6.31 Complement Override Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe second-pass complement sources without scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v5_source_audit import audit_row
          from raw_recon_v6_source_firewall import check_candidate, exposure_index

          rows = [
            {
              'family': 'account_enumeration',
              'source_root': 'GHSA-cjr5-m69m-f39c',
              'source_project': 'bluewave-labs/Checkmate',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-cjr5-m69m-f39c',
              'source_code_location': 'https://github.com/bluewave-labs/Checkmate',
              'summary': 'Checkmate user enumeration lets an unauthenticated caller determine whether a given email address is registered.',
              'description': 'The published advisory states that the password-recovery endpoint returns HTTP 200 for a registered email address and a different status code for an unregistered email, exposing existing account/user existence through a response discrepancy.',
            },
            {
              'family': 'broken_function_authorization',
              'source_root': 'ANDY-RBAC-ISSUE-97',
              'source_project': 'rivoli-ai/andy-rbac',
              'canonical_advisory_url': 'https://github.com/rivoli-ai/andy-rbac/issues/97',
              'summary': 'Andy RBAC management functions had a critical authorization bypass: any authenticated non-admin token could invoke privileged role, policy and grant administration.',
              'description': 'The repository security issue documents function-level authorization missing from administrative controllers. A low-privilege authenticated user could access privileged admin mutations and rewrite roles, policies or grants, escalating privileges because only generic authentication was enforced instead of the required admin/manage permission.',
            },
            {
              'family': 'command_injection',
              'source_root': 'GHSA-jqh7-pchh-v74j',
              'source_project': 'zimbra/zimbra-collaboration',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-jqh7-pchh-v74j',
              'summary': 'Zimbra Collaboration contains OS command injection in SNMP notification processing.',
              'description': 'The published CVE/GHSA states that improper sanitization of untrusted SMTP input in the SNMP notification processing path can execute arbitrary operating system commands as the Zimbra process user. Untrusted input therefore reaches an OS command execution boundary.',
            },
            {
              'family': 'exceptional_condition_mishandling',
              'source_root': 'GHSA-qh5g-q395-cx4j',
              'source_project': 'ImageMagick/ImageMagick',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-qh5g-q395-cx4j',
              'repository_advisory_url': 'https://github.com/ImageMagick/ImageMagick/security/advisories/GHSA-qh5g-q395-cx4j',
              'summary': 'ImageMagick missing null-check exceptional-condition handling can cause a use-after-free crash while parsing an XMP profile.',
              'description': 'The reviewed advisory states that a missing null check in XMP parsing leaves an error condition improperly handled, causing use-after-free behavior that can result in a process crash rather than a controlled failure path.',
            },
            {
              'family': 'file_upload',
              'source_root': 'GHSA-gxgp-6wm7-xrhr',
              'source_project': 'dulldusk/phpfm',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-gxgp-6wm7-xrhr',
              'source_code_location': 'https://github.com/dulldusk/phpfm',
              'summary': 'phpfm has an unrestricted file upload vulnerability allowing unauthenticated arbitrary PHP-file upload.',
              'description': 'The published advisory states that the upload extension filter is empty and authentication is disabled by default, so a remote attacker can upload a PHP webshell with a dangerous filename/extension to the application and execute the uploaded file.',
            },
            {
              'family': 'server_side_template_injection',
              'source_root': 'GHSA-95wq-w6wp-f2w9',
              'source_project': 'WGDashboard/WGDashboard',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-95wq-w6wp-f2w9',
              'source_code_location': 'https://github.com/WGDashboard/WGDashboard',
              'references': ['https://github.com/Stuub/WGDashboard-v4.3.2-SSTI-to-Root-RCE-PoC'],
              'summary': 'WGDashboard server-side template injection reaches an unsandboxed Jinja2 template render path and can execute code as root.',
              'description': 'The published SSTI disclosure and its linked PoC document user-supplied email template fields passed directly to Python jinja2.Template().render() without a sandbox. The attacker-controlled template/expression is rendered server-side and can invoke command execution.',
            },
            {
              'family': 'unrestricted_resource_consumption',
              'source_root': 'GHSA-rgw5-rvv9-x895',
              'source_project': 'juliangruber/brace-expansion',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-rgw5-rvv9-x895',
              'source_code_location': 'https://github.com/juliangruber/brace-expansion',
              'summary': 'brace-expansion has unbounded resource consumption causing memory exhaustion, CPU exhaustion and denial of service.',
              'description': 'The advisory documents unbounded intermediate arrays during brace expansion. A small crafted input can trigger uncatchable out-of-memory process termination, while a larger input can consume CPU and block the event loop for many seconds, exhausting memory/CPU resources and denying service.',
            },
          ]

          prior = exposure_index()
          results = []
          for row in rows:
              fw = check_candidate(row, index=prior)
              passed, hits, score = audit_row(row['family'], row)
              results.append({
                  'family': row['family'],
                  'source_root': row['source_root'],
                  'source_project': row['source_project'],
                  'audit_passed': bool(passed),
                  'audit_score': int(score),
                  'audit_hits': hits,
                  'firewall_allowed': bool(fw['allowed']),
                  'firewall': fw,
                  'eligible': bool(passed and fw['allowed']),
              })

          print(json.dumps({
              'scoring_executed': False,
              'detector_output_used': False,
              'candidate_count': len(rows),
              'eligible_count': sum(1 for row in results if row['eligible']),
              'all_eligible': all(row['eligible'] for row in results),
              'results': results,
          }, indent=2, sort_keys=True))
          if not all(row['eligible'] for row in results):
              raise SystemExit(2)
          PY
