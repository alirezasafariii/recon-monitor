name: Analysis 6.31 Alternate Logging Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe alternate logging sources without scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v5_source_audit import audit_row
          from raw_recon_v6_source_firewall import check_candidate, exposure_index

          rows = [
            {
              'family': 'security_logging_alerting_failure',
              'source_root': 'GHSA-q83p-h7pj-3m3p',
              'source_project': 'ibm/db2',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-q83p-h7pj-3m3p',
              'summary': 'IBM Db2 logging can write sensitive plaintext passwords into trace files.',
              'description': 'The published advisory states that local attackers can obtain sensitive information because plain text passwords are logged in Db2 trace files. The logging path therefore records credential data without redaction.',
            },
            {
              'family': 'security_logging_alerting_failure',
              'source_root': 'GHSA-wx8h-2jpv-xvwr',
              'source_project': 'mongodb/sql-schema-builder',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-wx8h-2jpv-xvwr',
              'summary': 'MongoDB SQL Schema Builder logging can write sensitive authentication material into diagnostic output and log files without redaction.',
              'description': 'The published advisory states that startup configuration is logged to standard output and optionally a file, with certain connection settings written without redaction so sensitive authentication credentials can appear in plaintext logs.',
            },
          ]

          prior = exposure_index()
          results = []
          for row in rows:
              fw = check_candidate(row, index=prior)
              passed, hits, score = audit_row(row['family'], row)
              results.append({
                  'family': row['family'],
                  'source_root': row['source_root'],
                  'source_project': row['source_project'],
                  'audit_passed': bool(passed),
                  'audit_score': int(score),
                  'audit_hits': hits,
                  'firewall_allowed': bool(fw['allowed']),
                  'firewall': fw,
                  'eligible': bool(passed and fw['allowed']),
              })

          print(json.dumps({
              'scoring_executed': False,
              'detector_output_used': False,
              'candidate_count': len(rows),
              'eligible_count': sum(1 for row in results if row['eligible']),
              'results': results,
          }, indent=2, sort_keys=True))
          if not any(row['eligible'] for row in results):
              raise SystemExit(2)
          PY
