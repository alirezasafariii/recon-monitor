name: Analysis 6.31 Final SSTI Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe SSTI source without scoring
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v5_source_audit import audit_row
          from raw_recon_v6_source_firewall import check_candidate, exposure_index

          row = {
              'family': 'server_side_template_injection',
              'source_root': 'OWNPAY-ISSUE-438',
              'source_project': 'own-pay/OwnPay',
              'canonical_advisory_url': 'https://github.com/own-pay/OwnPay/issues/438',
              'summary': 'OwnPay security audit found full server-side template injection in TwigFactory because editable templates render with the full unsandboxed Twig environment.',
              'description': 'A project-member audit issue documents non-superadmin-controlled Twig template source reaching the server-side Twig Environment without SandboxExtension. Injected Twig expressions are rendered by the full template engine and can read secrets, invoke registered hooks and potentially reach code execution through plugin functions.',
          }
          prior = exposure_index()
          fw = check_candidate(row, index=prior)
          passed, hits, score = audit_row(row['family'], row)
          result = {
              'family': row['family'],
              'source_root': row['source_root'],
              'source_project': row['source_project'],
              'audit_passed': bool(passed),
              'audit_score': int(score),
              'audit_hits': hits,
              'firewall_allowed': bool(fw['allowed']),
              'firewall': fw,
              'eligible': bool(passed and fw['allowed']),
              'scoring_executed': False,
              'detector_output_used': False,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result['eligible']:
              raise SystemExit(2)
          PY
