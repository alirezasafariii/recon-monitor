name: Analysis 6.31 Replacement Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe replacements
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import check_candidate

          rows = [
            {
              'family': 'cors_misconfiguration',
              'source_root': 'GHSA-v3j7-r9gq-3gjw',
              'source_project': 'electron/electron',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-v3j7-r9gq-3gjw',
              'repository_advisory_url': 'https://github.com/electron/electron/security/advisories/GHSA-v3j7-r9gq-3gjw',
            },
            {
              'family': 'graphql_data_exposure',
              'source_root': 'EYESPIE-ISSUE-122',
              'source_project': 'ryjen/eyespie',
              'canonical_advisory_url': 'https://github.com/ryjen/eyespie/issues/122',
            },
            {
              'family': 'nosql_injection',
              'source_root': 'GHSA-98xf-r82g-9mhx',
              'source_project': 'langchain-ai/langgraphjs',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-98xf-r82g-9mhx',
              'repository_advisory_url': 'https://github.com/langchain-ai/langgraphjs/security/advisories/GHSA-98xf-r82g-9mhx',
            },
            {
              'family': 'source_map_exposure',
              'source_root': 'GHSA-fxqj-rqcc-2cmp',
              'source_project': 'postcss/postcss',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-fxqj-rqcc-2cmp',
              'repository_advisory_url': 'https://github.com/postcss/postcss/security/advisories/GHSA-fxqj-rqcc-2cmp',
            },
            {
              'family': 'unsafe_api_consumption',
              'source_root': 'GHSA-94pj-82f3-465w',
              'source_project': 'guzzle/guzzle',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-94pj-82f3-465w',
              'repository_advisory_url': 'https://github.com/guzzle/guzzle/security/advisories/GHSA-94pj-82f3-465w',
            },
            {
              'family': 'websocket_authorization',
              'source_root': 'GHSA-5gpj-vj23-vhhv',
              'source_project': 'open-webui/open-webui',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-5gpj-vj23-vhhv',
              'repository_advisory_url': 'https://github.com/open-webui/open-webui/security/advisories/GHSA-5gpj-vj23-vhhv',
            },
          ]
          results = []
          for row in rows:
              result = check_candidate(row)
              results.append({'family': row['family'], 'source_root': row['source_root'], 'source_project': row['source_project'], **result})
          print(json.dumps({
              'scoring_executed': False,
              'detector_output_used': False,
              'candidate_count': len(rows),
              'fresh_count': sum(1 for row in results if row['allowed']),
              'rejected_count': sum(1 for row in results if not row['allowed']),
              'results': results,
          }, indent=2, sort_keys=True))
          if any(not row['allowed'] for row in results):
              raise SystemExit(2)
          PY
