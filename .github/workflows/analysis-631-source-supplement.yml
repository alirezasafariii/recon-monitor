name: Analysis 6.31 Source Supplement

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_selection_diagnostic.json
      - .github/workflows/analysis-631-source-supplement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supplement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect focused independent source candidates
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          import raw_recon_v4_source_discovery as v4
          import raw_recon_v5_nvd_api_discovery as nvd
          from raw_recon_v5_nvd_discovery import CVE_RE, _candidate, _cwes, prior_cve_exposure
          from raw_recon_v5_source_audit import audit_row
          import raw_recon_v6_source_firewall as fw

          diagnostic = json.loads(Path('benchmarks/raw/sources/v6_selection_diagnostic.json').read_text())
          targets = sorted(set(diagnostic['families_without_semantic_candidates']))
          prior = fw.exposure_index()
          prior_cves = set(prior_cve_exposure()) | {
              str(root).upper() for root in prior['roots'] if CVE_RE.fullmatch(str(root).upper())
          }
          grounding = v4._grounding_writeup_urls()
          family_cwes = v4._family_cwes()
          frequency = defaultdict(int)
          for cwes in family_cwes.values():
              for cwe in cwes:
                  frequency[cwe] += 1

          cache = {}
          counters = {'api_requests': 0, 'cache_hits': 0, 'records': 0}
          pools = {}
          query_plan = {}
          for family in targets:
              by_root = {}
              query_plan[family] = []
              cwes = sorted(family_cwes.get(family, ()), key=lambda value: (frequency[value], value))
              for cwe in cwes:
                  query_plan[family].append(cwe)
                  for cve in nvd._fetch_cwe(cwe, cache=cache, counters=counters):
                      matched = _cwes(cve) & set(family_cwes.get(family, ()))
                      if not matched:
                          continue
                      row = _candidate(
                          cve,
                          family=family,
                          matched_cwes=matched,
                          prior=prior,
                          prior_cves=prior_cves,
                          grounding_urls=grounding,
                      )
                      if row is None or not fw.check_candidate(row)['allowed']:
                          continue
                      root = str(row.get('source_root') or '')
                      if root and root not in by_root:
                          row['v6_firewall_allowed'] = True
                          by_root[root] = row
                  if sum(1 for row in by_root.values() if audit_row(family, row)[0]) >= 2:
                      break
              rows = list(by_root.values())
              rows.sort(
                  key=lambda row: (
                      1 if audit_row(family, row)[0] else 0,
                      audit_row(family, row)[2],
                      row.get('published_at') or '',
                  ),
                  reverse=True,
              )
              pools[family] = rows

          semantic = {
              family: sum(1 for row in rows if audit_row(family, row)[0])
              for family, rows in pools.items()
          }
          unresolved = sorted(family for family in targets if semantic.get(family, 0) == 0)
          out = {
              'version': '1.1.0',
              'rule_version': '2026.08.13.6.31',
              'evaluation_kind': 'fresh_blind_v6_unscored_source_supplement',
              'target_families': targets,
              'query_plan_by_family': query_plan,
              'api_request_count': counters['api_requests'],
              'query_cache_hit_count': counters['cache_hits'],
              'family_candidate_counts': {family: len(rows) for family, rows in pools.items()},
              'family_semantic_candidate_counts': semantic,
              'families_without_semantic_candidates': unresolved,
              'scoring_executed': False,
              'candidate_selection_uses_detector_scores': False,
              'candidate_selection_uses_admission_results': False,
              'candidate_selection_uses_ranking_results': False,
              'candidates_by_family': pools,
          }
          Path('benchmarks/raw/sources/v6_supplement_candidates.json').write_text(
              json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'target_family_count': len(targets),
              'api_request_count': out['api_request_count'],
              'families_without_semantic_candidates': unresolved,
              'scoring_executed': False,
          }, sort_keys=True))
          PY

      - name: Verify supplement remains unscored
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('benchmarks/raw/sources/v6_supplement_candidates.json').read_text())
          assert data['scoring_executed'] is False
          assert data['candidate_selection_uses_detector_scores'] is False
          assert data['candidate_selection_uses_admission_results'] is False
          assert data['candidate_selection_uses_ranking_results'] is False
          PY

      - name: Commit supplement snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_supplement_candidates.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record focused independent Analysis 6.31 v6 source supplement'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
