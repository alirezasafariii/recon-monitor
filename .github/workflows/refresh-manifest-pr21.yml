name: Refresh PR21 Manifest

on:
  push:
    branches: [agent/validation-eligibility-gate-v1]
    paths:
      - .ci-refresh-pr21

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh existing manifest hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest=Path('MANIFEST.sha256')
          rows=[]
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip(): continue
              _, path=raw.split('  ',1)
              rows.append(f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}')
          manifest.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
      - name: Commit manifest
        shell: bash
        run: |
          if git diff --quiet -- MANIFEST.sha256; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MANIFEST.sha256
          git commit -m "Refresh PR21 manifest after main sync"
          git push origin HEAD:agent/validation-eligibility-gate-v1
