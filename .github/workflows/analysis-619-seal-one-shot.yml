name: Analysis 6.19 Seal One-Shot

on:
  push:
    branches:
      - agent/analysis-engine-6.19-client-side-standards-grounding

permissions:
  contents: write

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.19-client-side-standards-grounding
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic Analysis 6.19 seal
        run: python scripts/analysis_619_seal.py

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Analysis 6.19 seal contract
        run: python -m unittest discover -s tests -p 'test_analysis_619_seal.py' -q

      - name: Four-layer standards grounding contract
        run: python -m unittest discover -s tests -p 'test_analysis_619_standards_grounding.py' -q

      - name: Client-side collector contract
        run: python -m unittest discover -s tests -p 'test_physical_raw_collector_client_side_v6190.py' -q

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit validated Analysis 6.19 seal and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-619-seal-one-shot.yml scripts/analysis_619_seal.py
          git add MANIFEST.sha256 app/analysis_engine.py app/bug_candidates.py app/security_reasoning.py tests/test_analysis_618_seal.py tests/test_analysis_619_seal.py docs/ANALYSIS_ENGINE_6_19_SEAL.md
          git diff --cached --check
          git commit -m "Seal Analysis 6.19 standards-grounded client collectors"
          git push origin HEAD:agent/analysis-engine-6.19-client-side-standards-grounding
