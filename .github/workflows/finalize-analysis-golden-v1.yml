name: Finalize Analysis Golden Benchmark

on:
  push:
    branches:
      - agent/analysis-engine-6.0-owasp-admission

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.0-owasp-admission
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove temporary benchmark workflows
        run: |
          rm -f .github/workflows/analysis-golden-v1-probe.yml
          rm -f .github/workflows/finalize-analysis-golden-v1.yml

      - name: Verify source hygiene
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name 'targets.json.backup-*' \) -print -quit)"
          test -z "$(find . -type f -name '*.jsonl' ! -path './benchmarks/golden/*' -print -quit)"

      - name: Syntax checks
        run: |
          python3 -m py_compile app/analysis_benchmark.py tests/test_analysis_golden_benchmark_v620.py

      - name: Golden benchmark strict gate
        env:
          PYTHONPATH: app
        run: python3 app/analysis_benchmark.py --strict

      - name: Golden benchmark regression tests
        run: python3 -m unittest tests.test_analysis_golden_benchmark_v620

      - name: Full regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Integration test
        run: python3 tests/integration_runner.py

      - name: Regenerate and verify manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          rows = []
          for raw in files:
              if not raw:
                  continue
              name = raw.decode()
              if name == "MANIFEST.sha256":
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f"{digest}  {name}")
          Path("MANIFEST.sha256").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          sha256sum -c MANIFEST.sha256

      - name: Commit final benchmark tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Analysis 6.2 golden vulnerability benchmark'
          git push origin HEAD:agent/analysis-engine-6.0-owasp-admission
