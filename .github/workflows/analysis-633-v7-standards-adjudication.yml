name: Analysis 6.33 V7 Standards Adjudication

on:
  push:
    branches: [agent/analysis-engine-6.33-v7-unseen-capture]
    paths:
      - '.github/workflows/analysis-633-v7-standards-adjudication.yml'
      - 'app/v7_standards_adjudication.py'
      - 'tests/test_v7_standards_adjudication.py'
      - 'app/analysis_standards.py'
      - 'app/researcher_logic.py'
      - 'app/family_detectors/**'
      - 'benchmarks/raw/sources/v7_semantic_review_packet_v2.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-633-v7-standards-adjudication
  cancel-in-progress: true

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.33-v7-unseen-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused standards adjudication guards
        env: {PYTHONPATH: app}
        run: python -m unittest tests.test_v7_standards_adjudication -v
      - name: Build standards-grounded adjudication
        env: {PYTHONPATH: app}
        run: python app/v7_standards_adjudication.py
      - name: Verify scientific boundary and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_standards_adjudication_report.json').read_text())
          assert r['family_count']==36 and r['variant_count']==144
          assert r['machine_adjudicated_variant_count']==144
          assert r['standards_coverage_family_count']==36
          assert r['writeup_coverage_family_count']==36
          assert r['human_review_required'] is False
          assert r['human_adjudication_performed'] is False
          assert r['human_verified_record_count']==0
          assert r['engine_output_allowed_as_evidence'] is False
          assert r['standards_count_as_target_evidence'] is False
          assert r['writeups_count_as_target_evidence'] is False
          assert r['accepted_variant_count'] + r['unresolved_variant_count'] == 144
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False
          print({
              'accepted': r['accepted_variant_count'],
              'unresolved': r['unresolved_variant_count'],
              'families_confirmed': r['family_mapping_confirmed_count'],
              'complete': r['machine_semantic_adjudication_complete'],
          })
          PY
      - name: Freeze adjudication artifacts and manifest
        run: |
          git add benchmarks/raw/sources/v7_standards_adjudication.json benchmarks/raw/sources/v7_standards_adjudication_report.json
          git ls-files -z | python -c 'import sys; x=[v for v in sys.stdin.buffer.read().split(b"\0") if v and v!=b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(x))+b"\0")' | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
          git add MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(analysis-633): freeze V7 standards adjudication'
          git push origin HEAD:agent/analysis-engine-6.33-v7-unseen-capture
