name: Promotion reconciliation patch

on:
  push:
    branches:
      - agent/promotion-reconciliation

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/promotion-reconciliation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python .github/scripts/promotion_reconciliation_patch.py

      - name: Remove temporary patch driver
        run: |
          git rm .github/scripts/promotion_reconciliation_patch.py
          git rm .github/workflows/promotion-reconciliation-patch.yml

      - name: Refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          tracked = sorted(path for path in tracked if path and path != 'MANIFEST.sha256')
          lines = []
          for name in tracked:
              path = Path(name)
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Verify focused reconciliation tests
        run: python -m unittest tests.test_promotion_reconciliation -v

      - name: Verify syntax hygiene and manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/hypothesis_admission.py app/bug_candidates_legacy_core.py tests/test_promotion_reconciliation.py
          git diff --check
          sha256sum --strict -c MANIFEST.sha256
          test ! -e .github/scripts/promotion_reconciliation_patch.py
          test ! -e .github/workflows/promotion-reconciliation-patch.yml

      - name: Run full unit and integration suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py

      - name: Commit promotion reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/hypothesis_admission.py app/bug_candidates_legacy_core.py tests/test_promotion_reconciliation.py MANIFEST.sha256
          git status --short
          git commit -m 'Reconcile promoted candidates with canonical admission'
          git push origin HEAD:agent/promotion-reconciliation
