name: Analysis 6.33 V7 Unseen Fourth Pass Targeted

on:
  push:
    branches: [agent/analysis-engine-6.33-v7-unseen-capture]
    paths:
      - '.github/workflows/analysis-633-v7-unseen-fourth-pass-targeted.yml'
      - 'app/v7_fourth_pass_targeted_acquisition.py'
      - 'tests/test_v7_fourth_pass_targeted_acquisition.py'
      - 'benchmarks/raw/sources/v7_third_pass_resolution_queue.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-633-v7-unseen-fourth-pass-targeted
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.33-v7-unseen-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused fourth-pass guards
        env: {PYTHONPATH: app}
        run: python -m unittest tests.test_v7_fourth_pass_targeted_acquisition -q
      - name: Acquire targeted same-source candidates
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/v7_fourth_pass_targeted_acquisition.py
      - name: Verify fourth-pass firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_fourth_pass_targeted_candidates_report.json').read_text())
          d=json.loads(Path('benchmarks/raw/sources/v7_fourth_pass_targeted_candidates.json').read_text())
          assert r['unresolved_input_count']==21 and r['unresolved_family_count']==17
          assert r['family_result_count']==17 and len(d['families'])==17
          assert r['source_assignment_locked'] is True
          assert r['source_replacement_allowed'] is False and r['source_replacement_used'] is False
          assert r['synthetic_fixture_allowed'] is False and r['synthetic_fixture_used'] is False
          assert r['cross_variant_mutation_allowed'] is False
          assert r['candidate_semantics_adjudicated'] is False
          assert r['human_adjudication_performed'] is False
          assert r['evidence_published'] is False and r['publication_authorized'] is False
          assert r['third_party_code_executed'] is False and r['target_contact_performed'] is False
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False
          for f in d['families']:
              assert f['source_replacement_used'] is False
              assert f['synthetic_fixture_used'] is False
              assert f['cross_variant_mutation_used'] is False
              assert f['candidate_semantics_adjudicated'] is False
              assert f['evidence_published'] is False
              assert f['scoring_executed'] is False and f['first_blind_consumed'] is False
          print({k:r[k] for k in ('literal_pair_candidate_count','two_sided_literal_pair_count','families_with_two_sided_literal_pairs','test_control_candidate_group_count','families_with_test_control_candidates')})
          PY
      - name: Full regression suite
        env: {PYTHONPATH: app}
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Freeze fourth-pass inventory and manifest
        run: |
          git add benchmarks/raw/sources/v7_fourth_pass_targeted_candidates.json benchmarks/raw/sources/v7_fourth_pass_targeted_candidates_report.json
          git ls-files -z | python -c 'import sys; x=[v for v in sys.stdin.buffer.read().split(b"\0") if v and v!=b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(x))+b"\0")' | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
          git add MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(analysis-633): freeze V7 fourth-pass targeted inventory'
          git push origin HEAD:agent/analysis-engine-6.33-v7-unseen-capture
