name: Diagnose Analysis 6.8 Focused Tests

on:
  push:
    branches:
      - agent/analysis-engine-6.8-family-evidence-extractors
    paths:
      - .analysis-68-diag

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.8-family-evidence-extractors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply pending patches
        run: python .analysis-68-apply.py
      - name: Extractor tests
        continue-on-error: true
        env: {PYTHONPATH: app}
        run: python tests/test_family_evidence_extractors_v680.py
      - name: Reasoner tests
        continue-on-error: true
        env: {PYTHONPATH: app}
        run: python tests/test_family_reasoners_v670.py
      - name: Confusion matrix tests
        continue-on-error: true
        env: {PYTHONPATH: app}
        run: python tests/test_family_confusion_matrix_v670.py
      - name: Ranking tests
        continue-on-error: true
        env: {PYTHONPATH: app}
        run: python tests/test_analysis_ranking_v650.py
      - name: Coverage tests
        continue-on-error: true
        env: {PYTHONPATH: app}
        run: python tests/test_analysis_coverage_v610.py
