name: Temporary GraphQL field-policy verification

on:
  push:
    branches:
      - feat/graphql-field-policy-review-20260914

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh changed file hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          targets = [
              'app/graphql_data_exposure_differential.py',
              'app/graphql_data_exposure_admission_bridge.py',
              'tests/test_graphql_data_exposure_differential_admission.py',
          ]
          lines = manifest.read_text(encoding='utf-8').splitlines()
          keep = [line for line in lines if not any(line.endswith('  ' + path) for path in targets)]
          for path in targets:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              keep.append(f'{digest}  {path}')
          manifest.write_text('\n'.join(keep) + '\n', encoding='utf-8')
          PY
      - name: Verify changed Python and focused tests
        id: verify
        run: |
          set +e
          {
            python -m py_compile app/graphql_data_exposure_differential.py app/graphql_data_exposure_admission_bridge.py tests/test_graphql_data_exposure_differential_admission.py
            python -m unittest discover -s tests -p 'test_graphql_data_exposure_differential_admission.py' -v
            sha256sum --strict -c MANIFEST.sha256 >/dev/null
          } > verify.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat verify.log
          exit 0
      - name: Finalize branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256 verify.log
          git rm .github/workflows/tmp-refresh-graphql-manifest.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: capture GraphQL verifier result'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Fail on verifier error
        if: steps.verify.outputs.status != '0'
        run: exit 1
