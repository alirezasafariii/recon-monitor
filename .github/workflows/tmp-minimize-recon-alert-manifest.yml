name: Temporary minimize Recon Alert manifest diff

on:
  push:
    branches:
      - agent/recon-alert-operations-v890

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/recon-alert-operations-v890
          fetch-depth: 0

      - name: Restore base manifest and update only changed files
        run: |
          git rm .github/workflows/tmp-minimize-recon-alert-manifest.yml
          git show origin/main:MANIFEST.sha256 > MANIFEST.sha256
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          changed = [
              'app/recon_alert_operations.py',
              'docs/RECON_ALERT_OUTBOX.md',
              'tests/test_recon_alert_operations.py',
              'tools/deliver_recon_alerts.py',
          ]
          lines = manifest.read_text(encoding='utf-8').splitlines()
          index = {}
          for i, line in enumerate(lines):
              parts = line.split('  ', 1)
              if len(parts) == 2:
                  index[parts[1]] = i
          for path in changed:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              value = f'{digest}  {path}'
              if path in index:
                  lines[index[path]] = value
              else:
                  lines.append(value)
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          sha256sum --strict -c MANIFEST.sha256
          python -m unittest tests.test_recon_alert_operations tests.test_recon_alert_outbox tests.test_recon_alert_transport_consolidation

      - name: Commit minimized manifest
        run: |
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add MANIFEST.sha256
          git commit -m 'chore: minimize Recon Alert operations manifest diff'
          git push origin HEAD:agent/recon-alert-operations-v890
