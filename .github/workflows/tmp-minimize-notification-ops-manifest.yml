name: Temporary minimize notification operations manifest

on:
  push:
    branches: [agent/notification-operations-center-v890]
    paths: [.github/workflows/tmp-minimize-notification-ops-manifest.yml]

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notification-operations-center-v890
          fetch-depth: 0
      - name: Restore base ordering and update changed files only
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:MANIFEST.sha256 > MANIFEST.sha256
          rm .github/workflows/tmp-minimize-notification-ops-manifest.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          lines = [line for line in manifest.read_text(encoding='utf-8').splitlines() if line.strip()]
          changed = [
              'app/dashboard_core.py',
              'app/notification_operations_center.py',
              'app/product_platform.py',
              'docs/NOTIFICATION_OPERATIONS_CENTER.md',
              'docs/OPERATIONS_CENTER.md',
              'tests/test_notification_operations_center.py',
          ]
          hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in changed}
          paths = [line.split('  ', 1)[1] for line in lines]
          for name in changed:
              rendered = f'{hashes[name]}  {name}'
              if name in paths:
                  index = paths.index(name)
                  lines[index] = rendered
              else:
                  index = next((i for i, path in enumerate(paths) if path > name), len(lines))
                  lines.insert(index, rendered)
                  paths.insert(index, name)
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          sha256sum --strict -c MANIFEST.sha256 >/dev/null
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add -A
          git commit -m 'chore: minimize notification operations manifest diff'
          git push origin HEAD:agent/notification-operations-center-v890
