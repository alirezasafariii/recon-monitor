name: Analysis 6.27 Blind Failure Calibration

on:
  push:
    branches:
      - agent/analysis-engine-6.27-blind-failure-calibration

permissions:
  contents: write

jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calibration branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.27-blind-failure-calibration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove frozen v4 inputs are unchanged before engine repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          expected = {
              'benchmarks/raw/analysis_raw_v4.jsonl': 'fe6936881b7fe0e8c71c9bc76a0f87d02446a3d703ec1dddf84e0b6caa7fb9b6',
              'benchmarks/raw/sources/v4_shortlist.json': 'd329752e8b6045b433e3d490c0ff438f067577840fb5429a80721a0f79a34f85',
              'benchmarks/raw/sources/v4_first_blind_report.json': '5c9d241b9da38fb374caa1851b8474aab2580dbafd1dbf25b6e68db267097960',
          }
          for name, wanted in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == wanted, (name, wanted, actual)
          receipt = json.loads(Path('benchmarks/raw/sources/v4_first_blind_receipt.json').read_text())
          assert receipt['status'] == 'first_blind_consumed'
          assert receipt['report_sha256'] == expected['benchmarks/raw/sources/v4_first_blind_report.json']
          print('immutable consumed-v4 inputs: verified')
          PY

      - name: Apply production-side calibration patch
        run: python scripts/analysis_627_calibration_patch.py

      - name: Calibration behavior contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_analysis_627_blind_failure_calibration.py' -q

      - name: Standards, detector and family regression contracts
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p 'test_analysis_625_seal.py' -q
          python -m unittest discover -s tests -p 'test_owasp_top10_2025_completion_v6250.py' -q
          python -m unittest discover -s tests -p 'test_family_confusion_matrix_v670.py' -q
          python -m unittest discover -s tests -p 'test_family_reasoners_v670.py' -q
          python -m unittest discover -s tests -p 'test_family_evidence_extractors_v680.py' -q
          python -m unittest discover -s tests -p 'test_detector_execution_intelligence_v6100.py' -q
          python -m unittest discover -s tests -p 'test_raw_condition_reconstruction_v6120.py' -q
          python -m unittest discover -s tests -p 'test_raw_precision_calibration_v6140.py' -q

      - name: Run consumed-v4 post-blind regression
        env:
          PYTHONPATH: app
        run: python app/raw_recon_v4_regression.py

      - name: Print regression delta versus immutable first blind
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          first = json.loads(Path('benchmarks/raw/sources/v4_first_blind_report.json').read_text())
          reg = json.loads(Path('benchmarks/raw/results/analysis_raw_v4_6_27_regression.json').read_text())
          keys = [
              'condition_extraction_precision','condition_extraction_recall',
              'routing_top1_accuracy','routing_top3_accuracy',
              'admission_precision','admission_recall','abstention_accuracy',
              'false_promotion_rate','wrong_family_promotion_rate','end_to_end_accuracy',
              'near_miss_abstention_accuracy','secure_negative_rejection_accuracy',
              'sparse_noisy_abstention_accuracy','positive_end_to_end_accuracy',
          ]
          delta = {k: {'first': first['metrics'][k], 'regression': reg['metrics'][k], 'delta': round(reg['metrics'][k]-first['metrics'][k], 6)} for k in keys}
          failed = sorted(f for f, row in reg['family_results'].items() if not row['positive_admitted'])
          wrong = sorted(f for f, row in reg['family_results'].items() if row['wrong_promotions'])
          print(json.dumps({'delta': delta, 'gate': reg['quality_gate'], 'failed_positive_families': failed, 'wrong_promotion_families': wrong}, indent=2, sort_keys=True))
          PY

      - name: Re-prove immutable v4 inputs after regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'benchmarks/raw/analysis_raw_v4.jsonl': 'fe6936881b7fe0e8c71c9bc76a0f87d02446a3d703ec1dddf84e0b6caa7fb9b6',
              'benchmarks/raw/sources/v4_shortlist.json': 'd329752e8b6045b433e3d490c0ff438f067577840fb5429a80721a0f79a34f85',
              'benchmarks/raw/sources/v4_first_blind_report.json': '5c9d241b9da38fb374caa1851b8474aab2580dbafd1dbf25b6e68db267097960',
          }
          for name, wanted in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == wanted, (name, wanted, actual)
          print('immutable consumed-v4 inputs remained unchanged')
          PY

      - name: Register Analysis 6.27 calibration artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          entries = {}; order = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line: continue
              _, name = line.split('  ', 1)
              path = root / name
              if path.is_file():
                  entries[name] = hashlib.sha256(path.read_bytes()).hexdigest(); order.append(name)
          for name in (
              'app/analysis_standards.py',
              'app/hypothesis_admission.py',
              'app/family_detectors/base.py',
              'app/family_detectors/execution.py',
              'app/family_detectors/unsafe_api_consumption.py',
              'app/raw_recon_v4_regression.py',
              'tests/test_analysis_627_blind_failure_calibration.py',
              'benchmarks/raw/results/analysis_raw_v4_6_27_regression.json',
          ):
              path = root / name
              entries[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order), encoding='utf-8')
          PY

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Commit calibration tranche and remove one-shot patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-627-blind-failure-calibration.yml scripts/analysis_627_calibration_patch.py
          git add -A
          git diff --cached --check
          git commit -m "Calibrate Analysis 6.27 from immutable blind failures"
          git push origin HEAD:agent/analysis-engine-6.27-blind-failure-calibration
