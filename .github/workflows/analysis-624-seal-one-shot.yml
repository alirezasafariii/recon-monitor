name: Analysis 6.24 Seal One-Shot

on:
  push:
    branches:
      - agent/analysis-engine-6.24-specialized-static-collectors

permissions:
  contents: write

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.24-specialized-static-collectors
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic Analysis 6.24 seal
        run: python scripts/analysis_624_seal.py

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Analysis 6.24 seal contract
        run: python -m unittest discover -s tests -p 'test_analysis_624_seal.py' -q

      - name: Specialized static collector contract
        run: python -m unittest discover -s tests -p 'test_specialized_static_collectors_v6240.py' -q

      - name: Four-layer standards grounding contract
        run: python -m unittest discover -s tests -p 'test_analysis_619_standards_grounding.py' -q

      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Golden analysis benchmark
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict

      - name: Integration test
        run: python tests/integration_runner.py

      - name: Commit validated Analysis 6.24 seal and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-624-seal-one-shot.yml scripts/analysis_624_seal.py
          git add -A
          git diff --cached --check
          git commit -m "Seal Analysis 6.24 specialized static collectors"
          git push origin HEAD:agent/analysis-engine-6.24-specialized-static-collectors
