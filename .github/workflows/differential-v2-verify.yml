name: Differential Evidence v2 branch verification

on:
  push:
    branches: [feat/differential-evidence-v2-open-redirect-20260914]
    paths: ['.github/workflows/differential-v2-verify.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/differential-evidence-v2-open-redirect-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh tracked hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          manifest = Path('MANIFEST.sha256')
          entries = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, name = line.split('  ', 1)
              entries[name] = digest
          tracked = [
              'app/differential_evidence.py',
              'app/differential_evidence_adapter.py',
              'app/recon_monitor.py',
              'docs/DIFFERENTIAL_EVIDENCE_V2.md',
              'docs/TYPED_EVIDENCE_ADAPTER.md',
              'tests/test_differential_evidence_v2.py',
          ]
          for name in tracked:
              entries[name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          manifest.write_text(
              ''.join(f'{entries[name]}  {name}\n' for name in sorted(entries)),
              encoding='utf-8',
          )
          PY
      - name: Focused compile and tests
        shell: bash
        run: |
          python -m py_compile app/differential_evidence.py app/differential_evidence_adapter.py app/recon_monitor.py tests/test_differential_evidence_v2.py
          python -m unittest discover -s tests -p 'test_differential_evidence_v2.py' -v
          sha256sum --strict -c MANIFEST.sha256
      - name: Commit final branch state
        shell: bash
        run: |
          rm -f .github/workflows/differential-v2-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add offline differential evidence v2 for open redirect'
          git push origin HEAD:feat/differential-evidence-v2-open-redirect-20260914
