name: Analysis 6.31 Historical Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe niche replacements against historical exposure
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import canonical_url, exposure_index
          prior = exposure_index()
          candidates = [
            ('cors_network_ai','cors_misconfiguration','GHSA-j3vx-cx2r-pvg8','Jovancoding/Network-AI',['https://github.com/advisories/GHSA-j3vx-cx2r-pvg8']),
            ('unsafe_datamodel_codegen','unsafe_api_consumption','GHSA-r5vv-ff45-prp2','koxudaxi/datamodel-code-generator',['https://github.com/koxudaxi/datamodel-code-generator/security/advisories/GHSA-r5vv-ff45-prp2','https://github.com/advisories/GHSA-r5vv-ff45-prp2']),
            ('websocket_openclaw','websocket_authorization','GHSA-jmmg-jqc7-5qf4','openclaw/openclaw',['https://github.com/openclaw/openclaw/security/advisories/GHSA-jmmg-jqc7-5qf4','https://github.com/advisories/GHSA-jmmg-jqc7-5qf4']),
          ]
          results=[]
          for label,family,root,project,raw_urls in candidates:
            urls={canonical_url(u) for u in raw_urls if canonical_url(u)}
            row={'label':label,'family':family,'source_root':root,'source_project':project,
                 'root_overlap':root in prior['roots'],'project_overlap':project in prior['projects'],
                 'url_overlap':sorted(urls & prior['urls'])}
            row['fresh']=not(row['root_overlap'] or row['project_overlap'] or row['url_overlap'])
            results.append(row)
          print(json.dumps({'scoring_executed':False,'detector_output_used':False,'results':results},indent=2,sort_keys=True))
          PY
