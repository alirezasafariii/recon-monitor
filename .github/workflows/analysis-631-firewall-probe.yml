name: Analysis 6.31 Historical Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe replacement candidates against historical exposure
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import canonical_url, exposure_index
          prior = exposure_index()
          candidates = [
            ('cors_opencode','cors_misconfiguration','GHSA-vxw4-wv6m-9hhh','anomalyco/opencode',['https://github.com/anomalyco/opencode/security/advisories/GHSA-vxw4-wv6m-9hhh','https://github.com/advisories/GHSA-vxw4-wv6m-9hhh']),
            ('cors_anythingllm','cors_misconfiguration','GHSA-24qj-pw4h-3jmm','Mintplex-Labs/anything-llm',['https://github.com/Mintplex-Labs/anything-llm/security/advisories/GHSA-24qj-pw4h-3jmm']),
            ('graphql_craft','graphql_data_exposure','GHSA-gj2p-p9m4-c8gw','craftcms/cms',['https://github.com/craftcms/cms/security/advisories/GHSA-gj2p-p9m4-c8gw']),
            ('nosql_cockpit','nosql_injection','GHSA-fm6c-rhcf-7439','Cockpit-HQ/Cockpit',['https://github.com/advisories/GHSA-fm6c-rhcf-7439']),
            ('sourcemap_postcss','source_map_exposure','GHSA-r28c-9q8g-f849','postcss/postcss',['https://github.com/advisories/GHSA-r28c-9q8g-f849']),
            ('sourcemap_babel','source_map_exposure','GHSA-4x5r-pxfx-6jf8','babel/babel',['https://github.com/advisories/GHSA-4x5r-pxfx-6jf8']),
            ('unsafe_guzzle','unsafe_api_consumption','GHSA-94pj-82f3-465w','guzzle/guzzle',['https://github.com/guzzle/guzzle/security/advisories/GHSA-94pj-82f3-465w']),
            ('unsafe_axios','unsafe_api_consumption','GHSA-j5f8-grm9-p9fc','axios/axios',['https://github.com/advisories/GHSA-j5f8-grm9-p9fc']),
            ('unsafe_angular_sw','unsafe_api_consumption','GHSA-qxh6-94w6-9r5p','angular/angular',['https://github.com/advisories/GHSA-qxh6-94w6-9r5p']),
            ('websocket_marimo','websocket_authorization','GHSA-2679-6mx9-h9xc','marimo-team/marimo',['https://github.com/advisories/GHSA-2679-6mx9-h9xc']),
          ]
          results=[]
          for label,family,root,project,raw_urls in candidates:
            urls={canonical_url(u) for u in raw_urls if canonical_url(u)}
            row={'label':label,'family':family,'source_root':root,'source_project':project,
                 'root_overlap':root in prior['roots'],'project_overlap':project in prior['projects'],
                 'url_overlap':sorted(urls & prior['urls'])}
            row['fresh']=not(row['root_overlap'] or row['project_overlap'] or row['url_overlap'])
            results.append(row)
          print(json.dumps({'scoring_executed':False,'detector_output_used':False,'results':results},indent=2,sort_keys=True))
          PY
