name: Analysis 6.31 DataPower Source Map Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe IBM DataPower APAR source map source
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import canonical_url, exposure_index
          prior = exposure_index()
          root = 'IBM-APAR-IT42976'
          project = 'ibm/datapower-gateways'
          urls = {canonical_url('https://www.ibm.com/support/pages/apar/IT42976')}
          urls.discard('')
          result = {
              'family': 'source_map_exposure',
              'source_root': root,
              'source_project': project,
              'root_overlap': root in prior['roots'],
              'project_overlap': project in prior['projects'],
              'url_overlap': sorted(urls & prior['urls']),
          }
          result['fresh'] = not (result['root_overlap'] or result['project_overlap'] or result['url_overlap'])
          print(json.dumps({
              'evaluation_kind': 'analysis_631_unscored_datapower_source_map_firewall_probe',
              'scoring_executed': False,
              'detector_output_used': False,
              'admission_output_used': False,
              'ranking_output_used': False,
              'historical_exposure_counts': {k: len(v) for k, v in prior.items()},
              'result': result,
          }, indent=2, sort_keys=True))
          PY
