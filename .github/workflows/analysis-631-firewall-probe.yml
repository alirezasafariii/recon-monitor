name: Analysis 6.31 Fresh Semantic Source Finder

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-fresh-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Search older advisory pages for fresh exact semantics
        env:
          PYTHONPATH: app
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request, urllib.error
          from raw_recon_v6_source_firewall import canonical_url, exposure_index

          prior = exposure_index()
          headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'recon-monitor-analysis-631-deep-source-finder',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
          }
          specs = {
              'cors_misconfiguration': {
                  'cwes':['942'],
                  'groups':[
                      ('cors','cross-origin','cross origin'),
                      ('origin','allow-origin','untrusted origin','arbitrary origin','wildcard'),
                      ('credential','authenticated','sensitive','read data','response data','state-changing'),
                  ],
              },
              'graphql_data_exposure': {
                  'cwes':['200','862','863','351'],
                  'groups':[
                      ('graphql',),
                      ('sensitive','private','restricted','information disclosure','data exposure','personal data','pii'),
                      ('field','query','resolver','scope','property','object','record'),
                  ],
              },
              'nosql_injection': {
                  'cwes':['943'],
                  'groups':[
                      ('nosql','mongodb','mongo'),
                      ('query','operator','filter','selector'),
                      ('inject','injection','unvalidated','alter','unintended','bypass'),
                  ],
              },
              'source_map_exposure': {
                  'cwes':['200','22','73'],
                  'groups':[
                      ('source map','source-map','sourcemap','sourcemappingurl','.map'),
                      ('source code','original source','sourcescontent','source content','debug artifact','map file'),
                      ('expose','disclosure','read','retrieve','returned to the browser','public','leak'),
                  ],
              },
              'websocket_authorization': {
                  'cwes':['862','863','287','306'],
                  'groups':[
                      ('websocket','web socket','socket.io'),
                      ('authorization','authentication','access control','permission'),
                      ('bypass','missing','skip','unauthorized','without authentication','regardless of permission'),
                  ],
              },
          }

          def api_page(cwe, page):
              params = urllib.parse.urlencode({'cwes':cwe,'per_page':100,'page':page,'sort':'published','direction':'desc'})
              req = urllib.request.Request(f'https://api.github.com/advisories?{params}', headers=headers)
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code not in (403,429) or attempt == 3:
                          raise
                      time.sleep(1.5 * (attempt + 1))
              return []

          def project_from(value):
              value=str(value or '')
              for pat in (r'https://api\.github\.com/repos/([^/]+/[^/]+)(?:/|$)',r'https://github\.com/([^/]+/[^/]+)(?:/|$)'):
                  m=re.match(pat,value)
                  if m and not m.group(1).lower().startswith('advisories/'):
                      return m.group(1)
              return ''

          cache={}
          for spec in specs.values():
              for cwe in spec['cwes']:
                  if cwe in cache: continue
                  rows=[]
                  for page in range(5,21):
                      batch=api_page(cwe,page)
                      if not batch: break
                      rows.extend(batch)
                      if len(batch)<100: break
                  cache[cwe]=rows

          report={}
          for family,spec in specs.items():
              by_root={}
              for cwe in spec['cwes']:
                  for raw in cache.get(cwe,[]):
                      root=str(raw.get('ghsa_id') or '').strip()
                      if root and not raw.get('withdrawn_at'): by_root.setdefault(root,raw)
              exact=[]; partial=[]
              for root,raw in by_root.items():
                  refs=[str(x) for x in raw.get('references') or [] if str(x)]
                  project=project_from(raw.get('repository_advisory_url')) or project_from(raw.get('source_code_location'))
                  if not project:
                      for ref in refs:
                          project=project_from(ref)
                          if project: break
                  if not project: continue
                  urls={canonical_url(raw.get('html_url')),canonical_url(raw.get('repository_advisory_url')),canonical_url(raw.get('source_code_location'))}
                  urls.update(canonical_url(x) for x in refs); urls.discard('')
                  if root in prior['roots'] or project in prior['projects'] or (urls & prior['urls']): continue
                  text=(str(raw.get('summary') or '')+'\n'+str(raw.get('description') or '')).lower()
                  hits=[sorted({term for term in group if term in text}) for group in spec['groups']]
                  passed=sum(bool(x) for x in hits)
                  if passed < 2: continue
                  item={
                      'source_root':root,'source_project':project,'canonical_advisory_url':raw.get('html_url'),
                      'repository_advisory_url':raw.get('repository_advisory_url'),'source_code_location':raw.get('source_code_location'),
                      'published_at':raw.get('published_at'),'reviewed':raw.get('type')=='reviewed','summary':raw.get('summary'),
                      'group_hits':hits,'groups_passed':passed,'historical_firewall_fresh':True,
                  }
                  (exact if passed==3 else partial).append(item)
              key=lambda r:(1 if r['reviewed'] else 0,r['published_at'] or '')
              exact.sort(key=key,reverse=True); partial.sort(key=key,reverse=True)
              report[family]={'exact':exact[:20],'partial':partial[:10]}

          print(json.dumps({
              'evaluation_kind':'analysis_631_unscored_deep_fresh_semantic_source_finder',
              'scoring_executed':False,'detector_output_used':False,'admission_output_used':False,'ranking_output_used':False,
              'page_window':'5-20','historical_exposure_counts':{k:len(v) for k,v in prior.items()},
              'candidates_by_family':report,
          },indent=2,sort_keys=True))
          PY
