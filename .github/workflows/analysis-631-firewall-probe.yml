name: Analysis 6.31 Vendor Source Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe canonical vendor-product sources
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import canonical_url, exposure_index
          prior = exposure_index()
          candidates = [
              ('cors_misconfiguration','CVE-2025-55462','eramba/eramba',[
                  'https://nvd.nist.gov/vuln/detail/CVE-2025-55462',
                  'https://discussions.eramba.org/t/release-3-28-0/7860',
                  'http://eramba.com',
              ]),
              ('graphql_data_exposure','CVE-2025-9572','theforeman/foreman',[
                  'https://nvd.nist.gov/vuln/detail/CVE-2025-9572',
                  'https://access.redhat.com/security/cve/CVE-2025-9572',
                  'https://theforeman.org/security.html#2025-9572',
              ]),
              ('nosql_injection','CVE-2025-60357','ahnlab/epp-management',[
                  'https://nvd.nist.gov/vuln/detail/CVE-2025-60357',
                  'https://ahnlab.com',
                  'https://vuldb.com/cve/CVE-2025-60357',
              ]),
              ('source_map_exposure','CVE-2024-38327','ibm/analytics-content-hub',[
                  'https://nvd.nist.gov/vuln/detail/CVE-2024-38327',
                  'https://www.ibm.com/support/pages/node/7234122',
              ]),
              ('websocket_authorization','CVE-2026-11807','ansible/eda-server',[
                  'https://nvd.nist.gov/vuln/detail/CVE-2026-11807',
                  'https://access.redhat.com/security/cve/CVE-2026-11807',
                  'https://github.com/ansible/eda-server',
              ]),
          ]
          results=[]
          for family,root,project,raw_urls in candidates:
              urls={canonical_url(u) for u in raw_urls if canonical_url(u)}
              result={
                  'family':family,'source_root':root,'source_project':project,
                  'root_overlap':root in prior['roots'],'project_overlap':project in prior['projects'],
                  'url_overlap':sorted(urls & prior['urls']),
              }
              result['fresh']=not(result['root_overlap'] or result['project_overlap'] or result['url_overlap'])
              results.append(result)
          print(json.dumps({
              'evaluation_kind':'analysis_631_unscored_vendor_source_firewall_probe',
              'scoring_executed':False,'detector_output_used':False,'admission_output_used':False,'ranking_output_used':False,
              'historical_exposure_counts':{k:len(v) for k,v in prior.items()},
              'fresh_count':sum(1 for r in results if r['fresh']),
              'results':results,
          },indent=2,sort_keys=True))
          PY
