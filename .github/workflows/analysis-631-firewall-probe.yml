name: Analysis 6.31 Final Replacement Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe five primary advisory candidates
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import canonical_url, exposure_index

          prior = exposure_index()
          candidates = [
              ('cors_misconfiguration','GHSA-8hmm-4crw-vm2c','musistudio/claude-code-router',[
                  'https://github.com/musistudio/claude-code-router/security/advisories/GHSA-8hmm-4crw-vm2c',
                  'https://github.com/musistudio/claude-code-router/issues/549',
                  'https://github.com/advisories/GHSA-8hmm-4crw-vm2c',
              ]),
              ('graphql_data_exposure','GHSA-38hg-ww64-rrwc','directus/directus',[
                  'https://github.com/directus/directus/security/advisories/GHSA-38hg-ww64-rrwc',
                  'https://github.com/advisories/GHSA-38hg-ww64-rrwc',
              ]),
              ('nosql_injection','GHSA-422w-vrfj-72g6','labring/FastGPT',[
                  'https://github.com/labring/FastGPT/security/advisories/GHSA-422w-vrfj-72g6',
              ]),
              ('source_map_exposure','GHSA-49w6-73cw-chjr','withastro/astro',[
                  'https://github.com/withastro/astro/security/advisories/GHSA-49w6-73cw-chjr',
                  'https://github.com/withastro/astro/issues/12703',
                  'https://github.com/advisories/GHSA-49w6-73cw-chjr',
              ]),
              ('websocket_authorization','GHSA-7893-256g-m822','jumpserver/jumpserver',[
                  'https://github.com/jumpserver/jumpserver/security/advisories/GHSA-7893-256g-m822',
              ]),
          ]
          results=[]
          for family,root,project,raw_urls in candidates:
              urls={canonical_url(u) for u in raw_urls if canonical_url(u)}
              result={
                  'family':family,
                  'source_root':root,
                  'source_project':project,
                  'root_overlap':root in prior['roots'],
                  'project_overlap':project in prior['projects'],
                  'url_overlap':sorted(urls & prior['urls']),
              }
              result['fresh']=not(result['root_overlap'] or result['project_overlap'] or result['url_overlap'])
              results.append(result)
          print(json.dumps({
              'evaluation_kind':'analysis_631_unscored_final_replacement_firewall_probe',
              'scoring_executed':False,
              'detector_output_used':False,
              'admission_output_used':False,
              'ranking_output_used':False,
              'historical_exposure_counts':{k:len(v) for k,v in prior.items()},
              'fresh_count':sum(1 for r in results if r['fresh']),
              'results':results,
          },indent=2,sort_keys=True))
          PY
