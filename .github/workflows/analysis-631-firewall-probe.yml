name: Analysis 6.31 Historical Firewall Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe final replacement set against historical exposure
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from raw_recon_v6_source_firewall import canonical_url, exposure_index
          prior = exposure_index()
          candidates = [
            ('cors_lightrag','cors_misconfiguration','GHSA-6x6h-qqr7-855w','HKUDS/LightRAG',['https://github.com/HKUDS/LightRAG/security/advisories/GHSA-6x6h-qqr7-855w','https://github.com/advisories/GHSA-6x6h-qqr7-855w']),
            ('graphql_strawberry','graphql_data_exposure','GHSA-5xh2-23cc-5jc6','strawberry-graphql/strawberry',['https://github.com/strawberry-graphql/strawberry/security/advisories/GHSA-5xh2-23cc-5jc6','https://github.com/advisories/GHSA-5xh2-23cc-5jc6']),
            ('nosql_langgraph','nosql_injection','GHSA-98xf-r82g-9mhx','langchain-ai/langgraphjs',['https://github.com/langchain-ai/langgraphjs/security/advisories/GHSA-98xf-r82g-9mhx','https://github.com/advisories/GHSA-98xf-r82g-9mhx']),
            ('websocket_affine','websocket_authorization','GHSL-2026-040','toeverything/AFFiNE',['https://securitylab.github.com/advisories/GHSL-2026-040_AFFiNE/']),
            ('unsafe_cdxgen','unsafe_api_consumption','GHSA-qhh4-458h-xwh2','cdxgen/cdxgen',['https://github.com/cdxgen/cdxgen/security/advisories/GHSA-qhh4-458h-xwh2','https://github.com/advisories/GHSA-qhh4-458h-xwh2']),
            ('sourcemap_claude_code','source_map_exposure','CLAUDE-CODE-SOURCEMAP-2026-03-31','anthropics/claude-code',['https://venturebeat.com/technology/claude-codes-source-code-appears-to-have-leaked-heres-what-we-know/']),
            ('sourcemap_vite','source_map_exposure','GHSA-4w7w-66w2-5vf9','vitejs/vite',['https://github.com/vitejs/vite/security/advisories/GHSA-4w7w-66w2-5vf9','https://github.com/advisories/GHSA-4w7w-66w2-5vf9']),
          ]
          results=[]
          for label,family,root,project,raw_urls in candidates:
            urls={canonical_url(u) for u in raw_urls if canonical_url(u)}
            row={'label':label,'family':family,'source_root':root,'source_project':project,
                 'root_overlap':root in prior['roots'],'project_overlap':project in prior['projects'],
                 'url_overlap':sorted(urls & prior['urls'])}
            row['fresh']=not(row['root_overlap'] or row['project_overlap'] or row['url_overlap'])
            results.append(row)
          print(json.dumps({'scoring_executed':False,'detector_output_used':False,'results':results},indent=2,sort_keys=True))
          PY
