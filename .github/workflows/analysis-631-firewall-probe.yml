name: Analysis 6.31 Fresh Semantic Source Finder

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-firewall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-fresh-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find fresh semantically relevant advisories only
        env:
          PYTHONPATH: app
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from raw_recon_v6_source_firewall import canonical_url, exposure_index

          prior = exposure_index()
          token = os.environ.get('GH_TOKEN', '')
          headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'recon-monitor-analysis-631-source-finder',
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          specs = {
              'cors_misconfiguration': {
                  'cwes': ['942'],
                  'groups': [
                      ('cors', 'cross-origin', 'cross origin'),
                      ('origin', 'untrusted domain', 'any domain', 'wildcard'),
                      ('credential', 'authenticated', 'sensitive', 'data', 'write operation'),
                  ],
              },
              'graphql_data_exposure': {
                  'cwes': ['200', '862', '863', '843', '351'],
                  'groups': [
                      ('graphql',),
                      ('sensitive', 'private', 'restricted', 'unauthorized data', 'information disclosure', 'data leakage', 'data exposure'),
                      ('field', 'query', 'resolver', 'scope', 'property', 'type'),
                  ],
              },
              'nosql_injection': {
                  'cwes': ['943', '89'],
                  'groups': [
                      ('nosql', 'mongodb', 'mongo'),
                      ('query', 'operator', 'filter', 'selector'),
                      ('inject', 'injection', 'unvalidated', 'alter', 'unintended'),
                  ],
              },
              'source_map_exposure': {
                  'cwes': ['200', '22', '73'],
                  'groups': [
                      ('source map', 'source-map', 'sourcemap', 'sourcemappingurl', '.map'),
                      ('source code', 'original source', 'sourcescontent', 'source content', 'debug artifact', 'map file'),
                      ('expose', 'disclosure', 'read', 'retrieve', 'returned to the browser', 'public'),
                  ],
              },
              'unsafe_api_consumption': {
                  'cwes': ['346', '522', '200', '918'],
                  'groups': [
                      ('http client', 'external api', 'remote service', 'third-party', 'registry', 'outbound request'),
                      ('redirect', 'cross-host', 'different host', 'different registry', 'destination'),
                      ('credential', 'authorization', 'proxy-authorization', 'forward', 'trust boundary'),
                  ],
              },
              'websocket_authorization': {
                  'cwes': ['862', '863', '287', '306'],
                  'groups': [
                      ('websocket', 'web socket'),
                      ('authorization', 'authentication', 'access control', 'permission'),
                      ('bypass', 'missing', 'skip', 'unauthorized', 'without authentication', 'regardless of permission'),
                  ],
              },
          }

          def fetch_cwe(cwe):
              out = []
              for page in range(1, 5):
                  params = urllib.parse.urlencode({
                      'cwes': cwe,
                      'per_page': 100,
                      'page': page,
                      'sort': 'published',
                      'direction': 'desc',
                  })
                  req = urllib.request.Request(
                      f'https://api.github.com/advisories?{params}', headers=headers
                  )
                  with urllib.request.urlopen(req, timeout=45) as response:
                      rows = json.load(response)
                  if not rows:
                      break
                  out.extend(rows)
                  if len(rows) < 100:
                      break
              return out

          cache = {}
          def advisories(cwe):
              if cwe not in cache:
                  cache[cwe] = fetch_cwe(cwe)
              return cache[cwe]

          def project_from_url(value):
              value = str(value or '')
              patterns = (
                  r'https://api\.github\.com/repos/([^/]+/[^/]+)(?:/|$)',
                  r'https://github\.com/([^/]+/[^/]+)(?:/|$)',
              )
              for pattern in patterns:
                  m = re.match(pattern, value)
                  if m:
                      project = m.group(1)
                      if project.lower().startswith('advisories/'):
                          return ''
                      return project
              return ''

          report = {}
          for family, spec in specs.items():
              by_root = {}
              for cwe in spec['cwes']:
                  for raw in advisories(cwe):
                      root = str(raw.get('ghsa_id') or '').strip()
                      if not root or raw.get('withdrawn_at'):
                          continue
                      by_root.setdefault(root, raw)

              rows = []
              for root, raw in by_root.items():
                  refs = [str(v) for v in raw.get('references') or [] if str(v)]
                  project = project_from_url(raw.get('repository_advisory_url'))
                  if not project:
                      project = project_from_url(raw.get('source_code_location'))
                  if not project:
                      for ref in refs:
                          project = project_from_url(ref)
                          if project:
                              break
                  if not project:
                      continue

                  urls = {
                      canonical_url(raw.get('html_url')),
                      canonical_url(raw.get('repository_advisory_url')),
                      canonical_url(raw.get('source_code_location')),
                  }
                  urls.update(canonical_url(v) for v in refs)
                  urls.discard('')
                  overlap_urls = sorted(urls & prior['urls'])
                  if root in prior['roots'] or project in prior['projects'] or overlap_urls:
                      continue

                  text = (str(raw.get('summary') or '') + '\n' + str(raw.get('description') or '')).lower()
                  group_hits = []
                  groups_passed = 0
                  hit_count = 0
                  for group in spec['groups']:
                      hits = sorted({term for term in group if term in text})
                      group_hits.append(hits)
                      if hits:
                          groups_passed += 1
                          hit_count += len(hits)

                  if groups_passed < 2:
                      continue
                  rows.append({
                      'family': family,
                      'source_root': root,
                      'source_project': project,
                      'canonical_advisory_url': raw.get('html_url'),
                      'repository_advisory_url': raw.get('repository_advisory_url'),
                      'source_code_location': raw.get('source_code_location'),
                      'published_at': raw.get('published_at'),
                      'reviewed': raw.get('type') == 'reviewed',
                      'summary': raw.get('summary'),
                      'groups_passed': groups_passed,
                      'group_hits': group_hits,
                      'hit_count': hit_count,
                      'historical_firewall_fresh': True,
                  })

              rows.sort(
                  key=lambda r: (
                      r['groups_passed'],
                      r['hit_count'],
                      1 if r['reviewed'] else 0,
                      r['published_at'] or '',
                  ),
                  reverse=True,
              )
              report[family] = rows[:15]

          print(json.dumps({
              'evaluation_kind': 'analysis_631_unscored_fresh_semantic_source_finder',
              'scoring_executed': False,
              'detector_output_used': False,
              'admission_output_used': False,
              'ranking_output_used': False,
              'historical_exposure_counts': {k: len(v) for k, v in prior.items()},
              'api_query_count': len(cache),
              'candidates_by_family': report,
          }, indent=2, sort_keys=True))
          PY
