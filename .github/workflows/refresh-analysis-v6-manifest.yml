name: Refresh Analysis 6.0 Manifest

on:
  push:
    branches:
      - agent/analysis-engine-6.0-owasp-admission

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.0-owasp-admission
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove temporary workflow and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-analysis-v6-manifest.yml
          : > MANIFEST.sha256
          while IFS= read -r -d '' file; do
            if [[ "$file" == "MANIFEST.sha256" ]]; then
              continue
            fi
            sha256sum "$file" >> MANIFEST.sha256
          done < <(git ls-files -z)
          sha256sum -c MANIFEST.sha256

      - name: Re-run full regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Commit refreshed manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh manifest for Analysis Engine 6.0'
          git push origin HEAD:agent/analysis-engine-6.0-owasp-admission
