name: Controlled Identity Differential branch verification

on:
  push:
    branches:
      - feat/differential-evidence-v2-controlled-identities-20260914

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh tracked hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          tracked = [
              'app/controlled_identity_differential.py',
              'tools/review_controlled_identity_differential.py',
              'tests/test_controlled_identity_differential.py',
              'docs/CONTROLLED_IDENTITY_DIFFERENTIAL.md',
          ]
          lines = manifest.read_text(encoding='utf-8').splitlines()
          positions = {}
          for i, line in enumerate(lines):
              if '  ' in line:
                  _, path = line.split('  ', 1)
                  positions[path] = i
          for path in tracked:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              rendered = f'{digest}  {path}'
              if path in positions:
                  lines[positions[path]] = rendered
              else:
                  positions[path] = len(lines)
                  lines.append(rendered)
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Focused compile and tests
        run: |
          python -m py_compile app/controlled_identity_differential.py tools/review_controlled_identity_differential.py tests/test_controlled_identity_differential.py
          python -m unittest tests.test_controlled_identity_differential
          sha256sum --strict -c MANIFEST.sha256
      - name: Commit final branch state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/controlled-identity-verify.yml
          git add MANIFEST.sha256 app/controlled_identity_differential.py tools/review_controlled_identity_differential.py tests/test_controlled_identity_differential.py docs/CONTROLLED_IDENTITY_DIFFERENTIAL.md
          git commit -m 'feat: add offline controlled identity differential review'
          git push
