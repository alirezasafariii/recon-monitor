name: Real-World Corpus V1 Source Discovery

on:
  push:
    branches: [agent/real-world-corpus-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(corpus-v1): refresh fresh source candidates') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover fresh primary-source candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python app/real_world_corpus_v1.py discover \
            --max-pages 10 \
            --selection-limit 160 \
            --output benchmarks/real_world/v1/source_candidates.json \
            --report benchmarks/real_world/v1/source_discovery_report.json

      - name: Focused corpus regressions
        run: python -m unittest tests/test_real_world_corpus_v1.py -q

      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Regenerate strict manifest
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/real_world/v1/source_candidates.json \
                  benchmarks/real_world/v1/source_discovery_report.json
          git ls-files -z \
            | python -c 'import sys; items=[x for x in sys.stdin.buffer.read().split(b"\0") if x and x != b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(items))+b"\0")' \
            | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256

      - name: Commit discovery registry and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/real_world/v1/source_candidates.json \
                  benchmarks/real_world/v1/source_discovery_report.json \
                  MANIFEST.sha256
          if git diff --cached --quiet; then
            echo 'No discovery changes to commit.'
            exit 0
          fi
          git commit -m 'chore(corpus-v1): refresh fresh source candidates'
          git push
