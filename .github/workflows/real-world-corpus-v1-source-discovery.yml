name: Real-World Corpus V1 Source Discovery

on:
  push:
    branches: [agent/real-world-corpus-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover fresh primary-source candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python app/real_world_corpus_v1_discovery.py discover \
            --max-pages 20 \
            --selection-limit 180 \
            --output benchmarks/real_world/v1/source_candidates.json \
            --report benchmarks/real_world/v1/source_discovery_report.json

      - name: Discover family-targeted candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python app/real_world_corpus_v1_targeted.py \
            --max-pages-per-cwe 3 \
            --target-buffer-families 60 \
            --output benchmarks/real_world/v1/targeted_candidates.json \
            --report benchmarks/real_world/v1/targeted_discovery_report.json

      - name: Build pre-adjudication 100-source shortlist
        run: |
          set -euo pipefail
          python app/real_world_corpus_v1_shortlist.py \
            --targeted benchmarks/real_world/v1/targeted_candidates.json \
            --general benchmarks/real_world/v1/source_candidates.json \
            --output benchmarks/real_world/v1/source_shortlist.json \
            --report benchmarks/real_world/v1/shortlist_report.json

      - name: Assess passive source feasibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python app/real_world_corpus_v1_feasibility.py \
            --shortlist benchmarks/real_world/v1/source_shortlist.json \
            --output benchmarks/real_world/v1/source_feasibility.json \
            --report benchmarks/real_world/v1/source_feasibility_report.json

      - name: Focused corpus regressions
        run: |
          python -m unittest tests/test_real_world_corpus_v1.py -q
          python -m unittest tests/test_real_world_corpus_v1_discovery.py -q
          python -m unittest tests/test_real_world_corpus_v1_targeted.py -q
          python -m unittest tests/test_real_world_corpus_v1_shortlist.py -q
          python -m unittest tests/test_real_world_corpus_v1_feasibility.py -q

      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Regenerate strict manifest
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/real_world/v1/source_candidates.json \
                  benchmarks/real_world/v1/source_discovery_report.json \
                  benchmarks/real_world/v1/targeted_candidates.json \
                  benchmarks/real_world/v1/targeted_discovery_report.json \
                  benchmarks/real_world/v1/source_shortlist.json \
                  benchmarks/real_world/v1/shortlist_report.json \
                  benchmarks/real_world/v1/source_feasibility.json \
                  benchmarks/real_world/v1/source_feasibility_report.json
          git ls-files -z \
            | python -c 'import sys; items=[x for x in sys.stdin.buffer.read().split(b"\0") if x and x != b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(items))+b"\0")' \
            | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256

      - name: Commit corpus source artifacts and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/real_world/v1/source_candidates.json \
                  benchmarks/real_world/v1/source_discovery_report.json \
                  benchmarks/real_world/v1/targeted_candidates.json \
                  benchmarks/real_world/v1/targeted_discovery_report.json \
                  benchmarks/real_world/v1/source_shortlist.json \
                  benchmarks/real_world/v1/shortlist_report.json \
                  benchmarks/real_world/v1/source_feasibility.json \
                  benchmarks/real_world/v1/source_feasibility_report.json \
                  MANIFEST.sha256
          if git diff --cached --quiet; then
            echo 'No corpus source changes to commit.'
            exit 0
          fi
          git commit -m 'chore(corpus-v1): refresh source feasibility'
          git push
