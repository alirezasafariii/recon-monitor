name: Final Analyzer Manifest Refresh

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh final analyzer manifest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild manifest from existing coverage plus new DOM XSS files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          paths = []
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              parts = raw.split(None, 1)
              if len(parts) != 2:
                  raise SystemExit(f'invalid manifest line: {raw!r}')
              path = parts[1].strip()
              if Path(path).is_file():
                  paths.append(path)

          for path in (
              'app/family_specs/dom_xss.py',
              'tests/test_final_analyzers_dom_xss_spec.py',
          ):
              if Path(path).is_file():
                  paths.append(path)

          output = []
          for path in sorted(set(paths)):
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              output.append(f'{digest}  {path}')
          manifest.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
      - name: Verify refreshed manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Commit manifest only
        shell: bash
        run: |
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh manifest for DOM XSS migration'
            git push origin HEAD:final-analyzers
          fi
