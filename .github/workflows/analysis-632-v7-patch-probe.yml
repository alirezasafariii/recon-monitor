name: Analysis 6.32 v7 Patch Feasibility Probe

on:
  push:
    branches:
      - agent/analysis-engine-6.32-post-blind-calibration
    paths:
      - 'benchmarks/raw/sources/v7_candidates.json'
      - '.github/workflows/analysis-632-v7-patch-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-632-v7-patch-probe
  cancel-in-progress: false

jobs:
  probe-v7-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.32-post-blind-calibration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pre-score condition and patch audits
        env:
          PYTHONPATH: app
        run: |
          python -m py_compile app/v7_source_semantic_audit.py app/v7_pre_score_condition_audit.py app/raw_recon_v7_patch_probe.py
          python - <<'PY'
          from v7_pre_score_condition_audit import validate_registry
          errors=validate_registry()
          print({'v7_condition_registry_errors': errors})
          assert errors == [], errors
          PY
      - name: Probe real upstream patches
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/raw_recon_v7_patch_probe.py
      - name: Assert uncontaminated patchable pool
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_candidates_patchable.json').read_text())
          assert r['family_count'] == 36
          assert r['candidate_selection_uses_detector_scores'] is False
          assert r['candidate_selection_uses_admission_results'] is False
          assert r['candidate_selection_uses_ranking_results'] is False
          assert r['candidate_selection_uses_v6_first_blind_score'] is False
          assert r['candidate_selection_uses_v6_first_blind_case_errors'] is False
          assert r['active_target_validation_performed'] is False
          assert r['scoring_executed'] is False
          assert r['first_blind_consumed'] is False
          print({'family_candidate_counts': r['family_candidate_counts'], 'families_without_candidates': r['families_without_candidates']})
          PY
      - name: Commit patch-feasible pool
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v7_candidates_patchable.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Analysis 6.32 v7 patch-feasible candidates'
          git pull --rebase origin agent/analysis-engine-6.32-post-blind-calibration
          git push origin HEAD:agent/analysis-engine-6.32-post-blind-calibration
