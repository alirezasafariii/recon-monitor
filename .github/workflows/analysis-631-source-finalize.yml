name: Analysis 6.31 Source Finalization

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_supplement_candidates.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select final independent source set
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from family_detectors.registry import DETECTOR_SPECS
          from raw_recon_v5_source_audit import AUDIT_RULE_VERSION, AUDIT_VERSION, audit_row
          from raw_recon_v6_source_firewall import check_candidate, validate_shortlist

          def pools(path):
              data = json.loads(Path(path).read_text())
              assert data['scoring_executed'] is False
              return data.get('candidates_by_family') or {}

          base = pools('benchmarks/raw/sources/v6_candidates.json')
          extra = pools('benchmarks/raw/sources/v6_supplement_candidates.json')
          eligible = {}
          for family in sorted(DETECTOR_SPECS):
              rows = []
              seen = set()
              for raw in [*(base.get(family) or []), *(extra.get(family) or [])]:
                  root = str(raw.get('source_root') or '').strip()
                  project = str(raw.get('source_project') or '').strip()
                  if not root or not project or (root, project) in seen:
                      continue
                  seen.add((root, project))
                  if not check_candidate(raw)['allowed']:
                      continue
                  passed, hits, score = audit_row(family, raw)
                  if not passed:
                      continue
                  row = dict(raw)
                  row['freshness_validated'] = True
                  row['v6_firewall_allowed'] = True
                  row['source_family_audit_version'] = AUDIT_VERSION
                  row['source_family_audit_rule_version'] = AUDIT_RULE_VERSION
                  row['source_family_audit_score'] = int(score)
                  row['source_family_audit_group_hits'] = hits
                  rows.append(row)
              rows.sort(key=lambda row: (int(row.get('source_family_audit_score') or 0), 1 if row.get('repository_advisory_url') else 0, row.get('published_at') or ''), reverse=True)
              eligible[family] = rows

          missing = sorted(family for family, rows in eligible.items() if not rows)
          if missing:
              Path('benchmarks/raw/sources/v6_selection_final_report.json').write_text(json.dumps({
                  'rule_version': '2026.08.13.6.31',
                  'scoring_executed': False,
                  'status': 'semantic_gap',
                  'eligible_counts': {family: len(rows) for family, rows in eligible.items()},
                  'families_without_eligible_source': missing,
              }, indent=2, sort_keys=True) + '\n')
              raise SystemExit('v6 source gap: ' + ', '.join(missing))

          used_roots, used_projects, selected = set(), set(), {}
          for family in sorted(eligible, key=lambda name: (len(eligible[name]), name)):
              for row in eligible[family]:
                  root = str(row['source_root'])
                  project = str(row['source_project'])
                  if root in used_roots or project in used_projects:
                      continue
                  selected[family] = row
                  used_roots.add(root)
                  used_projects.add(project)
                  break
              if family not in selected:
                  raise SystemExit('v6 source uniqueness gap: ' + family)

          rows = [selected[family] for family in sorted(selected)]
          firewall = validate_shortlist(rows, required_count=36)
          assert firewall['passed'], firewall['errors']
          result = {
              'version': '1.0.0',
              'rule_version': '2026.08.13.6.31',
              'evaluation_kind': 'fresh_blind_v6_unscored_source_selection',
              'selection_executes_scoring': False,
              'selection_uses_detector_output': False,
              'selection_uses_admission_results': False,
              'selection_uses_ranking_results': False,
              'family_count': 36,
              'unique_root_count': len(used_roots),
              'unique_project_count': len(used_projects),
              'eligible_counts': {family: len(items) for family, items in eligible.items()},
              'firewall': firewall,
              'selected': rows,
          }
          Path('benchmarks/raw/sources/v6_shortlist.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          Path('benchmarks/raw/sources/v6_selection_final_report.json').write_text(json.dumps({
              'rule_version': result['rule_version'],
              'scoring_executed': False,
              'status': 'selected',
              'family_count': 36,
              'unique_root_count': len(used_roots),
              'unique_project_count': len(used_projects),
              'eligible_counts': result['eligible_counts'],
          }, indent=2, sort_keys=True) + '\n')
          print({'family_count': 36, 'unique_root_count': len(used_roots), 'unique_project_count': len(used_projects)})
          PY

      - name: Commit final source set
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_shortlist.json benchmarks/raw/sources/v6_selection_final_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Select final independent Analysis 6.31 v6 sources'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
