name: Temporary reviewed evidence manifest cleanup

on:
  push:
    branches:
      - feat/reviewed-evidence-dispatcher-20260914

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore base manifest ordering and append new entries
        shell: bash
        run: |
          git show origin/main:MANIFEST.sha256 > MANIFEST.sha256
          sha256sum \
            app/reviewed_evidence_dispatcher.py \
            docs/REVIEWED_EVIDENCE_DISPATCHER.md \
            tests/test_reviewed_evidence_dispatcher.py \
            tools/dispatch_reviewed_evidence.py >> MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
      - name: Finalize branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-reviewed-evidence-manifest-cleanup.yml
          git add MANIFEST.sha256
          git commit -m 'chore: minimize reviewed evidence manifest diff'
          git push origin HEAD:feat/reviewed-evidence-dispatcher-20260914
