name: Probe Analysis Golden Benchmark

on:
  push:
    branches:
      - agent/analysis-engine-6.0-owasp-admission

permissions:
  contents: read

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python3 -m py_compile app/analysis_benchmark.py tests/test_analysis_golden_benchmark_v620.py
      - name: Golden benchmark JSON
        env:
          PYTHONPATH: app
        run: python3 app/analysis_benchmark.py --json
      - name: Golden benchmark regression tests
        run: python3 -m unittest tests.test_analysis_golden_benchmark_v620
