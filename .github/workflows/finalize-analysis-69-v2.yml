name: Final Analysis 6.9 Validation
on:
  push:
    branches: [agent/analysis-engine-6.9-physical-family-detectors]
    paths: [.analysis-69-final2]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.9-physical-family-detectors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Analysis 6.9
        run: python .analysis-69-apply.py
      - name: Advance inherited contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          repls={
          'tests/test_analysis_ranking_v650.py':[('REASONING_ENGINE_VERSION, "6.8.0"','REASONING_ENGINE_VERSION, "6.9.0"')],
          'tests/test_analysis_coverage_v610.py':[('ENGINE_VERSION, "6.8.0"','ENGINE_VERSION, "6.9.0"'),('CANDIDATE_ENGINE_VERSION, "6.8.0"','CANDIDATE_ENGINE_VERSION, "6.9.0"'),('REASONING_ENGINE_VERSION, "6.8.0"','REASONING_ENGINE_VERSION, "6.9.0"')],
          'tests/test_analysis_standards_v630.py':[('STANDARDS_ENGINE_VERSION, "1.1.0"','STANDARDS_ENGINE_VERSION, "1.2.0"')]}
          for path,pairs in repls.items():
              p=Path(path); text=p.read_text(encoding='utf-8')
              for a,b in pairs:
                  if a not in text: raise SystemExit(f'missing contract {path}: {a}')
                  text=text.replace(a,b,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Focused detector stack
        env:
          PYTHONPATH: app
        run: |
          python -m py_compile app/family_detectors/*.py app/analysis_standards.py app/bug_candidates.py app/analysis_engine.py app/security_reasoning.py
          python tests/test_physical_family_detectors_v690.py
          python tests/test_family_evidence_extractors_v680.py
          python tests/test_family_reasoners_v670.py
          python tests/test_family_confusion_matrix_v670.py
          python tests/test_analysis_ranking_v650.py
          python tests/test_analysis_coverage_v610.py
          python tests/test_analysis_standards_v630.py
      - name: Full unit suite
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Golden v3 strict regression
        env:
          PYTHONPATH: app
        run: python app/analysis_benchmark.py --strict
      - name: Integration test
        run: python tests/integration_runner.py
      - name: Cleanup temporary machinery
        run: |
          rm -f .analysis-69-apply.py .analysis-69-trigger .analysis-69-diag .analysis-69-finalize .analysis-69-full .analysis-69-final2
          rm -f analysis69-focused.txt analysis69-full.txt
          rm -f .github/workflows/apply-analysis-69.yml .github/workflows/diagnose-analysis-69.yml .github/workflows/finalize-analysis-69.yml .github/workflows/capture-analysis-69-full.yml .github/workflows/finalize-analysis-69-v2.yml
      - name: Regenerate manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          raw=subprocess.check_output(['git','ls-files','-z'])
          paths=[x.decode() for x in raw.split(b'\0') if x]
          removed={'.analysis-69-apply.py','.analysis-69-trigger','.analysis-69-diag','.analysis-69-finalize','.analysis-69-full','.analysis-69-final2','analysis69-focused.txt','analysis69-full.txt','.github/workflows/apply-analysis-69.yml','.github/workflows/diagnose-analysis-69.yml','.github/workflows/finalize-analysis-69.yml','.github/workflows/capture-analysis-69-full.yml','.github/workflows/finalize-analysis-69-v2.yml'}
          lines=[]
          for path in sorted(paths):
              if path=='MANIFEST.sha256' or path in removed or not os.path.isfile(path): continue
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              lines.append(f'{h.hexdigest()}  {path}\n')
          Path=''
          with open('MANIFEST.sha256','w',encoding='utf-8') as f: f.writelines(lines)
          PY
          sha256sum -c MANIFEST.sha256
      - name: Commit final Analysis 6.9
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Analysis 6.9 physical family detector stack"
          git push origin HEAD:agent/analysis-engine-6.9-physical-family-detectors
