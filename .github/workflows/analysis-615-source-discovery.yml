name: Analysis 6.15 Unseen Source Discovery

on:
  push:
    branches:
      - agent/analysis-engine-6.15-fresh-raw-holdout-v3

permissions:
  contents: write

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.15-fresh-raw-holdout-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify sealed protocol before discovery
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          from raw_recon_v3_benchmark import verify_v3_freeze
          r = verify_v3_freeze()
          assert r['passed'], r['errors']
          assert r['manifest']['evaluation_status'] == 'protocol_sealed_collection_open'
          assert r['manifest']['seal']['scored'] is False
          PY

      - name: Discover unseen candidates without scoring
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ github.token }}
        run: python app/raw_recon_v3_source_discovery.py --max-pages 5 --target-per-family 80

      - name: Verify discovery has no scoring imports
        run: |
          ! grep -Eq 'run_raw_benchmark|rank_families|assess_admission|execute_detector_intelligence' app/raw_recon_v3_source_discovery.py

      - name: Clean and commit discovery inventory
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/analysis-615-source-discovery.yml
          git ls-files | grep -v '^MANIFEST.sha256$' | while IFS= read -r f; do
            if [[ -f "$f" ]]; then sha256sum "$f"; fi
          done | LC_ALL=C sort -k2 > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Collect Analysis 6.15 unseen source candidates'
          git push origin HEAD:agent/analysis-engine-6.15-fresh-raw-holdout-v3
