name: Analysis 6.31 OWASP Source Validation

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - benchmarks/raw/sources/v6_owasp_writeup_candidates.json
      - benchmarks/raw/sources/v6_owasp_writeup_grounding.json
      - .github/workflows/analysis-631-owasp-source-validate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate independent sources against OWASP grounding
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v6_source_firewall import canonical_url, check_candidate

          root = Path('benchmarks/raw/sources')
          grounding = json.loads((root / 'v6_owasp_writeup_grounding.json').read_text())
          candidates = json.loads((root / 'v6_owasp_writeup_candidates.json').read_text())

          expected = {
              'business_logic',
              'cors_misconfiguration',
              'dom_xss',
              'graphql_data_exposure',
              'improper_inventory_management',
              'nosql_injection',
              'postmessage_trust',
              'sensitive_business_flow_abuse',
              'sensitive_caching',
              'software_supply_chain_failure',
          }
          contracts = {
              'business_logic': (
                  ('payment', 'workflow', 'state'),
                  ('validation', 'invariant', 'integrity'),
              ),
              'cors_misconfiguration': (
                  ('cors', 'cross-origin', 'origin'),
                  ('credential', 'sensitive'),
              ),
              'dom_xss': (
                  ('dom xss', 'client-side'),
                  ('render', 'sink', 'browser'),
                  ('sanit', 'bypass'),
              ),
              'graphql_data_exposure': (
                  ('graphql',),
                  ('pii', 'sensitive', 'data exposure'),
                  ('scope', 'field', 'resolver'),
              ),
              'improper_inventory_management': (
                  ('deprecated', 'legacy', 'api v1'),
                  ('reachable', 'operational'),
                  ('unauthenticated', 'weaker controls', 'security drift'),
              ),
              'nosql_injection': (
                  ('nosql', 'mongodb'),
                  ('filter', 'query'),
                  ('unintended', 'semantics', 'match'),
              ),
              'postmessage_trust': (
                  ('message', 'bridge'),
                  ('origin', 'source'),
                  ('cross-origin', 'frame'),
              ),
              'sensitive_business_flow_abuse': (
                  ('invite', 'business'),
                  ('repeat', 'duplicate', 'flood'),
                  ('rate limit', 'anti-abuse', 'frequency'),
              ),
              'sensitive_caching': (
                  ('cache',),
                  ('sensitive', 'data leakage'),
                  ('cross-request', 'reuse', 'isolation'),
              ),
              'software_supply_chain_failure': (
                  ('dependency', 'package'),
                  ('compromised', 'malicious'),
                  ('supply chain',),
              ),
          }

          errors = []
          checks = {}
          pools = candidates.get('candidates_by_family') or {}
          if candidates.get('scoring_executed') is not False:
              errors.append('candidate discovery must remain unscored')
          if grounding.get('grounding_counts_as_target_evidence') is not False:
              errors.append('OWASP/write-up grounding must never count as target evidence')
          if set(pools) != expected:
              errors.append(f'candidate family coverage mismatch: {sorted(set(pools) ^ expected)}')
          if set(grounding.get('families') or {}) != expected:
              errors.append('grounding family coverage mismatch')

          grounding_urls = set()
          for family, spec in (grounding.get('families') or {}).items():
              for key in ('owasp_anchor', 'owasp_companion'):
                  value = canonical_url(spec.get(key))
                  if value:
                      grounding_urls.add(value)
              for value in spec.get('writeups') or []:
                  value = canonical_url(value)
                  if value:
                      grounding_urls.add(value)
          project_urls = grounding.get('owasp_testing_project') or {}
          for value in project_urls.values():
              if isinstance(value, str):
                  value = canonical_url(value)
                  if value:
                      grounding_urls.add(value)

          roots = set()
          projects = set()
          for family in sorted(expected):
              rows = pools.get(family) or []
              if len(rows) != 1:
                  errors.append(f'{family}: expected exactly one candidate, got {len(rows)}')
                  continue
              row = dict(rows[0])
              text = ' '.join([
                  str(row.get('summary') or ''),
                  str(row.get('description') or ''),
                  *[str(value) for value in row.get('semantic_facts') or []],
              ]).lower()
              spec = grounding['families'][family]
              wstg = set(row.get('wstg_ids') or [])
              required_wstg = set(spec.get('wstg_ids') or [])
              if not wstg or not wstg.issubset(required_wstg):
                  errors.append(f'{family}: WSTG grounding mismatch candidate={sorted(wstg)} manifest={sorted(required_wstg)}')

              candidate_urls = {
                  canonical_url(row.get('canonical_advisory_url')),
                  canonical_url(row.get('repository_advisory_url')),
                  canonical_url(row.get('source_code_location')),
                  canonical_url(row.get('source_url')),
                  *[canonical_url(value) for value in row.get('references') or []],
              }
              candidate_urls.discard('')
              direct_grounding_overlap = sorted(candidate_urls & grounding_urls)
              if direct_grounding_overlap:
                  errors.append(f'{family}: grounding URL reused as candidate provenance: {direct_grounding_overlap}')

              semantic_hits = []
              for group in contracts[family]:
                  hits = sorted(term for term in group if term.lower() in text)
                  semantic_hits.append(hits)
                  if not hits:
                      errors.append(f'{family}: OWASP/write-up semantic group missing: {group}')

              firewall = check_candidate(row)
              if not firewall['allowed']:
                  errors.append(f"{family}: firewall rejected root/project/url overlap: {firewall}")

              source_root = str(row.get('source_root') or '').strip()
              source_project = str(row.get('source_project') or '').strip()
              if source_root in roots:
                  errors.append(f'{family}: duplicate source root {source_root}')
              if source_project in projects:
                  errors.append(f'{family}: duplicate source project {source_project}')
              roots.add(source_root)
              projects.add(source_project)
              checks[family] = {
                  'source_root': source_root,
                  'source_project': source_project,
                  'wstg_ids': sorted(wstg),
                  'semantic_group_hits': semantic_hits,
                  'grounding_provenance_overlap': direct_grounding_overlap,
                  'firewall': firewall,
              }

          if len(roots) != 10 or len(projects) != 10:
              errors.append(f'OWASP candidate uniqueness mismatch roots={len(roots)} projects={len(projects)}')

          report = {
              'version': '1.0.0',
              'rule_version': '2026.08.14.6.31',
              'evaluation_kind': 'fresh_blind_v6_pre_score_source_validation',
              'passed': not errors,
              'errors': errors,
              'family_count': len(checks),
              'unique_root_count': len(roots),
              'unique_project_count': len(projects),
              'grounding_counts_as_target_evidence': False,
              'scoring_executed': False,
              'detector_output_used': False,
              'admission_output_used': False,
              'ranking_output_used': False,
              'checks': checks,
          }
          out = root / 'v6_owasp_writeup_validation.json'
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'passed': report['passed'],
              'family_count': report['family_count'],
              'unique_root_count': report['unique_root_count'],
              'unique_project_count': report['unique_project_count'],
              'errors': report['errors'],
          }, indent=2, sort_keys=True))
          if errors:
              raise SystemExit(2)
          PY

      - name: Commit validation report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_owasp_writeup_validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate OWASP-grounded Analysis 6.31 source candidates'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
