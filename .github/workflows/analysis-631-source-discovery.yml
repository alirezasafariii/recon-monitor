name: Analysis 6.31 Source Discovery

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - app/raw_recon_v6_source_discovery.py
      - app/raw_recon_v6_source_firewall.py
      - .github/workflows/analysis-631-source-discovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unscored v6 source discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: app
        run: python app/raw_recon_v6_source_discovery.py

      - name: Verify discovery remains unscored
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('benchmarks/raw/sources/v6_candidates.json')
          data = json.loads(p.read_text())
          assert data['scoring_executed'] is False
          assert data['candidate_selection_uses_detector_scores'] is False
          assert data['candidate_selection_uses_admission_results'] is False
          assert data['candidate_selection_uses_ranking_results'] is False
          assert int(data.get('family_count') or 0) == 36
          print({
              'families_without_candidates': data.get('families_without_candidates'),
              'families_without_semantic_candidates': data.get('families_without_semantic_candidates'),
              'source_firewall_rejection_count': data.get('source_firewall_rejection_count'),
              'api_request_count': data.get('api_request_count'),
          })
          PY

      - name: Commit discovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_candidates.json
          if git diff --cached --quiet; then
            echo 'No discovery snapshot change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record unscored Analysis 6.31 v6 source discovery'
          git push
