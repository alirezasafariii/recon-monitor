name: Analysis 6.33 V7 Unseen Second Pass Source Capture

on:
  push:
    branches: [agent/analysis-engine-6.33-v7-unseen-capture]
    paths:
      - '.github/workflows/analysis-633-v7-unseen-second-pass-source-capture.yml'
      - 'app/v7_second_pass_source_capture.py'
      - 'tests/test_v7_second_pass_source_capture.py'
      - 'benchmarks/raw/sources/v7_second_pass_literal_candidates.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-633-v7-unseen-second-pass-source-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.33-v7-unseen-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused source-capture guards
        env: {PYTHONPATH: app}
        run: python -m unittest tests.test_v7_second_pass_source_capture -v
      - name: Capture same-source literal neighborhoods
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/v7_second_pass_source_capture.py
      - name: Verify source-capture firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_second_pass_source_snippet_candidates_report.json').read_text())
          d=json.loads(Path('benchmarks/raw/sources/v7_second_pass_source_snippet_candidates.json').read_text())
          assert r['family_count']==26 and len(d['families'])==26
          assert r['source_assignment_locked'] is True
          assert r['source_replacement_allowed'] is False and r['source_replacement_used'] is False
          assert r['synthetic_fixture_allowed'] is False and r['synthetic_fixture_used'] is False
          assert r['cross_variant_mutation_allowed'] is False
          assert r['candidate_semantics_adjudicated'] is False
          assert r['evidence_published'] is False and r['publication_authorized'] is False
          assert r['human_adjudication_performed'] is False
          assert r['third_party_code_executed'] is False and r['target_contact_performed'] is False
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False
          print({k:r[k] for k in ('family_count','pair_candidate_count','families_with_source_code_parent_snippets','families_with_source_code_fix_snippets','families_with_test_control_candidates','source_code_parent_snippet_pair_count','source_code_fix_snippet_pair_count','test_control_candidate_count','failure_count')})
          PY
      - name: Full regression suite
        env: {PYTHONPATH: app}
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Freeze second-pass source candidates
        run: |
          git add benchmarks/raw/sources/v7_second_pass_source_snippet_candidates.json benchmarks/raw/sources/v7_second_pass_source_snippet_candidates_report.json
          git ls-files -z | python -c 'import sys; x=[v for v in sys.stdin.buffer.read().split(b"\0") if v and v!=b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(x))+b"\0")' | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
          git add MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(analysis-633): freeze V7 second-pass source candidates'
          git push origin HEAD:agent/analysis-engine-6.33-v7-unseen-capture
