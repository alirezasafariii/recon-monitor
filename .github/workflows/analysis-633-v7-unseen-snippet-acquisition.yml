name: Analysis 6.33 V7 Unseen Source Snippet Acquisition

on:
  push:
    branches:
      - agent/analysis-engine-6.33-v7-unseen-capture
    paths:
      - '.github/workflows/analysis-633-v7-unseen-snippet-acquisition.yml'
      - 'app/v7_unseen_source_snippet_capture.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis-633-v7-unseen-source-snippets
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.33-v7-unseen-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact frozen source and boundary state
        env: {PYTHONPATH: app}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v7_capture_guard import assert_capture_source_freeze
          g=assert_capture_source_freeze()
          research=json.loads(Path('benchmarks/raw/sources/v7_literal_source_research.json').read_text())
          boundary=json.loads(Path('benchmarks/raw/sources/v7_boundary_evidence.json').read_text())
          assert g['source_assignment_commit']=='5656a8add583f61e712a837794ce7302857fce7a'
          assert g['recomputed_engine_seen_count']==0
          assert research['version']=='2.2.0'
          assert research['successful_snapshot_count']==36 and research['unresolved_snapshot_count']==0
          assert research['exact_frozen_root_match_count']==36 and research['ghsa_alias_resolution_count']==0
          assert boundary['source_count']==36 and boundary['source_assignment_commit']==g['source_assignment_commit']
          assert boundary['scoring_executed'] is False and boundary['first_blind_consumed'] is False
          assert boundary['target_contact_performed'] is False
          print({'sources':36,'exact_revision_pairs':boundary['exact_revision_pair_count'],'engine_seen':0,'scoring':False})
          PY

      - name: Capture bounded exact-revision source neighborhoods
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/v7_unseen_source_snippet_capture.py

      - name: Verify snippet acquisition remains evidence-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          boundary=json.loads(Path('benchmarks/raw/sources/v7_boundary_evidence_report.json').read_text())
          r=json.loads(Path('benchmarks/raw/sources/v7_unseen_source_snippet_candidates_report.json').read_text())
          assert r['source_count']==36
          assert r['exact_pair_source_count']==boundary['exact_revision_pair_count']
          assert r['failure_count']==0
          assert r['scoring_executed'] is False and r['first_blind_consumed'] is False
          assert r['third_party_code_executed'] is False and r['target_contact_performed'] is False
          print(r)
          PY

      - name: Focused snippet parser checks
        env: {PYTHONPATH: app}
        run: |
          python - <<'PY'
          from v7_unseen_source_snippet_capture import hunk_ranges, test_controls
          assert hunk_ranges('@@ -10,2 +12,3 @@') == [(10,2,12,3)]
          assert test_controls(b'def test_reject_unsafe():\n    assert reject("unsafe")\n')
          assert test_controls(b'def helper():\n    return 1\n') == []
          print('focused snippet checks: PASS')
          PY

      - name: Full regression suite
        env: {PYTHONPATH: app}
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Source hygiene
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '^(state|runs|output|reports|backups)/.+|(^|/)config\.env$|\.db($|-)' || true)"
          forbidden="$(printf '%s\n' "$forbidden" | grep -Ev '/\.gitkeep$' || true)"
          if [ -n "$forbidden" ]; then printf '%s\n' "$forbidden"; exit 1; fi

      - name: Freeze snippet inventory and strict manifest
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v7_unseen_source_snippet_candidates.json \
                  benchmarks/raw/sources/v7_unseen_source_snippet_candidates_report.json
          git ls-files -z \
            | python -c 'import sys; items=[x for x in sys.stdin.buffer.read().split(b"\0") if x and x != b"MANIFEST.sha256"]; sys.stdout.buffer.write(b"\0".join(sorted(items))+b"\0")' \
            | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum --strict -c MANIFEST.sha256
          git add MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo 'No snippet outputs changed.'; exit 0; fi
          git commit -m 'chore(analysis-633): freeze V7 unseen source snippet inventory'
          git push origin HEAD:agent/analysis-engine-6.33-v7-unseen-capture
