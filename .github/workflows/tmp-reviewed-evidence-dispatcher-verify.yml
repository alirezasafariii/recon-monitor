name: Temporary reviewed evidence dispatcher verification

on:
  push:
    branches:
      - feat/reviewed-evidence-dispatcher-20260914

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh changed file hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('MANIFEST.sha256')
          entries = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, path = line.split('  ', 1)
              entries[path] = digest
          for path in (
              'app/reviewed_evidence_dispatcher.py',
              'tools/dispatch_reviewed_evidence.py',
              'tests/test_reviewed_evidence_dispatcher.py',
              'docs/REVIEWED_EVIDENCE_DISPATCHER.md',
          ):
              data = Path(path).read_bytes()
              entries[path] = hashlib.sha256(data).hexdigest()
          manifest.write_text(
              ''.join(f'{entries[path]}  {path}\n' for path in sorted(entries)),
              encoding='utf-8',
          )
          PY
      - name: Verify focused dispatcher
        shell: bash
        run: |
          python -m py_compile app/reviewed_evidence_dispatcher.py tools/dispatch_reviewed_evidence.py tests/test_reviewed_evidence_dispatcher.py
          python tests/test_reviewed_evidence_dispatcher.py
          python tests/test_finding_notifications.py
          sha256sum --strict -c MANIFEST.sha256
      - name: Finalize branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-reviewed-evidence-dispatcher-verify.yml
          git add MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh manifest for reviewed evidence dispatcher'
            git push origin HEAD:feat/reviewed-evidence-dispatcher-20260914
          fi
