name: Analysis 6.31 Source Replacement Report

on:
  workflow_dispatch:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - '.github/workflows/analysis-631-source-replacement-report.yml'
      - 'app/v6_capture_source_replacement_report.py'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.31-fresh-blind-v6-validation
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build report-only replacement feasibility analysis
        env:
          PYTHONPATH: app
        run: python app/v6_capture_source_replacement_report.py

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_capture_source_replacement_report.json
          if git diff --cached --quiet; then
            echo 'Replacement report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Analysis 6.31 source replacement feasibility'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
