name: XSS browser acceptance

on:
  pull_request:
    branches: [main, feat/autonomous-hunt-agent]
  push:
    branches: [fix/xss-evidence-context]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xss-browser-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Real Chromium on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      XSS_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium with Linux system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: python -m playwright install chromium
      - name: Require a working browser and select its executable
        shell: bash
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              print('Chromium:', browser.version)
              browser.close()
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('XSS_TEST_CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - name: Run actual browser and orchestration acceptance
        run: |
          python -m unittest discover -s tests -p 'test_xss_browser*.py' -v
          python -m unittest discover -s tests -p 'test_hunt_browser_integration.py' -v
          python -m unittest discover -s tests -p 'test_hunt_agent_review.py' -v
      - name: Verify release metadata and manifest
        shell: bash
        run: |
          python tools/check_release_consistency.py
          shasum -a 256 -c MANIFEST.sha256
