name: Analysis 6.31 Final Source Research Correction

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-race-source-probe.yml

permissions:
  contents: write

jobs:
  finalize-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Allow exact Palo Alto vendor source in passive research
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/v6_literal_source_research.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('VERSION = "1.1.0"', 'VERSION = "1.1.1"')
          text = text.replace('RULE_VERSION = "2026.08.14.6.31.3"', 'RULE_VERSION = "2026.08.14.6.31.4"')
          needle = '    "blog.rubygems.org",\n}'
          replacement = '    "blog.rubygems.org",\n    "security.paloaltonetworks.com",\n}'
          if '"security.paloaltonetworks.com"' not in text:
              if needle not in text:
                  raise SystemExit('expected external-source allowlist anchor not found')
              text = text.replace(needle, replacement)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Collect all 36 passive canonical source snapshots
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python app/v6_literal_source_research.py --require-all

      - name: Assert passive research is complete and unscored
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('benchmarks/raw/sources/v6_literal_source_research.json').read_text(encoding='utf-8'))
          assert report['family_count'] == 36
          assert report['successful_snapshot_count'] == 36
          assert report['unresolved_snapshot_count'] == 0
          assert report['unresolved_sources'] == []
          assert report['scoring_executed'] is False
          assert report['first_blind_consumed'] is False
          assert report['detector_output_used'] is False
          assert report['admission_output_used'] is False
          assert report['ranking_output_used'] is False
          assert report['active_target_validation_performed'] is False
          race = next(row for row in report['entries'] if row['family'] == 'race_condition')
          assert race['source_root'] == 'CVE-2025-0120'
          assert race['canonical_reference'] == 'https://security.paloaltonetworks.com/CVE-2025-0120'
          assert race['fetch_status'] == 200
          assert race['snapshot_payload'] is not None
          PY

      - name: Commit complete passive source research
        shell: bash
        run: |
          set -euo pipefail
          git add app/v6_literal_source_research.py benchmarks/raw/sources/v6_literal_source_research.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete passive Analysis 6.31 source research 36 of 36'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
