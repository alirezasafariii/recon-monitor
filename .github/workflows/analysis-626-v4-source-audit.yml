name: Analysis 6.26 Raw v4 Source Audit

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit protocol contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_raw_recon_v4_source_audit_v6260.py' -q
      - name: Run strict pre-scoring source-family audit
        env:
          PYTHONPATH: app
        run: python app/raw_recon_v4_source_audit.py
      - name: Print audit result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmarks/raw/sources/v4_source_family_audit.json').read_text())
          print(json.dumps({
            'initial_failed_families':d['initial_failed_families'],
            'eligible_family_counts':d['eligible_family_counts'],
            'rebuilt_family_count':d['rebuilt_family_count'],
            'rebuilt_root_count':d['rebuilt_root_count'],
            'rebuilt_project_count':d['rebuilt_project_count'],
            'missing_families':d['missing_families'],
            'changed_selections':d['changed_selections'],
          },indent=2,sort_keys=True))
          PY
      - name: Stop before mutation if audit cannot rebuild exact 36
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmarks/raw/sources/v4_source_family_audit.json').read_text())
          assert d['rebuilt_family_count']==36
          assert d['rebuilt_root_count']==36
          assert d['rebuilt_project_count']==36
          assert not d['missing_families']
          PY
      - name: Promote audited shortlist and update manifest
        run: |
          mv benchmarks/raw/sources/v4_shortlist_audited.json benchmarks/raw/sources/v4_shortlist.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          manifest=root/'MANIFEST.sha256'
          entries={}; order=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line: continue
              _,name=line.split('  ',1)
              p=root/name
              if p.is_file():
                  entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          for name in (
              'app/raw_recon_v4_source_audit.py',
              'tests/test_raw_recon_v4_source_audit_v6260.py',
              'benchmarks/raw/sources/v4_source_family_audit.json',
              'benchmarks/raw/sources/v4_shortlist.json',
          ):
              p=root/name
              if p.is_file():
                  entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
                  if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order),encoding='utf-8')
          PY
      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Commit audited shortlist and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-v4-source-audit.yml
          git add -A
          git diff --cached --check
          git commit -m "Audit Analysis 6.26 raw v4 source-family fit"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
