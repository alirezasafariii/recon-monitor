name: Analysis 6.26 Raw v4 Result Diagnostic

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumed holdout branch
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stored-result diagnostic contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_raw_recon_v4_result_diagnostic_v6260.py' -q

      - name: Diagnose immutable stored first-blind result only
        env:
          PYTHONPATH: app
        run: python app/raw_recon_v4_result_diagnostic.py

      - name: Verify diagnostic provenance and no frozen-input mutation
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report_path=Path('benchmarks/raw/sources/v4_first_blind_report.json')
          receipt_path=Path('benchmarks/raw/sources/v4_first_blind_receipt.json')
          freeze_path=Path('benchmarks/raw/sources/v4_freeze.json')
          corpus_path=Path('benchmarks/raw/analysis_raw_v4.jsonl')
          shortlist_path=Path('benchmarks/raw/sources/v4_shortlist.json')
          diagnostic=json.loads(Path('benchmarks/raw/sources/v4_first_blind_diagnostic.json').read_text(encoding='utf-8'))
          receipt=json.loads(receipt_path.read_text(encoding='utf-8'))
          freeze=json.loads(freeze_path.read_text(encoding='utf-8'))

          assert hashlib.sha256(report_path.read_bytes()).hexdigest()==receipt['report_sha256']
          assert hashlib.sha256(corpus_path.read_bytes()).hexdigest()==freeze['corpus_sha256']
          assert hashlib.sha256(shortlist_path.read_bytes()).hexdigest()==freeze['shortlist_sha256']
          assert diagnostic['diagnostic_executes_analysis_engine'] is False
          assert diagnostic['diagnostic_reruns_holdout'] is False
          assert diagnostic['frozen_inputs_mutated'] is False
          assert diagnostic['positive_failure_count'] > 0
          print(json.dumps({
              'positive_failure_count': diagnostic['positive_failure_count'],
              'failed_positive_families': diagnostic['failed_positive_families'],
              'positive_failure_reason_counts': diagnostic['positive_failure_reason_counts'],
              'negative_promotion_case_count': diagnostic['negative_promotion_case_count'],
              'negative_promotion_kind_counts': diagnostic['negative_promotion_kind_counts'],
              'promoted_family_counts_on_negative_controls': diagnostic['promoted_family_counts_on_negative_controls'],
              'condition_false_positive_family_counts': diagnostic['condition_false_positive_family_counts'],
              'condition_miss_family_counts': diagnostic['condition_miss_family_counts'],
              'positive_top1_confusions': diagnostic['positive_top1_confusions'],
              'positive_top3_miss_families': diagnostic['positive_top3_miss_families'],
          }, indent=2, sort_keys=True))
          PY

      - name: Register immutable-result diagnostic in manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          manifest=root/'MANIFEST.sha256'
          entries={}; order=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line: continue
              _,name=line.split('  ',1); p=root/name
              if p.is_file(): entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          for name in (
              'app/raw_recon_v4_result_diagnostic.py',
              'tests/test_raw_recon_v4_result_diagnostic_v6260.py',
              'benchmarks/raw/sources/v4_first_blind_diagnostic.json',
          ):
              p=root/name
              entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
              if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order),encoding='utf-8')
          PY

      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256

      - name: Persist diagnostic and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-v4-result-diagnostic.yml
          git add -A
          git diff --cached --check
          git commit -m "Diagnose Analysis 6.26 raw v4 first blind failures"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
