name: Pre-main Final Analyzer Gate

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: write

jobs:
  refresh-and-smoke:
    if: github.event.head_commit.message == 'Run pre-main final analyzer gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh manifest for permanent merge-gate files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          paths = []
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line:
                  continue
              _, path = line.split('  ', 1)
              if path and (root / path).is_file():
                  paths.append(path)
          paths.extend([
              'docs/PRE_MAIN_ANALYZER_MERGE_GATE.md',
              'tests/test_pre_main_analyzer_merge_gate.py',
          ])
          rows = []
          for path in sorted(set(paths)):
              data = (root / path).read_bytes()
              rows.append(f'{sha256(data).hexdigest()}  {path}')
          manifest.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Verify merge gate
        run: python -m unittest tests.test_pre_main_analyzer_merge_gate -q
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration
        run: python tests/integration_runner.py
      - name: Commit refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh manifest for pre-main analyzer gate'
            git push origin HEAD:final-analyzers
          fi

  verify:
    needs: refresh-and-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout latest integrated head
        shell: bash
        run: |
          git fetch origin final-analyzers
          git checkout -B final-analyzers origin/final-analyzers
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Verify merge gate
        run: python -m unittest tests.test_pre_main_analyzer_merge_gate -q
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration
        run: python tests/integration_runner.py
