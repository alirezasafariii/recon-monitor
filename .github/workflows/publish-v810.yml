name: Publish Recon Monitor v8.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v8.1.0 source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .staging/v810.patch.gz.b64 | gunzip > /tmp/v810.patch
          git apply --check /tmp/v810.patch
          git apply /tmp/v810.patch

      - name: Rebuild source manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          paths = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              s = p.as_posix()
              if s.startswith(('.git/', '.github/', '.staging/')) or s == 'MANIFEST.sha256':
                  continue
              if '__pycache__' in s or s.endswith('.pyc'):
                  continue
              if s.startswith(('state/','output/','reports/','backups/','runs/','logs/')) and not s.endswith('.gitkeep'):
                  continue
              paths.append(p)
          lines = []
          for p in sorted(paths, key=lambda x: x.as_posix()):
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f'{digest}  {p.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Manifest entries: {len(lines)}')
          PY

      - name: Verify hygiene and manifest
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' -o -name 'targets.json.backup-*' \) -print -quit)"
          sha256sum -c MANIFEST.sha256 >/dev/null
          test "$(./recon-monitor.sh --version)" = "8.1.0"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate on Python 3.11
        shell: bash
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate on Python 3.13
        shell: bash
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -p 'test_*.py' -q
          python tests/integration_runner.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          sha256sum -c MANIFEST.sha256 >/dev/null

      - name: Commit clean v8.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .staging/v810.patch.gz.b64
          rmdir .staging 2>/dev/null || true
          git rm .github/workflows/publish-v810.yml
          git add -A
          git commit -m 'Release Recon Monitor 8.1.0'
          git push origin HEAD:main

      - name: Tag final v8.1.0 commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -fa v8.1.0 -m 'Recon Monitor 8.1.0'
          git push origin refs/tags/v8.1.0 --force

      - name: Build release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=recon-monitor-v8.1.0/ -o recon-monitor-v8.1.0.zip HEAD
          sha256sum recon-monitor-v8.1.0.zip > recon-monitor-v8.1.0.zip.sha256
          cat > RELEASE_NOTES.md <<'EOF'
          # Recon Monitor 8.1.0

          Operational upgrade focused on safe, low-friction updates from the private GitHub repository.

          Highlights:
          - `update check` discovers the latest private GitHub Release through authenticated `gh`
          - `update install` downloads the release ZIP and SHA-256 automatically
          - GitHub credentials stay in GitHub CLI / OS credential storage
          - semantic version comparison prevents older/equal releases being treated as updates
          - automatic data backup and program backup before replacement
          - hardened ZIP path/symlink validation
          - full post-update init, compile, unit and integration validation
          - automatic code + database rollback when validation fails
          - manual `--package` and legacy `RECON_UPDATE_MANIFEST` remain supported
          - database schema remains 16

          Validation:
          - 172 unit tests on Python 3.11
          - 172 unit tests on Python 3.13
          - integration test on both Python versions
          - source hygiene and manifest verification
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v8.1.0 >/dev/null 2>&1; then
            gh release upload v8.1.0 recon-monitor-v8.1.0.zip recon-monitor-v8.1.0.zip.sha256 --clobber
            gh release edit v8.1.0 --title 'Recon Monitor v8.1.0' --notes-file RELEASE_NOTES.md
          else
            gh release create v8.1.0 recon-monitor-v8.1.0.zip recon-monitor-v8.1.0.zip.sha256 --verify-tag --title 'Recon Monitor v8.1.0' --notes-file RELEASE_NOTES.md
          fi
