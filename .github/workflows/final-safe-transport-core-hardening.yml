name: Final Safe Transport Core Hardening

on:
  push:
    branches: [final-analyzers]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Run core transport hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply core transport hardening
        run: python .github/scripts/final_safe_transport_core_hardening.py
      - name: Verify syntax
        run: python -m py_compile app/safe_validation_core.py app/safe_validation.py app/safe_transport.py tests/test_safe_validation_core_transport_hardening.py
      - name: Verify manifest
        run: sha256sum --strict -c MANIFEST.sha256
      - name: Targeted tests
        run: |
          python -m unittest tests.test_safe_validation_core_transport_hardening -q
          python -m unittest tests.test_safe_validation_v51 -q
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration suite
        run: python tests/integration_runner.py
      - name: Commit successful hardening
        shell: bash
        run: |
          git config user.name 'Alireza Safari'
          git config user.email '88625680+alirezasafariii@users.noreply.github.com'
          git add app/safe_validation_core.py app/safe_validation.py tests/test_safe_validation_core_transport_hardening.py MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Harden Safe Validation core transport'
            git push origin HEAD:final-analyzers
          fi

  verify:
    needs: harden
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout hardened branch head
        run: |
          git fetch origin final-analyzers
          git checkout -B final-analyzers origin/final-analyzers
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e config.env
          test ! -e policies/targets.json
          test -z "$(find . -type d -name __pycache__ -print -quit)"
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-*' -o -name '*.log' -o -name '*.jsonl' \) -print -quit)"
      - name: Verify syntax and manifest
        run: |
          python -m py_compile app/safe_validation_core.py app/safe_validation.py app/safe_transport.py tests/test_safe_validation_core_transport_hardening.py
          sha256sum --strict -c MANIFEST.sha256
      - name: Targeted tests
        run: |
          python -m unittest tests.test_safe_validation_core_transport_hardening -q
          python -m unittest tests.test_safe_validation_v51 -q
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Integration suite
        run: python tests/integration_runner.py
