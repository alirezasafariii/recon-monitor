name: Analysis 6.26 Materialization Facts

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  facts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print pre-scoring materialization facts
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from family_detectors.registry import DETECTOR_SPECS
          legacy = {
              'broken_object_authorization','broken_function_authorization','mass_assignment','authentication_session',
              'account_enumeration','open_redirect','ssrf','file_upload','path_traversal','information_disclosure',
              'cors_misconfiguration','race_condition','sql_injection','nosql_injection','command_injection',
              'server_side_template_injection','ldap_injection','unrestricted_resource_consumption',
              'security_misconfiguration','secret_exposure',
          }
          shortlist = json.loads(Path('benchmarks/raw/sources/v4_shortlist.json').read_text(encoding='utf-8'))
          rows = []
          for row in shortlist['selected']:
              family = row['family']
              if family in legacy:
                  continue
              rows.append({
                  'family': family,
                  'root': row['source_root'],
                  'project': row['source_project'],
                  'summary': row['summary'],
                  'cwes': row.get('matched_cwes', []),
                  'condition_signals': sorted(DETECTOR_SPECS[family].condition_signals),
                  'blocking_controls': sorted(DETECTOR_SPECS[family].blocking_controls),
                  'identity_signals': sorted(DETECTOR_SPECS[family].identity_signals),
              })
          print(json.dumps(rows, indent=2, ensure_ascii=False, sort_keys=True))
          PY
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-materialization-facts.yml
          git commit -m "Remove Analysis 6.26 materialization facts workflow"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
