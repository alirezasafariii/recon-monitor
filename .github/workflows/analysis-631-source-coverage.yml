name: Analysis 6.31 Source Coverage

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - app/v6_source_coverage_report.py
      - .github/workflows/analysis-631-source-coverage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build source coverage report
        env:
          PYTHONPATH: app
        run: python app/v6_source_coverage_report.py

      - name: Commit source coverage report
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_selection_diagnostic.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Analysis 6.31 v6 source coverage diagnostic'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
