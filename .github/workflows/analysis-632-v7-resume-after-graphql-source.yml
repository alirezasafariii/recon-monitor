name: Analysis 6.32 v7 Resume After GraphQL Source Fix

on:
  push:
    branches:
      - agent/analysis-engine-6.32-post-blind-calibration
    paths:
      - '.github/workflows/analysis-632-v7-resume-after-graphql-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate-and-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.32-post-blind-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source pool and diagnose uniqueness before scoring
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python app/raw_recon_v7_missing5_supplement_v2.py
          python app/raw_recon_v7_merge_patchable.py
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          from raw_recon_v7_source_selection import _prepare_pool
          from raw_recon_v7_source_firewall import exposure_index
          raw=json.loads(Path('benchmarks/raw/sources/v7_candidates_patchable.json').read_text())
          pools={}
          prior=exposure_index()
          for family,rows in sorted(raw['candidates_by_family'].items()):
              pools[family]=_prepare_pool(family,list(rows or []),prior)
          by_project=defaultdict(list)
          for family,rows in pools.items():
              for row in rows:
                  by_project[str(row.get('source_project') or '').casefold()].append((family,str(row.get('source_root') or '')))
          collisions={p:v for p,v in by_project.items() if len({f for f,_ in v})>1}
          singleton={f:[(r.get('source_project'),r.get('source_root')) for r in rows] for f,rows in pools.items() if len(rows)==1}
          print('V7_PROJECT_COLLISIONS='+json.dumps(collisions,sort_keys=True))
          print('V7_SINGLETON_POOLS='+json.dumps(singleton,sort_keys=True))
          assert len(pools)==36 and all(pools.values())
          PY
          python app/raw_recon_v7_source_selection.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('benchmarks/raw/sources/v7_shortlist.json').read_text())
          assert len(r['selected'])==36
          assert r['global_assignment_complete'] is True
          assert r['firewall']['passed'] is True
          assert r['firewall']['unique_root_count']==36
          assert r['firewall']['unique_project_count']==36
          assert r['scoring_executed'] is False
          print({'selected_count':len(r['selected']),'unique_projects':r['firewall']['unique_project_count']})
          PY
      - name: Dispatch full existing pre-blind pipeline on latest branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run analysis-632-v7-complete-preblind-v3.yml --ref agent/analysis-engine-6.32-post-blind-calibration
          echo 'Dispatched Analysis 6.32 v7 Complete Pre-Blind v3 on latest branch state.'
