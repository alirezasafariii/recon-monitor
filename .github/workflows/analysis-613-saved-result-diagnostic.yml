name: Analysis 6.13 Saved Result Diagnostic

on:
  push:
    branches:
      - agent/analysis-engine-6.13-fresh-raw-holdout-v2

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.13-fresh-raw-holdout-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify v2 is already consumed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('benchmarks/raw/splits/v2.json').read_text())
          assert m['evaluation_status']=='evaluated_once_consumed'
          assert m['first_and_only_fresh_evaluation']['run_id']=='31471744115'
          PY
      - name: Analyze only the saved first-evaluation report
        run: |
          python app/raw_recon_v2_result_diagnostic.py
          ! grep -Eq 'raw_recon_v2_benchmark|run_raw_benchmark|evaluate_raw_case|execute_detector_intelligence|rank_families|assess_admission' app/raw_recon_v2_result_diagnostic.py
      - name: Cleanup and regenerate manifest
        shell: bash
        run: |
          rm -f .github/workflows/analysis-613-saved-result-diagnostic.yml
          tmp="$(mktemp)"
          git ls-files | grep -v '^MANIFEST.sha256$' | while IFS= read -r f; do
            if [[ -f "$f" ]]; then sha256sum "$f"; fi
          done | sort -k2 > "$tmp"
          mv "$tmp" MANIFEST.sha256
          sha256sum -c MANIFEST.sha256 >/dev/null
      - name: Commit saved-result diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Summarize consumed Analysis 6.13 raw v2 result'
          git push origin HEAD:agent/analysis-engine-6.13-fresh-raw-holdout-v2
