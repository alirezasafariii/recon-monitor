name: Analysis 6.31 Normalize Existing Raw Methods

on:
  workflow_dispatch:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - '.github/workflows/analysis-631-normalize-existing-raw-methods.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.31-fresh-blind-v6-validation
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize invalid raw methods only
        env:
          PYTHONPATH: app
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from raw_recon_v4_corpus import V4_VALID_METHODS

          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)

          root = Path('benchmarks/raw/sources/v6_capture_evidence')
          changed = []
          for path in sorted(root.glob('*.json')):
              doc = json.loads(path.read_text(encoding='utf-8'))
              raw = doc.get('raw') or {}
              method = str(raw.get('method') or '').strip().upper()
              touched = False
              if method not in V4_VALID_METHODS:
                  raw['method'] = 'UNKNOWN'
                  touched = True
              if not isinstance(raw.get('endpoint_schema'), dict):
                  raw['endpoint_schema'] = {}
                  touched = True
              if touched:
                  doc['raw'] = raw
                  doc['raw_sha256'] = hashlib.sha256(canonical(raw).encode('utf-8')).hexdigest()
                  path.write_text(json.dumps(doc, indent=2, sort_keys=True) + '\n', encoding='utf-8')
                  changed.append(path.name)
          print(json.dumps({'normalized_files': changed, 'count': len(changed)}, indent=2))
          PY
          python app/v6_literal_capture_plan.py
          python app/v6_literal_capture_ingest.py --allow-incomplete
          python app/v6_literal_partial_verify.py
          python app/v6_literal_raw_precheck.py
          python app/v6_pre_score_checkpoint_refresh.py

      - name: Commit normalized evidence
        shell: bash
        run: |
          set -euo pipefail
          git add benchmarks/raw/sources/v6_capture_evidence/*.json \
                  benchmarks/raw/sources/v6_literal_capture_plan.json \
                  benchmarks/raw/sources/v6_literal_capture_ingest_report.json \
                  benchmarks/raw/sources/v6_pre_score_checkpoint.json
          if git diff --cached --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize existing Analysis 6.31 raw methods'
          git pull --rebase origin agent/analysis-engine-6.31-fresh-blind-v6-validation
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
