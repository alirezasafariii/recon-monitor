name: Analysis 6.26 Inventory Discovery

on:
  push:
    branches:
      - agent/analysis-engine-6.26-fresh-raw-holdout-v4

permissions:
  contents: write

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-engine-6.26-fresh-raw-holdout-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory discovery protocol contract
        env:
          PYTHONPATH: app
        run: python -m unittest discover -s tests -p 'test_raw_recon_v4_inventory_discovery_v6260.py' -q
      - name: Discover exact fresh API9 source
        env:
          PYTHONPATH: app
          GITHUB_TOKEN: ${{ github.token }}
        run: python app/raw_recon_v4_inventory_discovery.py --max-pages-per-cwe 50
      - name: Verify exact fresh inventory semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('benchmarks/raw/sources/v4_inventory_discovery.json').read_text(encoding='utf-8'))
          assert d['selected'] is not None, d
          s=d['selected']
          assert s['family']=='improper_inventory_management'
          assert s['freshness_validated'] is True
          groups=s['inventory_semantic_groups']
          assert all(groups.values()), groups
          print(json.dumps({
              'reviewed_rows':d['reviewed_advisory_rows'],
              'semantic_matches':d['semantic_match_count_before_novelty'],
              'novelty_rejections':d['novelty_rejection_count'],
              'selected':{k:s[k] for k in ('source_root','source_project','canonical_advisory_url','matched_cwes','summary')},
              'semantic_groups':groups,
          },indent=2,ensure_ascii=False,sort_keys=True))
          PY
      - name: Register inventory discovery artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.'); manifest=root/'MANIFEST.sha256'
          entries={}; order=[]
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if '  ' not in line: continue
              _,name=line.split('  ',1); p=root/name
              if p.is_file(): entries[name]=hashlib.sha256(p.read_bytes()).hexdigest(); order.append(name)
          for name in ('app/raw_recon_v4_inventory_discovery.py','tests/test_raw_recon_v4_inventory_discovery_v6260.py','benchmarks/raw/sources/v4_inventory_discovery.json'):
              p=root/name
              if p.is_file():
                  entries[name]=hashlib.sha256(p.read_bytes()).hexdigest()
                  if name not in order: order.append(name)
          manifest.write_text(''.join(f'{entries[name]}  {name}\n' for name in order),encoding='utf-8')
          PY
      - name: Verify manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Commit inventory discovery snapshot and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analysis-626-inventory-discovery.yml
          git add -A
          git diff --cached --check
          git commit -m "Discover fresh Analysis 6.26 API inventory holdout source"
          git push origin HEAD:agent/analysis-engine-6.26-fresh-raw-holdout-v4
