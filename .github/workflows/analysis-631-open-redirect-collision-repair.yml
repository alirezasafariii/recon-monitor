name: Analysis 6.31 Complement Collision Repair

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-open-redirect-collision-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append one fresh semantic security-misconfiguration source
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v5_source_audit import AUDIT_RULE_VERSION, AUDIT_VERSION, audit_row
          from raw_recon_v6_source_firewall import check_candidate

          family = 'security_misconfiguration'
          path = Path('benchmarks/raw/sources/v6_candidates.json')
          data = json.loads(path.read_text())
          if data.get('scoring_executed') is not False:
              raise SystemExit('v6 discovery must remain unscored')

          candidate = {
              'advisory_source_type': 'unreviewed',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-j3fc-fx73-7qv7',
              'repository_advisory_url': '',
              'description': 'The VPS.org one-click Supabase template has an insecure default configuration that publishes PostgreSQL on all interfaces at 0.0.0.0:5432 with the default database password postgres. The database is therefore publicly exposed by default, and Docker networking rules can bypass a standard host UFW configuration.',
              'family': family,
              'freshness_validated': True,
              'matched_cwes': ['CWE-1188'],
              'published_at': '2026-07-31T18:32:17Z',
              'references': [
                  'https://nvd.nist.gov/vuln/detail/CVE-2026-16503',
                  'https://kb.cert.org/vuls/id/243636'
              ],
              'selection_basis': 'pre-score targeted source discovery repair for global root/project uniqueness; no detector, admission, ranking, or blind result used',
              'severity': 'critical',
              'source_code_location': '',
              'source_kind': 'vendor_product_advisory_record',
              'source_project': 'vps.org/supabase-one-click-template',
              'source_root': 'GHSA-j3fc-fx73-7qv7',
              'summary': 'VPS.org Supabase template exposes PostgreSQL through an insecure default configuration with a default password.',
              'updated_at': '2026-08-03T18:31:45Z',
          }

          fw = check_candidate(candidate)
          if not fw['allowed']:
              raise SystemExit(f'collision-repair candidate rejected by historical firewall: {fw}')
          passed, hits, score = audit_row(family, candidate)
          if not passed:
              raise SystemExit(f'collision-repair candidate failed semantic audit: hits={hits}')

          candidate['v6_firewall_allowed'] = True
          candidate['v6_firewall_version'] = '1.0.0'
          candidate['v6_firewall_rule_version'] = '2026.08.13.6.31'
          candidate['source_family_audit_version'] = AUDIT_VERSION
          candidate['source_family_audit_rule_version'] = AUDIT_RULE_VERSION
          candidate['source_family_audit_score'] = int(score)
          candidate['source_family_audit_group_hits'] = hits
          candidate['source_selection_track'] = 'legacy_semantic_fresh_pool_pre_score_uniqueness_repair'

          pool = data.setdefault('candidates_by_family', {}).setdefault(family, [])
          pool = [row for row in pool if row.get('source_root') != candidate['source_root']]
          pool.append(candidate)
          data['candidates_by_family'][family] = pool
          data.setdefault('family_candidate_counts', {})[family] = len(pool)
          data.setdefault('family_semantic_candidate_counts', {})[family] = sum(
              1 for row in pool if audit_row(family, row)[0]
          )
          data.setdefault('pre_score_collision_repairs', [])
          repair = {
              'family': family,
              'reason': 'global uniqueness collision with security_logging_alerting_failure on kyndryl-open-source/hashi-vault-js',
              'source_root': candidate['source_root'],
              'source_project': candidate['source_project'],
              'historical_firewall_passed': True,
              'semantic_audit_passed': True,
              'scoring_executed': False,
          }
          data['pre_score_collision_repairs'] = [
              r for r in data['pre_score_collision_repairs']
              if r.get('family') != family
          ] + [repair]
          data['scoring_executed'] = False
          data['candidate_selection_uses_detector_scores'] = False
          data['candidate_selection_uses_admission_results'] = False
          data['candidate_selection_uses_ranking_results'] = False
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'family': family,
              'historical_firewall_passed': True,
              'semantic_audit_passed': True,
              'source_root': candidate['source_root'],
              'source_project': candidate['source_project'],
              'semantic_score': score,
              'scoring_executed': False,
          }, sort_keys=True))
          PY
      - name: Commit repaired unscored discovery pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/raw/sources/v6_candidates.json
          if git diff --cached --quiet; then
            echo "No collision-repair change required"
            exit 0
          fi
          git commit -m "Repair Analysis 6.31 security misconfiguration source uniqueness"
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
