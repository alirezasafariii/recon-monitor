name: Analysis 6.31 Open Redirect Collision Repair

on:
  push:
    branches:
      - agent/analysis-engine-6.31-fresh-blind-v6-validation
    paths:
      - .github/workflows/analysis-631-open-redirect-collision-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append one fresh semantic open-redirect source
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from raw_recon_v5_source_audit import AUDIT_RULE_VERSION, AUDIT_VERSION, audit_row
          from raw_recon_v6_source_firewall import check_candidate

          path = Path('benchmarks/raw/sources/v6_candidates.json')
          data = json.loads(path.read_text())
          if data.get('scoring_executed') is not False:
              raise SystemExit('v6 discovery must remain unscored')

          candidate = {
              'advisory_source_type': 'unreviewed',
              'canonical_advisory_url': 'https://github.com/advisories/GHSA-jjjg-67rc-qf87',
              'description': 'Saurus CMS Community Edition contains an unauthenticated open redirect in logout handling where a caller-controlled url parameter is passed to the Location header without an allowlist, scheme validation, or relative-path enforcement. An attacker can supply an arbitrary external destination and redirect users to an attacker-controlled site.',
              'family': 'open_redirect',
              'freshness_validated': True,
              'matched_cwes': ['CWE-601'],
              'published_at': '2026-08-13T18:31:38Z',
              'references': ['https://github.com/sauruscms/Saurus-CMS-Community-Edition'],
              'repository_advisory_url': '',
              'selection_basis': 'pre-score targeted source discovery repair for global root/project uniqueness; no detector, admission, ranking, or blind result used',
              'severity': 'medium',
              'source_code_location': 'https://github.com/sauruscms/Saurus-CMS-Community-Edition',
              'source_kind': 'github_unreviewed_advisory_with_repository_reference',
              'source_project': 'sauruscms/Saurus-CMS-Community-Edition',
              'source_root': 'GHSA-jjjg-67rc-qf87',
              'summary': 'Saurus CMS Community Edition contains an unauthenticated open redirect vulnerability in logout handling.',
              'updated_at': '2026-08-13T18:31:43Z',
          }

          fw = check_candidate(candidate)
          if not fw['allowed']:
              raise SystemExit(f'collision-repair candidate rejected by historical firewall: {fw}')
          passed, hits, score = audit_row('open_redirect', candidate)
          if not passed:
              raise SystemExit(f'collision-repair candidate failed semantic audit: hits={hits}')

          candidate['v6_firewall_allowed'] = True
          candidate['v6_firewall_version'] = '1.0.0'
          candidate['v6_firewall_rule_version'] = '2026.08.13.6.31'
          candidate['source_family_audit_version'] = AUDIT_VERSION
          candidate['source_family_audit_rule_version'] = AUDIT_RULE_VERSION
          candidate['source_family_audit_score'] = int(score)
          candidate['source_family_audit_group_hits'] = hits
          candidate['source_selection_track'] = 'legacy_semantic_fresh_pool_pre_score_uniqueness_repair'

          pool = data.setdefault('candidates_by_family', {}).setdefault('open_redirect', [])
          pool = [row for row in pool if row.get('source_root') != candidate['source_root']]
          pool.append(candidate)
          data['candidates_by_family']['open_redirect'] = pool
          data.setdefault('family_candidate_counts', {})['open_redirect'] = len(pool)
          data.setdefault('family_semantic_candidate_counts', {})['open_redirect'] = sum(
              1 for row in pool if audit_row('open_redirect', row)[0]
          )
          data.setdefault('pre_score_collision_repairs', [])
          repair = {
              'family': 'open_redirect',
              'reason': 'global uniqueness collision with information_disclosure on ether/etherpad',
              'source_root': candidate['source_root'],
              'source_project': candidate['source_project'],
              'historical_firewall_passed': True,
              'semantic_audit_passed': True,
              'scoring_executed': False,
          }
          data['pre_score_collision_repairs'] = [
              r for r in data['pre_score_collision_repairs']
              if r.get('family') != 'open_redirect'
          ] + [repair]
          data['scoring_executed'] = False
          data['candidate_selection_uses_detector_scores'] = False
          data['candidate_selection_uses_admission_results'] = False
          data['candidate_selection_uses_ranking_results'] = False
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'family': 'open_redirect',
              'historical_firewall_passed': True,
              'semantic_audit_passed': True,
              'source_root': candidate['source_root'],
              'source_project': candidate['source_project'],
              'semantic_score': score,
              'scoring_executed': False,
          }, sort_keys=True))
          PY
      - name: Commit repaired unscored discovery pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/raw/sources/v6_candidates.json
          if git diff --cached --quiet; then
            echo "No collision-repair change required"
            exit 0
          fi
          git commit -m "Repair Analysis 6.31 open redirect source uniqueness"
          git push origin HEAD:agent/analysis-engine-6.31-fresh-blind-v6-validation
